name: Fushi patched Flutter engine (Windows)
description: >-
  Installs the patched flutter_windows.dll (HDR output inside the Flutter
  compositor, ci/patches/flutter-engine/<version>/) into the runner's Flutter
  SDK cache. Must run after subosito/flutter-action and before
  `flutter build windows`.

runs:
  using: composite
  steps:
    - name: Install patched Flutter Windows engine
      shell: pwsh
      run: |
        $version = (Get-Content fushi/.fvmrc -Raw | ConvertFrom-Json).flutter
        $manifest = "ci/patches/flutter-engine/$version/artifacts.json"
        if (-not (Test-Path $manifest)) {
          # Without published artifacts the app still builds and runs on the
          # stock engine; the runner then reports compositor HDR unsupported
          # and HDR video keeps using the host window.
          Write-Output "::warning title=Stock Flutter engine::$manifest is not published yet; building with the stock engine (compositor HDR unavailable)."
          exit 0
        }
        flutter precache --windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./tool/engine_overlay.ps1 -Manifest $manifest
