name: Rust test libraries (fushi_fsrs + fushi_compute + fushi_rwkv + fushi_music + fushi_corpus, linux-x64)
description: >-
  Builds native/fushi_fsrs, native/fushi_compute, native/fushi_rwkv, native/fushi_music and native/fushi_corpus for
  linux-x64 and verifies them. All five are hard dependencies of the fushi/ unit tests and of packages/
  tests (no Dart fallback; a missing library fails the test instead of skipping). Producer
  jobs call this action and upload the five .so files as the `fushi-test-native-linux-x64`
  artifact (paths relative to native/); the test matrix downloads it into native/ and points
  FUSHI_FSRS_LIB / FUSHI_COMPUTE_LIB / FUSHI_RWKV_LIB / FUSHI_MUSIC_LIB / FUSHI_CORPUS_LIB at it.

# Why one producer job instead of a build step in every shard: each of the four unit-test
# shards used to build both crates itself (~2 min per shard, setup-fushi-compute 76 s +
# fsrs 34 s measured 2026-10-20), on every shard's critical path. Built once, in parallel
# with web-core-linux, the shards only download. Artifacts do not count against the Actions
# cache quota (fushi/test/build/workflow_cache_quota_guard_test.dart).
runs:
  using: composite
  steps:
    # 用 runner 自带的 stable 工具链（不进持久库，不需要钉版），与原来各分片里的那一步相同。
    - name: Cache Rust build (fushi_fsrs)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/fushi_fsrs -> target
        key: fushi-fsrs-linux-x64
    # 测试库带 ID 审计（native/fushi_fsrs/src/store/ids.rs `audit`，与 main.yml 包测试那份同一 feature）：ID 列存
    # 16 字节 BLOB，SQL 里绑 ID 漏写 srs_id(?) 在发布构建里是静默查不到行，审计构建里那条语句直接报错，主应用单测
    # （fushi/test，经 Drift → ffsrs_store_exec 进内核的语句）因此会红。消费方 job 设 FUSHI_FSRS_ID_AUDIT=1，金丝雀
    # fushi/test/srs/srs_id_audit_gate_test.dart 据此断言审计真的开着。这个 .so 只给测试用，不进任何发布产物。
    - name: Build fushi_fsrs (linux-x64 .so, id_audit)
      shell: bash
      env:
        FUSHI_FSRS_FEATURES: id_audit
      run: bash native/fushi_fsrs/build_linux_so.sh
    - name: Build fushi_compute (linux-x64 .so)
      uses: ./.github/actions/setup-fushi-compute
    # RWKV-Instant 排程推理 fushi_rwkv 同为硬依赖（无 Dart 回退）：同样的输入。
    - name: Build fushi_rwkv (linux-x64 .so)
      uses: ./.github/actions/setup-fushi-rwkv
    # 音乐胖核心 fushi_music（曲库扫描 / 标签 / CUE）同为硬依赖：runner 自带 stable 工具链编。
    - name: Build fushi_music (linux-x64 .so)
      shell: bash
      run: |
        set -euo pipefail
        bash native/fushi_music/build_linux_so.sh
        bash native/fushi_music/verify_abi.sh native/fushi_music/prebuilt/linux-x64/libfushi_music.so nm
    # 语料胖核心 fushi_corpus（「我库里的例句」倒排索引）同为硬依赖：runner 自带 stable 工具链编。
    - name: Build fushi_corpus (linux-x64 .so)
      shell: bash
      run: |
        set -euo pipefail
        bash native/fushi_corpus/build_linux_so.sh
        bash native/fushi_corpus/verify_abi.sh native/fushi_corpus/prebuilt/linux-x64/libfushi_corpus.so nm
