# SRS 排程内核原生库（native/fushi_fsrs，Rust + fsrs-rs）的 **PR 阶段门**。
#
# ── 补的是哪个缺口（与 native-p2p-gate.yml 同一形态）──────────────────────────────
#   build_windows_dll.ps1 / build_linux_so.sh / build_macos_dylib.sh / iOS 伞形库
#       -> build-multiplatform.yml 的 windows / linux-server / macos / ios job（路径门把
#          `native/fushi_fsrs/**` 与 `packages/fushi_srs/**` 路由给这四个 job），Windows /
#          Linux 还跑 packages/fushi_srs 的真 FFI 测试。⇒ 这四端 PR 上本来就有真编译门。
#   build_android_so.sh
#       -> 没有任何 `pull_request` 触发的 workflow 编它。本 workflow 的 android job 补这一条：
#          cargo-ndk 三个 ABI + ELF 架构 + ffsrs_* 符号核对。
#   lib.rs 自己的单元测试（defaults 个数、next_states 单调、参数个数校验、zstd 往返……）与同步 v2 的
#   收敛 / 确定性测试
#       -> 本 workflow 的 rust-tests job（linux x86_64 / aarch64、macOS arm64、Windows 四格 `cargo test --release`）。
#
# ── 它**不**负责什么 ──────────────────────────────────────────────────────────────
#   * 不重复跑上面四端；不碰发布路径（全程只读，不上传产物、不建 tag）。
#
# ── 退出码纪律 ────────────────────────────────────────────────────────────────────
# `shell: bash` + `set -euo pipefail`，无 `continue-on-error`；缓存未命中只会变慢。
name: native-fsrs-gate

on:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'native/fushi_fsrs/**'
      - 'packages/fushi_srs/lib/src/ffi/**'
      - '.github/workflows/native-fsrs-gate.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # 工具链钉法与 native-p2p-gate.yml 一致（Rust 1.95.0、cargo-ndk 4.1.2）。
      - name: Set up Rust (fushi_fsrs, Android targets)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Cache Rust build (fushi_fsrs)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fushi_fsrs -> target
          key: fushi-fsrs-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Build fushi_fsrs Android .so (arm64-v8a, armeabi-v7a, x86_64)
        shell: bash
        run: |
          set -euo pipefail
          bash native/fushi_fsrs/build_android_so.sh "$ANDROID_NDK_LATEST_HOME" arm64-v8a armeabi-v7a x86_64
      - name: Verify .so architecture and exported C ABI surface
        shell: bash
        run: |
          set -euo pipefail
          nm_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ ! -x "$nm_bin" ]; then nm_bin=nm; fi
          for pair in arm64-v8a:AArch64 armeabi-v7a:ARM x86_64:X86-64; do
            abi="${pair%%:*}"; want="${pair#*:}"
            so="native/fushi_fsrs/prebuilt/android/$abi/libfushi_fsrs.so"
            machine="$(readelf -h "$so" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            echo "$abi: ELF machine = $machine"
            case "$machine" in
              *"$want"*) : ;;
              *) echo "::error title=wrong target arch::$abi 期望 $want，实际 $machine"; exit 1 ;;
            esac
            bash native/fushi_fsrs/verify_abi.sh "$so" "$nm_bin"
          done

  # 复习同步 v2 的确定性门（docs/specs/2026-10-25-srs-sync-v2-design.md §4.5、计划 P8）：各设备必须逐比特
  # 算出同样的调度，否则两台设备在同一版本向量下摘要不同。`sync2::fsrs_det` 的固定向量哈希测试在每个平台上
  # 跑一遍——任一平台哈希不一致即红。FSRS 只用纯 Rust 的 libm（不走平台 libm），Android / iOS 与这里的
  # linux-aarch64 / macos-arm64 同一套 aarch64 浮点路径，所以这四格覆盖五个出包平台的算术。
  rust-tests:
    name: cargo test --release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust (fushi_fsrs)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - name: Cache Rust build (fushi_fsrs tests)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fushi_fsrs -> target
          key: fushi-fsrs-tests-${{ matrix.name }}
      - name: cargo test --release (fushi_fsrs)
        shell: bash
        working-directory: native/fushi_fsrs
        run: |
          set -euo pipefail
          cargo test --release --locked
      # `id_audit` 打开的是桥入口（exec / select / batch / read_session）上的审计分支，默认构建里那几行
      # 不编译；在一格上带 feature 编一遍跑一遍，免得它烂掉没人知道。
      - name: cargo test --release --features id_audit (fushi_fsrs)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        working-directory: native/fushi_fsrs
        run: |
          set -euo pipefail
          cargo test --release --locked --features id_audit
