# 计算内核原生库（native/fushi_compute，Rust：哈希 / 图像 / 文本）的 **PR 阶段门**。
#
# ── 补的是哪个缺口（与 native-fsrs-gate.yml 同一形态）──────────────────────────────
#   build_windows_dll.ps1 / build_linux_so.sh / build_macos_dylib.sh / iOS 伞形库
#       -> build-multiplatform.yml 的 windows / linux-server / macos / ios job（路径门把
#          `native/fushi_compute/**` 与 `packages/fushi_compute/**` 路由给这四个 job），Windows /
#          Linux 还跑 packages/fushi_compute 的真 FFI 测试。⇒ 这四端 PR 上本来就有真编译门。
#   build_android_so.sh
#       -> 没有任何 `pull_request` 触发的 workflow 编它。本 workflow 的 android job 补这一条：
#          cargo-ndk 三个 ABI + ELF 架构 + ffc_* 符号核对。
#   lib.rs 与各域模块自己的单元测试
#       -> 本 workflow 的 rust-tests job（ubuntu 上 `cargo test --release`）。
#   字幕解析（src/parse/subtitle/）在 arm64 上的逐位一致性
#       -> 本 workflow 的 subtitle-parity-arm64 job（macOS arm64 上跑 packages/fushi_audio 的
#          subtitle_native_parity_test.dart）。摘要分 CPU 架构冻结（语料里的 NaN 位模式随硬件），
#          而 PR 上跑 packages 测试的只有 x64（main.yml 的 Linux、build-multiplatform 的
#          Windows / Linux），arm64 那张表此前只能手动验（拍板台 left3646）。
#
# ── 它**不**负责什么 ──────────────────────────────────────────────────────────────
#   * 不重复跑上面四端；不碰发布路径（全程只读，不上传产物、不建 tag）。
#
# ── 退出码纪律 ────────────────────────────────────────────────────────────────────
# `shell: bash` + `set -euo pipefail`，无 `continue-on-error`；缓存未命中只会变慢。
name: native-compute-gate

on:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'native/fushi_compute/**'
      # verify_abi.sh 的期望符号集取自这里的 lookup 名：绑定新增符号也要重新核对 .so。
      - 'packages/fushi_compute/**'
      # subtitle-parity-arm64 的输入：Dart 侧字幕解析入口（委托 Rust）与逐位一致性测试 / 语料。
      - 'packages/fushi_audio/lib/src/parsers/**'
      - 'packages/fushi_audio/test/parsers/subtitle_native_parity_test.dart'
      - 'packages/fushi_audio/test/parsers/subtitle_parity_corpus.dart'
      - '.github/actions/setup-fushi-compute/**'
      - '.github/workflows/native-compute-gate.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # 工具链钉法与 native-fsrs-gate.yml / native-p2p-gate.yml 一致（Rust 1.95.0、cargo-ndk 4.1.2）。
      - name: Set up Rust (fushi_compute, Android targets)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Cache Rust build (fushi_compute)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/fushi_compute -> target
          key: fushi-compute-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-ndk@4.1.2
      - name: Build fushi_compute Android .so (arm64-v8a, armeabi-v7a, x86_64)
        shell: bash
        run: |
          set -euo pipefail
          bash native/fushi_compute/build_android_so.sh "$ANDROID_NDK_LATEST_HOME" arm64-v8a armeabi-v7a x86_64
      - name: Verify .so architecture and exported C ABI surface
        shell: bash
        run: |
          set -euo pipefail
          nm_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ ! -x "$nm_bin" ]; then nm_bin=nm; fi
          for pair in arm64-v8a:AArch64 armeabi-v7a:ARM x86_64:X86-64; do
            abi="${pair%%:*}"; want="${pair#*:}"
            so="native/fushi_compute/prebuilt/android/$abi/libfushi_compute.so"
            machine="$(readelf -h "$so" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            echo "$abi: ELF machine = $machine"
            case "$machine" in
              *"$want"*) : ;;
              *) echo "::error title=wrong target arch::$abi 期望 $want，实际 $machine"; exit 1 ;;
            esac
            bash native/fushi_compute/verify_abi.sh "$so" "$nm_bin"
          done

  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Rust (fushi_compute)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.95.0'
      - name: Cache Rust build (fushi_compute tests)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/fushi_compute -> target
          key: fushi-compute-tests
      - name: cargo test --release (fushi_compute)
        shell: bash
        working-directory: native/fushi_compute
        run: |
          set -euo pipefail
          cargo test --release --locked

  # arm64 字幕解析逐位一致性（拍板台 left3646 第 2 条）。subtitle_native_parity_test.dart 的冻结摘要
  # 按 Abi.current() 分 x64 / arm64 两张表；macos-latest 是 Apple Silicon，与 arm64 表求得时的平台
  # 一致（iOS / Android arm64 同一套 aarch64 NaN 语义）。只跑这一个文件，不重复 x64 端已覆盖的包测试。
  # 原生库是硬依赖：setup-fushi-compute 编 aarch64 dylib 并导出 FUSHI_COMPUTE_LIB，找不到库时
  # 测试直接失败（不 skip）；执行数哨兵防「零个测试跑过」也判绿。
  subtitle-parity-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: Build fushi_compute (macOS arm64 dylib)
        uses: ./.github/actions/setup-fushi-compute
      - name: Subtitle native parity (arm64 digests)
        shell: bash
        working-directory: packages/fushi_audio
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 || { echo "::error::expected an arm64 runner, got $(uname -m)"; exit 1; }
          test -f "$FUSHI_COMPUTE_LIB" || { echo "::error::FUSHI_COMPUTE_LIB not built: $FUSHI_COMPUTE_LIB"; exit 1; }
          dart pub get --enforce-lockfile
          log="$RUNNER_TEMP/subtitle_parity_arm64.log"
          dart test test/parsers/subtitle_native_parity_test.dart --reporter expanded 2>&1 | tee "$log"
          passed="$(grep -Eo '\+[0-9]+' "$log" | tail -n 1 | tr -d '+')"
          if [ -z "$passed" ] || [ "$passed" -lt 6 ]; then
            echo "::error::subtitle parity ran ${passed:-0} tests on arm64; expected at least 6"
            exit 1
          fi
