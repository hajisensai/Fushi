# galgame 引擎-hook 注入器 helper 的打包/分发 workflow（Hibiki 主仓同源构建）。
#
# injector + hook DLL 仍与 Hibiki.exe 保持进程/链接边界；同一组 zip 同时进入 Windows 主包，
# 解决离线首装，并发布到固定 tag 供旧包与后台更新使用。
#
# 发布到固定 tag `voice-hook-helper` 的 prerelease、非 Latest release。
#
# 每架构分发 4 个核心文件（injector.exe + hook.dll + LunaHook<arch>.dll + LunaHost<arch>.dll）。
# x86 包另带 Locale Emulator 2.5.0.1 的 LoaderDll.dll / LocaleEmulator.dll 与 LGPL 文本，供
# Hibiki 自动以日语 CP932 挂起启动旧式非 Unicode galgame；不运行安装器、不改系统区域设置。
# 打成 voice_hook_<arch>.zip（文件平铺在 zip 根）+ .sha256 侧车供 app 校验完整性。app 下载 URL：
#   https://github.com/hajisensai/hibiki/releases/download/voice-hook-helper/voice_hook_<arch>.zip
name: voice-hook-helper

on:
  workflow_dispatch:
  # push 自动重发：develop 上任何影响 helper 产物的提交都自动重建并 upsert 同一 prerelease，
  # 杜绝「修复已合入但 release 忘了重发、客户端 sha 对比一致永不自更」的漏发事故
  # （2026-07-21 两个注入修复合入后 release 停在 init 版两天，实锤过一次）。
  #
  # 合仓后必须用 paths **白名单**而不是原来的 paths-ignore：helper 现在住在 Hibiki 主仓库里，
  # 沿用 paths-ignore 会让主仓库任何一次非文档提交都去重建并重发 helper release。
  # 本 workflow 自身改动也要触发（否则改了发布逻辑却发不出去）。
  push:
    branches: [develop]
    paths:
      - 'native/galgame_hook/**'
      - '.github/workflows/voice-hook-helper.yml'

# 同一时刻只跑一份发布（push 连发时后车顶掉前车，避免并发 upsert 同一 release 竞态）。
concurrency:
  group: voice-hook-helper-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        # helper 源码合仓后住在 native/galgame_hook/，各 run 步骤内的相对路径
        # （cmake -S . / tools/*.py / dist/**）因此保持与独立仓库时代完全一致。
        # 注意：softprops/action-gh-release 的 files: 不吃 working-directory，
        # 那里必须写仓库根起算的完整路径。
        working-directory: native/galgame_hook
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # P0 单一真相源守卫：schema/真实样本证据必须有效，生成文档不得漂移。
      - name: Verify engine support manifest
        run: |
          python tools/generate_engine_support.py --check
          python tools/generate_luna_profiles.py --check
          ./tools/sync_lunahook.ps1
          python tests/engine_support_manifest_test.py
          python tests/adapter_structure_test.py
          python tests/evidence_contract_test.py
          python tests/galhook_workflow_test.py

      # release 与 Windows 主包必须共用同一打包脚本和文件清单，避免离线资产与在线 release 漂移。
      - name: Build, test and package helper (x64 + x86)
        run: ./tools/build_distribution.ps1 -RunTests

      # 固定 tag `voice-hook-helper` 反复 upsert 同一 release（softprops 有则更新、无则创建，同名
      # asset 自动覆盖）；prerelease + 非 Latest。
      # 分支守卫：只有 develop（本仓库默认分支）才允许 upsert 那个**所有用户都会自更新拉取**的固定 tag
      # release。此前本步骤无任何条件，于是在功能分支上 workflow_dispatch 一次，就会把
      # 未经审查的 helper 直接推给全部用户（客户端按同一 tag + sha 比对自更新）。构建与
      # 双架构 ctest 仍在任意分支照跑，只是不发布——这样 PR 分支能安全地验证构建门。
      - name: Publish helper release
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: voice-hook-helper
          target_commitish: ${{ github.sha }}
          name: Galgame voice hook helper
          body: |
            Galgame 引擎-hook 注入器 helper（含进程注入代码：CreateRemoteThread/WriteProcessMemory）。
            Windows 主包已随附同源归档用于离线首装；本 release 供旧包下载与已安装版本后台更新。
            本 release 为 prerelease、非 Latest。

            杀软说明：Windows Defender（签名 1.455.357.0）实扫全部文件与 zip 均无检出，
            见 hibiki-hook#8 的 av-selfscan 实测。国产杀软（360/火绒等）未验证，若被拦为误报。
          prerelease: true
          make_latest: false
          files: |
            native/galgame_hook/dist/voice_hook_x64.zip
            native/galgame_hook/dist/voice_hook_x86.zip
            native/galgame_hook/dist/voice_hook_x64.zip.sha256
            native/galgame_hook/dist/voice_hook_x86.zip.sha256
