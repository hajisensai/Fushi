name: Build Desktop and Apple Release Artifacts

on:
  # TODO-1208: docs-only / repo-chore pushes should not fire the full desktop +
  # Apple release build. Scope the PUSH trigger to build-relevant paths. The
  # `release` and `workflow_dispatch` triggers stay UNfiltered so manual
  # beta/formal publishes always run. A version bump lives under fushi/** so it
  # still triggers; rolling debug seq = commit count, so skipping a seq on a
  # docs-only push is harmless.
  # ⚠️ Fushi 改名过渡期（2026-08-07 用户指示）：暂停 push 自动发布——新版 Fushi
  # 尚未正式就绪，自动发布会让老 Hibiki 用户经应用内更新拉到改名后的构建
  # （Android 并存装新包 / helper 组件名对不上），迁移链发布前恢复本块。
  # push:
  #   branches: ['main', 'develop']
  #   paths:
  #     - 'fushi/**'
  #     - 'packages/**'
  #     # C ABI bridge 源码：只改 native/ 的 PR 以前触发不了任何构建，
  #     # 编译挂了要等下一个不相关改动才暴露。
  #     - 'native/**'
  #     - 'ci/**'
  #     - 'tool/**'
  #     - 'third_party/**'
  #     - 'tools/build_magpie_slim.ps1'
  #     - '.github/workflows/**'
  #     - 'melos.yaml'
  #     - 'pubspec.yaml'
  #     - 'pubspec.lock'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel: debug, beta, or formal'
        required: true
        default: beta
        type: choice
        options:
          - debug
          - beta
          - formal
      tag_name:
        description: 'Optional release tag. Defaults to v<version>-debug.<seq>+<sha>, v<version>-beta.<seq>, or v<version>.'
        required: false
      release_name:
        description: 'Optional GitHub Release title.'
        required: false
      # TestFlight 上传只在手动 beta/formal 发布时发生（见 ios job 的
      # "Resolve Apple signing mode"）。push 的 debug 通道每次提交都会跑，
      # 传上去只会白烧 App Store Connect 的处理配额并把构建号推高。
      upload_testflight:
        description: 'Upload a signed iOS build to TestFlight (beta/formal only; needs the Apple secrets).'
        required: false
        default: true
        type: boolean

concurrency:
  group: fushi-release-${{ github.event.release.tag_name || github.event.inputs.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate unified release policy
        shell: pwsh
        run: ./tool/check_release_policy.ps1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve desktop release channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' fushi/pubspec.yaml | sed 's/version: *//;s/+.*//')
          RELEASE_SEQUENCE=$(git rev-list --count HEAD)
          if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
            echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME}"
          CHANNEL="${INPUT_CHANNEL:-}"
          TAG="${INPUT_TAG_NAME:-}"
          NAME="${INPUT_RELEASE_NAME:-}"
          BODY=""
          PRERELEASE=true
          MAKE_LATEST=false
          PUBLISH_MANAGED_RELEASE=false
          # BUG-869: manifest-only publish flag decoupled from
          # PUBLISH_MANAGED_RELEASE (see release.yml) so the `release` event can
          # emit latest-stable.json without re-touching the manual Release.
          PUBLISH_MANIFEST=false
          MANIFEST_CHANNEL=""

          case "$EVENT" in
            push)
              CHANNEL=debug
              TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
              NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
              BODY="Automated desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
              PUBLISH_MANAGED_RELEASE=true
              ;;
            workflow_dispatch)
              case "$CHANNEL" in
                debug)
                  TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                  NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
                  BODY="Manual desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                  ;;
                beta)
                  TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                  NAME="${NAME:-Hibiki ${VERSION} beta ${RELEASE_SEQUENCE}}"
                  BODY="Manual desktop beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                  ;;
                formal)
                  TAG="${TAG:-v${VERSION}}"
                  NAME="${NAME:-Hibiki ${VERSION}}"
                  BODY="Manual desktop formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                  PRERELEASE=false
                  MAKE_LATEST=true
                  ;;
                *)
                  echo "::error title=Invalid release channel::Use debug, beta, or formal."
                  exit 1
                  ;;
              esac
              PUBLISH_MANAGED_RELEASE=true
              ;;
            release)
              CHANNEL=github-release
              TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
              # BUG-869: a manually-published NON-prerelease Release IS the formal
              # stable release → emit latest-stable.json (with releaseSequence) for
              # in-China stable clients. Manifest-only; never touches the Release.
              if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
                MANIFEST_CHANNEL=formal
                PUBLISH_MANIFEST=true
                PRERELEASE=false
              fi
              ;;
            *)
              echo "::error title=Unsupported event::$EVENT is not a desktop release event."
              exit 1
              ;;
          esac

          # BUG-869: push / workflow_dispatch unchanged — MANIFEST_CHANNEL follows
          # CHANNEL and manifest publishes whenever the managed release does.
          if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
          if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

          BUILD_VERSION_NAME="$VERSION"
          case "$CHANNEL" in
            debug)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
                echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
                exit 1
              fi
              ;;
            beta)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
                echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
                exit 1
              fi
              ;;
            formal)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                echo "::error title=Invalid formal tag::Use v<version>."
                exit 1
              fi
              ;;
          esac
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
            BUILD_VERSION_NAME="${TAG#v}"
            BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
          fi

          # TODO-1049: the debug channel publishes to ONE fixed rolling GitHub
          # Release tag (`debug-rolling`) instead of a new
          # v<version>-debug.<seq> tag per push, so debug builds stop piling up
          # prereleases that bury the formal/beta entries. PUBLISH_TAG is the git
          # tag the GitHub Release actually uses; TAG stays the versioned/seq tag
          # the client compares (manifest `tag` field) and that names the
          # installer. beta/formal are unchanged: their release IS the version
          # tag. Mirrors release.yml so Android + desktop land on the same
          # rolling release for the same commit.
          # BUG-1481: per product family; the bridge (`app.hibiki.reader`) keeps
          # the historical `debug-rolling`. Must match release.yml.
          ROLLING_DEBUG_TAG=fushi-debug-rolling
          if [ "$CHANNEL" = debug ]; then
            PUBLISH_TAG="$ROLLING_DEBUG_TAG"
            ROLLING_DEBUG=true
          else
            PUBLISH_TAG="$TAG"
            ROLLING_DEBUG=false
          fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "publish_tag=$PUBLISH_TAG"
            echo "rolling_debug=$ROLLING_DEBUG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
            echo "publish_manifest=$PUBLISH_MANIFEST"
            echo "manifest_channel=$MANIFEST_CHANNEL"
            echo "build_version_name=$BUILD_VERSION_NAME"
            echo "release_sequence=$RELEASE_SEQUENCE"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # google_oauth_secret.dart is gitignored (the real client secret lives only
      # on dev hosts); CI lacks it, so google_drive_auth.dart's import fails to
      # compile. When the GOOGLE_OAUTH_CLIENT_SECRET repo secret is set, bake the
      # REAL value in so the desktop release can actually sign in to Google Drive
      # (otherwise sign-in hits invalid_client 401, TODO-045). When it is not
      # set, fall back to the committed example (placeholder value, no GOCSPX-
      # prefix, so the no_hardcoded_google_secret guard stays green).
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=fushi/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      # log_upload_secret.dart ships a committed empty placeholder (endpoint = '')
      # so a fresh clone compiles and the log-upload button stays hidden (it is
      # gated by a non-empty endpoint, not by platform - see log_upload_config
      # showUploadLogAction). When the LOG_UPLOAD_ENDPOINT / LOG_UPLOAD_TOKEN repo
      # secrets are set, bake the real values in so CI/release builds (incl.
      # Windows) actually show and can use the "upload log to cloud" button
      # (TODO-385). When unset, leave the committed empty placeholder so the
      # button stays hidden and no endpoint is exposed.
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=fushi/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=fushi/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: cache media_kit's pre-built libmpv + ANGLE .7z archives it
      # downloads from GitHub into the CMake binary dir (fushi/build/windows/x64).
      # media_kit's download_and_verify skips the download when the archive exists
      # with a matching MD5, so restoring just the .7z blobs (NOT the build tree /
      # CMakeCache -- avoids stale-abspath breakage) cuts the slow GitHub fetch.
      # Keyed on pubspec.lock so a media_kit version bump re-fetches.
      - name: Cache media_kit Windows mpv/ANGLE archives
        uses: actions/cache@v4
        with:
          path: fushi/build/windows/x64/*.7z
          key: ${{ runner.os }}-mediakit7z-${{ hashFiles('fushi/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-mediakit7z-
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        shell: bash
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # 内置 libtorrent 引擎 DLL：vcpkg 编 libtorrent + bridge，产物随发布包（下面
      # flutter build 的 copy-if-present 拷到 hibiki.exe 旁）。发布版必须带上，故此步
      # 失败即让发布失败（不静默出无内置引擎的包）。
      #
      # TODO-2668｜缓存 key 必须带 runner 镜像版本，否则这条链路每次都在冷编 + 拉网。
      # 旧 key 是常量 `<os>-vcpkg-libtorrent-x64-windows-v1`，有两个叠加的后果：
      #   a) GitHub 的 windows-2022 池同时在跑多个镜像版本，不同镜像里固化的 vcpkg
      #      修订不同，全部包的 ABI hash 就不同，一个常量 key 只装得下其中一种；
      #   b) actions/cache 只在「主 key 未命中」时才回存，所以另一种镜像的归档
      #      永远存不进去，一直冷。
      # 2026-08-02 实测 5 次 desktop run，ImageVersion 与命中率完全对应、无一例外：
      #   20260728.258.1 -> `Restored 72 package(s)`，vcpkg 步骤 4 min，零下载；
      #   20260720.249.2 -> 缓存命中、白下载解压 81MB，然后 `Restored 0 package(s)`，
      #                     22 min 全量重编 72 个包，并拉 ~110 个 tarball。
      # 那 ~110 个件里有 ~45 个来自 4 个不受我们控制的非 GitHub 主机
      # （mirror.msys2.org x40 / ftpmirror.gnu.org x2 / www.nasm.us / download.qt.io）。
      # run 30729229450 就死在其中一个：automake-1.17.tar.gz 三个 GNU 镜像同时
      # `curl error 35 (SSL connect error)`，而 vcpkg 把 SSL connect error 判成
      # 「Not a transient network error, won't retry」直接 BUILD_FAILED，桌面发布链整条
      # 红（publish 那句 `No files matched fushi-*-windows-setup.exe` 只是级联）。
      # 所以根因不是「vcpkg 的重试判定写错了」——那是外部缺陷、我们改不了——而是
      # 这条路径本来就不该下载任何东西：key 带上 ImageVersion 后两种镜像各占一个
      # 条目，都走 `Restored 72` 的零下载路径，取件抖动面归零、顺带每次省 ~18 min。
      # 二进制缓存故意不留 restore-keys：前缀命中回来的是另一镜像的归档，实测
      # `Restored 0`，纯白下 81MB，还会连同新归档一起回存、越滚越大。
      - name: Resolve vcpkg cache identity
        id: vcpkg_cache_id
        shell: pwsh
        run: |
          # runner 镜像版本决定了镜像内固化的 vcpkg 修订与 MSVC 工具集，也就决定了
          # 所有 vcpkg 包的 ABI hash。取不到时退回常量，行为等同改动前（冷编但不失败）。
          $image = $env:ImageVersion
          if ([string]::IsNullOrWhiteSpace($image)) { $image = 'unknown-image' }
          $image = ($image -replace '[^0-9A-Za-z._-]', '-')
          Write-Host "vcpkg cache identity (runner ImageVersion): $image"
          # 用 pwsh 的 `>>`（GHA 的 shell: pwsh 是 PowerShell 7，写 UTF-8 无 BOM）。
          # 别换成 `Out-File -Encoding utf8`：那在 Windows PowerShell 5.1 下会写 BOM，
          # BOM 会跟着糊进第一个 key，GITHUB_OUTPUT 的 key=value 解析当场失效。
          "image=$image" >> $env:GITHUB_OUTPUT
      # 第二层，只兜「新镜像上线那一次必然冷编」的残余：把 vcpkg 的 distfile 目录也
      # 缓存住，等价于 vcpkg 官方 asset cache 要解决的问题，但不需要额外的 Azure 或
      # 自建存储。distfile 全部按 SHA512 校验，所以前缀 restore-key 拿回上一个镜像的
      # 目录是安全的——对不上号的文件 vcpkg 自己会重下。而恰好那 4 个高危非 GitHub
      # 主机上的件（msys2 工具链 / automake / libiconv / nasm / jom）跨 vcpkg 修订几乎
      # 不变，前缀命中就能把高危取件面清零。排除 downloads\tools（解压后的树）以免把
      # 条目撑到 GB 级；重新解压是纯本地操作，不碰网络。该目录长期只增不减，体积不
      # 合适了就把 key 里的 -v1 递增一次。
      - name: Cache vcpkg source distfiles (libtorrent)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg-downloads
            !${{ runner.temp }}\vcpkg-downloads\tools
          key: ${{ runner.os }}-vcpkg-downloads-libtorrent-v1-${{ steps.vcpkg_cache_id.outputs.image }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-libtorrent-v1-
      - name: Cache vcpkg binary archives (libtorrent)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-libtorrent-x64-windows-v2-${{ steps.vcpkg_cache_id.outputs.image }}
      - name: Build embedded libtorrent DLL (vcpkg)
        shell: pwsh
        env:
          VCPKG_DOWNLOADS: ${{ runner.temp }}\vcpkg-downloads
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libtorrent:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install libtorrent failed" }
          powershell -ExecutionPolicy Bypass -File native/fushi_torrent/build_windows_dll.ps1 -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
      - name: Build Windows release
        working-directory: fushi
        run: >-
          flutter build windows --release
          --build-name "${{ steps.channel.outputs.build_version_name }}"
          --build-number "${{ steps.channel.outputs.release_sequence }}"
      - name: Bundle pinned Mihon desktop runtime
        shell: pwsh
        run: |
          .\tool\mihon\build_desktop_runtime.ps1 `
            -OutputDirectory "fushi\build\windows\x64\runner\Release\mihon_bridge" `
            -DownloadCache "$env:RUNNER_TEMP\hibiki-mihon-downloads"
          if ($LASTEXITCODE -ne 0) { throw "Mihon desktop runtime build failed ($LASTEXITCODE)" }
          .\tool\mihon\verify_desktop_runtime.ps1 `
            -RuntimeDirectory "fushi\build\windows\x64\runner\Release\mihon_bridge"
      - name: Build and bundle galgame helper archives
        shell: pwsh
        run: |
          # 这句断言是把「意外安全」变成「显式安全」，不是在修一个当前的漏红。
          # 准确的 pwsh 规则是：$LASTEXITCODE 只被 **native 命令** 写，cmdlet
          # （Join-Path / New-Item / Test-Path / Copy-Item）不会重置它。下面整段
          # 只有这一条 native 命令，所以块尾 GitHub 追加的 `exit $LASTEXITCODE`
          # 今天确实拿到的是 build_distribution.ps1 的退出码 —— 它是对的。
          # 但这份正确性完全依赖「后面没有第二条 native 命令」：任何人在下方插入
          # 一条 git / 7z / certutil，`-RunTests` 里双架构 22 个 ctest 的判决就会
          # 被静默顶掉。显式断言后这个隐性前提消失。
          powershell -NoProfile -ExecutionPolicy Bypass -File native/galgame_hook/tools/build_distribution.ps1 -RunTests
          if ($LASTEXITCODE -ne 0) { throw "build_distribution.ps1 -RunTests failed ($LASTEXITCODE)" }
          # BUG-1449：把 helper 作为**普通文件**直接装进 bundle 的 voice_hook\<arch>\，
          # 不再随包发 zip 让运行时解压。zip + 侧车 + 运行时安装那套是 helper 还走网络
          # 下载时的设计；随包之后它只剩一个后果——磁盘上多出一份需要与本体保持同步的
          # 解压副本，而「保持同步」正是 BUG-1448 断掉的地方。构建期解压使两者同源，
          # 漂移在结构上不再可能。完整性校验没有削弱，只是前移到这里（构建期 fail-closed）。
          # 解压/校验逻辑与 build-multiplatform.yml 共用同一个脚本：这两段曾是孪生副本，
          # 而「两份各自漂移」就是本次要根治的形态，不要再复制粘贴回来。
          powershell -NoProfile -ExecutionPolicy Bypass -File native/galgame_hook/tools/install_into_bundle.ps1 -BundleDirectory "$PWD\fushi\build\windows\x64\runner\Release"
          if ($LASTEXITCODE -ne 0) { throw "install_into_bundle.ps1 failed ($LASTEXITCODE)" }
      - name: Bundle slim Magpie for offline upscaling install
        shell: pwsh
        run: |
          # BUG-1217：随主包发行精简版 Magpie，超分首次使用不再需要下载 10.79 MB。
          # 脚本自己先校验上游完整包的 SHA-256 再裁剪重打包——裁剪等于重新签名，
          # 源包若被掉包而不先验，我们的侧车就成了给污染产物背书的东西。
          # 只出 x64：ARM64 用户极少且能跑 x64 模拟，为它多背 4.7 MB 不划算，
          # 那条路继续走按需下载。
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_magpie_slim.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_magpie_slim.ps1 failed ($LASTEXITCODE)" }
          $sourceDir = Join-Path $PWD 'dist'
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release\magpie_bundle'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          foreach ($file in @(
            'Magpie-hibiki-slim-x64.zip',
            'Magpie-hibiki-slim-x64.zip.sha256'
          )) {
            $source = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing bundled magpie asset: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $targetDir $file) -Force
          }
      # ffmpeg.exe and its MinGW runtime DLLs are vendored at
      # third_party/ffmpeg-min/windows/
      # (TODO-416). It used to be fetched from another workflow's build artifact,
      # which silently broke whenever that artifact expired (90 days) or that
      # workflow had not run on this branch, shipping a Windows bundle with NO
      # ffmpeg -> missing video covers/subtitles. Copying the committed binary
      # plus its runtime DLLs makes every release self-contained and removes the
      # cross-workflow supply dependency.
      - name: Install vendored ffmpeg-min runtime into Windows bundle
        shell: pwsh
        run: |
          $sourceDir = Join-Path $PWD 'third_party\ffmpeg-min\windows'
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            throw "Missing Windows release bundle directory: $targetDir"
          }
          # BUG-1420: ffprobe rides along with ffmpeg. resolveFfprobeExecutable()
          # (ffmpeg_backend.dart) has always looked for it next to the app exe,
          # but the recipe used to pass --disable-ffprobe so it never existed and
          # the lookup silently fell through to PATH. Two features degrade
          # silently without it on a machine with no system ffmpeg: embedded
          # subtitle fonts (subtitle_embedded_fonts.dart) and audio container
          # tags (desktop_audio_clipper.dart).
          # TODO-2701 ②: no MinGW runtime DLLs here. The recipe builds Windows with
          # `--extra-ldflags=-static --pkg-config-flags=--static`, so zlib/pthread
          # are folded into the exe; ffmpeg.exe/ffprobe.exe import only system DLLs
          # (kernel32/msvcrt/ws2_32/secur32/bcrypt). libwinpthread-1.dll and
          # zlib1.dll were leftovers from the pre-static, dynamically-linked MSYS2
          # generation and shipped ~194 KB of dead weight to every user.
          $runtimeFiles = @(
            'ffmpeg.exe',
            'ffprobe.exe'
          )
          foreach ($file in $runtimeFiles) {
            $source = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing vendored ffmpeg-min runtime file: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $targetDir $file) -Force
          }
          Get-Item -LiteralPath ($runtimeFiles | ForEach-Object { Join-Path $targetDir $_ }) |
            Select-Object FullName, Length
      # TODO-1242 (P0): hibiki's C++ modules link the MSVC CRT dynamically (/MD)
      # and reference newer STL/EH symbols (VCRUNTIME140_1!__CxxFrameHandler4).
      # The installer did NOT ship the CRT, so machines whose system VC++
      # Redistributable is stale (stuck at 2019 14.24) lack those exports and
      # hibiki.exe dies at launch with a faulting MSVCP140.dll / c0000005 access
      # violation. Standard Flutter Windows distribution practice: copy the CRT
      # DLLs next to the exe (app-directory DLL search precedes System32, needs
      # no elevation) so the payload is self-contained regardless of the target
      # machine's system redist. The DLLs land in the same Release dir that
      # hibiki.iss packages via `Source: {#SourceDir}\*`, so they ride into the
      # installer automatically. Sourced from the VS2022 redist on windows-2022.
      - name: Bundle VC++ CRT runtime into Windows bundle
        shell: pwsh
        run: |
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            throw "Missing Windows release bundle directory: $targetDir"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere not found: $vswhere (cannot locate the VS redist CRT)"
          }
          $vsInstall = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "vswhere could not resolve a Visual Studio installation path"
          }
          # Redist layout: <VSInstall>\VC\Redist\MSVC\<version>\x64\Microsoft.VC<NNN>.CRT\*.dll
          # Both <version> and <NNN> vary per VS build -- glob them, never hardcode.
          $redistRoot = Join-Path $vsInstall 'VC\Redist\MSVC'
          if (-not (Test-Path -LiteralPath $redistRoot -PathType Container)) {
            throw "VS redist root not found: $redistRoot"
          }
          $crtDir = Get-ChildItem -LiteralPath $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Get-ChildItem -Path (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'msvcp140.dll') -PathType Leaf } |
            Select-Object -First 1
          if ($null -eq $crtDir) {
            throw "Could not find a Microsoft.VC*.CRT x64 folder with msvcp140.dll under $redistRoot"
          }
          Write-Host "Using VC++ CRT redist: $($crtDir.FullName)"
          # Required trio: msvcp140 (STL) + vcruntime140 + vcruntime140_1 (the
          # __CxxFrameHandler4 EH exports the stale 14.24 redist is missing).
          # Absence must fail loudly -- silently skipping would ship a still-
          # crashing installer for this P0.
          $requiredDlls = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($dll in $requiredDlls) {
            $src = Join-Path $crtDir.FullName $dll
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) {
              throw "Required VC++ CRT DLL missing from redist: $src"
            }
            Copy-Item -LiteralPath $src -Destination (Join-Path $targetDir $dll) -Force
          }
          # Optional companions the same redist ships when present.
          $optionalDlls = @('msvcp140_1.dll', 'msvcp140_2.dll', 'msvcp140_codecvt_ids.dll', 'concrt140.dll')
          foreach ($dll in $optionalDlls) {
            $src = Join-Path $crtDir.FullName $dll
            if (Test-Path -LiteralPath $src -PathType Leaf) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $targetDir $dll) -Force
            }
          }
          Get-ChildItem -LiteralPath $targetDir -Filter '*140*.dll' |
            Select-Object FullName, Length
      # The bundled ffmpeg -version check below is the hard gate: it proves the
      # exact binary we ship in the installer payload executes. The fuller
      # smoke-test.sh comparison additionally needs a *fixture* full ffmpeg to
      # author representative MP4/MKV inputs (the minimal bundled binary
      # deliberately lacks lavfi/muxers - see windows_vendored_ffmpeg_guard).
      # GitHub windows runners do not preinstall ffmpeg, so the fixture comes
      # from `choco install ffmpeg`, whose source community.chocolatey.org
      # intermittently returns 504 Gateway Timeout (runs +130/+132). That is an
      # external-service flake on a *reference* generator, not a defect in the
      # shipped artifact, yet it was failing the whole Desktop release workflow
      # and blocking the installer. Fix (mirrors the TODO-624 emulator
      # non-blocking precedent): retry the choco install a few times to absorb
      # transient 504s, and if the fixture still cannot be obtained, emit a loud
      # ::warning:: and skip only the comparison smoke (the bundled -version gate
      # already ran). External-platform limitation: re-evaluate once a more
      # reliable fixture ffmpeg source is vendored/cached (TODO-652).
      - name: Smoke test bundled ffmpeg in Windows bundle
        shell: pwsh
        run: |
          # NOTE: keep the FULL literal bundle paths below (no $releaseDir
          # indirection). release_workflow_diagnostics_guard_test asserts on
          # these literals to prove the release smokes the exact binaries copied
          # beside hibiki.exe -- splitting them into a variable silently blinds
          # that guard.
          $target = Join-Path $PWD 'fushi\build\windows\x64\runner\Release\ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
            throw "Missing bundled ffmpeg executable: $target"
          }
          & $target -version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled ffmpeg failed -version with exit code $LASTEXITCODE"
          }
          # BUG-1420: ffprobe is a SEPARATE executable with its own consumers
          # (embedded subtitle fonts, audio container tags). A bundle that ships
          # a healthy ffmpeg but a missing/broken ffprobe degrades silently -
          # both consumers swallow the ProcessException by design - so gate it
          # here with the same -version check rather than trusting the copy step.
          $probeTarget = Join-Path $PWD 'fushi\build\windows\x64\runner\Release\ffprobe.exe'
          if (-not (Test-Path -LiteralPath $probeTarget -PathType Leaf)) {
            throw "Missing bundled ffprobe executable: $probeTarget"
          }
          & $probeTarget -version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled ffprobe failed -version with exit code $LASTEXITCODE"
          }
          $fixtureCommand = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($null -eq $fixtureCommand) {
            # External dependency: tolerate transient chocolatey 504s with a
            # bounded retry instead of failing on the first flake.
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Installing fixture ffmpeg from chocolatey (attempt $attempt/3)"
              choco install ffmpeg -y --no-progress
              $fixtureCommand = Get-Command ffmpeg -ErrorAction SilentlyContinue
              if ($null -ne $fixtureCommand) { break }
              if ($attempt -lt 3) {
                Write-Host "Fixture ffmpeg not available yet; retrying in 30s..."
                Start-Sleep -Seconds 30
              }
            }
          }
          if ($null -eq $fixtureCommand) {
            Write-Host "::warning title=Fixture ffmpeg unavailable::Could not obtain a full fixture ffmpeg (chocolatey likely flaking, e.g. 504). The bundled ffmpeg -version gate already passed; skipping the fixture comparison smoke test. This is an external-service flake on a reference generator, not a defect in the shipped binary (TODO-652)."
            exit 0
          }
          $fixtureFfmpeg = $fixtureCommand.Source
          & $fixtureFfmpeg -version
          if ($LASTEXITCODE -ne 0) {
            throw "Fixture ffmpeg failed -version with exit code $LASTEXITCODE"
          }
          $bash = (Get-Command bash -ErrorAction Stop).Source
          $env:FFMPEG_MIN = ($target -replace '\\', '/')
          $env:FIXTURE_FFMPEG = ($fixtureFfmpeg -replace '\\', '/')
          & $bash -c 'bash tool/ffmpeg-min/smoke-test.sh'
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & "$iscc" "/DAppVersion=${{ steps.channel.outputs.build_version_name }}" `
            "/DSourceDir=$PWD\fushi\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\fushi\build\installer" `
            "fushi\windows\installer\fushi.iss"
      - name: Check signing availability
        id: signcheck
        shell: bash
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sign installer (optional)
        if: steps.signcheck.outputs.have == 'true'
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & "$st" sign /fd SHA256 /f "$PWD\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "$PWD\fushi\build\installer\fushi-${{ steps.channel.outputs.build_version_name }}-windows-setup.exe"
      - name: Prepare Windows installer release asset
        shell: bash
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
        run: |
          set -euo pipefail
          installer="fushi/build/installer/fushi-${BUILD_VERSION_NAME}-windows-setup.exe"
          asset_name="$(basename "$installer")"
          if [ ! -f "$installer" ]; then
            echo "::error title=Windows installer missing::Expected $installer"
            exit 1
          fi
          if [ "$CHANNEL" = "debug" ]; then
            case "$asset_name" in
              *-debug.*-windows-setup.exe) ;;
              *)
                echo "::error title=Invalid debug Windows installer asset::Expected *-debug.*-windows-setup.exe, got $asset_name"
                exit 1
                ;;
            esac
          fi
          mkdir -p fushi/build/release-artifacts
          rm -f fushi/build/release-artifacts/fushi-*-windows-setup.exe
          cp "$installer" "fushi/build/release-artifacts/$asset_name"
      # TODO-866: same fragility as the Android release workflow -- the prepared
      # Windows installer is otherwise only uploaded as a GitHub Release asset
      # (softprops steps below). When that publish intermittently 403s, the
      # installer is built successfully but has NO download path and dies with
      # the runner. Capture it as a workflow-run artifact so the build is always
      # downloadable from the run page, decoupled from Release publish. The
      # single non-blocking `publish` job downloads this artifact and does all
      # Release publishing, so Windows never waits on / is blocked by mac/iOS.
      - name: Upload Windows installer artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-windows
          path: fushi/build/release-artifacts/fushi-*-windows-setup.exe
          if-no-files-found: ignore
          retention-days: 14

  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve desktop release channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' fushi/pubspec.yaml | sed 's/version: *//;s/+.*//')
          RELEASE_SEQUENCE=$(git rev-list --count HEAD)
          if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
            echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME}"
          CHANNEL="${INPUT_CHANNEL:-}"
          TAG="${INPUT_TAG_NAME:-}"
          NAME="${INPUT_RELEASE_NAME:-}"
          BODY=""
          PRERELEASE=true
          MAKE_LATEST=false
          PUBLISH_MANAGED_RELEASE=false
          # BUG-869: manifest-only publish flag decoupled from
          # PUBLISH_MANAGED_RELEASE (see release.yml) so the `release` event can
          # emit latest-stable.json without re-touching the manual Release.
          PUBLISH_MANIFEST=false
          MANIFEST_CHANNEL=""

          case "$EVENT" in
            push)
              CHANNEL=debug
              TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
              NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
              BODY="Automated desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
              PUBLISH_MANAGED_RELEASE=true
              ;;
            workflow_dispatch)
              case "$CHANNEL" in
                debug)
                  TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                  NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
                  BODY="Manual desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                  ;;
                beta)
                  TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                  NAME="${NAME:-Hibiki ${VERSION} beta ${RELEASE_SEQUENCE}}"
                  BODY="Manual desktop beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                  ;;
                formal)
                  TAG="${TAG:-v${VERSION}}"
                  NAME="${NAME:-Hibiki ${VERSION}}"
                  BODY="Manual desktop formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                  PRERELEASE=false
                  MAKE_LATEST=true
                  ;;
                *)
                  echo "::error title=Invalid release channel::Use debug, beta, or formal."
                  exit 1
                  ;;
              esac
              PUBLISH_MANAGED_RELEASE=true
              ;;
            release)
              CHANNEL=github-release
              TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
              # BUG-869: a manually-published NON-prerelease Release IS the formal
              # stable release → emit latest-stable.json (with releaseSequence) for
              # in-China stable clients. Manifest-only; never touches the Release.
              if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
                MANIFEST_CHANNEL=formal
                PUBLISH_MANIFEST=true
                PRERELEASE=false
              fi
              ;;
            *)
              echo "::error title=Unsupported event::$EVENT is not a desktop release event."
              exit 1
              ;;
          esac

          # BUG-869: push / workflow_dispatch unchanged — MANIFEST_CHANNEL follows
          # CHANNEL and manifest publishes whenever the managed release does.
          if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
          if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

          BUILD_VERSION_NAME="$VERSION"
          case "$CHANNEL" in
            debug)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
                echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
                exit 1
              fi
              ;;
            beta)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
                echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
                exit 1
              fi
              ;;
            formal)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                echo "::error title=Invalid formal tag::Use v<version>."
                exit 1
              fi
              ;;
          esac
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
            BUILD_VERSION_NAME="${TAG#v}"
            BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
          fi

          # BUG-1481: per product family; the bridge (`app.hibiki.reader`) keeps
          # the historical `debug-rolling`. Must match release.yml.
          ROLLING_DEBUG_TAG=fushi-debug-rolling
          if [ "$CHANNEL" = debug ]; then
            PUBLISH_TAG="$ROLLING_DEBUG_TAG"
            ROLLING_DEBUG=true
          else
            PUBLISH_TAG="$TAG"
            ROLLING_DEBUG=false
          fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "publish_tag=$PUBLISH_TAG"
            echo "rolling_debug=$ROLLING_DEBUG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
            echo "publish_manifest=$PUBLISH_MANIFEST"
            echo "manifest_channel=$MANIFEST_CHANNEL"
            echo "build_version_name=$BUILD_VERSION_NAME"
            echo "release_sequence=$RELEASE_SEQUENCE"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=fushi/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=fushi/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=fushi/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: cache CocoaPods spec repos + downloaded pod source and the
      # generated Pods dirs. Keyed on the Podfile.lock/pubspec.lock so a pod bump
      # invalidates it; CocoaPods re-installs on a mismatch, and a miss just
      # re-downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            fushi/ios/Pods
            fushi/macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('fushi/ios/Podfile.lock', 'fushi/macos/Podfile.lock', 'fushi/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        shell: bash
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      - name: Build macOS release
        working-directory: fushi
        run: >-
          flutter build macos --release
          --build-name "${{ steps.channel.outputs.build_version_name }}"
          --build-number "${{ steps.channel.outputs.release_sequence }}"
      - name: Bundle and sign pinned Mihon desktop runtimes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tool/mihon/build_desktop_runtime.sh
          app_dir="fushi/build/macos/Build/Products/Release/fushi.app"
          runtime_dir="$app_dir/Contents/Resources/mihon_bridge"
          tool/mihon/build_desktop_runtime.sh "$runtime_dir" "$RUNNER_TEMP/hibiki-mihon-downloads"
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$candidate"
            fi
          done < <(find "$runtime_dir" -type f)
          chmod +x tool/mihon/verify_desktop_runtime.sh
          tool/mihon/verify_desktop_runtime.sh "$runtime_dir"
          codesign --force --deep --sign - --timestamp=none "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
      # BUG-1421: the macOS bundle never shipped ffmpeg at all. Only the Windows
      # job had an install step, so fushi.app/Contents/MacOS/ held just the main
      # executable and _bundledExecutablePath() (ffmpeg_backend.dart) always
      # returned null -> resolveFfmpegExecutable() fell through to a bare
      # 'ffmpeg' on PATH. macOS ships no system ffmpeg, so every Mac without a
      # Homebrew ffmpeg had the ENTIRE desktop mining chain dead: frame covers,
      # sentence audio, cue animations, clip export, embedded subtitle
      # extraction -- all ProcessException.
      #
      # Contents/MacOS/ is the right home: that is the directory
      # Platform.resolvedExecutable lives in, which is exactly where the Dart
      # lookup searches. The app is ad-hoc signed (--sign -, no notarization),
      # so shipping helper executables there needs no Helpers/ dir or
      # entitlements change -- they just have to be signed, and the app
      # re-signed afterwards. Mirrors the Mihon runtime step above.
      - name: Install vendored ffmpeg-min runtime into macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          source_dir="third_party/ffmpeg-min/macos"
          app_dir="fushi/build/macos/Build/Products/Release/fushi.app"
          target_dir="$app_dir/Contents/MacOS"
          if [ ! -d "$target_dir" ]; then
            echo "::error title=macOS bundle missing::Expected $target_dir"
            exit 1
          fi
          for tool in ffmpeg ffprobe; do
            src="$source_dir/$tool"
            if [ ! -f "$src" ]; then
              echo "::error title=Missing vendored binary::$src"
              exit 1
            fi
            cp "$src" "$target_dir/$tool"
            chmod +x "$target_dir/$tool"
            codesign --force --sign - --timestamp=none "$target_dir/$tool"
          done
          # Re-sign the app after mutating its bundle, then prove the payload is
          # actually runnable. `-version` is the hard gate: a wrong-arch or
          # broken binary would otherwise ride into the release unnoticed (the
          # Windows job has the same gate for the same reason).
          codesign --force --deep --sign - --timestamp=none "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
          "$target_dir/ffmpeg" -hide_banner -version | head -n 1
          "$target_dir/ffprobe" -hide_banner -version | head -n 1
          ls -lh "$target_dir/ffmpeg" "$target_dir/ffprobe"
      # ---- Developer ID 签名 + 公证（Gatekeeper）-------------------------
      # **必须排在上面 Mihon / ffmpeg 两步之后**：那两步往 bundle 里塞可执行文件
      # 并用 `codesign --force --deep --sign -` 重签整个 app，签在前面的
      # Developer ID 签名会被那个 ad-hoc 签名整个盖掉。
      # 每一项 Apple 凭据都是可选的：没有它们（fork，或本仓开发者账号存在之前）
      # 走原来的 ad-hoc 签名 zip，发布链路绝不硬依赖 Apple 开发者账号。
      # 有它们时才做 Developer ID 重签 + notarytool 公证 + stapler 装订，
      # 用户下载 zip 后不再被「已损坏，无法打开」拦住。
      # 注意：macOS 走的是 Developer ID（App Store 之外分发），不是 TestFlight。
      # Release.entitlements 已刻意去沙盒（应用内自动更新要写 /Applications），
      # 上 Mac App Store / macOS TestFlight 需要重新引入沙盒，是另一个决策。
      - name: Resolve macOS Developer ID signing mode
        id: signing
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SIGN=false
          if [ -n "$MACOS_DEVELOPER_ID_P12_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            SIGN=true
          fi
          # 公证要 App Store Connect API key；只签不公证仍然会被 Gatekeeper 拦，
          # 所以缺 API key 时把签名一起降级，避免产出「签了但过不了」的中间态。
          NOTARIZE=false
          if [ "$SIGN" = true ] && [ -n "$APPSTORE_API_KEY_ID" ] \
             && [ -n "$APPSTORE_API_ISSUER_ID" ] && [ -n "$APPSTORE_API_PRIVATE_KEY" ]; then
            NOTARIZE=true
          fi
          if [ "$SIGN" = true ] && [ "$NOTARIZE" = false ]; then
            echo "::warning title=macOS notarization skipped::Developer ID cert present but APPSTORE_API_* secrets are missing; falling back to the unsigned ad-hoc zip."
            SIGN=false
          fi
          echo "macos_signed=$SIGN" >> "$GITHUB_OUTPUT"
          echo "Developer ID signing: $SIGN"
      - name: Import Developer ID certificate
        if: steps.signing.outputs.macos_signed == 'true'
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/hibiki-macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 6h 自动锁；不设的话默认 5 分钟无操作即锁，长构建中途 codesign 会失败。
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" \
            -P "${MACOS_DEVELOPER_ID_P12_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -A
          rm -f "$P12_PATH"
          # 没有这一步，codesign 每次用私钥都会弹「允许访问钥匙串」的 UI 授权，
          # 无人值守的 runner 上直接挂住。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # 把临时钥匙串放进搜索列表最前面，同时保留 runner 原有的 login 钥匙串。
          EXISTING_KEYCHAINS=""
          while IFS= read -r line; do
            trimmed="$(printf '%s' "$line" | tr -d '"' | sed 's/^ *//;s/ *$//')"
            if [ -n "$trimmed" ]; then
              EXISTING_KEYCHAINS="$EXISTING_KEYCHAINS $trimmed"
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -n 1 | sed 's/.*) \([0-9A-F]*\) ".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error title=No Developer ID identity::MACOS_DEVELOPER_ID_P12_BASE64 does not contain a 'Developer ID Application' certificate with its private key."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          {
            echo "MACOS_SIGN_IDENTITY=$IDENTITY"
            echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
          echo "Developer ID identity: $IDENTITY"
      - name: Sign macOS app with Developer ID
        if: steps.signing.outputs.macos_signed == 'true'
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/fushi.app"
          ENTITLEMENTS="macos/Runner/Release.entitlements"
          JVM_ENTITLEMENTS="$RUNNER_TEMP/mihon-jvm.entitlements"
          if [ ! -d "$APP" ]; then
            echo "::error title=macOS app missing::Expected $APP"
            exit 1
          fi
          # 捆绑的 Temurin JDK 21 jlink 镜像（Contents/Resources/mihon_bridge）在
          # 强化运行时下跑 HotSpot 需要 JIT 和可写可执行内存，还要能加载镜像里那堆
          # 库。这些 entitlement 只给 JVM 可执行体，不进主 app —— 主 app 是 AOT 的
          # Flutter，给了纯属白白扩大攻击面。
          cat > "$JVM_ENTITLEMENTS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$JVM_ENTITLEMENTS"
          sign_one() {
            codesign --force --timestamp --options runtime \
              --keychain "$MACOS_KEYCHAIN_PATH" \
              --sign "$MACOS_SIGN_IDENTITY" "$@"
          }
          # 公证要求 bundle 里**每一个** Mach-O 都带强化运行时 + 安全时间戳，不是
          # 只有 dylib：Contents/MacOS 下的 ffmpeg/ffprobe、mihon_bridge 里的 JVM
          # 可执行体同样算，而它们都没有扩展名 —— 所以按 `file` 判定而不是后缀。
          # 按路径深度倒序，内层先签（codesign 会把内层签名封进外层，顺序反了外层
          # 立刻失效）。-type f 同时排除了符号链接，jlink 镜像和 framework 里的
          # 符号链接不能签。
          MIHON_PREFIX="$APP/Contents/Resources/mihon_bridge/"
          while IFS= read -r item; do
            if ! file "$item" | grep -q 'Mach-O'; then
              continue
            fi
            case "$item" in
              "$MIHON_PREFIX"*)
                echo "signing (jvm): $item"
                sign_one --entitlements "$JVM_ENTITLEMENTS" "$item"
                ;;
              *)
                echo "signing: $item"
                sign_one "$item"
                ;;
            esac
          done < <(find "$APP/Contents" -type f \
            | awk '{ print gsub(/\//, "/") "\t" $0 }' | sort -rn | cut -f2-)
          # framework bundle 本身（内层 Mach-O 上一轮已签）。
          while IFS= read -r -d '' item; do
            echo "signing bundle: $item"
            sign_one "$item"
          done < <(find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 2>/dev/null)
          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --keychain "$MACOS_KEYCHAIN_PATH" \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - --verbose=4 "$APP"
      - name: Notarize and staple macOS app
        if: steps.signing.outputs.macos_signed == 'true'
        working-directory: fushi
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/fushi.app"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          NOTARIZE_ZIP="$RUNNER_TEMP/hibiki-notarize.zip"
          # 公证服务只吃 zip/dmg/pkg，且必须 ditto 保留 .app 的符号链接与扩展属性。
          ditto -c -k --keepParent "$APP" "$NOTARIZE_ZIP"
          set +e
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_API_ISSUER_ID" \
            --wait --timeout 45m
          NOTARY_STATUS=$?
          set -e
          rm -f "$KEY_PATH" "$NOTARIZE_ZIP"
          if [ "$NOTARY_STATUS" -ne 0 ]; then
            echo "::error title=Notarization failed::notarytool exited $NOTARY_STATUS. Run 'xcrun notarytool log <submission-id>' with the same key to see the rejected binaries."
            exit "$NOTARY_STATUS"
          fi
          # 装订票据：装订后用户离线也能通过 Gatekeeper（不装订则每次首启都要联网）。
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
      - name: Prepare macOS app release asset
        working-directory: fushi
        shell: bash
        env:
          BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
        run: |
          set -euo pipefail
          app_dir="build/macos/Build/Products/Release/fushi.app"
          out_dir="build/release-artifacts"
          if [ ! -d "$app_dir" ]; then
            echo "::error title=macOS app missing::Expected $app_dir"
            exit 1
          fi
          mkdir -p "$out_dir"
          rm -f "$out_dir"/fushi-*-macos.zip
          ditto -c -k --keepParent "$app_dir" "$out_dir/fushi-${BUILD_VERSION_NAME}-macos.zip"
      # The single non-blocking `publish` job downloads this artifact and does
      # all Release publishing, so macOS builds in parallel with Windows/iOS and
      # never blocks (or is blocked by) the other platforms.
      - name: Upload macOS app artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-macos
          path: fushi/build/release-artifacts/fushi-*-macos.zip
          if-no-files-found: ignore
          retention-days: 14

  ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve desktop release channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' fushi/pubspec.yaml | sed 's/version: *//;s/+.*//')
          RELEASE_SEQUENCE=$(git rev-list --count HEAD)
          if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
            echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME}"
          CHANNEL="${INPUT_CHANNEL:-}"
          TAG="${INPUT_TAG_NAME:-}"
          NAME="${INPUT_RELEASE_NAME:-}"
          BODY=""
          PRERELEASE=true
          MAKE_LATEST=false
          PUBLISH_MANAGED_RELEASE=false
          # BUG-869: manifest-only publish flag decoupled from
          # PUBLISH_MANAGED_RELEASE (see release.yml) so the `release` event can
          # emit latest-stable.json without re-touching the manual Release.
          PUBLISH_MANIFEST=false
          MANIFEST_CHANNEL=""

          case "$EVENT" in
            push)
              CHANNEL=debug
              TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
              NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
              BODY="Automated desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
              PUBLISH_MANAGED_RELEASE=true
              ;;
            workflow_dispatch)
              case "$CHANNEL" in
                debug)
                  TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                  NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
                  BODY="Manual desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                  ;;
                beta)
                  TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                  NAME="${NAME:-Hibiki ${VERSION} beta ${RELEASE_SEQUENCE}}"
                  BODY="Manual desktop beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                  ;;
                formal)
                  TAG="${TAG:-v${VERSION}}"
                  NAME="${NAME:-Hibiki ${VERSION}}"
                  BODY="Manual desktop formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                  PRERELEASE=false
                  MAKE_LATEST=true
                  ;;
                *)
                  echo "::error title=Invalid release channel::Use debug, beta, or formal."
                  exit 1
                  ;;
              esac
              PUBLISH_MANAGED_RELEASE=true
              ;;
            release)
              CHANNEL=github-release
              TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
              # BUG-869: a manually-published NON-prerelease Release IS the formal
              # stable release → emit latest-stable.json (with releaseSequence) for
              # in-China stable clients. Manifest-only; never touches the Release.
              if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
                MANIFEST_CHANNEL=formal
                PUBLISH_MANIFEST=true
                PRERELEASE=false
              fi
              ;;
            *)
              echo "::error title=Unsupported event::$EVENT is not a desktop release event."
              exit 1
              ;;
          esac

          # BUG-869: push / workflow_dispatch unchanged — MANIFEST_CHANNEL follows
          # CHANNEL and manifest publishes whenever the managed release does.
          if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
          if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

          BUILD_VERSION_NAME="$VERSION"
          case "$CHANNEL" in
            debug)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
                echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
                exit 1
              fi
              ;;
            beta)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
                echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
                exit 1
              fi
              ;;
            formal)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                echo "::error title=Invalid formal tag::Use v<version>."
                exit 1
              fi
              ;;
          esac
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
            BUILD_VERSION_NAME="${TAG#v}"
            BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
          fi

          # BUG-1481: per product family; the bridge (`app.hibiki.reader`) keeps
          # the historical `debug-rolling`. Must match release.yml.
          ROLLING_DEBUG_TAG=fushi-debug-rolling
          if [ "$CHANNEL" = debug ]; then
            PUBLISH_TAG="$ROLLING_DEBUG_TAG"
            ROLLING_DEBUG=true
          else
            PUBLISH_TAG="$TAG"
            ROLLING_DEBUG=false
          fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "publish_tag=$PUBLISH_TAG"
            echo "rolling_debug=$ROLLING_DEBUG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
            echo "publish_manifest=$PUBLISH_MANIFEST"
            echo "manifest_channel=$MANIFEST_CHANNEL"
            echo "build_version_name=$BUILD_VERSION_NAME"
            echo "release_sequence=$RELEASE_SEQUENCE"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=fushi/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=fushi/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=fushi/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp fushi/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: cache CocoaPods spec repos + downloaded pod source and the
      # generated Pods dirs. Keyed on the Podfile.lock/pubspec.lock so a pod bump
      # invalidates it; CocoaPods re-installs on a mismatch, and a miss just
      # re-downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            fushi/ios/Pods
            fushi/macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('fushi/ios/Podfile.lock', 'fushi/macos/Podfile.lock', 'fushi/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        shell: bash
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # See build-multiplatform.yml ios job: flutter_native_splash 2.4.4 ships a
      # broken SPM Package.swift and its 2.4.5+ fix conflicts with our pinned
      # archive ^3.6.1 / xml ^6.3.0. iOS deps are CocoaPods-managed, so disable
      # Flutter 3.44's experimental SPM integration here too. (TODO-1129)
      - name: Disable experimental Swift Package Manager (CocoaPods-managed iOS)
        run: flutter config --no-enable-swift-package-manager
      - name: Build iOS release app (no codesign)
        working-directory: fushi
        run: >-
          flutter build ios --release --no-codesign
          --build-name "${{ steps.channel.outputs.build_version_name }}"
          --build-number "${{ steps.channel.outputs.release_sequence }}"
      - name: Prepare unsigned iOS IPA release asset
        working-directory: fushi
        shell: bash
        env:
          BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
        run: |
          set -euo pipefail
          app_dir="build/ios/iphoneos/Runner.app"
          out_dir="build/release-artifacts"
          payload_dir="$RUNNER_TEMP/hibiki-ios-payload"
          if [ ! -d "$app_dir" ]; then
            echo "::error title=iOS app missing::Expected $app_dir"
            exit 1
          fi
          rm -rf "$payload_dir"
          mkdir -p "$payload_dir/Payload" "$out_dir"
          ditto "$app_dir" "$payload_dir/Payload/Runner.app"
          rm -f "$out_dir"/fushi-*-ios.ipa
          (
            cd "$payload_dir"
            zip -qry "$GITHUB_WORKSPACE/fushi/$out_dir/fushi-${BUILD_VERSION_NAME}-ios.ipa" Payload
          )
      # The single non-blocking `publish` job downloads this artifact and does
      # all Release publishing, so iOS builds in parallel with Windows/macOS and
      # never blocks (or is blocked by) the other platforms.
      - name: Upload iOS IPA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-ios
          path: fushi/build/release-artifacts/fushi-*-ios.ipa
          if-no-files-found: ignore
          retention-days: 14

      # ---- App Store 签名 + TestFlight ---------------------------------
      # 上面的未签名 IPA 是 GitHub Release 资产，**保持不变**：老用户用自签工具
      # （AltStore / Sideloadly 等）侧载的就是它，换成 App Store 签名的包会直接
      # 打断他们。TestFlight 走的是下面这个额外的、只在手动 beta/formal 发布时
      # 才产出的签名 IPA，它不进 Release 资产。
      #
      # 每一项 Apple 凭据都是可选的：缺任何一项就整段跳过，未签名 IPA 照常发布，
      # fork 与无账号状态下发布链路不受影响（tool/check_release_policy.ps1 守卫
      # 也依赖 `flutter build ios --release --no-codesign` 这条路径继续存在）。
      - name: Resolve Apple signing mode
        id: signing
        shell: bash
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
          INPUT_UPLOAD_TESTFLIGHT: ${{ github.event.inputs.upload_testflight }}
        run: |
          set -euo pipefail
          CREDS=false
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] \
             && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPSTORE_API_KEY_ID" ] \
             && [ -n "$APPSTORE_API_ISSUER_ID" ] && [ -n "$APPSTORE_API_PRIVATE_KEY" ]; then
            CREDS=true
          fi
          # 只在手动 beta/formal 发布时上传。push 触发的 debug 通道每次提交都会跑，
          # 传 TestFlight 只会白烧 App Store Connect 的处理配额并把构建号推高，
          # 而构建号在同一个 CFBundleShortVersionString 下必须单调，浪费不可回收。
          TESTFLIGHT=false
          if [ "$CREDS" = true ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
             && { [ "$RELEASE_CHANNEL" = beta ] || [ "$RELEASE_CHANNEL" = formal ]; } \
             && [ "${INPUT_UPLOAD_TESTFLIGHT:-true}" != false ]; then
            TESTFLIGHT=true
          fi
          if [ "$CREDS" = false ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
             && [ "${INPUT_UPLOAD_TESTFLIGHT:-true}" != false ] \
             && { [ "$RELEASE_CHANNEL" = beta ] || [ "$RELEASE_CHANNEL" = formal ]; }; then
            echo "::warning title=TestFlight upload skipped::Apple signing secrets are incomplete. See docs/agent/apple-signing.md for the required secret names."
          fi
          echo "testflight=$TESTFLIGHT" >> "$GITHUB_OUTPUT"
          echo "TestFlight upload: $TESTFLIGHT (channel=$RELEASE_CHANNEL event=$GITHUB_EVENT_NAME creds=$CREDS)"
      - name: Import iOS distribution certificate
        if: steps.signing.outputs.testflight == 'true'
        shell: bash
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/hibiki-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12_PATH="$RUNNER_TEMP/ios-distribution.p12"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 见 macos job：默认 5 分钟无操作即锁，长构建中途 codesign 会失败。
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" \
            -P "${IOS_DIST_CERT_P12_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -A
          rm -f "$P12_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          EXISTING_KEYCHAINS=""
          while IFS= read -r line; do
            trimmed="$(printf '%s' "$line" | tr -d '"' | sed 's/^ *//;s/ *$//')"
            if [ -n "$trimmed" ]; then
              EXISTING_KEYCHAINS="$EXISTING_KEYCHAINS $trimmed"
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Apple Distribution' | head -n 1 | sed 's/.*) \([0-9A-F]*\) ".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error title=No Apple Distribution identity::IOS_DIST_CERT_P12_BASE64 does not contain an 'Apple Distribution' certificate with its private key. A 'Apple Development' cert cannot sign an App Store build."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          {
            echo "IOS_SIGN_IDENTITY=$IDENTITY"
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
          echo "Apple Distribution identity: $IDENTITY"
      - name: Install provisioning profile and signing xcconfig
        if: steps.signing.outputs.testflight == 'true'
        shell: bash
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/hibiki.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/hibiki-profile.plist"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          # .mobileprovision 是 CMS 签名信封，先解出里面的 plist 才能读字段。
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_EXPIRY="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_BUNDLE_ID="${APP_ID#*.}"
          EXPECTED_BUNDLE_ID="$(sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER = \(.*\);/\1/p' \
            fushi/ios/Runner.xcodeproj/project.pbxproj | grep -v RunnerTests | head -n 1)"
          if [ "$PROFILE_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error title=Provisioning profile mismatch::Profile is for '$PROFILE_BUNDLE_ID' but Runner builds '$EXPECTED_BUNDLE_ID'. A wildcard profile cannot be used for App Store distribution."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          # 手动签名设置写进 ios/Flutter/Release.xcconfig（gitignore 之外的模板文件，
          # 只在 runner 上追加，不入库）。这是 Runner **target** 的 base configuration，
          # 在 Xcode 的优先级里高于 project 级设置 —— 而 project.pbxproj 恰好在
          # project 级钉了 CODE_SIGN_IDENTITY[sdk=iphoneos*] = "iPhone Developer"，
          # CI 钥匙串里没有这张证书。带条件的赋值只能被同样带条件的赋值压过，
          # 所以两种写法都写一遍。改 pbxproj 或用 xcodebuild 命令行全局覆盖都会
          # 波及 CocoaPods 的 pod target（use_frameworks! 下它们也要签名），
          # 这条路径只作用于 Runner 工程。
          {
            echo ""
            echo "// Injected by .github/workflows/release-desktop.yml for the TestFlight build."
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution"
            echo "OTHER_CODE_SIGN_FLAGS = \$(inherited) --keychain $IOS_KEYCHAIN_PATH"
          } >> fushi/ios/Flutter/Release.xcconfig
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${PROFILE_BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          # heredoc 的缩进由 YAML 块标量统一剥掉，但这个文件是签名链路的唯一入口，
          # 写坏了报错发生在 xcodebuild 深处，先在这里把格式问题挡下来。
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$PROFILE_PATH" "$PROFILE_PLIST"
          echo "profile: $PROFILE_NAME ($PROFILE_UUID) bundle=$PROFILE_BUNDLE_ID expires=$PROFILE_EXPIRY"
      - name: Build signed iOS App Store IPA
        if: steps.signing.outputs.testflight == 'true'
        working-directory: fushi
        run: >-
          flutter build ipa --release
          --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          --build-name "${{ steps.channel.outputs.build_version_name }}"
          --build-number "${{ steps.channel.outputs.release_sequence }}"
      - name: Upload to TestFlight
        if: steps.signing.outputs.testflight == 'true'
        working-directory: fushi
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IPA=""
          while IFS= read -r candidate; do
            IPA="$candidate"
            break
          done < <(find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f)
          if [ -z "$IPA" ]; then
            echo "::error title=Signed IPA missing::flutter build ipa produced no .ipa under fushi/build/ios/ipa"
            ls -la build/ios/ipa || true
            exit 1
          fi
          echo "uploading $IPA"
          # altool 只在这几个固定目录里找 --apiKey 对应的 .p8。
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          cleanup() { rm -f "$KEY_PATH"; }
          trap cleanup EXIT
          # 先 validate 再 upload：绝大多数拒收（缺 icon、entitlement 不匹配、
          # 构建号回退）在 validate 阶段就报出来，比等 App Store Connect 发退信快。
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"
          echo "已上传 TestFlight；App Store Connect 处理完成（通常 5-30 分钟）后才会出现在测试员列表里。"

  publish:
    needs: [windows, macos, ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate unified release policy
        shell: pwsh
        run: ./tool/check_release_policy.ps1
      - name: Resolve desktop release channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' fushi/pubspec.yaml | sed 's/version: *//;s/+.*//')
          RELEASE_SEQUENCE=$(git rev-list --count HEAD)
          if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
            echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME}"
          CHANNEL="${INPUT_CHANNEL:-}"
          TAG="${INPUT_TAG_NAME:-}"
          NAME="${INPUT_RELEASE_NAME:-}"
          BODY=""
          PRERELEASE=true
          MAKE_LATEST=false
          PUBLISH_MANAGED_RELEASE=false
          # BUG-869: manifest-only publish flag decoupled from
          # PUBLISH_MANAGED_RELEASE (see release.yml) so the `release` event can
          # emit latest-stable.json without re-touching the manual Release.
          PUBLISH_MANIFEST=false
          MANIFEST_CHANNEL=""

          case "$EVENT" in
            push)
              CHANNEL=debug
              TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
              NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
              BODY="Automated desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
              PUBLISH_MANAGED_RELEASE=true
              ;;
            workflow_dispatch)
              case "$CHANNEL" in
                debug)
                  TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                  NAME="${NAME:-Hibiki desktop debug ${VERSION} (${SHORT_SHA})}"
                  BODY="Manual desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                  ;;
                beta)
                  TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                  NAME="${NAME:-Hibiki ${VERSION} beta ${RELEASE_SEQUENCE}}"
                  BODY="Manual desktop beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                  ;;
                formal)
                  TAG="${TAG:-v${VERSION}}"
                  NAME="${NAME:-Hibiki ${VERSION}}"
                  BODY="Manual desktop formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                  PRERELEASE=false
                  MAKE_LATEST=true
                  ;;
                *)
                  echo "::error title=Invalid release channel::Use debug, beta, or formal."
                  exit 1
                  ;;
              esac
              PUBLISH_MANAGED_RELEASE=true
              ;;
            release)
              CHANNEL=github-release
              TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
              # BUG-869: a manually-published NON-prerelease Release IS the formal
              # stable release → emit latest-stable.json (with releaseSequence) for
              # in-China stable clients. Manifest-only; never touches the Release.
              if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
                MANIFEST_CHANNEL=formal
                PUBLISH_MANIFEST=true
                PRERELEASE=false
              fi
              ;;
            *)
              echo "::error title=Unsupported event::$EVENT is not a desktop release event."
              exit 1
              ;;
          esac

          # BUG-869: push / workflow_dispatch unchanged — MANIFEST_CHANNEL follows
          # CHANNEL and manifest publishes whenever the managed release does.
          if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
          if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

          BUILD_VERSION_NAME="$VERSION"
          case "$CHANNEL" in
            debug)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
                echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
                exit 1
              fi
              ;;
            beta)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
                echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
                exit 1
              fi
              ;;
            formal)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                echo "::error title=Invalid formal tag::Use v<version>."
                exit 1
              fi
              ;;
          esac
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
            BUILD_VERSION_NAME="${TAG#v}"
            BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
          fi

          # BUG-1481: per product family; the bridge (`app.hibiki.reader`) keeps
          # the historical `debug-rolling`. Must match release.yml.
          ROLLING_DEBUG_TAG=fushi-debug-rolling
          if [ "$CHANNEL" = debug ]; then
            PUBLISH_TAG="$ROLLING_DEBUG_TAG"
            ROLLING_DEBUG=true
          else
            PUBLISH_TAG="$TAG"
            ROLLING_DEBUG=false
          fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "publish_tag=$PUBLISH_TAG"
            echo "rolling_debug=$ROLLING_DEBUG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
            echo "publish_manifest=$PUBLISH_MANIFEST"
            echo "manifest_channel=$MANIFEST_CHANNEL"
            echo "build_version_name=$BUILD_VERSION_NAME"
            echo "release_sequence=$RELEASE_SEQUENCE"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Pull in every platform's built asset. Windows / macOS / iOS build in
      # PARALLEL and upload their installers/zips/ipas as `desktop-artifacts-*`
      # workflow artifacts; this single publish job (needs: all three, but
      # if: always()) gathers whichever ones succeeded and does ALL Release
      # publishing here. merge-multiple flattens them into one dir; a failed
      # platform simply contributes no file (uploads use if-no-files-found:
      # ignore), so a broken mac/iOS build never blocks the Windows publish.
      - name: Download platform release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-artifacts-*
          merge-multiple: true
          path: fushi/build/release-artifacts
      - name: Upload assets to GitHub Release event
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          files: |
            fushi/build/release-artifacts/fushi-*-windows-setup.exe
            fushi/build/release-artifacts/fushi-*-macos.zip
            fushi/build/release-artifacts/fushi-*-ios.ipa
      # TODO-1049 / TODO-1123 / TODO-1129: same rolling-release asset GC as
      # release.yml. softprops upserts same-named assets but never removes a
      # PRIOR commit's asset (different seq/sha in the name) from the reused
      # `debug-rolling` release, so without pruning it would accumulate one
      # EXE/DMG/IPA per commit. The OLD prune kept ONLY assets carrying THIS
      # desktop build's versionName, which cross-platform WIPED the Android APKs
      # (release.yml publishes to the SAME rolling tag with a different
      # versionName) -- TODO-1129. We now mirror release.yml exactly: keep the
      # most recent KEEP_SEQS (=3) debug sequences by seq number, so Android and
      # desktop publishing to the same tag each keep their top-3 and never delete
      # each other, and a client mid-download against a just-superseded seq is
      # not 404'd. Skipped unless rolling debug; missing release / nothing to
      # prune is a no-op.
      - name: Prune stale assets from rolling debug release
        if: steps.channel.outputs.publish_managed_release == 'true' && steps.channel.outputs.rolling_debug == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PUBLISH_TAG: ${{ steps.channel.outputs.publish_tag }}
          BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
        run: |
          set -euo pipefail
          # Keep the most recent KEEP_SEQS debug sequences (current + prior 2) so a
          # client mid-download against a just-superseded seq is not 404'd.
          KEEP_SEQS=3
          if ! gh release view "$PUBLISH_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Rolling release $PUBLISH_TAG does not exist yet; nothing to prune."
            exit 0
          fi
          ASSET_NAMES=()
          while IFS= read -r line; do ASSET_NAMES+=("$line"); done < <(
            gh release view "$PUBLISH_TAG" --repo "$REPO" --json assets \
              --jq '.assets[].name' || true
          )
          if [ "${#ASSET_NAMES[@]}" -eq 0 ]; then
            echo "No assets on $PUBLISH_TAG; nothing to prune."
            exit 0
          fi
          # TODO-1131: only ever prune THIS workflow's own (desktop + Apple)
          # assets. The rolling debug release is shared by Android and this
          # desktop/Apple workflow, each publishing from an independent workflow
          # run. Computing the kept-seq set across ALL platforms' assets means a
          # lagging platform has its last-good asset's seq pushed out of the top
          # KEEP_SEQS by the OTHER platforms' newer seqs -- so another platform's
          # prune deletes it and the rolling release "loses" that device. Scope
          # the candidate set to THIS workflow's filename shapes (Windows:
          # *-windows-setup.exe / macOS: *-macos.zip / iOS: *-ios.ipa) so it keeps
          # its own top KEEP_SEQS and never touches Android's assets.
          PLATFORM_ASSETS=()
          for name in "${ASSET_NAMES[@]}"; do
            case "$name" in
              *-windows-setup.exe|*-macos.zip|*-ios.ipa) PLATFORM_ASSETS+=("$name") ;;
            esac
          done
          # Check length BEFORE re-expanding the (possibly empty) array: on macOS
          # bash 3.2 `("${empty[@]}")` under `set -u` is an unbound-variable error,
          # and no-asset-for-this-platform is exactly the lagging / first-publish
          # case this fix must handle gracefully. `${#arr[@]}` is safe on 3.2.
          if [ "${#PLATFORM_ASSETS[@]}" -eq 0 ]; then
            echo "No desktop/Apple assets on $PUBLISH_TAG; nothing to prune."
            exit 0
          fi
          ASSET_NAMES=("${PLATFORM_ASSETS[@]}")
          # Asset names embed the versionName token `-<base>-debug.<seq>-` (e.g.
          # hibiki-0.11.1-debug.5633-3cf5905-windows-setup.exe). Parse the current
          # build's seq from BUILD_VERSION_NAME (0.11.1-debug.5633), extract every
          # asset's seq the same way, keep the top KEEP_SEQS distinct seqs (numeric
          # desc), and delete only assets whose seq is NOT in that set. Assets with
          # no parseable debug seq are treated as stale (superseded/legacy naming).
          seq_of() { printf '%s' "$1" | sed -n 's/.*-debug\.\([0-9]\+\).*/\1/p'; }
          CURRENT_SEQ="$(seq_of "$BUILD_VERSION_NAME")"
          {
            # Terminal-position `[ -n "$X" ] && echo` inside a pipefail
            # brace-group returns 1 when the last test is false (empty seq /
            # legacy tail asset), which pipefail propagates and set -e kills
            # silently. Use no-else `if` so a false test yields exit 0.
            if [ -n "$CURRENT_SEQ" ]; then echo "$CURRENT_SEQ"; fi
            for name in "${ASSET_NAMES[@]}"; do
              s="$(seq_of "$name")"
              if [ -n "$s" ]; then echo "$s"; fi
            done
          } | sort -rn -u > /tmp/all_seqs.txt
          KEEP_SEQ_LIST=()
          while IFS= read -r line; do KEEP_SEQ_LIST+=("$line"); done < <(head -n "$KEEP_SEQS" /tmp/all_seqs.txt)
          echo "Keeping debug seqs: ${KEEP_SEQ_LIST[*]:-<none>}"
          in_keep() {
            local target="$1"
            for k in "${KEEP_SEQ_LIST[@]}"; do
              [ "$k" = "$target" ] && return 0
            done
            return 1
          }
          STALE=()
          for name in "${ASSET_NAMES[@]}"; do
            [ -n "$name" ] || continue
            s="$(seq_of "$name")"
            if [ -z "$s" ] || ! in_keep "$s"; then
              STALE+=("$name")
            fi
          done
          if [ "${#STALE[@]}" -eq 0 ]; then
            echo "No stale assets on $PUBLISH_TAG (all within kept seqs)."
            exit 0
          fi
          for asset in "${STALE[@]}"; do
            [ -n "$asset" ] || continue
            echo "  deleting stale asset $asset from $PUBLISH_TAG"
            gh release delete-asset "$PUBLISH_TAG" "$asset" --repo "$REPO" --yes
          done
      - name: Publish desktop channel release
        if: steps.channel.outputs.publish_managed_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.channel.outputs.publish_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.channel.outputs.name }}
          body: ${{ steps.channel.outputs.body }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          files: |
            fushi/build/release-artifacts/fushi-*-windows-setup.exe
            fushi/build/release-artifacts/fushi-*-macos.zip
            fushi/build/release-artifacts/fushi-*-ios.ipa
      # TODO-705: publish a mirror update manifest so beta/debug in-China update
      # checks succeed (raw.githubusercontent.com is proxiable; api.github.com
      # /releases is mirror-403'd, BUG-292). This pushes a DATA FILE to the
      # update-manifest branch -- it is NOT a GitHub Release: it never sets
      # make_latest / prerelease:false, reuses the channel outputs verbatim, uses
      # the shared release_sequence (never run_number), and update-manifest is
      # absent from this workflow's push trigger (main/develop only) so it does
      # not cascade a run. Merges this platform's assets into any same-tag
      # manifest the Android workflow already pushed (concurrent, dedupe by name).
      - name: Publish mirror update manifest (desktop assets)
        # BUG-869: gate on publish_manifest + manifest_channel so the `release`
        # event emits latest-stable.json without re-touching the manual Release.
        if: steps.channel.outputs.publish_manifest == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.channel.outputs.manifest_channel }}
          TAG: ${{ steps.channel.outputs.tag }}
          # TODO-1049: manifest `tag` keeps the versioned/seq TAG for client
          # version comparison; asset URLs resolve under DOWNLOAD_TAG (the actual
          # release tag -- `debug-rolling` for debug, else identical to TAG).
          DOWNLOAD_TAG: ${{ steps.channel.outputs.publish_tag }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          NOTES: ${{ steps.channel.outputs.body }}
          VERSION: ${{ steps.channel.outputs.build_version_name }}
          RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
          ARTIFACTS_DIR: fushi/build/release-artifacts
          ASSET_GLOB: fushi-*-windows-setup.exe
          PLATFORM_LABEL: desktop
        run: bash tool/publish_update_manifest.sh
      - name: Publish mirror update manifest (Apple assets)
        # BUG-869: gate on publish_manifest + manifest_channel so the `release`
        # event emits latest-stable.json without re-touching the manual Release.
        if: steps.channel.outputs.publish_manifest == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.channel.outputs.manifest_channel }}
          TAG: ${{ steps.channel.outputs.tag }}
          DOWNLOAD_TAG: ${{ steps.channel.outputs.publish_tag }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          NOTES: ${{ steps.channel.outputs.body }}
          VERSION: ${{ steps.channel.outputs.build_version_name }}
          RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
          ARTIFACTS_DIR: fushi/build/release-artifacts
          ASSET_GLOB: fushi-*-macos.zip fushi-*-ios.ipa
          PLATFORM_LABEL: apple
        run: bash tool/publish_update_manifest.sh
