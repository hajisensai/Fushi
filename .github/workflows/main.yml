name: Build Android APK
# TODO-1208: this workflow no longer runs on push to main/develop. On push it
# never built an APK anyway (the R8/proguard/native "Verify release build" steps
# below are all `if: pull_request`), so its analyze + unit/package tests were a
# byte-for-byte duplicate of release.yml's early analyze+test stage that already
# runs on every push (release.yml then goes on to build+publish the debug-channel
# APK). Dropping the push trigger removes that ~41m duplicate job per push while
# keeping main.yml as the SOLE R8/proguard/native gate on PRs (release.yml has no
# pull_request trigger). workflow_dispatch stays for manual re-runs.
on:
  pull_request:
    branches: ['main', 'develop']
    # 路径清单 = 本 workflow 真正读到的东西，不多不少（2026-09-30 精简 CI）：
    # * 只列**自己**的 workflow 文件和自己 `uses:` / `bash` 到的共享件。以前挂整个
    #   `.github/workflows/**`，改任何一条别的 workflow 都会白跑这 ~90 分钟；workflow
    #   与发布脚本的守卫测试改由轻量的 ci-config-gate.yml 专门跑。
    # * 无头服务端 packages/fushi_server/** 不进 app：app 不依赖它，它的
    #   analyze / 包测试 / `dart build cli` 冒烟由 server-gate.yml 负责。负向模式必须
    #   排在 `packages/**` 之后才生效。
    # * **故意不排除 `*.md`**：本 workflow 是 PR 上唯一跑 fushi/test 全量的门，而
    #   fushi_rename_guard（扫 CLAUDE.md / docs/agent / native 下的 .md）、
    #   onnxruntime_*_guard（读 third_party/flutter_onnxruntime/PATCHES.md）、
    #   popup_mine_key_binding（读浏览器扩展 README）等守卫把 .md 当语料；排掉 .md
    #   等于让只改 .md 的 PR 绕过这些守卫。docs/ 与仓库根的 .md 本就不在清单里。
    paths:
      - 'fushi/**'
      - 'packages/**'
      # C ABI bridge 源码：只改 native/ 的 PR 以前触发不了任何构建，
      # 编译挂了要等下一个不相关改动才暴露。
      - 'native/**'
      - 'ci/**'
      # 根 pubspec.yaml 的 dependency_overrides 把一批插件 path 指向 third_party/
      # （ffmpeg_kit_next_flutter / flutter_inappwebview_android / media_kit_* /
      # flutter_onnxruntime …），改它们直接改变 Android 构建产物，以前却不触发本门。
      - 'third_party/**'
      - 'tool/vendored_binaries.json'
      - 'tool/vendored_binaries.py'
      - '.github/actions/fetch-vendored-binaries/**'
      # 统一 FFmpeg 配方（版本 / 补丁 / 能力清单）：播放器与制卡共用，守卫在 fushi/test。
      - 'tool/ffmpeg-unified/**'
      - 'tool/release_sequence.sh'
      - '.github/workflows/main.yml'
      - '.github/actions/provide-baked-secrets/**'
      - '.github/actions/pdfium-hook-cache/**'
      - '.github/actions/fushi-web-core-linux/**'
      - '.github/actions/test-native-linux/**'
      - '.github/actions/fushidicts-linux/**'
      - '.github/actions/setup-fushi-compute/**'
      - '.github/actions/setup-fushi-rwkv/**'
      - '.github/actions/setup-fushi-music/**'
      - '.github/actions/setup-fushi-corpus/**'
      # setup-fushi-compute / setup-fushi-rwkv 从这里读 Rust / cargo-ndk 钉版。
      - '.github/actions/native-store-names/names.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '!packages/fushi_server/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded PR run when the PR is force-pushed. (This workflow only
# runs on pull_request / workflow_dispatch now -- see the TODO-1208 note above --
# so there is no push-to-main/develop run to protect from cancellation.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 网页内容核心（native/fushi_web_core）Linux .so：packages/fushi_web_core 把原生库当硬依赖
  # （没有「缺库判不可用」的分支，测试找不到库就失败、不 skip），所以 fushi/ 与 packages/ 的
  # 单测 job 都要它。只编一次、以 workflow artifact 交给下游（artifact 不占 Actions 缓存配额）。
  web-core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/fushi-web-core-linux
    - uses: actions/upload-artifact@v7
      with:
        name: fushi-web-core-linux-x64
        path: native/fushi_web_core/prebuilt/linux-x64/libfushi_web_core.so
        if-no-files-found: error
        retention-days: 3

  # 单测矩阵的另几个 Rust 硬依赖（fushi_fsrs / fushi_compute / fushi_rwkv）同理只编一次、与
  # web-core-linux 并行，以 artifact 交给各分片（原来每片各编一遍，约 2 分钟压在每片的关键路径上）。
  test-native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-native-linux
    - uses: actions/upload-artifact@v7
      with:
        name: fushi-test-native-linux-x64
        path: |
          native/fushi_fsrs/prebuilt/linux-x64/libfushi_fsrs.so
          native/fushi_compute/prebuilt/linux-x64/libfushi_compute.so
          native/fushi_rwkv/prebuilt/linux-x64/libfushi_rwkv.so
          native/fushi_music/prebuilt/linux-x64/libfushi_music.so
          native/fushi_corpus/prebuilt/linux-x64/libfushi_corpus.so
        if-no-files-found: error
        retention-days: 3

  # 词典引擎（native/fushidicts）Linux .so：packages/fushi_dictionary 的真原生库测试
  # （background_tokenize_native_test.dart 的后台查词 / redirect 标记迁移两组）缺库直接失败、
  # 不 skip，所以 packages/*/test 的 runner 要它。与 web-core-linux 并行编一次、以 artifact 下发。
  fushidicts-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/fushidicts-linux
    - uses: actions/upload-artifact@v7
      with:
        name: fushidicts-linux-x64
        path: native/fushidicts/prebuilt/linux-x64/libfushidicts_ffi.so
        if-no-files-found: error
        retention-days: 3

  build:
    needs: [web-core-linux, fushidicts-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUSHI_WEB_CORE_LIB: ${{ github.workspace }}/native/fushi_web_core/prebuilt/linux-x64/libfushi_web_core.so
    steps:
    - uses: actions/checkout@v6
      with:
        # TODO-414: versionCode derives from the commit count, so the validation
        # builds below need the FULL history. A shallow checkout would make
        # `git rev-list --count HEAD` report a truncated (smaller) sequence,
        # producing a versionCode that disagrees with release.yml's. Keep this in
        # lockstep with release.yml's `fetch-depth: 0`.
        # 2026-08-12: 序号统一由 tool/release_sequence.sh 算（计数 + 一次性地板）。
        # 地板只补「历史重写导致计数倒退」，补不了「浅克隆导致计数截断」——
        # 后者每次 checkout 都可能不同，仍然只能靠 fetch-depth: 0 兜住。
        fetch-depth: 0
    # Prebuilt third-party binaries are not in git (tool/vendored_binaries.json).
    - name: Fetch vendored binaries
      uses: ./.github/actions/fetch-vendored-binaries
      with:
        groups: android

    - name: Resolve shared release sequence
      shell: bash
      run: |
        set -euo pipefail
        RELEASE_SEQUENCE=$(bash tool/release_sequence.sh)
        if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
          echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
          exit 1
        fi
        # Same monotonic commit-count build number release.yml feeds Android, so
        # main.yml's validation APKs carry the identical versionCode formula.
        echo "RELEASE_SEQUENCE=$RELEASE_SEQUENCE" >> "$GITHUB_ENV"

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.6'
        cache: true
    # pdfium_dart's build hook downloads PDFium from GitHub on every fresh
    # runner; restore it so a release-asset hiccup cannot fail the build.
    - uses: ./.github/actions/pdfium-hook-cache
      with:
        purpose: android

    - name: Remove local proxy from gradle.properties
      working-directory: fushi/android
      run: |
        sed -i '/systemProp\.http\.proxyHost/d' gradle.properties
        sed -i '/systemProp\.http\.proxyPort/d' gradle.properties
        sed -i '/systemProp\.https\.proxyHost/d' gradle.properties
        sed -i '/systemProp\.https\.proxyPort/d' gradle.properties
        sed -i '/systemProp\.http\.nonProxyHosts/d' gradle.properties

    # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
    # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
    # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
    - name: Provide baked-in secret stubs
      uses: ./.github/actions/provide-baked-secrets
      with:
        google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
        log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
        dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
        dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
        tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
        opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
        acoustid-api-key: ${{ secrets.ACOUSTID_API_KEY }}
    # TODO-2721: 只缓存 Gradle 的下载物（modules-2 / wrapper dists），不缓存
    # <ver>/transforms 这类可从 modules-2 重算的派生产物。三个 workflow
    # （main / release / build-multiplatform）的 path + key 必须逐字相同，且此步
    # 之前不得 sed 改 build.gradle / settings.gradle —— 否则同一份内容会被存成
    # 两条各 2.7 GB 的缓存。理由见 docs/agent/build.md 的「CI 缓存配额」，守卫见
    # fushi/test/build/workflow_cache_quota_guard_test.dart。
    # 只读（2026-09-30）：只有 release.yml 的 push 写 Gradle 缓存，见 workflow_cache_quota_guard_test。
    - name: Cache Gradle caches
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/journal-1
          ~/.gradle/wrapper/dists
        key: ${{ runner.os }}-gradle-v2-${{ hashFiles('fushi/android/**/*.gradle*', 'fushi/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-v2-

    - name: Remove aliyun mirrors from gradle files
      working-directory: fushi/android
      run: |
        sed -i "/maven.*aliyun/d" build.gradle
        sed -i "/maven.*aliyun/d" settings.gradle

    - name: Flutter pub get
      working-directory: fushi
      run: flutter pub get

    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh

    - name: Run dart analyze
      working-directory: fushi
      run: flutter analyze

    # 主应用单测不在这个 job 里跑了：见下面的 unit-tests 矩阵（按文件分 4 片并行）。

    - name: Fetch fushi_web_core linux-x64 library (hard dependency of the unit tests)
      uses: actions/download-artifact@v7
      with:
        name: fushi-web-core-linux-x64
        path: native/fushi_web_core/prebuilt/linux-x64
    - name: Fetch fushidicts linux-x64 library (hard dependency of the package tests)
      uses: actions/download-artifact@v7
      with:
        name: fushidicts-linux-x64
        path: native/fushidicts/prebuilt/linux-x64
    # Anki 搜索的逐卡求值与 AnkiConnect 查重规范形只有 Rust 实现（native/fushi_fsrs/src/search.rs）：
    # fushi_srs / fushi_engine 的搜索测试要真实 .so，库缺失时直接判红（不 skip）。
    # 用 runner 自带的 stable 工具链（不进持久库，不需要钉版）；冷编约 1 min。
    - name: Cache Rust build (fushi_fsrs)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/fushi_fsrs -> target
        key: fushi-fsrs-linux-x64
    # 包测试的库带 ID 审计（src/store/ids.rs `audit`）：schema v17 起 ID 列存 16 字节 BLOB，Dart 原生 SQL
    # 漏了 srs_id() 会查不到 / 写错形状，审计让这类语句直接报错；fushi_srs 的金丝雀测试凭
    # FUSHI_FSRS_ID_AUDIT=1 断言审计真的开着（库换成不带审计的构建就红）。
    - name: Build fushi_fsrs (Linux x64, id_audit) for package tests
      env:
        FUSHI_FSRS_FEATURES: id_audit
      run: bash native/fushi_fsrs/build_linux_so.sh
    # 计算内核 fushi_compute 是硬依赖：包测试（fushi_compute / fushi_engine）要 Linux .so
    # （导出 FUSHI_COMPUTE_LIB），下面的 Android release 验证构建（android-arm64）要 arm64-v8a .so，
    # 否则 build.gradle 的 checkFushiComputeNative 让构建失败。
    - name: Build fushi_compute (Linux .so + Android arm64-v8a)
      uses: ./.github/actions/setup-fushi-compute
      with:
        android-abis: arm64-v8a
    # RWKV-Instant 排程推理 fushi_rwkv 同为硬依赖（无 Dart 回退）：同样的输入，导出 FUSHI_RWKV_LIB。
    - name: Build fushi_rwkv (Linux .so + Android arm64-v8a)
      uses: ./.github/actions/setup-fushi-rwkv
      with:
        android-abis: arm64-v8a
    # 音乐胖核心 fushi_music（曲库扫描 / 标签 / CUE）同为 app 硬依赖：与上一步 fushi_rwkv 同一口径。
    - name: Build fushi_music (Linux .so + Android arm64-v8a)
      uses: ./.github/actions/setup-fushi-music
      with:
        android-abis: arm64-v8a
    # 语料胖核心 fushi_corpus（「我库里的例句」倒排索引）同为 app 硬依赖：与上一步 fushi_corpus 同一口径。
    - name: Build fushi_corpus (Linux .so + Android arm64-v8a)
      uses: ./.github/actions/setup-fushi-corpus
      with:
        android-abis: arm64-v8a
    # packages/fushi_rwkv 的端到端测试要真权重（缺了判红、不 skip）。只读 native-rwkv-gate 写的
    # 同一个缓存条目（key 是两个钉死的 SHA-256，与 fetch_model.sh 一致），不另占配额；未命中时
    # fetch_model.sh 按钉死 URL 下载并校验（~16 MB）。
    - name: Restore RWKV weights cache
      uses: actions/cache/restore@v4
      with:
        path: native/fushi_rwkv/model
        key: fushi-rwkv-model-749ad1ad18d5b6ef8c4185802fa0c1e4a14e67cd7874f3efeaae355fffb1b9ec-7b1790f49fdabf1279510247cc9bc3bf3ac461b67cf0135ab8e51589b5efe71a
    - name: Fetch RWKV weights (pinned URL, SHA-256 checked)
      run: bash native/fushi_rwkv/fetch_model.sh

    - name: Run package tests
      env:
        FUSHI_FSRS_LIB: ${{ github.workspace }}/native/fushi_fsrs/prebuilt/linux-x64/libfushi_fsrs.so
        FUSHI_FSRS_ID_AUDIT: '1'
        FUSHI_DICTS_LIB: ${{ github.workspace }}/native/fushidicts/prebuilt/linux-x64/libfushidicts_ffi.so
      run: |
        # 扫描面按磁盘枚举，不写死包清单：这里是 packages/*/test 的**唯一** runner，
        # 上一版把五个包名写成字面量，于是任何新加的自有包连同它的测试在 CI 里
        # 一次都不会跑，而且表现为绿。排除项只有两类，都有明确归属：
        #   * vendored / fork / stub —— 上游产物，不归本仓测；
        #   * fushi_torrent —— 测试要 dlopen 真 DLL，Linux 上整组 skip，由
        #     build-multiplatform.yml 里那个带 FUSHI_TORRENT_LIB 的 job 专门跑。
        skip="flutter_inappwebview_windows gamepads_windows gamepads_android_stub fushi_torrent"
        ran=0
        for pkg in packages/*/; do
          name=$(basename "$pkg")
          case " $skip " in
            *" $name "*) echo "::notice title=Skipped package::$name（vendored 或有专用 job）"; continue;;
          esac
          if [ -d "$pkg/test" ]; then
            echo "::group::Testing $name"
            (cd "$pkg" && dart ../../fushi/tool/flutter_test_failures.dart --output-dir=../../.codex-test/flutter-test/$name)
            echo "::endgroup::"
            ran=$((ran + 1))
          else
            echo "::warning title=No package tests::$name has no test/ dir — its code is only covered transitively by the main-app suite"
          fi
        done
        # 规模哨兵：枚举写错或 packages/ 布局变动会让循环一个包都不跑，而「零个包跑过」
        # 与「所有包都绿」在退出码上完全一样。实测 4 个（core/anki/audio/platform）。
        if [ "$ran" -lt 3 ]; then
          echo "::error title=Package test enumeration collapsed::只跑了 $ran 个包的测试，实测应有 4 个。去修枚举逻辑，不要调低这个下界。"
          exit 1
        fi

    # JS behavior tests (jsdom) for the reader/audiobook WebView bridge. The Dart
    # source-scan guards can't execute compareDocumentPosition semantics; this runs
    # the real bridge functions against a real DOM (BUG-724). Ubuntu runners ship
    # Node; jsdom is pinned exactly in test/js/package.json so `npm install` is
    # reproducible (package-lock is gitignored).
    - name: Run JS behavior tests (jsdom)
      working-directory: test/js
      run: |
        npm install
        npm test

    # 浏览器扩展的 JS 行为测试（node:test + vm，零依赖，真加载 content.js / popup.js
    # 跑断言）。这些测试一直存在但**从来没有人执行过**：上面那步的 working-directory 是
    # test/js，`node --test` 只会跑那个目录下的 .test.mjs，tools/browser-extension/*.test.js
    # 全部落在门外。于是「隐藏字幕不得用 display:none」「IME 组字中不得制卡」这类真行为
    # 守卫写了也白写，改坏了 CI 照样绿。接进来时本地实测 171 个用例全绿，故不会把既有
    # PR 的 CI 变红。
    - name: Run browser-extension JS behavior tests
      working-directory: tools/browser-extension
      run: node --test *.test.js

    # The release build (minify/R8/proguard + C++23 native) is the variant that
    # ships; without a keystore it was never exercised on PRs, so R8/keep-rule
    # regressions stayed invisible until a tagged release (HBK-AUDIT-026).
    # build.gradle refuses debug-signed release APKs, so we mint a throwaway
    # keystore to run the full release pipeline (artifact is NOT distributable).
    #
    # TODO-950: this verification APK only runs on PULL REQUESTS. On push to
    # main/develop, release.yml already does the real release-signed arm64 build
    # (debug channel) and publishes it -- so a second release build here was a
    # redundant duplicate APK ("why two APKs on push"). PRs do NOT trigger
    # release.yml (no pull_request trigger there), so the PR-only verification
    # below stays the sole R8/proguard/native gate for PRs (HBK-AUDIT-026). It is
    # also arm64-only now (matches the shipped debug-channel slice; no need to
    # raster the unshipped armv7/x86_64 slices just to exercise R8 keep-rules).
    # R8 / proguard / the Android native build only see Java/Kotlin (app +
    # plugins), Gradle config, native sources and the plugin set pinned by
    # pubspec. A Dart-only PR cannot change what they do: upstream 09-20..30
    # ran this verify 48 times with 0 failures while it cost ~14 min per PR run
    # (build job ~20 -> ~6 min without it). develop pushes still build the
    # release-signed APK through R8 in release.yml, so nothing ships unverified.
    # If the diff cannot be computed, the verify runs (fail safe).
    - name: Decide whether the Android release verify build is needed
      id: r8
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if ! changed="$(git diff --name-only "$BASE_SHA"...HEAD)"; then
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "::warning title=R8 verify gate::could not diff against $BASE_SHA; running the verify build"
          exit 0
        fi
        pattern='^(fushi/android/|native/|third_party/|ci/|packages/[^/]+/android/|packages/[^/]+/pubspec\.yaml$|fushi/pubspec\.yaml$|pubspec\.yaml$|pubspec\.lock$|\.github/workflows/main\.yml$|\.github/actions/)'
        if grep -qE "$pattern" <<< "$changed"; then
          echo "needed=true" >> "$GITHUB_OUTPUT"
        else
          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=R8 verify skipped::no Android / native / plugin / pubspec change in this PR"
        fi

    # 网页内容核心是硬依赖：fushi/android/app/build.gradle 的 requireWebCoreSo 在 release 构建里
    # 逐 ABI 核对 prebuilt/android/<abi>/libfushi_web_core.so，缺就拒绝出包。本验证构建只出
    # arm64，先编这一个 ABI（工具链与 native-web-core-gate.yml / release.yml 一致）。
    - name: Set up Rust (fushi_web_core, Android arm64)
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.95.0'
        targets: aarch64-linux-android
    - name: Cache Rust build (fushi_web_core, Android)
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/fushi_web_core -> target
        key: fushi-web-core-android
    - name: Install cargo-ndk (fushi_web_core)
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk@4.1.2
    - name: Build fushi_web_core Android .so (arm64-v8a)
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash native/fushi_web_core/build_android_so.sh "$ANDROID_NDK_LATEST_HOME" arm64-v8a

    - name: Generate throwaway keystore (no signing secret present)
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true' && env.HAS_KEYSTORE != 'true'
      working-directory: fushi/android
      run: |
        keytool -genkeypair -v -keystore fushi-release.jks \
          -storepass ci_throwaway -keypass ci_throwaway -alias ci \
          -keyalg RSA -keysize 2048 -validity 1 \
          -dname "CN=Fushi CI, O=CI, C=US"
        cat > key.properties <<EOF
        storePassword=ci_throwaway
        keyPassword=ci_throwaway
        keyAlias=ci
        storeFile=fushi-release.jks
        EOF
      env:
        HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    - name: Verify release build (minify/R8/proguard/native)
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true' && env.HAS_KEYSTORE != 'true'
      working-directory: fushi
      run: >-
        flutter build apk --release --target-platform android-arm64
        --build-number "$RELEASE_SEQUENCE"
      env:
        HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    - name: Decode keystore
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true' && env.HAS_KEYSTORE == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fushi/android/fushi-release.jks
      env:
        HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    - name: Create key.properties
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true' && env.HAS_KEYSTORE == 'true'
      working-directory: fushi/android
      run: |
        cat > key.properties <<EOF
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=fushi-release.jks
        EOF
      env:
        HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    # TODO-950: arm64-only + PR-only (see the keystore-gen comment above). This
    # is the keystore-present twin of "Verify release build"; on push it would
    # otherwise duplicate release.yml's published arm64 APK.
    - name: Verify release build (signed, minify/R8/proguard/native)
      if: github.event_name == 'pull_request' && steps.r8.outputs.needed == 'true' && env.HAS_KEYSTORE == 'true'
      working-directory: fushi
      run: >-
        flutter build apk --release --target-platform android-arm64
        --build-number "$RELEASE_SEQUENCE"
      env:
        HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    - name: Check dependency health
      working-directory: fushi
      run: |
        flutter pub outdated || true

  # 主应用单测按**文件**分 4 片并行（2026-09-30）。原来它是 build job 里的一步，
  # 带 coverage 单机串行跑完 3.5k 个 suite，实测 130~175 分钟，平均一直占 6 个
  # runner，而 coverage 产物从没被任何步骤上传或读取；release.yml 同一套不带
  # coverage 的测试是 73 分钟。不用 flutter test 自带的 --total-shards：它交给
  # package:test 在**每个 suite 内部**切用例，每片仍要编译加载全部 suite，编译加载
  # 正是大头。--file-shard 由 tool/flutter_test_failures.dart 按文件大小 LPT 分配，
  # 各片只把自己的 suite 路径交给 flutter test，并集恰好是整个 test/（契约测试
  # fushi/test/tools/test_file_shards_test.dart）。分片数改这里的 matrix 和下面
  # 的 --file-shard 分母，两处一起改。
  # 2026-10-21：试过分片内加 --experimental-faster-testing（全片 suite 合成一个 dill 只编译
  # 一次、同一个 flutter_tester 进程里各起一个 isolate），已撤回：PR #2422 五轮 CI 里两次
  # flutter_tester 随机 SIGSEGV（exit 245，一次在批次全部 suite 跑完、进程收尾时），根因未明，
  # 单测门不能带随机原生崩溃上线。现在回到普通模式（每个 suite 独立进程、默认并发），
  # 保留的提速是：Rust 测试库由 test-native-linux 只编一次、按实测 suite 耗时
  # （tool/test_flow/suite_timings.json）均衡分片。重新启用前先拿到崩溃的原生栈定根因；
  # 届时 --concurrency=1 与 --max-suites-per-run 的理由见 git 历史（PR #2422）。
  unit-tests:
    needs: [web-core-linux, test-native-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUSHI_WEB_CORE_LIB: ${{ github.workspace }}/native/fushi_web_core/prebuilt/linux-x64/libfushi_web_core.so
      FUSHI_FSRS_LIB: ${{ github.workspace }}/native/fushi_fsrs/prebuilt/linux-x64/libfushi_fsrs.so
      FUSHI_COMPUTE_LIB: ${{ github.workspace }}/native/fushi_compute/prebuilt/linux-x64/libfushi_compute.so
      FUSHI_RWKV_LIB: ${{ github.workspace }}/native/fushi_rwkv/prebuilt/linux-x64/libfushi_rwkv.so
      FUSHI_MUSIC_LIB: ${{ github.workspace }}/native/fushi_music/prebuilt/linux-x64/libfushi_music.so
      FUSHI_CORPUS_LIB: ${{ github.workspace }}/native/fushi_corpus/prebuilt/linux-x64/libfushi_corpus.so
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: unit-tests (${{ matrix.shard }}/4)
    steps:
    - uses: actions/checkout@v6
    # Prebuilt third-party binaries are not in git (tool/vendored_binaries.json).
    - name: Fetch vendored binaries
      uses: ./.github/actions/fetch-vendored-binaries
      with:
        groups: all

    # 钉 commit（v2 = v2.23.0）：第三方 action 按 tag 引用时，tag 可被改指任意提交。
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.6'
        cache: true
    # pdfium_dart's build hook downloads PDFium from GitHub on every fresh
    # runner; restore it so a release-asset hiccup cannot fail the build.
    - uses: ./.github/actions/pdfium-hook-cache
      with:
        purpose: test

    - name: Provide baked-in secret stubs
      uses: ./.github/actions/provide-baked-secrets
      with:
        google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
        log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
        dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
        dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
        tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
        opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
        acoustid-api-key: ${{ secrets.ACOUSTID_API_KEY }}

    - name: Flutter pub get
      working-directory: fushi
      run: flutter pub get --enforce-lockfile

    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh

    # Golden image tests are gated to the reference platform (the dev host where
    # goldens were generated); Linux CI font/raster rendering differs and would
    # always mismatch, so exclude them here. They still run on a plain local
    # `flutter test`. See fushi/dart_test.yaml.
    - name: Fetch fushi_web_core linux-x64 library (hard dependency of the unit tests)
      uses: actions/download-artifact@v7
      with:
        name: fushi-web-core-linux-x64
        path: native/fushi_web_core/prebuilt/linux-x64

    # SRS 浏览页测试走 Rust 搜索内核（fushi_fsrs），计算内核 fushi_compute 与 RWKV-Instant 排程推理
    # fushi_rwkv 是硬依赖（无 Dart 回退）：都由 test-native-linux 编好，这里只下载（路径与 job 级
    # FUSHI_FSRS_LIB / FUSHI_COMPUTE_LIB / FUSHI_RWKV_LIB 对应）。
    - name: Fetch fushi_fsrs + fushi_compute + fushi_rwkv linux-x64 libraries (hard dependencies of the unit tests)
      uses: actions/download-artifact@v7
      with:
        name: fushi-test-native-linux-x64
        path: native
    # flutter_tester 原生崩溃（SIGSEGV 等）时留 core dump，失败时由下面的 backtrace 步骤打
    # 全线程原生栈，看是哪个原生库。
    - name: Enable core dumps
      run: sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
    # --experimental-faster-testing：本片所有 suite 编成一个 dill、在同一个 flutter_tester
    # 里各起一个轻量 engine，省掉逐文件串行编译（每文件 1.4–2.3 s），单片 32–46 min → 14–17 min。
    # * PR #2422 时它随机 SIGSEGV（exit 245），根因是 Dart VM 的 JIT 去优化把分配下沉的
    #   Pointer.asTypedList 视图物化成错地址；本仓一律经 package:fushi_ffi_view 建视图绕开
    #   （守卫 fushi/test/build/ffi_typed_list_view_guard_test.dart）。
    # * --concurrency=1：轻量 engine 共用 flutter_tester 唯一的 UI 线程，并发只会让同步重活的
    #   suite 饿死邻居、撞 30 s 超时（默认并发 2 时 8 片里 5 片因此红），换不来并行。
    # * --max-suites-per-run=400：一片拆成 3 个 flutter test 进程，泄漏的定时器 / 句柄不至于
    #   在一个进程里累积到拖垮后半程。
    - name: Run unit tests (main app, file shard ${{ matrix.shard }}/4)
      working-directory: fushi
      run: |
        ulimit -c unlimited
        dart run tool/flutter_test_failures.dart --file-shard=${{ matrix.shard }}/4 --exclude-tags golden --experimental-faster-testing --concurrency=1 --max-suites-per-run=400
    - name: Native backtrace of a crashed flutter_tester
      if: failure()
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        cores=(/tmp/core.*)
        if [ "${#cores[@]}" -eq 0 ]; then
          echo "No core dump (the failure was not a native crash)."
          exit 0
        fi
        sudo apt-get install -y -qq gdb > /dev/null
        tester="$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64/flutter_tester"
        for core in "${cores[@]}"; do
          echo "::group::$core"
          gdb -batch -q -ex 'info sharedlibrary' -ex 'thread apply all bt 40' "$tester" "$core" 2>&1 || true
          echo "::endgroup::"
        done

    # 逐 suite 耗时的唯一来源：tool/update_suite_timings.dart 读这些事件日志刷新
    # tool/test_flow/suite_timings.json（--file-shard 按它均衡各片）。失败时也传，排障用。
    - name: Upload test event log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-events-${{ matrix.shard }}
        path: .codex-test/flutter-test/flutter_test.jsonl
        if-no-files-found: warn
        retention-days: 14

    # The compact summary omits RenderFlex creation sites. Print complete
    # diagnostics for failed tests into the job log (GitHub masks secrets here),
    # keeping the original test step's failure and avoiding another test run.
    - name: Show complete failed-test diagnostics
      if: failure()
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path

        path = Path('.codex-test/flutter-test/flutter_test.jsonl')
        if not path.is_file():
            print('No test event log was produced.')
            raise SystemExit(0)
        # A batched shard (--max-suites-per-run) appends several runs to one
        # log; test IDs restart at each run's `start` event.
        runs = [[]]
        for line in path.read_text(encoding='utf-8').splitlines():
            try:
                event = json.loads(line)
            except json.JSONDecodeError:
                continue
            if isinstance(event, dict):
                if event.get('type') == 'start' and runs[-1]:
                    runs.append([])
                runs[-1].append(event)
        for events in runs:
            failed = {
                event.get('testID') for event in events
                if event.get('type') == 'error' or (
                    event.get('type') == 'testDone'
                    and event.get('result') in ('failure', 'error')
                )
            }
            for event in events:
                if event.get('type') == 'testStart' and event['test']['id'] in failed:
                    print('\nFAILED TEST:', event['test']['name'])
                elif event.get('testID') in failed:
                    if event.get('type') == 'print':
                        print(event.get('message', ''))
                    elif event.get('type') == 'error':
                        print(event.get('error', ''))
                        print(event.get('stackTrace', ''))
        PY
