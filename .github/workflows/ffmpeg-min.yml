# 构建 Hibiki 桌面用的「精简 ffmpeg」（~12MB 量级，GPL/含 libx264，仅含 Hibiki 调用的组件）。
# 产物 ffmpeg(.exe) 放到 app 程序旁即被 resolveFfmpegExecutable() 优先选用
# （见 hibiki/lib/src/media/video/ffmpeg_backend.dart）。
#
# 手动触发：重新编出三平台「精简 ffmpeg」并产出 artifact。Windows 产物现已入库到
# third_party/ffmpeg-min/windows/ffmpeg.exe，release-desktop.yml 直接 Copy（不再跨
# workflow 下载 artifact，见 TODO-416）。需要刷新入库二进制时：手动跑此 workflow，
# 下载对应平台 artifact，替换 third_party 下的 vendored 文件再提交。
#
# ⚠️ 本 workflow 的 smoke-test 只验**当场刚编出来的**二进制，管不到入库的那个。
# 「改了 build-ffmpeg-min.sh 却忘记重新 vendor」曾让桌面片段导出静默丢字幕整整一个
# 版本（BUG-1058）。该缺口现由 hibiki/test/tools/ffmpeg_min_vendored_recipe_guard_test.dart
# 在每次单测里静态比对配方与入库 exe 内嵌的 configure 串堵住——改配方后不重新 vendor
# 会直接把单测打红。别去改守卫来绕过它，跑这个 workflow 换二进制才是修法。
# configure 白名单调优清单见 docs/specs/2026-06-07-ffmpeg-min-build-pipeline.md。
# TODO-1214/1257：加 libx264(H.264,GPL) + --enable-network(schannel/securetransport/
# gnutls TLS) → 需各平台 x264 dev 包 + Linux gnutls dev（下方 install 步已加）。
name: ffmpeg-min

on:
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: "FFmpeg git tag/branch"
        default: "n7.1.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ffmpeg-min-linux-x64
          - os: macos-latest
            artifact: ffmpeg-min-macos
          - os: windows-2022
            artifact: ffmpeg-min-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        # Debian/Ubuntu 把 SVT-AV1 拆成 common / enc / dec 三个 dev 包，`--enable-libsvtav1`
        # 找的 `SvtAv1Enc.pc` 只在 libsvtav1enc-dev 里；只装 libsvtav1-dev 会在 configure
        # 阶段报 "SvtAv1Enc >= 0.9.0 not found using pkg-config"。
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nasm yasm pkg-config zlib1g-dev libx264-dev libgnutls28-dev libsvtav1-dev libsvtav1enc-dev libwebp-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg nasm pkg-config x264 svt-av1 webp

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
            mingw-w64-x86_64-x264 mingw-w64-x86_64-svt-av1 mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-ffmpeg

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: FFMPEG_REF="${{ github.event.inputs.ffmpeg_ref }}" OUT="$PWD/out" bash tool/ffmpeg-min/build-ffmpeg-min.sh

      - name: Build (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: FFMPEG_REF="${{ github.event.inputs.ffmpeg_ref }}" OUT="$PWD/out" bash tool/ffmpeg-min/build-ffmpeg-min.sh

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: FFMPEG_MIN="$PWD/out/bin/ffmpeg" bash tool/ffmpeg-min/smoke-test.sh

      - name: Smoke test (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: FFMPEG_MIN="$PWD/out/bin/ffmpeg.exe" bash tool/ffmpeg-min/smoke-test.sh

      - name: Report size (Linux/macOS)
        if: runner.os != 'Windows'
        run: ls -lh out/bin/ffmpeg out/bin/ffprobe

      - name: Report size (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Item out/bin/ffmpeg.exe, out/bin/ffprobe.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/bin/ffmpeg
            out/bin/ffmpeg.exe
            out/bin/ffprobe
            out/bin/ffprobe.exe
          if-no-files-found: error
