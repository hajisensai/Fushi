# Throwaway: reproduce the insertPrefIfAbsent SQLITE_BUSY on a Linux runner.
# Lives only on repro/* branches; never merged.
name: zz repro sqlite busy
on:
  push:
    branches: ['repro/**']
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.6'
        cache: true
    - uses: ./.github/actions/pdfium-hook-cache
      with:
        purpose: test
    - name: Flutter pub get
      working-directory: fushi
      run: flutter pub get --enforce-lockfile
    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh
    - name: A/B under CPU stress, x3000 each
      continue-on-error: true
      working-directory: fushi
      run: |
        for c in $(seq 1 $(( $(nproc) * 2 ))); do (while :; do :; done) & done
        flutter test --no-pub test/zz_repro/sqlite_busy_repro_test.dart --plain-name "AB-" --dart-define=REPS=3000 --reporter expanded > /tmp/ab.txt 2>&1 || true
        kill $(jobs -p) 2>/dev/null || true
        grep -E "REPRO" /tmp/ab.txt | cut -c1-1500
        grep -E "tests passed|tests failed" /tmp/ab.txt | tail -1
