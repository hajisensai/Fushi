# Throwaway: reproduce the insertPrefIfAbsent SQLITE_BUSY on a Linux runner.
# Lives only on repro/* branches; never merged.
name: zz repro sqlite busy
on:
  push:
    branches: ['repro/**']
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.6'
        cache: true
    - uses: ./.github/actions/pdfium-hook-cache
      with:
        purpose: test
    - name: Flutter pub get
      working-directory: fushi
      run: flutter pub get --enforce-lockfile
    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh
    - name: Repro (plain flutter test)
      continue-on-error: true
      working-directory: fushi
      run: flutter test --no-pub test/zz_repro/sqlite_busy_repro_test.dart --dart-define=REPS=400 --reporter expanded > /tmp/plain.txt 2>&1; grep -E "REPRO|tests passed|tests failed" /tmp/plain.txt
    - name: Repro (faster-testing, repro + anki suite)
      continue-on-error: true
      working-directory: fushi
      run: |
        flutter test --no-pub --experimental-faster-testing --concurrency=1 test/zz_repro/sqlite_busy_repro_test.dart test/anki/anki_settings_drift_store_test.dart --dart-define=REPS=400 --reporter expanded > /tmp/fast.txt 2>&1 || true
        grep -E "REPRO|tests passed|tests failed|\[E\]" /tmp/fast.txt
        grep -n -B2 -A40 "\[E\]" /tmp/fast.txt | head -200
    - name: Loop anki suite alone (faster-testing x15, plain x15)
      continue-on-error: true
      working-directory: fushi
      run: |
        for i in $(seq 1 15); do
          flutter test --no-pub --experimental-faster-testing --concurrency=1 test/anki/anki_settings_drift_store_test.dart --reporter expanded > /tmp/a$i.txt 2>&1 && echo "fast#$i pass" || { echo "fast#$i FAIL"; grep -n -A30 "\[E\]" /tmp/a$i.txt | head -60; }
        done
        for i in $(seq 1 15); do
          flutter test --no-pub test/anki/anki_settings_drift_store_test.dart --reporter expanded > /tmp/b$i.txt 2>&1 && echo "plain#$i pass" || { echo "plain#$i FAIL"; grep -n -A30 "\[E\]" /tmp/b$i.txt | head -60; }
        done
