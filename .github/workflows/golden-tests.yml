# Golden 图像测试（BUG-3494，2026-10-17 所有者拍板）。
#
# 为什么单独一条 workflow：main.yml / release.yml 的单测跑在 ubuntu 上并带
# `--exclude-tags golden`（fushi/dart_test.yaml 把 golden 门控到参考平台 Windows），
# 所以此前**没有任何 CI job 跑 golden**；Windows 开发机本地又不跑全量测试。10-04～10-16
# 的 M3E 改版批次因此把 18 张基准悄悄弄过期，直到有人手动跑才发现（BUG-3494）。
#
# 这里在参考平台 Windows 上只跑 `--tags golden`：每个 PR 与 develop push 都跑，不挑路径
# （golden 覆盖的是共享组件 / 设置页 / 同步对话框，改动面散在 lib/ 各处，路径过滤必漏）。
# 红了只显示、不拦合并：本仓刻意不设分支保护 / required check（见 CLAUDE.md「合并 PR
# 要看作者」），这条也不例外。失败时 test/goldens/failures/ 的对比图作为 artifact 上传。
#
# 有意改界面导致变红时：本机（Windows）对**确认是有意变化的那几张** 跑
# `flutter test --update-goldens <文件> --plain-name <用例>`，与改界面的代码同一个 PR 提交。
name: Golden tests

on:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['develop']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  goldens:
    runs-on: windows-latest
    # 本机实测编译 + 跑 43 张约 2 分钟；冷 runner 的 pub get + 首次编译留足余量。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # 与发布 workflow 的 Windows job 同法：只缓存 pub、不缓存 SDK
      # （理由与实测见 build-multiplatform.yml windows job 同处注释）。
      # 不装 flutter-engine-overlay：它只替换 flutter_windows.dll（桌面 app 的
      # 合成器 HDR），flutter test 用的 flutter_tester 不受影响。
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          cache: false
          pub-cache: true
      # pdfium_dart's build hook downloads PDFium from GitHub on every fresh
      # runner; restore it so a release-asset hiccup cannot fail the build.
      - uses: ./.github/actions/pdfium-hook-cache
        with:
          purpose: test
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get --enforce-lockfile
      - name: Apply pub cache patches
        shell: bash
        run: bash ci/apply-patches.sh
      - name: Run golden tests
        working-directory: fushi
        run: flutter test --no-pub --tags golden
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: fushi/test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 14
