name: Build and Test Android / macOS / Linux / Windows

# Verifies the app compiles on the four non-Android shipped platforms:
#  - iOS/macOS gamepads = GameController; Linux = evdev/GTK
#  - Windows = the forked flutter_inappwebview_windows C++ EPUB renderer, which
#    is otherwise only built on the dev host and was never gated by CI.
# Also runs the shared comprehensive automation contract on Android, Windows,
# and macOS. That runner requires real test verdict text in logs, not just a
# zero exit code.
# Runs on routine main/develop pushes and PRs again: iOS/macOS regressions are
# user-facing now, and release-desktop.yml can publish Windows/macOS/iOS assets.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'develop']
    paths: &multiplatform_paths
      - 'hibiki/**'
      - 'packages/**'
      # C ABI bridge 源码：只改 native/ 的 PR 以前触发不了任何构建，
      # 编译挂了要等下一个不相关改动才暴露。
      - 'native/**'
      - 'ci/**'
      - 'third_party/**'
      - '.github/workflows/build-multiplatform.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: ['main', 'develop']
    paths: *multiplatform_paths

# Cancel a superseded PR run (4 build jobs incl. 2 expensive macOS runners) when
# the PR is force-pushed; keep pushes and manual-dispatch runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    # The reactivecircus/android-emulator-runner emulator on the GitHub-hosted
    # ubuntu runner boots under a software GPU (swiftshader, -accel off) and
    # intermittently never reaches sys.boot_completed within emulator-boot-timeout
    # (600s), failing the step with "Unable to connect to adb daemon on port:
    # 5037" / adb exit code 224 (e.g. CI runs +111/+112). That is a runner/emulator
    # infrastructure flake, not a Hibiki break: the same commit's linux (Linux
    # ctest + desktop build), windows, and macos jobs stayed green, and later runs
    # of identical code (+113..+123) all passed. The action has no built-in boot
    # retry, so make the job non-blocking: the appSmoke contract still runs and a
    # failure is still visible as a red X on this job (signal preserved), but an
    # emulator boot flake no longer fails the whole workflow and so no longer
    # blocks the Linux native ctest gate or the deliverable platform builds
    # (TODO-624). External-platform limitation: re-evaluate dropping this once the
    # hosted runner / action ships a reliable boot, or move the smoke contract to a
    # self-hosted emulator.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      # google_oauth_secret.dart is gitignored (the real client secret lives only
      # on dev hosts); CI lacks it, so google_drive_auth.dart's import fails to
      # compile. When the GOOGLE_OAUTH_CLIENT_SECRET repo secret is set, bake the
      # REAL value in so the build can actually sign in to Google Drive
      # (otherwise desktop sign-in hits invalid_client 401, TODO-045). When it is
      # not set, fall back to the committed example (placeholder value with no
      # GOCSPX- prefix, so the no_hardcoded_google_secret guard stays green).
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=hibiki/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      # log_upload_secret.dart ships a committed empty placeholder (endpoint = '')
      # so a fresh clone compiles and the log-upload button stays hidden (it is
      # gated by a non-empty endpoint, not by platform - see log_upload_config
      # showUploadLogAction). When the LOG_UPLOAD_ENDPOINT / LOG_UPLOAD_TOKEN repo
      # secrets are set, bake the real values in so CI/release builds (incl.
      # Windows) actually show and can use the "upload log to cloud" button
      # (TODO-385). When unset, leave the committed empty placeholder so the
      # button stays hidden and no endpoint is exposed.
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=hibiki/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=hibiki/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: cache resolved pub packages (miss auto-rebuilds; apply-patches
      # is idempotent so a warm cache is safe).
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('hibiki/android/**/*.gradle*', 'hibiki/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Flutter pub get
        working-directory: hibiki
        run: flutter pub get
      - name: Remove aliyun mirrors from gradle files
        working-directory: hibiki/android
        run: |
          sed -i "/maven.*aliyun/d" build.gradle
          sed -i "/maven.*aliyun/d" settings.gradle
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      - name: Run Android comprehensive automation contract
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash ci/comprehensive-test.sh --platform=android --only=appSmoke
      # The comprehensive runner now streams flutter-drive output to the console,
      # but also upload the full report (per-command stdout/stderr logs + report
      # .json + screenshots) so a failure is debuggable without re-running.
      - name: Upload comprehensive test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-comprehensive-report
          path: .codex-test/comprehensive/
          if-no-files-found: ignore

  # Linux gates the GTK/evdev desktop build path.
  linux:
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang cmake pkg-config \
            gcc-14 g++-14 libstdc++-14-dev \
            libgtk-3-dev libkeybinder-3.0-dev libmpv-dev liblzma-dev
      - name: Verify Linux C++23 compiler
        shell: bash
        run: |
          set -euo pipefail
          "$CC" --version
          "$CXX" --version
          cat > /tmp/hoshidicts_expected.cpp <<'CPP'
          #include <expected>
          #ifndef __cpp_lib_expected
          #error __cpp_lib_expected missing
          #endif
          int main() {
            std::expected<int, int> ok = 23;
            std::expected<int, int> fail = std::unexpected(1);
            return ok.value() == 23 && fail.error() == 1 ? 0 : 1;
          }
          CPP
          "$CXX" -std=c++23 /tmp/hoshidicts_expected.cpp -o /tmp/hoshidicts_expected
      # Native engine e2e/guard suite (TODO-578): build the real hoshidicts
      # static lib via the unified CMake/ctest harness and run every native test
      # (UAF dict-name, kanji round-trip, media import/query, freq+pitch, plus
      # the pure-memory zip64/word-scan/text-processor guards). Self-contained
      # in-memory zip fixtures, no emulator/external assets. Runs before the
      # Flutter build so a native break fails fast and stays independent of Dart.
      - name: Run hoshidicts native tests (ctest)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/hoshidicts/tests -B "$RUNNER_TEMP/hoshi-tests" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/hoshi-tests" --config Release
          # --no-tests=error：ctest 在「一个测试都没注册」时默认返回 0，于是一次
          # CMake 回归让 tests/CMakeLists.txt 的 add_test 列表变空就会读成通过。
          # 与 BUG-1157 同族的「零测试执行伪装成绿」。对齐 native-hoshidicts-gate.yml。
          ctest --test-dir "$RUNNER_TEMP/hoshi-tests" --output-on-failure -C Release --no-tests=error
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      # See the android job: bake the real OAuth secret in when the
      # GOOGLE_OAUTH_CLIENT_SECRET repo secret is set, else stub from the example
      # so the import in google_drive_auth.dart compiles (TODO-045).
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=hibiki/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      # log_upload_secret.dart ships a committed empty placeholder (endpoint = '')
      # so a fresh clone compiles and the log-upload button stays hidden (it is
      # gated by a non-empty endpoint, not by platform - see log_upload_config
      # showUploadLogAction). When the LOG_UPLOAD_ENDPOINT / LOG_UPLOAD_TOKEN repo
      # secrets are set, bake the real values in so CI/release builds (incl.
      # Windows) actually show and can use the "upload log to cloud" button
      # (TODO-385). When unset, leave the committed empty placeholder so the
      # button stays hidden and no endpoint is exposed.
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=hibiki/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=hibiki/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: cache resolved pub packages (miss auto-rebuilds; apply-patches
      # is idempotent so a warm cache is safe).
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      - name: Flutter pub get
        working-directory: hibiki
        run: flutter pub get
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      - name: Flutter Linux CMake toolchain shim
        working-directory: hibiki
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/linux
          mkdir -p "$RUNNER_TEMP/hibiki-linux-toolchain"
          cat > "$RUNNER_TEMP/hibiki-linux-toolchain/clang" <<'SH'
          #!/usr/bin/env bash
          exec gcc-14 "$@"
          SH
          cat > "$RUNNER_TEMP/hibiki-linux-toolchain/clang++" <<'SH'
          #!/usr/bin/env bash
          exec g++-14 "$@"
          SH
          chmod +x "$RUNNER_TEMP/hibiki-linux-toolchain/clang" \
            "$RUNNER_TEMP/hibiki-linux-toolchain/clang++"

          # Flutter 3.44 invokes Linux CMake with CC=clang/CXX=clang++,
          # ignoring the job-level CC/CXX. Put the wrappers first in PATH so
          # Flutter's CMake configure and the real build use the same
          # std::expected-capable GNU 14 toolchain verified above.
          PATH="$RUNNER_TEMP/hibiki-linux-toolchain:$PATH" \
            flutter build linux --debug --config-only

          cache="build/linux/x64/debug/CMakeCache.txt"
          grep -F "CMAKE_CXX_COMPILER:FILEPATH=$RUNNER_TEMP/hibiki-linux-toolchain/clang++" "$cache"
          compiler_file="$(find build/linux/x64/debug/CMakeFiles -name CMakeCXXCompiler.cmake -print -quit)"
          test -n "$compiler_file"
          grep -F 'set(CMAKE_CXX_COMPILER_ID "GNU")' "$compiler_file"

          cat > /tmp/hoshidicts_flutter_cmake_expected.cpp <<'CPP'
          #include <expected>
          #ifndef __cpp_lib_expected
          #error __cpp_lib_expected missing
          #endif
          int main() {
            std::expected<int, int> ok = 23;
            std::expected<int, int> fail = std::unexpected(1);
            return ok.value() == 23 && fail.error() == 1 ? 0 : 1;
          }
          CPP
          "$RUNNER_TEMP/hibiki-linux-toolchain/clang++" -std=c++23 \
            /tmp/hoshidicts_flutter_cmake_expected.cpp \
            -o /tmp/hoshidicts_flutter_cmake_expected
      - name: Build Linux (debug)
        working-directory: hibiki
        shell: bash
        run: |
          set -euo pipefail
          if PATH="$RUNNER_TEMP/hibiki-linux-toolchain:$PATH" \
              flutter build linux --debug --verbose; then
            exit 0
          fi

          echo "::group::Linux CMake/Ninja diagnostics"
          cache="build/linux/x64/debug/CMakeCache.txt"
          if [ -f "$cache" ]; then
            grep -E 'CMAKE_(C|CXX)_COMPILER|CMAKE_CXX_STANDARD|CMAKE_BUILD_TYPE' "$cache" || true
          fi
          compiler_file="$(
            find build/linux/x64/debug/CMakeFiles \
              -name CMakeCXXCompiler.cmake -print -quit 2>/dev/null || true
          )"
          if [ -n "$compiler_file" ]; then
            grep -E 'CMAKE_CXX_COMPILER(_ID|_VERSION)?|CMAKE_CXX_STANDARD' \
              "$compiler_file" || true
          fi
          if [ -d build/linux/x64/debug ]; then
            PATH="$RUNNER_TEMP/hibiki-linux-toolchain:$PATH" \
              ninja -C build/linux/x64/debug -v install || true
          fi
          echo "::endgroup::"
          exit 1

  # macOS gates the desktop build plus the shared smoke contract.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      # See the android job: bake the real OAuth secret in when the
      # GOOGLE_OAUTH_CLIENT_SECRET repo secret is set, else stub from the example
      # so the import in google_drive_auth.dart compiles (TODO-045).
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=hibiki/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      # log_upload_secret.dart ships a committed empty placeholder (endpoint = '')
      # so a fresh clone compiles and the log-upload button stays hidden (it is
      # gated by a non-empty endpoint, not by platform - see log_upload_config
      # showUploadLogAction). When the LOG_UPLOAD_ENDPOINT / LOG_UPLOAD_TOKEN repo
      # secrets are set, bake the real values in so CI/release builds (incl.
      # Windows) actually show and can use the "upload log to cloud" button
      # (TODO-385). When unset, leave the committed empty placeholder so the
      # button stays hidden and no endpoint is exposed.
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=hibiki/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=hibiki/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: cache resolved pub packages (miss auto-rebuilds; apply-patches
      # is idempotent so a warm cache is safe).
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      # TODO-1208: cache CocoaPods spec repos, downloaded pod source and generated
      # Pods dirs. Keyed on Podfile.lock/pubspec.lock; CocoaPods re-installs on a
      # mismatch and a miss just re-downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            hibiki/ios/Pods
            hibiki/macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('hibiki/ios/Podfile.lock', 'hibiki/macos/Podfile.lock', 'hibiki/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Flutter pub get
        working-directory: hibiki
        run: flutter pub get
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      - name: Build macOS (debug)
        working-directory: hibiki
        run: >-
          flutter build macos --debug
      - name: Bundle and verify pinned Mihon desktop runtimes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tool/mihon/build_desktop_runtime.sh
          app_dir="hibiki/build/macos/Build/Products/Debug/hibiki.app"
          runtime_dir="$app_dir/Contents/Resources/mihon_bridge"
          tool/mihon/build_desktop_runtime.sh "$runtime_dir" "$RUNNER_TEMP/hibiki-mihon-downloads"
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$candidate"
            fi
          done < <(find "$runtime_dir" -type f)
          chmod +x tool/mihon/verify_desktop_runtime.sh
          tool/mihon/verify_desktop_runtime.sh "$runtime_dir"
          codesign --force --deep --sign - --timestamp=none "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
      - name: Verify macOS hoshidicts dylib bundle
        working-directory: hibiki
        run: |
          set -euo pipefail
          app_dir="build/macos/Build/Products/Debug/hibiki.app"
          dylib="$app_dir/Contents/Frameworks/libhoshidicts_ffi.dylib"
          test -f "$dylib"
          found="$(find "$app_dir/Contents/Frameworks" -maxdepth 1 -type f -name 'libhoshidicts_ffi.dylib' -print -quit)"
          test "$found" = "$dylib"
          otool -D "$dylib"
          test "$(otool -D "$dylib" | tail -n +2)" = "@rpath/libhoshidicts_ffi.dylib"
          otool -L "$dylib"
          otool -l "$app_dir/Contents/MacOS/hibiki" | grep -A2 LC_RPATH | grep -F '@executable_path/../Frameworks'
          DYLIB_PATH="$dylib" python3 - <<'PY'
          import ctypes
          import os
          lib = ctypes.CDLL(os.environ["DYLIB_PATH"])
          lib.hoshidicts_create.restype = ctypes.c_void_p
          lib.hoshidicts_destroy.argtypes = [ctypes.c_void_p]
          handle = lib.hoshidicts_create()
          if not handle:
              raise SystemExit("hoshidicts_create returned null")
          lib.hoshidicts_destroy(handle)
          print("hoshidicts dylib smoke ok")
          PY
      - name: Run macOS comprehensive automation contract
        run: bash ci/comprehensive-test.sh --platform=macos --only=appSmoke

  # iOS runs on a macOS runner and uses a no-codesign device build so CI links
  # the real iOS plugin slices without requiring an Apple developer account.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      # See the android job: bake the real OAuth secret in when the
      # GOOGLE_OAUTH_CLIENT_SECRET repo secret is set, else stub from the example
      # so the import in google_drive_auth.dart compiles (TODO-045).
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=hibiki/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      # See the android job: CI/release builds should use the real log-upload
      # endpoint only when repo secrets provide it; otherwise keep the committed
      # empty placeholder so the upload button remains hidden.
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=hibiki/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=hibiki/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: cache resolved pub packages (miss auto-rebuilds; apply-patches
      # is idempotent so a warm cache is safe).
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      # TODO-1208: cache CocoaPods spec repos, downloaded pod source and generated
      # Pods dirs. Keyed on Podfile.lock/pubspec.lock; CocoaPods re-installs on a
      # mismatch and a miss just re-downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            hibiki/ios/Pods
            hibiki/macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('hibiki/ios/Podfile.lock', 'hibiki/macos/Podfile.lock', 'hibiki/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Flutter pub get
        working-directory: hibiki
        run: flutter pub get
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # Unsigned DEVICE build: needs no Development Team and links the device
      # arch of all plugins (incl. gamepads_ios / record_ios). The --simulator
      # path was wrong before — record_mp3_plus shipped a device-only static lib
      # with no simulator slice; record now ships proper xcframeworks, but the
      # device no-codesign build is the meaningful headless verification.
      # flutter_native_splash 2.4.4 ships a broken SPM Package.swift (invalid
      # public headers "include" dir; fixed upstream only in 2.4.5+, which pulls
      # image ^4.5.2 -> archive 4.x / xml 7.x, conflicting with our pinned
      # archive ^3.6.1 (GDrive streaming) + xml ^6.3.0). iOS deps here are
      # CocoaPods-managed (ios/Podfile.lock), so Flutter 3.44's experimental SPM
      # integration is redundant and breaks the build on this dev-only tool.
      # Disable it until the native_splash chain is satisfiable / we adopt SPM. (TODO-1129)
      - name: Disable experimental Swift Package Manager (CocoaPods-managed iOS)
        run: flutter config --no-enable-swift-package-manager
      - name: Build iOS (debug, no codesign)
        working-directory: hibiki
        run: >-
          flutter build ios --debug --no-codesign
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      # See the android job: bake the real OAuth secret in when the
      # GOOGLE_OAUTH_CLIENT_SECRET repo secret is set, else stub from the example
      # so the import in google_drive_auth.dart compiles (TODO-045).
      - name: Provide gitignored Google OAuth secret stub
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          dst=hibiki/lib/src/sync/google_oauth_secret.dart
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
            printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
              "$oauth_secret_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/sync/google_oauth_secret.example.dart "$dst"
          fi
      # log_upload_secret.dart ships a committed empty placeholder (endpoint = '')
      # so a fresh clone compiles and the log-upload button stays hidden (it is
      # gated by a non-empty endpoint, not by platform - see log_upload_config
      # showUploadLogAction). When the LOG_UPLOAD_ENDPOINT / LOG_UPLOAD_TOKEN repo
      # secrets are set, bake the real values in so CI/release builds (incl.
      # Windows) actually show and can use the "upload log to cloud" button
      # (TODO-385). When unset, leave the committed empty placeholder so the
      # button stays hidden and no endpoint is exposed.
      - name: Provide gitignored log upload secret stub
        shell: bash
        env:
          LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
        run: |
          dst=hibiki/lib/src/utils/misc/log_upload_secret.dart
          if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
            log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
            log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
            printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
              "$log_endpoint_literal" \
              "$log_token_literal" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
          fi
      # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
      # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
      # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set,
      # bake the real values in so CI/release builds sign dandanplay open-API
      # requests and online danmaku works out of the box (no manual API entry).
      - name: Provide gitignored dandanplay secret stub
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          dst=hibiki/lib/src/media/video/dandanplay_secret.dart
          if [ -n "$DANDANPLAY_APP_ID" ]; then
            printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
              "$DANDANPLAY_APP_ID" \
              "$DANDANPLAY_APP_SECRET" \
              > "$dst"
          elif [ ! -f "$dst" ]; then
            cp hibiki/lib/src/media/video/dandanplay_secret.example.dart "$dst"
          fi
      # TODO-1208: Windows Dart pub cache defaults to %LOCALAPPDATA%\Pub\Cache.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pubcache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pubcache-
      # TODO-1208: cache media_kit's libmpv + ANGLE .7z archives it downloads into
      # the CMake binary dir (hibiki/build/windows/x64). media_kit skips the
      # download when the .7z exists with a matching MD5, so caching just the
      # blobs (NOT the build tree / CMakeCache) cuts the slow GitHub fetch.
      - name: Cache media_kit Windows mpv/ANGLE archives
        uses: actions/cache@v4
        with:
          path: hibiki/build/windows/x64/*.7z
          key: ${{ runner.os }}-mediakit7z-${{ hashFiles('hibiki/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-mediakit7z-
      - name: Flutter pub get
        working-directory: hibiki
        run: flutter pub get
      - name: Apply pub cache patches
        shell: bash
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # 内置 libtorrent 引擎的 Windows DLL：vcpkg 编 libtorrent + bridge，产物落
      # native/hibiki_torrent/prebuilt/windows-x64/，供下面 flutter build windows
      # 的 copy-if-present 随包（缺则跳，运行期回退 qb）。vcpkg 二进制缓存摊薄首编
      # ~40min（boost+openssl+libtorrent）到后续秒级。
      - name: Cache vcpkg binary archives (libtorrent)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-libtorrent-x64-windows-v1
          restore-keys: |
            ${{ runner.os }}-vcpkg-libtorrent-
      - name: Build embedded libtorrent DLL (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libtorrent:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install libtorrent failed" }
          powershell -ExecutionPolicy Bypass -File native/hibiki_torrent/build_windows_dll.ps1 -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
      # `packages/hibiki_torrent` 的测试是**唯一**会真正 dlopen 这个 bridge、
      # 把 Dart FFI 绑定按真实 ABI 调一遍的地方；它们要 HIBIKI_TORRENT_LIB 指向
      # 已构建的 DLL，所以在 Linux 上永远整组 skip，main.yml / release.yml 的
      # 包测试清单里也没收录这个包 —— 换句话说，改 C ABI 在 CI 里原本无人可挡。
      #
      # 这个 job 上面刚好已经把 DLL 编出来了，跑一遍近乎零边际成本，且这是唯一
      # 能验证「新 DLL + 新绑定」真能对上的地方（纯文本层的漂移由
      # hibiki/test/media/torrent/torrent_ffi_bindings_parity_guard_test.dart
      # 在所有平台兜底）。
      - name: Run hibiki_torrent FFI tests against the freshly built DLL
        shell: pwsh
        working-directory: packages/hibiki_torrent
        env:
          HIBIKI_TORRENT_LIB: ${{ github.workspace }}\native\hibiki_torrent\prebuilt\windows-x64\hibiki_torrent_ffi.dll
        run: |
          if (-not (Test-Path -LiteralPath $env:HIBIKI_TORRENT_LIB)) {
            throw "DLL not found at $env:HIBIKI_TORRENT_LIB — the build step above should have produced it"
          }
          # 两条都是 native 命令，所以 `dart pub get` 的退出码会被紧随其后的
          # `dart test` 覆盖，末尾那句断言只管得到 `dart test`。pub get 挂掉时
          # 通常靠 dart test 也挂来自愈成红，但报错指向的是「测试失败」而不是
          # 「依赖没解析出来」，排查方向被带偏。逐条断言。
          dart pub get
          if ($LASTEXITCODE -ne 0) { throw "dart pub get failed ($LASTEXITCODE)" }
          dart test
          if ($LASTEXITCODE -ne 0) { throw "hibiki_torrent FFI tests failed" }
      # Windows is the ONLY platform that renders EPUB via the forked
      # flutter_inappwebview_windows C++ plugin; an MSVC/native break here was
      # previously invisible to CI (the audit: Windows never built anywhere).
      - name: Build Windows (debug)
        working-directory: hibiki
        run: >-
          flutter build windows --debug
      - name: Bundle and verify pinned Mihon desktop runtime
        shell: pwsh
        run: |
          .\tool\mihon\build_desktop_runtime.ps1 `
            -OutputDirectory "hibiki\build\windows\x64\runner\Debug\mihon_bridge" `
            -DownloadCache "$env:RUNNER_TEMP\hibiki-mihon-downloads"
          if ($LASTEXITCODE -ne 0) { throw "Mihon desktop runtime build failed ($LASTEXITCODE)" }
          $runtime = "hibiki\build\windows\x64\runner\Debug\mihon_bridge"
          foreach ($required in @(
            "runtime\bin\java.exe",
            "m-extension-server.jar",
            "checksums.json",
            "LICENSE-M-Extension-Server.txt",
            "NOTICE-M-Extension-Server.txt"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $required) -PathType Leaf)) {
              throw "Missing bundled Mihon runtime asset: $required"
            }
          }
          .\tool\mihon\verify_desktop_runtime.ps1 -RuntimeDirectory $runtime
      - name: Build and bundle galgame helper archives
        shell: pwsh
        run: |
          # 同 release-desktop.yml 的孪生副本：这段今天是「意外安全」的（块内只有
          # 这一条 native 命令，后面全是不重置 $LASTEXITCODE 的 cmdlet），但只要
          # 有人插入第二条 native 命令，双架构 ctest 的判决就被静默顶掉。显式断言。
          powershell -NoProfile -ExecutionPolicy Bypass -File native/galgame_hook/tools/build_distribution.ps1 -RunTests
          if ($LASTEXITCODE -ne 0) { throw "build_distribution.ps1 -RunTests failed ($LASTEXITCODE)" }
          $sourceDir = Join-Path $PWD 'native\galgame_hook\dist'
          $targetDir = Join-Path $PWD 'hibiki\build\windows\x64\runner\Debug\galgame_helper'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          foreach ($file in @(
            'voice_hook_x64.zip',
            'voice_hook_x64.zip.sha256',
            'voice_hook_x86.zip',
            'voice_hook_x86.zip.sha256'
          )) {
            $source = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing bundled galgame helper asset: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $targetDir $file) -Force
          }
      - name: Bundle slim Magpie for offline upscaling install
        shell: pwsh
        run: |
          # BUG-1217：随主包发行精简版 Magpie，超分首次使用不再需要下载 10.79 MB。
          # 脚本自己先校验上游完整包的 SHA-256 再裁剪重打包——裁剪等于重新签名，
          # 源包若被掉包而不先验，我们的侧车就成了给污染产物背书的东西。
          # 只出 x64：ARM64 用户极少且能跑 x64 模拟，为它多背 4.7 MB 不划算，
          # 那条路继续走按需下载。
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_magpie_slim.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_magpie_slim.ps1 failed ($LASTEXITCODE)" }
          $sourceDir = Join-Path $PWD 'dist'
          $targetDir = Join-Path $PWD 'hibiki\build\windows\x64\runner\Debug\magpie_bundle'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          foreach ($file in @(
            'Magpie-hibiki-slim-x64.zip',
            'Magpie-hibiki-slim-x64.zip.sha256'
          )) {
            $source = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing bundled magpie asset: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $targetDir $file) -Force
          }
      - name: Run Windows comprehensive automation contract
        run: .\ci\comprehensive-test.ps1 -Platform windows -Only appSmoke
