name: Build and Test Android / macOS / Linux / Windows

# Verifies the app compiles on the four non-Android shipped platforms:
#  - iOS/macOS gamepads = GameController; Linux = evdev/GTK
#  - Windows = the forked flutter_inappwebview_windows C++ EPUB renderer, which
#    is otherwise only built on the dev host and was never gated by CI.
# Also runs the shared comprehensive automation contract on Android, Windows,
# and macOS. That runner requires real test verdict text in logs, not just a
# zero exit code.
# Runs on routine main/develop pushes and PRs again: iOS/macOS regressions are
# user-facing now, and release-desktop.yml can publish Windows/macOS/iOS assets.
on:
  workflow_dispatch:
  push:
    # develop push 上只保留 release.yml（Build Release APK，本仓唯一带 app 全量单测门的
    # workflow）。此前每次合并会同时点燃三条长 workflow，runner 排队到互相 cancel，
    # 「Build and Test」实测常年被后续 push 的 concurrency 取消、等于没跑。
    # **日常覆盖没有减少**：下面的 pull_request 仍是 ['main','develop']，develop 的每条
    # PR 照跑四平台编译门；手动 workflow_dispatch 也在。去掉的只是「合进 develop 之后
    # 再重跑一遍」这份纯冗余。
    branches: ['main']
    paths: &multiplatform_paths
      - 'fushi/**'
      - 'packages/**'
      # C ABI bridge 源码：只改 native/ 的 PR 以前触发不了任何构建，
      # 编译挂了要等下一个不相关改动才暴露。
      - 'native/**'
      - 'ci/**'
      - 'third_party/**'
      - 'tools/build_magpie_slim.ps1'
      - 'tools/bundle_7za.ps1'
      - '.github/workflows/build-multiplatform.yml'
      - '.github/actions/setup-fushi-anki-sync/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: ['main', 'develop']
    paths: *multiplatform_paths

# Cancel a superseded PR run (4 build jobs incl. 2 expensive macOS runners) when
# the PR is force-pushed; keep pushes and manual-dispatch runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    # Still non-blocking (TODO-624 / BUG-365), but the original rationale here was
    # wrong and has been corrected - see the "Enable KVM group permissions" step
    # below. Measured over 52 completed runs (2026-07-28..2026-08-01, sampled via
    # the Actions API): 13 green, 6 red on emulator boot ("Unable to connect to
    # adb daemon on port: 5037" / adb exit code 224), 33 red inside appSmoke with
    # the app process killed by a chromium renderer crash. That is a ~75% red
    # rate held steady across the whole retained history - not the rare flake the
    # first TODO-624 note assumed, and not traceable to any one commit.
    # The KVM step below removes the CPU-emulation starvation that feeds both
    # classes, but it is only proven against the boot class by mechanism; its
    # effect on the appSmoke class is unproven until CI actually runs with
    # acceleration on. So the job stays non-blocking for now instead of turning a
    # known-red contract into a hard gate.
    # What the looseness costs, precisely: this job runs ONLY the appSmoke
    # contract - no APK build and no signing happen here (main.yml still builds
    # and unit-tests the release APK), so the coverage currently at risk is
    # exactly integration_test/app_smoke_test.dart, which is nonetheless the only
    # gate exercising Hibiki on a real Android runtime.
    # Removal condition: once runs with KVM enabled show the appSmoke class gone,
    # drop continue-on-error so this contract becomes a real gate again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
      # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
      # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      # TODO-2721: 只缓存 Gradle 的下载物（modules-2 / wrapper dists），不缓存
      # <ver>/transforms 这类可从 modules-2 重算的派生产物。三个 workflow
      # （main / release / build-multiplatform）的 path + key 必须逐字相同，且此步
      # 之前不得 sed 改 build.gradle / settings.gradle —— 否则同一份内容会被存成
      # 两条各 2.7 GB 的缓存。理由见 docs/agent/build.md 的「CI 缓存配额」，守卫见
      # fushi/test/build/workflow_cache_quota_guard_test.dart。
      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/journal-1
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('fushi/android/**/*.gradle*', 'fushi/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Remove aliyun mirrors from gradle files
        working-directory: fushi/android
        run: |
          sed -i "/maven.*aliyun/d" build.gradle
          sed -i "/maven.*aliyun/d" settings.gradle
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # The GitHub-hosted ubuntu runner DOES ship /dev/kvm (nested virtualization
      # has been available on the standard Ubuntu images since 2023), but the
      # `runner` user is not a member of the `kvm` group, so the emulator's own
      # probe fails and the AVD silently drops to full software CPU emulation:
      #   ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm).
      #   The KVM line in /etc/group is: [kvm:x:993:]
      #   disable Linux hardware acceleration: true
      #   emulator ... -no-boot-anim -accel off
      #   TCG doesn't support requested feature: CPUID.01H:ECX.avx
      # Note the empty member list after `993:` - the device node is there, only
      # the group membership is missing. Measured cost of running under TCG over
      # 52 completed runs (2026-07-28..2026-08-01): `Boot completed in` 316s..704s
      # against the action's 600s emulator-boot-timeout, and inside the app single
      # frames of 90s..214s with 1000+ skipped frames, so even the 30s WebView
      # pre-warm fallback (BUG-1372) times out. So `-accel off` was never the
      # hosted-runner limitation BUG-365 assumed - it is this missing udev rule,
      # which is exactly the setup android-emulator-runner's own error output
      # tells you to apply. This restores hardware virtualization; it is not a
      # retry, a sleep or a timeout bump.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android comprehensive automation contract
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash ci/comprehensive-test.sh --platform=android --only=appSmoke
      # The comprehensive runner now streams flutter-drive output to the console,
      # but also upload the full report (per-command stdout/stderr logs + report
      # .json + screenshots) so a failure is debuggable without re-running.
      - name: Upload comprehensive test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-comprehensive-report
          path: .codex-test/comprehensive/
          if-no-files-found: ignore

  # Linux gates the GTK/evdev desktop build path.
  linux:
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang cmake pkg-config \
            gcc-14 g++-14 libstdc++-14-dev \
            libgtk-3-dev libkeybinder-3.0-dev libmpv-dev liblzma-dev
      - name: Verify Linux C++23 compiler
        shell: bash
        run: |
          set -euo pipefail
          "$CC" --version
          "$CXX" --version
          cat > /tmp/fushidicts_expected.cpp <<'CPP'
          #include <expected>
          #ifndef __cpp_lib_expected
          #error __cpp_lib_expected missing
          #endif
          int main() {
            std::expected<int, int> ok = 23;
            std::expected<int, int> fail = std::unexpected(1);
            return ok.value() == 23 && fail.error() == 1 ? 0 : 1;
          }
          CPP
          "$CXX" -std=c++23 /tmp/fushidicts_expected.cpp -o /tmp/fushidicts_expected
      # Native engine e2e/guard suite (TODO-578): build the real fushidicts
      # static lib via the unified CMake/ctest harness and run every native test
      # (UAF dict-name, kanji round-trip, media import/query, freq+pitch, plus
      # the pure-memory zip64/word-scan/text-processor guards). Self-contained
      # in-memory zip fixtures, no emulator/external assets. Runs before the
      # Flutter build so a native break fails fast and stays independent of Dart.
      - name: Run fushidicts native tests (ctest)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/fushidicts/tests -B "$RUNNER_TEMP/fushi-tests" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/fushi-tests" --config Release
          # --no-tests=error：ctest 在「一个测试都没注册」时默认返回 0，于是一次
          # CMake 回归让 tests/CMakeLists.txt 的 add_test 列表变空就会读成通过。
          # 与 BUG-1157 同族的「零测试执行伪装成绿」。对齐 native-fushidicts-gate.yml。
          ctest --test-dir "$RUNNER_TEMP/fushi-tests" --output-on-failure -C Release --no-tests=error
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
      # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
      # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # 互联 P2P 隧道（iroh）Linux .so：一份产物两处用——Flutter Linux bundle
      # （fushi/linux/CMakeLists.txt copy-if-present 进 bundle/lib/）与下面的
      # fushi_server bundle（bin/../lib/）。失败口径同 libtorrent：构建失败即 job 失败。
      # rust-cache 的 key 按平台分；缓存未命中只会变慢，没有任何步骤的成败挂在 cache-hit 上。
      - name: Set up Rust (fushi_p2p)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - name: Cache Rust build (fushi_p2p)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fushi_p2p -> target
          key: fushi-p2p-linux-x64
      - name: Build fushi_p2p (Linux x64)
        shell: bash
        run: |
          set -euo pipefail
          bash native/fushi_p2p/build_linux_so.sh
          bash native/fushi_p2p/verify_abi.sh native/fushi_p2p/prebuilt/linux-x64/libfushi_p2p.so nm
      - name: Flutter Linux CMake toolchain shim
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/linux
          mkdir -p "$RUNNER_TEMP/fushi-linux-toolchain"
          cat > "$RUNNER_TEMP/fushi-linux-toolchain/clang" <<'SH'
          #!/usr/bin/env bash
          exec gcc-14 "$@"
          SH
          cat > "$RUNNER_TEMP/fushi-linux-toolchain/clang++" <<'SH'
          #!/usr/bin/env bash
          exec g++-14 "$@"
          SH
          chmod +x "$RUNNER_TEMP/fushi-linux-toolchain/clang" \
            "$RUNNER_TEMP/fushi-linux-toolchain/clang++"

          # Flutter 3.44 invokes Linux CMake with CC=clang/CXX=clang++,
          # ignoring the job-level CC/CXX. Put the wrappers first in PATH so
          # Flutter's CMake configure and the real build use the same
          # std::expected-capable GNU 14 toolchain verified above.
          PATH="$RUNNER_TEMP/fushi-linux-toolchain:$PATH" \
            flutter build linux --debug --config-only

          cache="build/linux/x64/debug/CMakeCache.txt"
          grep -F "CMAKE_CXX_COMPILER:FILEPATH=$RUNNER_TEMP/fushi-linux-toolchain/clang++" "$cache"
          compiler_file="$(find build/linux/x64/debug/CMakeFiles -name CMakeCXXCompiler.cmake -print -quit)"
          test -n "$compiler_file"
          grep -F 'set(CMAKE_CXX_COMPILER_ID "GNU")' "$compiler_file"

          cat > /tmp/fushidicts_flutter_cmake_expected.cpp <<'CPP'
          #include <expected>
          #ifndef __cpp_lib_expected
          #error __cpp_lib_expected missing
          #endif
          int main() {
            std::expected<int, int> ok = 23;
            std::expected<int, int> fail = std::unexpected(1);
            return ok.value() == 23 && fail.error() == 1 ? 0 : 1;
          }
          CPP
          "$RUNNER_TEMP/fushi-linux-toolchain/clang++" -std=c++23 \
            /tmp/fushidicts_flutter_cmake_expected.cpp \
            -o /tmp/fushidicts_flutter_cmake_expected
      - name: Build Linux (debug)
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          if PATH="$RUNNER_TEMP/fushi-linux-toolchain:$PATH" \
              flutter build linux --debug --verbose; then
            exit 0
          fi

          echo "::group::Linux CMake/Ninja diagnostics"
          cache="build/linux/x64/debug/CMakeCache.txt"
          if [ -f "$cache" ]; then
            grep -E 'CMAKE_(C|CXX)_COMPILER|CMAKE_CXX_STANDARD|CMAKE_BUILD_TYPE' "$cache" || true
          fi
          compiler_file="$(
            find build/linux/x64/debug/CMakeFiles \
              -name CMakeCXXCompiler.cmake -print -quit 2>/dev/null || true
          )"
          if [ -n "$compiler_file" ]; then
            grep -E 'CMAKE_CXX_COMPILER(_ID|_VERSION)?|CMAKE_CXX_STANDARD' \
              "$compiler_file" || true
          fi
          if [ -d build/linux/x64/debug ]; then
            PATH="$RUNNER_TEMP/fushi-linux-toolchain:$PATH" \
              ninja -C build/linux/x64/debug -v install || true
          fi
          echo "::endgroup::"
          exit 1
      - name: Verify fushi_p2p is in the Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          so=fushi/build/linux/x64/debug/bundle/lib/libfushi_p2p.so
          test -f "$so" || { echo "::error::$so missing — fushi/linux/CMakeLists.txt did not bundle native/fushi_p2p/prebuilt/linux-x64"; exit 1; }
          ls -la "$so"
      # 无头服务端（packages/fushi_server）：纯 Dart，dart build 出带 native assets
      # （sqlite3）的 CLI bundle。这是 fushi_engine「闭包里没有 dart:ui」的最终门——
      # flutter analyze / 守卫测试都只是它的镜像。--help 冒烟不开 DB。
      - name: Build headless fushi_server (Linux)
        shell: bash
        run: |
          set -euo pipefail
          dart build cli --target packages/fushi_server/bin/fushi_server.dart \
            --output build/fushi_server_linux
          ls -la build/fushi_server_linux/bundle
          build/fushi_server_linux/bundle/bin/fushi_server --help
      # fushi-anki-sync（native/fushi_anki_sync，链 Anki 官方 rslib 的 AGPL helper）：
      # 发布包里它随 app / 服务端可执行文件同级（release-desktop.yml / release-server.yml）。
      # PR 门编 debug（不走 LTO，只为抓编译/补丁断裂），装进服务端 bundle/bin，
      # build.sh 顺带生成 SOURCE.txt 并对装好的副本跑 version 冒烟。
      - name: Set up fushi-anki-sync toolchain
        uses: ./.github/actions/setup-fushi-anki-sync
      - name: Build fushi-anki-sync (Linux, debug)
        shell: bash
        run: |
          set -euo pipefail
          bash native/fushi_anki_sync/build.sh --debug --install-dir build/fushi_server_linux/bundle/bin
      # 第 4 期：无头服务端的两块随包原生库，都落 bundle/lib/（服务端按
      # `<exe>/../lib/<裸名>` 定位，见 packages/fushi_server/lib/src/native_libs.dart）。
      #
      # (a) 内置 torrent 引擎 bridge：**vcpkg manifest 静态链**（x64-linux-fpic overlay
      #     triplet，libtorrent 2.0.11 + boost + openssl 全进 .so，libstdc++ 也静态），
      #     目标机零运行库依赖——此前动态链发行版 libtorrent-rasterbar，等于逼用户
      #     `apt install` 或退到外接 qBittorrent。冷编约 40 min，二进制缓存命中后 ~3 min；
      #     缓存 key 带 runner ImageVersion（TODO-2668 同款理由）。
      # (b) onnxruntime CPU 版：与 third_party/flutter_onnxruntime/linux 钉同一版本
      #     1.22.0（asr_onnx_ffi 的 kOrtApiVersion=22 要求 ≥1.22）。要 CUDA 的用户
      #     自行换成 GPU 包并在配置 onnxruntime_library 指过去（README「GPU」一节）。
      - name: Resolve vcpkg cache identity (fushi_server)
        id: vcpkg_cache_id_server
        shell: bash
        run: |
          set -euo pipefail
          image="${ImageVersion:-unknown-image}"
          image="$(echo "$image" | tr -c '0-9A-Za-z._-' '-')"
          echo "vcpkg cache identity (runner ImageVersion): $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg source distfiles (libtorrent linux)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-downloads
            !${{ runner.temp }}/vcpkg-downloads/tools
          key: ${{ runner.os }}-vcpkg-downloads-libtorrent-linux-v1-${{ steps.vcpkg_cache_id_server.outputs.image }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-libtorrent-linux-v1-
      - name: Cache vcpkg binary archives (libtorrent linux)
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          # 末段 = vcpkg.json / overlay ports / triplets 的哈希：改钉版自动换 key，不再靠手动
          # bump vN（命中即不回存，忘了 bump 就每次重编改过的包）。restore-keys 只在同一
          # 镜像内前缀回退，没变的包照样从归档恢复；跨镜像不回退的约束不变。
          key: ${{ runner.os }}-vcpkg-libtorrent-x64-linux-fpic-v1-${{ steps.vcpkg_cache_id_server.outputs.image }}-${{ hashFiles('native/fushi_torrent/vcpkg.json', 'native/fushi_torrent/vcpkg-ports/**', 'native/fushi_torrent/vcpkg-triplets/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-libtorrent-x64-linux-fpic-v1-${{ steps.vcpkg_cache_id_server.outputs.image }}
      - name: Build embedded torrent bridge for fushi_server (Linux, static)
        shell: bash
        env:
          VCPKG_DOWNLOADS: ${{ runner.temp }}/vcpkg-downloads
        run: |
          set -euo pipefail
          chmod +x native/fushi_torrent/build_linux_so.sh
          bash native/fushi_torrent/build_linux_so.sh "$VCPKG_INSTALLATION_ROOT"
          so=native/fushi_torrent/prebuilt/linux-x64/libfushi_torrent_ffi.so
          bash .github/scripts/verify_torrent_abi.sh "$so" nm
          mkdir -p build/fushi_server_linux/bundle/lib
          cp "$so" build/fushi_server_linux/bundle/lib/
      # 与 windows job 同一理由：这是 Linux 上唯一能把 Dart FFI 绑定按真实 ABI 调一遍
      # 的地方（release.yml 的真单测门没有原生产物，这个包整组 skip）。
      - name: Run fushi_torrent FFI tests against the freshly built .so
        shell: bash
        working-directory: packages/fushi_torrent
        env:
          FUSHI_TORRENT_LIB: ${{ github.workspace }}/native/fushi_torrent/prebuilt/linux-x64/libfushi_torrent_ffi.so
        run: |
          set -euo pipefail
          test -f "$FUSHI_TORRENT_LIB" || { echo "::error::.so not found at $FUSHI_TORRENT_LIB"; exit 1; }
          dart pub get
          dart test
      # (c) 互联 P2P 隧道 .so（上面 Linux 桌面构建前已编好）。随后拿 **bundle 里那一份**
      # 跑 packages/fushi_p2p 的真隧道测试（同进程两端点经直连地址互拨，不依赖外网）：
      # 验的是实际发出去的文件能 dlopen、绑定与 C ABI 对得上。main.yml / release.yml 的
      # 包测试没有原生产物，这个包在那里整组 skip，所以这里是 Linux 上唯一的真 ABI 门。
      - name: Bundle fushi_p2p into fushi_server and run its FFI tests (Linux)
        shell: bash
        working-directory: packages/fushi_p2p
        env:
          FUSHI_P2P_LIB: ${{ github.workspace }}/build/fushi_server_linux/bundle/lib/libfushi_p2p.so
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FUSHI_P2P_LIB")"
          cp "$GITHUB_WORKSPACE/native/fushi_p2p/prebuilt/linux-x64/libfushi_p2p.so" "$FUSHI_P2P_LIB"
          dart pub get
          # 库加载失败时这组测试整组 skip 而不是红（tryLoad 永不抛），退出码照样是 0。
          # 所以除了退出码，还要断言 skip 原因没出现，否则「库坏了」会读成绿。
          dart test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/fushi_p2p_test.log"
          if grep -q 'native library not found' "$RUNNER_TEMP/fushi_p2p_test.log"; then
            echo "::error::fushi_p2p tests were skipped: $FUSHI_P2P_LIB did not load"
            exit 1
          fi
      - name: Bundle onnxruntime (CPU) for fushi_server (Linux)
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION=1.22.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          cp -a "$RUNNER_TEMP/onnxruntime-linux-x64-${ORT_VERSION}/lib/"libonnxruntime.so* \
            build/fushi_server_linux/bundle/lib/
          ls -la build/fushi_server_linux/bundle/lib
      - name: Smoke fushi_server with bundled native libs (Linux)
        shell: bash
        run: |
          set -euo pipefail
          # 真进程起 serve：验证 sqlite3 native asset、随包 .so 定位、admin 端口全通。
          # 端口固定非默认值，避免与 runner 上别的东西撞。
          cfg="$RUNNER_TEMP/fushi_server_smoke"
          mkdir -p "$cfg"
          cat > "$cfg/fushi_server.yaml" <<'YAML'
          data_dir: "data"
          port: 48765
          bind: "127.0.0.1"
          tls: false
          admin_port: 48780
          admin_bind: "127.0.0.1"
          admin_token: "ci-smoke-token"
          torrent:
            engine: embedded
          libraries: []
          YAML
          build/fushi_server_linux/bundle/bin/fushi_server serve --config "$cfg/fushi_server.yaml" \
            > "$cfg/serve.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:48780/ && break
            sleep 0.5
          done
          status="$(curl -fsS -H 'Authorization: Bearer ci-smoke-token' http://127.0.0.1:48780/api/admin/status)"
          echo "$status"
          echo "$status" | grep -q '"backend":"embedded"' \
            || { echo "::error::embedded torrent engine not resolved (bundled .so not loaded)"; cat "$cfg/serve.log"; exit 1; }
          models="$(curl -fsS -H 'Authorization: Bearer ci-smoke-token' http://127.0.0.1:48780/api/admin/models)"
          echo "$models" | grep -q '"asr":\[' || { echo "::error::models endpoint failed"; cat "$cfg/serve.log"; exit 1; }
          echo "$models" | grep -q '"error"' && { echo "::error::an ASR language failed to plan (onnxruntime not loadable?)"; echo "$models"; cat "$cfg/serve.log"; exit 1; }
          kill $pid; wait $pid || true
          cat "$cfg/serve.log"
      - name: Upload fushi_server (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: fushi_server-linux-x64
          path: build/fushi_server_linux/bundle/
          if-no-files-found: error

  # macOS gates the desktop build plus the shared smoke contract.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
      # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
      # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      # TODO-1208: cache CocoaPods spec repos, downloaded pod source and generated
      # Pods dirs. Keyed on Podfile.lock/pubspec.lock; CocoaPods re-installs on a
      # mismatch and a miss just re-downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            fushi/ios/Pods
            fushi/macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('fushi/ios/Podfile.lock', 'fushi/macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # 互联 P2P 隧道（iroh）universal dylib：Runner 的「Bundle fushi_p2p dylib」构建阶段
      # （fushi/macos/bundle_fushi_p2p.sh）copy-if-present 进 Contents/Frameworks。
      # 编 universal 而不是只编本机架构：发布包是 universal，x86_64 切片在 PR 上也要编一遍。
      - name: Set up Rust (fushi_p2p, macOS targets)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust build (fushi_p2p)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fushi_p2p -> target
          key: fushi-p2p-macos
      - name: Build fushi_p2p (macOS universal dylib)
        shell: bash
        run: |
          set -euo pipefail
          bash native/fushi_p2p/build_macos_dylib.sh
          bash native/fushi_p2p/verify_abi.sh native/fushi_p2p/prebuilt/macos/libfushi_p2p.dylib nm
      - name: Build macOS (debug)
        working-directory: fushi
        run: >-
          flutter build macos --debug
      # 缓存理由同 windows job 的 Mihon 步骤。缓存里是未签名的原始输出，ad-hoc 签名
      # 只作用于拷进 .app 的副本；ditto 原样保留 jlink 镜像里的符号链接与权限位。
      # key 与 release-desktop.yml macos job 逐字一致。
      - name: Restore pinned Mihon desktop runtimes
        id: mihon_runtime_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mihon-runtime
          key: ${{ runner.os }}-${{ runner.arch }}-mihon-runtime-v1-${{ hashFiles('third_party/m_extension_server/**', 'third_party/jogamp/**', 'tool/mihon/**') }}
      - name: Bundle and verify pinned Mihon desktop runtimes
        shell: bash
        run: |
          set -euo pipefail
          built="$RUNNER_TEMP/mihon-runtime"
          if [[ "${{ steps.mihon_runtime_cache.outputs.cache-hit }}" != "true" ]]; then
            chmod +x tool/mihon/build_desktop_runtime.sh
            tool/mihon/build_desktop_runtime.sh "$built" "$RUNNER_TEMP/hibiki-mihon-downloads"
          fi
          app_dir="fushi/build/macos/Build/Products/Debug/fushi.app"
          runtime_dir="$app_dir/Contents/Resources/mihon_bridge"
          rm -rf -- "$runtime_dir"
          ditto "$built" "$runtime_dir"
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$candidate"
            fi
          done < <(find "$runtime_dir" -type f)
          chmod +x tool/mihon/verify_desktop_runtime.sh
          tool/mihon/verify_desktop_runtime.sh "$runtime_dir" "$app_dir/Contents/MacOS/fushi"
          codesign --force --deep --sign - --timestamp=none "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
      # fushi-anki-sync：PR 门只编本机架构 debug 抓编译断裂；universal（--universal，
      # arm64 + x86_64 lipo）由 release-desktop.yml 的发布构建负责。放置与签名同发布包。
      - name: Set up fushi-anki-sync toolchain
        uses: ./.github/actions/setup-fushi-anki-sync
      - name: Build and bundle fushi-anki-sync (debug)
        shell: bash
        run: |
          set -euo pipefail
          app_dir="fushi/build/macos/Build/Products/Debug/fushi.app"
          target_dir="$app_dir/Contents/MacOS"
          bash native/fushi_anki_sync/build.sh --debug --install-dir "$target_dir"
          mv "$target_dir/fushi-anki-sync.SOURCE.txt" "$app_dir/Contents/Resources/fushi-anki-sync.SOURCE.txt"
          codesign --force --sign - --timestamp=none "$target_dir/fushi-anki-sync"
          codesign --force --deep --sign - --timestamp=none "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
      - name: Verify macOS fushidicts dylib bundle
        working-directory: fushi
        run: |
          set -euo pipefail
          app_dir="build/macos/Build/Products/Debug/fushi.app"
          dylib="$app_dir/Contents/Frameworks/libfushidicts_ffi.dylib"
          test -f "$dylib"
          found="$(find "$app_dir/Contents/Frameworks" -maxdepth 1 -type f -name 'libfushidicts_ffi.dylib' -print -quit)"
          test "$found" = "$dylib"
          otool -D "$dylib"
          test "$(otool -D "$dylib" | tail -n +2)" = "@rpath/libfushidicts_ffi.dylib"
          otool -L "$dylib"
          otool -l "$app_dir/Contents/MacOS/fushi" | grep -A2 LC_RPATH | grep -F '@executable_path/../Frameworks'
          DYLIB_PATH="$dylib" python3 - <<'PY'
          import ctypes
          import os
          lib = ctypes.CDLL(os.environ["DYLIB_PATH"])
          lib.fushidicts_create.restype = ctypes.c_void_p
          lib.fushidicts_destroy.argtypes = [ctypes.c_void_p]
          handle = lib.fushidicts_create()
          if not handle:
              raise SystemExit("fushidicts_create returned null")
          lib.fushidicts_destroy(handle)
          print("fushidicts dylib smoke ok")
          PY
      - name: Verify macOS fushi_p2p dylib bundle
        working-directory: fushi
        run: |
          set -euo pipefail
          app_dir="build/macos/Build/Products/Debug/fushi.app"
          dylib="$app_dir/Contents/Frameworks/libfushi_p2p.dylib"
          test -f "$dylib" || { echo "::error::$dylib missing — the Runner 'Bundle fushi_p2p dylib' phase did not copy it"; exit 1; }
          # universal dylib：otool -D 按架构各打一段「path (architecture x):」+ id，逐段核对。
          test "$(otool -D "$dylib" | grep -v ':$' | sort -u)" = "@rpath/libfushi_p2p.dylib"
          lipo -info "$dylib"
          otool -L "$dylib"
          bash ../native/fushi_p2p/verify_abi.sh "$dylib" nm
          DYLIB_PATH="$dylib" python3 - <<'PY'
          import ctypes
          import os
          lib = ctypes.CDLL(os.environ["DYLIB_PATH"])
          lib.fp2p_version.restype = ctypes.c_char_p
          version = lib.fp2p_version()
          if not version:
              raise SystemExit("fp2p_version returned null")
          print("fushi_p2p dylib smoke ok:", version.decode())
          PY
      - name: Run macOS comprehensive automation contract
        run: bash ci/comprehensive-test.sh --platform=macos --only=appSmoke

  # iOS runs on a macOS runner and uses a no-codesign device build so CI links
  # the real iOS plugin slices without requiring an Apple developer account.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
      # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
      # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      # TODO-1208: cache CocoaPods spec repos, downloaded pod source and generated
      # Pods dirs. Keyed on Podfile.lock/pubspec.lock; CocoaPods re-installs on a
      # mismatch and a miss just re-downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            fushi/ios/Pods
            fushi/macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('fushi/ios/Podfile.lock', 'fushi/macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # Unsigned DEVICE build: needs no Development Team and links the device
      # arch of all plugins (incl. gamepads_ios / record_ios). The --simulator
      # path was wrong before — record_mp3_plus shipped a device-only static lib
      # with no simulator slice; record now ships proper xcframeworks, but the
      # device no-codesign build is the meaningful headless verification.
      # flutter_native_splash 2.4.4 ships a broken SPM Package.swift (invalid
      # public headers "include" dir; fixed upstream only in 2.4.5+, which pulls
      # image ^4.5.2 -> archive 4.x / xml 7.x, conflicting with our pinned
      # archive ^3.6.1 (GDrive streaming) + xml ^6.3.0). iOS deps here are
      # CocoaPods-managed (ios/Podfile.lock), so Flutter 3.44's experimental SPM
      # integration is redundant and breaks the build on this dev-only tool.
      # Disable it until the native_splash chain is satisfiable / we adopt SPM. (TODO-1129)
      - name: Disable experimental Swift Package Manager (CocoaPods-managed iOS)
        run: flutter config --no-enable-swift-package-manager
      # 互联 P2P 隧道（iroh）iOS 静态库：iOS 不能加载自带 dylib，以 staticlib 经
      # -force_load 链进 Runner（native/fushi_p2p/build_ios_staticlib.sh 生成的 xcconfig
      # 由 fushi/ios/Flutter/*.xcconfig 可选 include，给 OTHER_LDFLAGS 的 $(FUSHI_P2P_LDFLAGS)）。
      # 这里是设备构建，只编 device 切片。
      - name: Set up Rust (fushi_p2p, iOS device target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-ios
      - name: Cache Rust build (fushi_p2p)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fushi_p2p -> target
          key: fushi-p2p-ios
      - name: Build fushi_p2p (iOS device staticlib)
        shell: bash
        run: |
          set -euo pipefail
          bash native/fushi_p2p/build_ios_staticlib.sh device
      - name: Build iOS (debug, no codesign)
        working-directory: fushi
        run: >-
          flutter build ios --debug --no-codesign
      # 静态库 + -force_load 的失败形态是「链接成功、符号被 dead-strip / strip 掉」，
      # DynamicLibrary.process().lookup 在用户手里才抛。直接查 Runner 主二进制的导出表。
      # Xcode 的 debug 构建会把 app 代码放进 Runner.debug.dylib（ENABLE_DEBUG_DYLIB），有就查它。
      - name: Verify fushi_p2p symbols are linked into Runner (iOS)
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          bin="$app/Runner"
          if [ -f "$app/Runner.debug.dylib" ]; then bin="$app/Runner.debug.dylib"; fi
          bash ../native/fushi_p2p/verify_abi.sh "$bin" nm
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
      # native-artifact-store 按名字查 / 下载本仓历史 run 的产物。
      actions: read
    steps:
      - uses: actions/checkout@v6
      # Windows 只缓存 pub、不缓存 SDK：run 36365037668 实测 1.8 GB SDK 缓存在 NTFS 上
      # 解包就要 125 s，与直接下官方 zip 同量级，却常驻占掉 10 GB 配额的 18%，把 vcpkg /
      # helper 这类真正省时间的原生产物缓存挤出 LRU。Linux（15 s）/ macOS（27 s）解包快，
      # SDK 缓存照留。release-desktop.yml 的 windows job 同一取舍。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: false
          pub-cache: true

      # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
      # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
      # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        shell: bash
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # 内置 libtorrent 引擎的 Windows DLL：vcpkg 编 libtorrent + bridge，产物落
      # native/fushi_torrent/prebuilt/windows-x64/，供下面 flutter build windows
      # 的 copy-if-present 随包（缺则跳，运行期回退 qb）。
      #
      # TODO-2668｜缓存 key 必须带 runner 镜像版本，两条 Windows workflow 同一处病灶。
      # 完整实测数据与失败链路见 release-desktop.yml 同名步骤上的长注释；要点：
      # 常量 key 只装得下一种 runner 镜像的 ABI，而 actions/cache 命中即不回存，于是
      # 另一种镜像永远冷编（`Restored 0 package(s)` + 22 min + ~110 个 tarball，其中
      # ~45 个来自 mirror.msys2.org / ftpmirror.gnu.org / www.nasm.us / download.qt.io
      # 这 4 个不受控主机）。key 带上 ImageVersion 后两种镜像各占一个条目，都走
      # `Restored 72 package(s)` 的零下载路径（4 min）。二进制缓存的 restore-keys 只回退
      # 到**同一镜像**（前缀含 ImageVersion）：跨镜像前缀命中回来的归档实测一个都用不上。
      - name: Resolve vcpkg cache identity
        id: vcpkg_cache_id
        shell: pwsh
        run: |
          # runner 镜像版本决定了镜像内固化的 vcpkg 修订与 MSVC 工具集，也就决定了
          # 所有 vcpkg 包的 ABI hash。取不到时退回常量，行为等同改动前（冷编但不失败）。
          $image = $env:ImageVersion
          if ([string]::IsNullOrWhiteSpace($image)) { $image = 'unknown-image' }
          $image = ($image -replace '[^0-9A-Za-z._-]', '-')
          Write-Host "vcpkg cache identity (runner ImageVersion): $image"
          # 用 pwsh 的 `>>`（GHA 的 shell: pwsh 是 PowerShell 7，写 UTF-8 无 BOM）。
          # 别换成 `Out-File -Encoding utf8`：那在 Windows PowerShell 5.1 下会写 BOM，
          # BOM 会跟着糊进第一个 key，GITHUB_OUTPUT 的 key=value 解析当场失效。
          "image=$image" >> $env:GITHUB_OUTPUT
      # 原生产物持久库（.github/actions/native-artifact-store）：名字 = 全部构建输入的哈希
      # （源码树 + runner 镜像 + 工具链钉版），在**任何东西被构建之前**算好一次：此时
      # gitignore 的 build/ prebuilt/ target/ dist/ .anki-src/ 都还不存在，所以不写排除模式
      # （release_workflow_path_filter_guard 要求每个 hashFiles 模式都能匹配到文件）；
      # 之后这些目录出现在树里，再算就不是同一个值了。
      # 为什么不用 actions/cache：仓库 10 GB 配额常年超额，整个缓存约 1 小时换一轮，
      # 这几条 Windows 条目几乎总在下一次读之前被 LRU 驱逐（实测数据见该 action 头注释）。
      # 名字在两条 workflow 里逐字一致，develop 上 release-desktop 存的件 PR 门直接复用。
      - name: Resolve native artifact store names
        id: native_store
        shell: pwsh
        env:
          IMAGE: ${{ steps.vcpkg_cache_id.outputs.image }}
          TORRENT_HASH: ${{ hashFiles('native/fushi_torrent/**') }}
          P2P_HASH: ${{ hashFiles('native/fushi_p2p/**') }}
          MIHON_HASH: ${{ hashFiles('third_party/m_extension_server/**', 'third_party/jogamp/**', 'tool/mihon/**') }}
          GALGAME_HASH: ${{ hashFiles('native/galgame_hook/**') }}
          ANKI_SYNC_HASH: ${{ hashFiles('native/fushi_anki_sync/**', '.github/actions/setup-fushi-anki-sync/**') }}
        run: |
          foreach ($v in 'TORRENT_HASH', 'P2P_HASH', 'MIHON_HASH', 'GALGAME_HASH', 'ANKI_SYNC_HASH') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$v").Value)) { throw "$v is empty: hashFiles matched nothing" }
          }
          # fushi_p2p 的 Rust 工具链钉在下面 dtolnay 步骤的 toolchain（1.95.0），改那里要同步改这里。
          @(
            "torrent=win-x64-fushi-torrent-dll-v1-$env:IMAGE-$env:TORRENT_HASH"
            "p2p=win-x64-fushi-p2p-dll-v1-rust1.95.0-$env:IMAGE-$env:P2P_HASH"
            "mihon=win-x64-mihon-runtime-v1-$env:MIHON_HASH"
            "galgame=win-galgame-helper-dist-v1-$env:IMAGE-$env:GALGAME_HASH"
            "anki_sync_release=win-x64-fushi-anki-sync-release-v1-$env:IMAGE-$env:ANKI_SYNC_HASH"
            "anki_sync_debug=win-x64-fushi-anki-sync-debug-v1-$env:IMAGE-$env:ANKI_SYNC_HASH"
          ) | ForEach-Object { Write-Host $_; $_ >> $env:GITHUB_OUTPUT }
      - name: Restore libtorrent DLLs from native artifact store
        id: torrent_store
        uses: ./.github/actions/native-artifact-store
        with:
          mode: restore
          name: ${{ steps.native_store.outputs.torrent }}
          path: native\fushi_torrent\prebuilt\windows-x64
      # 第二层，只兜「新镜像上线那一次必然冷编」的残余：缓存 vcpkg 的 distfile 目录，
      # 等价于官方 asset cache 但不需要额外存储。distfile 全部 SHA512 校验，故前缀
      # restore-key 拿回上一个镜像的目录是安全的；那 4 个高危非 GitHub 主机上的件跨
      # vcpkg 修订几乎不变，前缀命中即可把高危取件面清零。排除 downloads\tools（解压
      # 后的树）以免条目撑到 GB 级；重新解压是纯本地操作，不碰网络。
      - name: Cache vcpkg source distfiles (libtorrent)
        if: steps.torrent_store.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg-downloads
            !${{ runner.temp }}\vcpkg-downloads\tools
          key: ${{ runner.os }}-vcpkg-downloads-libtorrent-v1-${{ steps.vcpkg_cache_id.outputs.image }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-libtorrent-v1-
      - name: Cache vcpkg binary archives (libtorrent)
        if: steps.torrent_store.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          # v2 -> v3：manifest 钉版换掉了 libtorrent/boost/openssl 的 ABI hash，旧条目
          # 一个都用不上；不 bump 的话 actions/cache 命中即不回存，会每次冷编
          # （TODO-2668 记的同一处病灶）。
          # 末段 = vcpkg.json / overlay ports / triplets 的哈希：改钉版自动换 key，不再靠手动
          # bump vN（命中即不回存，忘了 bump 就每次重编改过的包）。restore-keys 只在同一
          # 镜像内前缀回退，没变的包照样从归档恢复；跨镜像不回退的约束不变。
          key: ${{ runner.os }}-vcpkg-libtorrent-x64-windows-v3-${{ steps.vcpkg_cache_id.outputs.image }}-${{ hashFiles('native/fushi_torrent/vcpkg.json', 'native/fushi_torrent/vcpkg-ports/**', 'native/fushi_torrent/vcpkg-triplets/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-libtorrent-x64-windows-v3-${{ steps.vcpkg_cache_id.outputs.image }}
      - name: Build embedded libtorrent DLL (vcpkg)
        if: steps.torrent_store.outputs.hit != 'true'
        shell: pwsh
        env:
          VCPKG_DOWNLOADS: ${{ runner.temp }}\vcpkg-downloads
        run: |
          # 不再 classic `vcpkg install`：版本钉在 native/fushi_torrent/vcpkg.json
          # （manifest + overrides = libtorrent 2.0.11），cmake configure 时工具链
          # 自动按它装。BUG-1772：classic 模式装的是 runner 镜像内固化的 vcpkg 修订
          # 当下的版本，镜像升到 20260818.277.1 后漂到 2.1，4 个 DLL 直接编不出来。
          # baseline 可用性由 build_windows_dll.ps1 的 Assert-VcpkgBaseline 前置检查。
          powershell -ExecutionPolicy Bypass -File native/fushi_torrent/build_windows_dll.ps1 -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "build_windows_dll.ps1 failed" }
      # `packages/fushi_torrent` 的测试是**唯一**会真正 dlopen 这个 bridge、
      # 把 Dart FFI 绑定按真实 ABI 调一遍的地方；它们要 FUSHI_TORRENT_LIB 指向
      # 已构建的 DLL，所以在 Linux 上永远整组 skip，main.yml / release.yml 的
      # 包测试清单里也没收录这个包 —— 换句话说，改 C ABI 在 CI 里原本无人可挡。
      #
      # 这个 job 上面刚好已经把 DLL 编出来了，跑一遍近乎零边际成本，且这是唯一
      # 能验证「新 DLL + 新绑定」真能对上的地方（纯文本层的漂移由
      # fushi/test/media/torrent/torrent_ffi_bindings_parity_guard_test.dart
      # 在所有平台兜底）。
      - name: Run fushi_torrent FFI tests against the freshly built DLL
        shell: pwsh
        working-directory: packages/fushi_torrent
        env:
          FUSHI_TORRENT_LIB: ${{ github.workspace }}\native\fushi_torrent\prebuilt\windows-x64\fushi_torrent_ffi.dll
        run: |
          if (-not (Test-Path -LiteralPath $env:FUSHI_TORRENT_LIB)) {
            throw "DLL not found at $env:FUSHI_TORRENT_LIB — the build step above should have produced it"
          }
          # 两条都是 native 命令，所以 `dart pub get` 的退出码会被紧随其后的
          # `dart test` 覆盖，末尾那句断言只管得到 `dart test`。pub get 挂掉时
          # 通常靠 dart test 也挂来自愈成红，但报错指向的是「测试失败」而不是
          # 「依赖没解析出来」，排查方向被带偏。逐条断言。
          dart pub get
          if ($LASTEXITCODE -ne 0) { throw "dart pub get failed ($LASTEXITCODE)" }
          dart test
          if ($LASTEXITCODE -ne 0) { throw "fushi_torrent FFI tests failed" }
      - name: Save libtorrent DLLs to native artifact store
        if: steps.torrent_store.outputs.hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/native-artifact-store
        with:
          mode: save
          name: ${{ steps.native_store.outputs.torrent }}
          path: native\fushi_torrent\prebuilt\windows-x64
      # 互联 P2P 隧道（iroh）Windows DLL：产物落 native/fushi_p2p/prebuilt/windows-x64/，
      # 供下面 flutter build windows 的 copy-if-present 随包。失败口径同 libtorrent：
      # 构建失败即 job 失败。随后用它跑 packages/fushi_p2p 的真隧道 FFI 测试。
      - name: Restore fushi_p2p DLL from native artifact store
        id: p2p_store
        uses: ./.github/actions/native-artifact-store
        with:
          mode: restore
          name: ${{ steps.native_store.outputs.p2p }}
          path: native\fushi_p2p\prebuilt\windows-x64
      - name: Set up Rust (fushi_p2p)
        if: steps.p2p_store.outputs.hit != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build (fushi_p2p)
        if: steps.p2p_store.outputs.hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fushi_p2p -> target
          key: fushi-p2p-windows-x64
      - name: Build fushi_p2p DLL
        if: steps.p2p_store.outputs.hit != 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File native/fushi_p2p/build_windows_dll.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_windows_dll.ps1 (fushi_p2p) failed" }
      # bash 而不是 pwsh：要 tee 日志再断言没有被 skip（库加载失败时整组 skip、退出码 0）。
      - name: Run fushi_p2p FFI tests against the freshly built DLL
        shell: bash
        working-directory: packages/fushi_p2p
        env:
          FUSHI_P2P_LIB: ${{ github.workspace }}\native\fushi_p2p\prebuilt\windows-x64\fushi_p2p.dll
        run: |
          set -euo pipefail
          test -f "$FUSHI_P2P_LIB" || { echo "::error::DLL not found at $FUSHI_P2P_LIB"; exit 1; }
          dart pub get
          dart test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/fushi_p2p_test.log"
          if grep -q 'native library not found' "$RUNNER_TEMP/fushi_p2p_test.log"; then
            echo "::error::fushi_p2p tests were skipped: $FUSHI_P2P_LIB did not load"
            exit 1
          fi
      - name: Save fushi_p2p DLL to native artifact store
        if: steps.p2p_store.outputs.hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/native-artifact-store
        with:
          mode: save
          name: ${{ steps.native_store.outputs.p2p }}
          path: native\fushi_p2p\prebuilt\windows-x64
      # Windows is the ONLY platform that renders EPUB via the forked
      # flutter_inappwebview_windows C++ plugin; an MSVC/native break here was
      # previously invisible to CI (the audit: Windows never built anywhere).
      - name: Build Windows (debug)
        working-directory: fushi
        run: >-
          flutter build windows --debug
      - name: Verify fushi_p2p is in the Windows bundle
        shell: pwsh
        run: |
          $dll = "fushi\build\windows\x64\runner\Debug\fushi_p2p.dll"
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "$dll missing — fushi/windows/CMakeLists.txt did not bundle native/fushi_p2p/prebuilt/windows-x64"
          }
          Get-Item -LiteralPath $dll | Select-Object FullName, Length
      # BUG-2726: the game-stream input regression (SGRE native gamepad channel,
      # releases that skip visibility checks) is excluded from the runner's
      # default build because it touches real HWNDs; build and run it here with
      # the MSVC tree `flutter build windows` just configured.
      - name: Run game-stream input regression
        shell: pwsh
        run: |
          cmake --build fushi\build\windows\x64 --config Debug --target fushi_windows_game_stream_input_gate
          if ($LASTEXITCODE -ne 0) { throw "game-stream input regression failed ($LASTEXITCODE)" }
      # Mihon runtime 完全由 vendored 源码（m_extension_server + 离线 jogamp 仓库）+ 构建
      # 脚本决定（JDK / 服务端 commit 均在脚本里钉死；脚本再多读仓库里别的目录，必须同步
      # 加进 Resolve native artifact store names 的 MIHON_HASH）：输入没变就复用上次产物，
      # 省掉 gradle + jlink 的 150~220 s。产物先落 $RUNNER_TEMP\mihon-runtime 再拷进 bundle，
      # 签名/校验只动 bundle 里的副本，存进持久库的永远是原始构建输出。
      # 名字与 release-desktop.yml windows job 逐字一致，两条 workflow 共用同一份。
      - name: Restore pinned Mihon desktop runtime
        id: mihon_runtime_store
        uses: ./.github/actions/native-artifact-store
        with:
          mode: restore
          name: ${{ steps.native_store.outputs.mihon }}
          path: ${{ runner.temp }}\mihon-runtime
      - name: Bundle and verify pinned Mihon desktop runtime
        shell: pwsh
        run: |
          $built = "$env:RUNNER_TEMP\mihon-runtime"
          if ('${{ steps.mihon_runtime_store.outputs.hit }}' -ne 'true') {
            .\tool\mihon\build_desktop_runtime.ps1 `
              -OutputDirectory $built `
              -DownloadCache "$env:RUNNER_TEMP\hibiki-mihon-downloads"
            if ($LASTEXITCODE -ne 0) { throw "Mihon desktop runtime build failed ($LASTEXITCODE)" }
          }
          $runtime = "fushi\build\windows\x64\runner\Debug\mihon_bridge"
          if (Test-Path -LiteralPath $runtime) { Remove-Item -LiteralPath $runtime -Recurse -Force }
          Copy-Item -LiteralPath $built -Destination $runtime -Recurse
          foreach ($required in @(
            "runtime\bin\java.exe",
            "m-extension-server.jar",
            "checksums.json",
            "LICENSE-M-Extension-Server.txt",
            "NOTICE-M-Extension-Server.txt"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $required) -PathType Leaf)) {
              throw "Missing bundled Mihon runtime asset: $required"
            }
          }
          .\tool\mihon\verify_desktop_runtime.ps1 -RuntimeDirectory $runtime
      - name: Save Mihon desktop runtime to native artifact store
        if: steps.mihon_runtime_store.outputs.hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/native-artifact-store
        with:
          mode: save
          name: ${{ steps.native_store.outputs.mihon }}
          path: ${{ runner.temp }}\mihon-runtime
      # helper 双架构 cmake + ctest 每次 270~400 s。key = runner 镜像 + native/galgame_hook
      # 全树哈希。镜像决定 MSVC / CMake / 自带 .NET 运行时，工具链一变就重编并重跑 ctest；
      # 树哈希**含测试**：只改 ctest 用例也必须 miss 重跑，所以不能拿只覆盖出包输入的
      # helper_source_fingerprint 当 key。持久库只在 build_distribution.ps1 -RunTests 与
      # install_into_bundle.ps1 都成功之后才存（下面的 Save 步骤），所以命中
      # = 这棵树已经完整编译并通过过 -RunTests，跳过是重复劳动而不是跳过门。
      # install_into_bundle.ps1 仍会按当前源码指纹复核 dist，串号在那里 fail-closed。
      # 哈希在 Resolve native artifact store names 里算：那时 build/ 与 dist/ 还不存在，
      # 只覆盖入库文件（hashFiles 不认 .gitignore）。
      # 名字与 release-desktop.yml windows job 逐字一致，两条 workflow 共用同一份。
      - name: Restore galgame helper archives
        id: galgame_helper_store
        uses: ./.github/actions/native-artifact-store
        with:
          mode: restore
          name: ${{ steps.native_store.outputs.galgame }}
          path: native\galgame_hook\dist
      - name: Build and bundle galgame helper archives
        shell: pwsh
        run: |
          # 同 release-desktop.yml 的孪生副本：这段今天是「意外安全」的（块内只有
          # 这一条 native 命令，后面全是不重置 $LASTEXITCODE 的 cmdlet），但只要
          # 有人插入第二条 native 命令，双架构 ctest 的判决就被静默顶掉。显式断言。
          if ('${{ steps.galgame_helper_store.outputs.hit }}' -ne 'true') {
            powershell -NoProfile -ExecutionPolicy Bypass -File native/galgame_hook/tools/build_distribution.ps1 -RunTests
            if ($LASTEXITCODE -ne 0) { throw "build_distribution.ps1 -RunTests failed ($LASTEXITCODE)" }
          }
          # BUG-1449：见 release-desktop.yml 同处注释。helper 作为普通文件直接装进
          # voice_hook\<arch>\，与本体同源；解压/校验走共用脚本，不要复制粘贴回来。
          powershell -NoProfile -ExecutionPolicy Bypass -File native/galgame_hook/tools/install_into_bundle.ps1 -BundleDirectory "$PWD\fushi\build\windows\x64\runner\Debug"
          if ($LASTEXITCODE -ne 0) { throw "install_into_bundle.ps1 failed ($LASTEXITCODE)" }
      - name: Save galgame helper archives to native artifact store
        if: steps.galgame_helper_store.outputs.hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/native-artifact-store
        with:
          mode: save
          name: ${{ steps.native_store.outputs.galgame }}
          path: native\galgame_hook\dist
      - name: Bundle slim Magpie for offline upscaling install
        shell: pwsh
        run: |
          # BUG-1217：随主包发行精简版 Magpie，超分首次使用不再需要下载 10.79 MB。
          # 脚本自己先校验上游完整包的 SHA-256 再裁剪重打包——裁剪等于重新签名，
          # 源包若被掉包而不先验，我们的侧车就成了给污染产物背书的东西。
          # 只出 x64：ARM64 用户极少且能跑 x64 模拟，为它多背 4.7 MB 不划算，
          # 那条路继续走按需下载。
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_magpie_slim.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_magpie_slim.ps1 failed ($LASTEXITCODE)" }
          $sourceDir = Join-Path $PWD 'dist'
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Debug\magpie_bundle'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          foreach ($file in @(
            'Magpie-hibiki-slim-x64.zip',
            'Magpie-hibiki-slim-x64.zip.sha256'
          )) {
            $source = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing bundled magpie asset: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $targetDir $file) -Force
          }
      - name: Bundle full 7-Zip for discovery and manga extraction
        shell: pwsh
        run: |
          # 发现页与漫画导入的 7z/rar 离线解压依赖随包 7z.exe + 7z.dll
          # （LGPL，官方 GitHub 镜像 + SHA-256 钉死，fail-closed）。
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/bundle_7za.ps1 `
            -BundleDirectory "$PWD\fushi\build\windows\x64\runner\Debug" `
            -DownloadCache "$env:RUNNER_TEMP\hibiki-7za-cache"
          if ($LASTEXITCODE -ne 0) { throw "bundle_7za.ps1 failed ($LASTEXITCODE)" }
      # fushi-anki-sync：同 release-desktop.yml 的发布步骤，PR 门编 debug 抓编译断裂，
      # 装进 Debug bundle（fushi.exe 同级）并由 build.ps1 跑 version 冒烟。
      - name: Restore fushi-anki-sync from native artifact store
        id: anki_sync_store
        uses: ./.github/actions/native-artifact-store
        with:
          mode: restore
          name: ${{ steps.native_store.outputs.anki_sync_debug }}
          path: ${{ runner.temp }}\fushi-anki-sync-prebuilt
      - name: Set up fushi-anki-sync toolchain
        if: steps.anki_sync_store.outputs.hit != 'true'
        uses: ./.github/actions/setup-fushi-anki-sync
      - name: Build and bundle fushi-anki-sync (debug)
        shell: pwsh
        run: |
          # 持久库命中 = 同一棵 native/fushi_anki_sync 树已在可信 run 里编过；只跳 cargo，
          # 安装 + SOURCE.txt + version 冒烟照跑。
          $prebuilt = @()
          if ('${{ steps.anki_sync_store.outputs.hit }}' -eq 'true') {
            $prebuilt = @('-PrebuiltBinary', "$env:RUNNER_TEMP\fushi-anki-sync-prebuilt\fushi-anki-sync.exe")
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File native/fushi_anki_sync/build.ps1 -DebugBuild -InstallDirectory "$PWD\fushi\build\windows\x64\runner\Debug" @prebuilt
          if ($LASTEXITCODE -ne 0) { throw "fushi_anki_sync build.ps1 failed ($LASTEXITCODE)" }
      - name: Save fushi-anki-sync to native artifact store
        if: steps.anki_sync_store.outputs.hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/native-artifact-store
        with:
          mode: save
          name: ${{ steps.native_store.outputs.anki_sync_debug }}
          path: native\fushi_anki_sync\target\debug\fushi-anki-sync.exe
      - name: Run Windows comprehensive automation contract
        run: .\ci\comprehensive-test.ps1 -Platform windows -Only appSmoke
