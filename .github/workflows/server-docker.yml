name: fushi_server Docker image

# Builds the fushi_server Docker image (packages/fushi_server/docker/Dockerfile,
# from the newest published Linux release bundle) and smoke-tests it
# (smoke_test.sh: first-start init, PUID/PGID ownership, health check, WebUI /
# admin API). Build only, never pushes to a registry. Dockerfile.source (an hour
# or more cold) is built by the manual server-docker-publish.yml instead.

on:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'packages/fushi_server/docker/**'
      - '.github/workflows/server-docker.yml'
  push:
    branches: ['develop']
    paths:
      - 'packages/fushi_server/docker/**'
      - '.github/workflows/server-docker.yml'

permissions:
  contents: read

concurrency:
  group: server-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        working-directory: packages/fushi_server/docker
        run: docker build -t fushi-server:ci .
      - name: Compose files parse
        working-directory: packages/fushi_server/docker
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.bundle.yml config --quiet
      # The newest release bundle may predate the language setting, so no
      # --language here; the source image is checked with it before publishing.
      - name: Smoke test
        run: bash packages/fushi_server/docker/smoke_test.sh fushi-server:ci
