          esac
          bash native/fushi_corpus/verify_abi.sh "$so" "$nm_bin"
        done

    # TODO-fast-release: analyze/unit/package tests no longer gate this build job.
    # They ran here as sequential steps BEFORE `flutter build apk`, so a slow or
    # red suite delayed (and could block) the debug-channel APK the user is
    # waiting on. They now live in the sibling `tests` job below, which runs in
    # PARALLEL off the same trigger and does NOT gate build/publish: the APK
    # compiles + publishes immediately, and a test failure still surfaces as a red
    # X on the `tests` job (continuous signal preserved on every push, including
    # direct develop pushes that skip the PR gate in main.yml). The desktop/EXE
    # workflow (release-desktop.yml) never ran tests, so nothing there changes.
    # The workflow_dispatch skip_tests input now governs whether the `tests` job
    # runs (see its job-level `if`), keeping the manual fast-release path intact.
    - name: Collect Android release build diagnostics
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Tool versions"
        pwd
        git rev-parse --short HEAD
        flutter --version
        dart --version
        java -version
        (cd android && timeout 120s ./gradlew --version --no-daemon) || true
        echo "::endgroup::"
        echo "::group::Pre-build output paths"
        ls -la build || true
        ls -la build/app || true
        ls -la build/app/outputs || true
        ls -la build/app/outputs/flutter-apk || true
        find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \; || true
        echo "::endgroup::"

    - name: Build debug APK
      if: steps.channel.outputs.build_debug_apk == 'true'
      working-directory: fushi
      timeout-minutes: 20
      shell: bash
      run: |
        set -euo pipefail
        flutter --verbose build apk --debug \
          --build-name "${{ steps.channel.outputs.build_version_name }}" \
          --build-number "${{ steps.channel.outputs.android_build_number }}" \
          --dart-define="FUSHI_BUILD_VERSION=${{ steps.channel.outputs.build_version_name }}"

    - name: Prepare debug APK release asset
      if: steps.channel.outputs.build_debug_apk == 'true'
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        BUILD_VERSION_NAME="${{ steps.channel.outputs.build_version_name }}"
        SHORT_SHA="${GITHUB_SHA::7}"
        APK_DIR=build/app/outputs/flutter-apk
        OUT_DIR=build/release-artifacts
        DEBUG_APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*-debug.apk' | sort | head -n 1)
        if [ -z "$DEBUG_APK" ]; then
          echo "::error title=Debug APK missing::No *-debug.apk found in $APK_DIR"
          exit 1
        fi
        mkdir -p "$OUT_DIR"
        rm -f "$OUT_DIR"/fushi-*.apk
        cp "$DEBUG_APK" "$OUT_DIR/fushi-${BUILD_VERSION_NAME}-${SHORT_SHA}-debug.apk"

    - name: Build release-signed debug-channel APK
      if: steps.channel.outputs.build_debug_channel_apk == 'true'
      working-directory: fushi
      timeout-minutes: 30
      shell: bash
      run: |
        set -euo pipefail
        flutter --verbose build apk --release --target-platform android-arm64 \
          --build-name "${{ steps.channel.outputs.build_version_name }}" \
          --build-number "${{ steps.channel.outputs.android_build_number }}" \
          --dart-define="FUSHI_BUILD_VERSION=${{ steps.channel.outputs.build_version_name }}"

    - name: Prepare release-signed debug-channel APK asset
      if: steps.channel.outputs.build_debug_channel_apk == 'true'
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        BUILD_VERSION_NAME="${{ steps.channel.outputs.build_version_name }}"
        SHORT_SHA="${GITHUB_SHA::7}"
        APK_DIR=build/app/outputs/flutter-apk
        OUT_DIR=build/release-artifacts
        DEBUG_CHANNEL_APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' ! -name '*-debug.apk' | sort | head -n 1)
        if [ -z "$DEBUG_CHANNEL_APK" ]; then
          echo "::error title=Debug channel APK missing::No release-signed APK found in $APK_DIR"
          exit 1
        fi
        mkdir -p "$OUT_DIR"
        rm -f "$OUT_DIR"/fushi-*.apk
        cp "$DEBUG_CHANNEL_APK" "$OUT_DIR/fushi-${BUILD_VERSION_NAME}-${SHORT_SHA}-debug.apk"

    # BUG-3874：--target-platform 只管 libflutter/libapp，插件与本仓 jniLibs 不随之过滤，
    # 调试包曾带着 armeabi-v7a / x86_64 两套起不来的原生库（459 MB，近一半死重）。过滤由
    # build.gradle 的 ndk.abiFilters 按 target-platform 收；这里在出包后钉死结果。
    - name: Verify debug-channel APK is arm64-only
      if: steps.channel.outputs.build_debug_channel_apk == 'true'
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        apk=$(find build/release-artifacts -maxdepth 1 -type f -name 'fushi-*-debug.apk' | head -n 1)
        abis="$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
        echo "lib ABIs in $apk: $(echo $abis)"
        if [ "$abis" != "arm64-v8a" ]; then
          echo "::error title=Debug APK carries extra ABIs::$apk lib/ has: $(echo $abis) (expected arm64-v8a only)"
          exit 1
        fi

    - name: Build release APK (split per ABI)
      if: steps.channel.outputs.build_split_release_apk == 'true'
      working-directory: fushi
      timeout-minutes: 60
      shell: bash
      run: |
        set -euo pipefail
        flutter --verbose build apk --split-per-abi --release \
          --build-name "${{ steps.channel.outputs.build_version_name }}" \
          --build-number "${{ steps.channel.outputs.android_build_number }}" \
          --dart-define="FUSHI_BUILD_VERSION=${{ steps.channel.outputs.build_version_name }}"

    - name: Collect Android post-build diagnostics
      if: ${{ always() && (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Post-build APK diagnostics"
        pwd
        find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \; || true
        find build/app/outputs -maxdepth 5 -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
        echo "::endgroup::"

    - name: Prepare release APK assets
      if: steps.channel.outputs.build_split_release_apk == 'true'
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        BUILD_VERSION_NAME="${{ steps.channel.outputs.build_version_name }}"
        APK_DIR=build/app/outputs/flutter-apk
        OUT_DIR=build/release-artifacts
        mkdir -p "$OUT_DIR"
        for f in "$APK_DIR"/app-*-release.apk; do
          ABI=$(basename "$f" | sed 's/^app-//;s/-release\.apk$//')
          cp "$f" "$OUT_DIR/fushi-${BUILD_VERSION_NAME}-${ABI}.apk"
        done

    # build.gradle 的 release signingConfig 显式开了 v1 + v2 + v3：minSdk 24 时 AGP 默认只签
    # v2，HarmonyOS 4.x 安装器会因没有 JAR（v1）签名报「无证书」拒装（反馈 j3ChbSpKgJ）。
    # 这三个开关被删 / 被 AGP 升级改了默认都不会让构建失败，这里对每个 release 签名的 APK
    # （release-signed 调试通道包与 split release 包；Gradle 出的 `*-release.apk`，debug 签名
    # 的 `*-debug.apk` 不在其列）跑 apksigner，三种方案缺一个就挡在发布前。
    - name: Verify release APK signing schemes (v1 + v2 + v3)
      if: ${{ steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
        if [ -z "$APKSIGNER" ]; then
          echo "::error title=apksigner missing::No apksigner under $ANDROID_HOME/build-tools"
          exit 1
        fi
        echo "Using $APKSIGNER"
        shopt -s nullglob
        apks=(build/app/outputs/flutter-apk/*-release.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=Release APK missing::No *-release.apk in build/app/outputs/flutter-apk"
          exit 1
        fi
        failed=0
        for apk in "${apks[@]}"; do
          out="$("$APKSIGNER" verify --verbose "$apk")"
          echo "::group::apksigner verify $apk"
          echo "$out"
          echo "::endgroup::"
          for scheme in v1 v2 v3; do
            if ! grep -Eq "^Verified using ${scheme} scheme \(.*\): true$" <<<"$out"; then
              echo "::error title=APK not signed with ${scheme}::$apk is not verified with the ${scheme} signature scheme"
              failed=1
            fi
          done
        done
        exit "$failed"

    # jniLibs 是 copy-if-present：.so 没落到 prebuilt/ 时 Gradle 静默跳过，APK 照出、
    # P2P 能力在用户那里整块消失。这里按「APK 里 app 能跑的每个 ABI（有 libflutter.so
    # 的 lib/<abi>/），都必须有那个 ABI 的 libfushi_p2p.so」逐包核对，把「编了但没进包」
    # 挡在发布前。判据用 libflutter.so 而不是「任何 lib/ 目录」：第三方插件可能自带
    # Flutter 根本不支持的 ABI 目录（如 x86），那上面 app 本身就起不来。
    - name: Verify fushi_p2p is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          if [ -z "$abis" ]; then
            echo "::error title=APK has no Flutter engine::$apk has no lib/<abi>/libflutter.so"
            exit 1
          fi
          for abi in $abis; do
            # here-string，不用 `printf | grep -q`：清单是整个 APK 的条目（远超 64KB 管道缓冲），
            # grep -q 一命中就退出，printf 随即 SIGPIPE，在 pipefail 下整条管道判失败，`if !`
            # 就把「找到了」读成「没有」（BUG-2804，2f08d46 / 248238cf7 两次假红，日志里是
            # `printf: write error: Broken pipe`）。
            if ! grep -qx "lib/$abi/libfushi_p2p.so" <<< "$listing"; then
              echo "::error title=fushi_p2p missing from APK::$apk lib/$abi/ has no libfushi_p2p.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_p2p.so"
          done
        done

    # 同上，fushi_fsrs（SRS 排程内核）也是 jniLibs copy-if-present：逐包、逐 ABI 核对
    # APK 里确有 libfushi_fsrs.so，把「编了但没进包」挡在发布前。判据与 here-string
    # 理由（BUG-2804）同上一步。
    - name: Verify fushi_fsrs is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          if [ -z "$abis" ]; then
            echo "::error title=APK has no Flutter engine::$apk has no lib/<abi>/libflutter.so"
            exit 1
          fi
          for abi in $abis; do
            if ! grep -qx "lib/$abi/libfushi_fsrs.so" <<< "$listing"; then
              echo "::error title=fushi_fsrs missing from APK::$apk lib/$abi/ has no libfushi_fsrs.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_fsrs.so"
          done
        done
    # 同上，fushi_web_core（网页内容核心）也走 jniLibs：逐包、逐 ABI 核对
    # APK 里确有 libfushi_web_core.so，把「编了但没进包」挡在发布前。判据与 here-string
    # 理由（BUG-2804）同上一步。
    - name: Verify fushi_web_core is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          if [ -z "$abis" ]; then
            echo "::error title=APK has no Flutter engine::$apk has no lib/<abi>/libflutter.so"
            exit 1
          fi
          for abi in $abis; do
            if ! grep -qx "lib/$abi/libfushi_web_core.so" <<< "$listing"; then
              echo "::error title=fushi_web_core missing from APK::$apk lib/$abi/ has no libfushi_web_core.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_web_core.so"
          done
        done

    # 同上，fushi_compute（计算内核）也是 jniLibs copy-if-present：逐包、逐 ABI 核对。
    - name: Verify fushi_compute is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          if [ -z "$abis" ]; then
            echo "::error title=APK has no Flutter engine::$apk has no lib/<abi>/libflutter.so"
            exit 1
          fi
          for abi in $abis; do
            if ! grep -qx "lib/$abi/libfushi_compute.so" <<< "$listing"; then
              echo "::error title=fushi_compute missing from APK::$apk lib/$abi/ has no libfushi_compute.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_compute.so"
          done
        done

    # 同上，fushi_rwkv（RWKV 排程推理，硬依赖）：逐包、逐 ABI 核对。
    - name: Verify fushi_rwkv is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          if [ -z "$abis" ]; then
            echo "::error title=APK has no Flutter engine::$apk has no lib/<abi>/libflutter.so"
            exit 1
          fi
          for abi in $abis; do
            if ! grep -qx "lib/$abi/libfushi_rwkv.so" <<< "$listing"; then
              echo "::error title=fushi_rwkv missing from APK::$apk lib/$abi/ has no libfushi_rwkv.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_rwkv.so"
          done
        done
    # 音乐胖核心 fushi_music（曲库扫描 / 标签 / CUE）同为 app 硬依赖：与上一步 fushi_rwkv 同一口径。
    - name: Verify fushi_music is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          if [ -z "$abis" ]; then
            echo "::error title=APK has no Flutter engine::$apk has no lib/<abi>/libflutter.so"
            exit 1
          fi
          for abi in $abis; do
            if ! grep -qx "lib/$abi/libfushi_music.so" <<< "$listing"; then
              echo "::error title=fushi_music missing from APK::$apk lib/$abi/ has no libfushi_music.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_music.so"
          done
        done
    # 语料胖核心 fushi_corpus（「我库里的例句」倒排索引）同为 app 硬依赖：与上一步 fushi_corpus 同一口径。
    - name: Verify fushi_corpus is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          if [ -z "$abis" ]; then
            echo "::error title=APK has no Flutter engine::$apk has no lib/<abi>/libflutter.so"
            exit 1
          fi
          for abi in $abis; do
            if ! grep -qx "lib/$abi/libfushi_corpus.so" <<< "$listing"; then
              echo "::error title=fushi_corpus missing from APK::$apk lib/$abi/ has no libfushi_corpus.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_corpus.so"
          done
        done

    # libbluray opens the Blu-ray libaacs module as soname libaacs.so.0; the app
    # preloads libfushi_aacs.so (native/fushi_aacs) from every ABI it runs on.
    - name: Verify fushi_aacs is packaged in every APK ABI
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: fushi
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/release-artifacts/fushi-*.apk)
        if [ "${#apks[@]}" -eq 0 ]; then
          echo "::error title=No APK to verify::build/release-artifacts has no fushi-*.apk"
          exit 1
        fi
        for apk in "${apks[@]}"; do
          listing="$(unzip -Z1 "$apk")"
          abis="$(printf '%s\n' "$listing" | sed -n 's#^lib/\([^/]*\)/libflutter\.so$#\1#p' | sort -u)"
          for abi in $abis; do
            # here-string, not printf | grep -q (BUG-2804 SIGPIPE false red).
            if ! grep -qx "lib/$abi/libfushi_aacs.so" <<< "$listing"; then
              echo "::error title=fushi_aacs missing from APK::$apk lib/$abi/ has no libfushi_aacs.so"
              exit 1
            fi
            echo "ok: $apk lib/$abi/libfushi_aacs.so"
          done
        done

    # TODO-866: the prepared APKs in build/release-artifacts/ are otherwise only
    # ever uploaded as GitHub Release assets (the softprops steps below). When
    # that release publish intermittently 403s ("Resource not accessible by
    # integration"), the APK is built successfully but has NO download path and
    # is destroyed with the runner. Capture it as a workflow-run artifact so the
    # build is always downloadable from the run page, decoupled from Release
    # publish. Pure additive capture: touches no tag/publish/Latest/formal
    # logic. always() + no channel gate so a successful build is downloadable
    # even if a later publish step 403s; if-no-files-found: ignore tolerates
    # channels/events that produced no APK.
    # 通道解析结果交给 publish-android 的唯一通道（不走 job outputs，原因见本 job 的
    # outputs 注释）。一键一文件，原样写值：不经 shell 展开、不怕多行公告。
    - name: Save Android release channel for publish job
      if: always() && steps.channel.outcome == 'success'
      shell: bash
      env:
        CH_CHANNEL: ${{ steps.channel.outputs.channel }}
        CH_TAG: ${{ steps.channel.outputs.tag }}
        CH_PUBLISH_TAG: ${{ steps.channel.outputs.publish_tag }}
        CH_ROLLING_DEBUG: ${{ steps.channel.outputs.rolling_debug }}
        CH_NAME: ${{ steps.channel.outputs.name }}
        CH_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        CH_MAKE_LATEST: ${{ steps.channel.outputs.make_latest }}
        CH_BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
        CH_RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
        CH_PUBLISH_MANAGED_RELEASE: ${{ steps.channel.outputs.publish_managed_release }}
        CH_PUBLISH_MANIFEST: ${{ steps.channel.outputs.publish_manifest }}
        CH_MANIFEST_CHANNEL: ${{ steps.channel.outputs.manifest_channel }}
        CH_FILES: ${{ steps.channel.outputs.files }}
        CH_BODY: ${{ steps.channel.outputs.body }}
      run: |
        set -euo pipefail
        dir=fushi/build/release-channel
        mkdir -p "$dir"
        for key in channel tag publish_tag rolling_debug name prerelease make_latest build_version_name release_sequence publish_managed_release publish_manifest manifest_channel files body; do
          var="CH_${key^^}"
          printf '%s' "${!var}" > "$dir/$key"
        done

    - name: Upload Android release channel to workflow run
      if: always() && steps.channel.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: fushi-release-channel-${{ github.sha }}
        path: fushi/build/release-channel/
        if-no-files-found: error
        retention-days: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.channel == 'formal' || github.event.inputs.channel == 'beta')) && 30 || 14 }}

    - name: Upload APK artifacts to workflow run
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fushi-${{ steps.channel.outputs.channel }}-apk-${{ github.sha }}
        path: fushi/build/release-artifacts/*.apk
        if-no-files-found: ignore
        # 正式 / 测试版 dispatch 的 publish job 要等人工审批（环境 release-publish，
        # 待审批 job 最长挂 30 天），publish job 从这份 artifact 取 APK：保留期必须
        # 盖住整个审批窗口，否则过了 14 天再批就发不出去。
        retention-days: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.channel == 'formal' || github.event.inputs.channel == 'beta')) && 30 || 14 }}

  # 对外发布全部收在这个 job（2026-10-17 用户要求：正式版必须云端预构建好，说「发版」
  # 时秒发、不重新构建）。build job 只构建 + 签名 + 上传 run artifact；这里下载 artifact
  # 后才做 GitHub Release 创建 / 上传、滚动 debug 清理、更新清单、反馈回填、main 同步。
  #
  # 审批门：workflow_dispatch 的 formal / beta 走环境 `release-publish`（必需审批人
  # hajisensai、允许自审），job 停在「Waiting」直到批准；push 的滚动 debug 与手动发
  # GitHub Release（`release` 事件，本身就是发布动作）走无保护规则的 `release-auto`，
  # 不等人。不用「表达式算出空串 = 不挂环境」：官方文档没写这条语义，push 发布每天
  # 跑十几次，赌错就是全停；两个具名环境的行为都有文档保证。
  # build_only 时两个发布开关都是 false，job 级 if 直接跳过，不会弹审批。
  # release-desktop.yml 的 publish / testflight 两个 job 挂同一个门（本 job 叫 publish-android：
  # 两条 workflow 的 job 名按产出不相交，守卫 release_workflow_push_branches_guard_test），同 tag 两条
  # dispatch 都停在门口，两条都批准才是完整的一次发版。流程见 docs/agent/build.md
  # 「正式版预构建与审批发布」；守卫 fushi/test/build/release_publish_gate_guard_test.dart。
  publish-android:
    needs: build
    if: ${{ (github.event_name == 'release' || needs.build.outputs.publish_managed_release == 'true' || needs.build.outputs.publish_manifest == 'true') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    environment: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.channel == 'formal' || github.event.inputs.channel == 'beta')) && 'release-publish' || 'release-auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # publish_update_manifest.sh 推完正式版清单要 `gh workflow run` 唤醒 R2 镜像；
      # job 级 permissions 会把没列出的 scope 置 none，缺 actions: write 则 dispatch 403。
      actions: write

    steps:
    # 完整历史：反馈回填要 `git merge-base --is-ancestor`，main 同步拿工作区当
    # `--reference` 借对象，清单脚本在 tool/ 下。
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # 把 build job 的通道解析结果还原成 steps.channel.outputs.*（不在这里重新解析：
    # 同一份结果只算一次，publish 与 build 不可能对版本串 / tag / 开关各执一词）。
    # 来源是 build job 上传的 artifact，不是 job outputs（会被 secret 过滤静默丢值）。
    - name: Download Android release channel from build job
      uses: actions/download-artifact@v7
      with:
        name: fushi-release-channel-${{ github.sha }}
        path: ${{ runner.temp }}/release-channel

    - name: Load Android release channel from build job
      id: channel
      shell: bash
      env:
        CH_DIR: ${{ runner.temp }}/release-channel
      run: |
        set -euo pipefail
        for key in channel tag publish_tag rolling_debug name prerelease make_latest build_version_name release_sequence publish_managed_release publish_manifest manifest_channel files body; do
          if [ ! -f "$CH_DIR/$key" ]; then
            echo "::error title=Release channel incomplete::build job did not hand over '$key'"
            exit 1
          fi
        done
        # 空 tag 绝不能往下走：prune / 上传拿空 tag 会落到 Latest release 上。
        for key in channel tag publish_tag; do
          if [ -z "$(cat "$CH_DIR/$key")" ]; then
            echo "::error title=Empty release channel value::'$key' is empty; refusing to publish"
            exit 1
          fi
        done
        {
          for key in channel tag publish_tag rolling_debug name prerelease make_latest build_version_name release_sequence publish_managed_release publish_manifest manifest_channel files; do
            printf '%s=%s\n' "$key" "$(cat "$CH_DIR/$key")"
          done
          echo "body<<FUSHI_RELEASE_BODY_EOF"
          cat "$CH_DIR/body"
          printf '\n'
          echo "FUSHI_RELEASE_BODY_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "channel=$(cat "$CH_DIR/channel") tag=$(cat "$CH_DIR/tag") publish_tag=$(cat "$CH_DIR/publish_tag") managed=$(cat "$CH_DIR/publish_managed_release") manifest=$(cat "$CH_DIR/publish_manifest")/$(cat "$CH_DIR/manifest_channel")"

    - name: Download APK artifacts from build job
      uses: actions/download-artifact@v7
      with:
        name: fushi-${{ steps.channel.outputs.channel }}-apk-${{ github.sha }}
        path: fushi/build/release-artifacts

    - name: Upload APKs to GitHub Release event
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.channel.outputs.tag }}
        files: |
          fushi/build/release-artifacts/fushi-*.apk

    # TODO-1049 / TODO-1123: the debug channel reuses ONE rolling GitHub Release
    # (tag `debug-rolling`). softprops upserts same-named assets but never
    # removes an asset from a PRIOR commit (different seq/sha in the name), so
    # without pruning the rolling release would accumulate one APK+EXE per commit.
    #
    # TODO-1123 root-cause narrowing of the pruned-asset 404 race: the OLD prune
    # kept ONLY the current build's seq, so a device that had just fetched the
    # PREVIOUS manifest (older seq) and then started downloading would 404 the
    # instant a newer push pruned that seq's APK. We now keep the most recent
    # KEEP_SEQS (=3: current + prior two) sequences, giving in-flight downloads a
    # grace window across a couple of pushes. The client also re-resolves the
    # manifest on a 404 and retries the fresh URL once (update_checker), so this
    # CI change is the "widen the window" half of a two-sided fix. Same-commit
    # Android+desktop share the seq, so they never prune each other. Skipped
    # unless this run is the rolling debug channel. Missing release / nothing to
    # prune is a no-op.
    - name: Prune stale assets from rolling debug release
      if: steps.channel.outputs.publish_managed_release == 'true' && steps.channel.outputs.rolling_debug == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PUBLISH_TAG: ${{ steps.channel.outputs.publish_tag }}
        BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
      run: |
        set -euo pipefail
        # Keep the most recent KEEP_SEQS debug sequences (current + prior 2) so a
        # client mid-download against a just-superseded seq is not 404'd.
        KEEP_SEQS=3
        if ! gh release view "$PUBLISH_TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Rolling release $PUBLISH_TAG does not exist yet; nothing to prune."
          exit 0
        fi
        mapfile -t ASSET_NAMES < <(
          gh release view "$PUBLISH_TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' || true
        )
        if [ "${#ASSET_NAMES[@]}" -eq 0 ]; then
          echo "No assets on $PUBLISH_TAG; nothing to prune."
          exit 0
        fi
        # TODO-1131: only ever prune THIS platform's own assets. The rolling
        # debug release is shared by Android/Windows/Apple, each publishing from
        # an independent workflow run. Computing the kept-seq set across ALL
        # platforms' assets means a lagging platform (slower or transiently
        # failed build) has its last-good asset's seq pushed out of the top
        # KEEP_SEQS by the OTHER platforms' newer seqs -- so another platform's
        # prune deletes it and the rolling release "loses" that device. Scope the
        # candidate set to this platform's filename shape (Android: *.apk) so each
        # platform keeps its own top KEEP_SEQS and never touches another's assets.
        PLATFORM_ASSETS=()
        for name in "${ASSET_NAMES[@]}"; do
          case "$name" in
            *.apk) PLATFORM_ASSETS+=("$name") ;;
          esac
        done
        # Check length BEFORE re-expanding the (possibly empty) array: on macOS
        # bash 3.2 `("${empty[@]}")` under `set -u` is an unbound-variable error,
        # and no-asset-for-this-platform is exactly the lagging / first-publish
        # case this fix must handle gracefully. `${#arr[@]}` is safe on 3.2.
        if [ "${#PLATFORM_ASSETS[@]}" -eq 0 ]; then
          echo "No Android assets on $PUBLISH_TAG; nothing to prune."
          exit 0
        fi
        ASSET_NAMES=("${PLATFORM_ASSETS[@]}")
        # Asset names embed the versionName token `-<base>-debug.<seq>-` (e.g.
        # fushi-0.11.1-debug.5633-3cf5905-debug.apk). Parse the current build's
        # seq from BUILD_VERSION_NAME (0.11.1-debug.5633), extract every asset's
        # seq the same way, keep the top KEEP_SEQS distinct seqs (numeric desc),
        # and delete only assets whose seq is NOT in that set. Assets with no
        # parseable debug seq are treated as stale (superseded/legacy naming).
        seq_of() { printf '%s' "$1" | sed -n 's/.*-debug\.\([0-9]\+\).*/\1/p'; }
        CURRENT_SEQ="$(seq_of "$BUILD_VERSION_NAME")"
        {
          # TODO-1129: terminal-position `[ -n "$X" ] && echo` inside a pipefail
          # brace-group returns 1 when the test is false (empty seq), which
          # pipefail propagates and set -e kills the step silently. Use no-else
          # `if` so a false test yields exit 0.
          if [ -n "$CURRENT_SEQ" ]; then echo "$CURRENT_SEQ"; fi
          for name in "${ASSET_NAMES[@]}"; do
            s="$(seq_of "$name")"
            if [ -n "$s" ]; then echo "$s"; fi
          done
        } | sort -rn -u > /tmp/all_seqs.txt
        mapfile -t KEEP_SEQ_LIST < <(head -n "$KEEP_SEQS" /tmp/all_seqs.txt)
        echo "Keeping debug seqs: ${KEEP_SEQ_LIST[*]:-<none>}"
        in_keep() {
          local target="$1"
          for k in "${KEEP_SEQ_LIST[@]}"; do
            [ "$k" = "$target" ] && return 0
          done
          return 1
        }
        STALE=()
        for name in "${ASSET_NAMES[@]}"; do
          [ -n "$name" ] || continue
          s="$(seq_of "$name")"
          if [ -z "$s" ] || ! in_keep "$s"; then
            STALE+=("$name")
          fi
        done
        if [ "${#STALE[@]}" -eq 0 ]; then
          echo "No stale assets on $PUBLISH_TAG (all within kept seqs)."
          exit 0
        fi
        for asset in "${STALE[@]}"; do
          [ -n "$asset" ] || continue
          echo "  deleting stale asset $asset from $PUBLISH_TAG"
          gh release delete-asset "$PUBLISH_TAG" "$asset" --repo "$REPO" --yes
        done

    - name: Publish Android channel release
      if: steps.channel.outputs.publish_managed_release == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.channel.outputs.publish_tag }}
        # Rolling debug: target the DEFAULT branch, not github.sha. GitHub rejects a
        # GITHUB_TOKEN update of a release whose resolved target commit changes
        # .github/workflows/ relative to the default branch (REST docs, "Update a release";
        # the token cannot hold `workflows`). develop diverged from main in workflows from
        # 2026-09-29 21:13 on and the rolling publish failed intermittently with
        # "Resource not accessible by integration" (10 of 27 attempts; Android stuck ~3 h).
        # The rolling tag already exists, so target_commitish never moves it; the develop
        # sha stays in the release name/body. Beta/formal keep github.sha.
        target_commitish: ${{ steps.channel.outputs.rolling_debug == 'true' && github.event.repository.default_branch || github.sha }}
        name: ${{ steps.channel.outputs.name }}
        body: ${{ steps.channel.outputs.body }}
        prerelease: ${{ steps.channel.outputs.prerelease }}
        make_latest: ${{ steps.channel.outputs.make_latest }}
        files: ${{ steps.channel.outputs.files }}

    # TODO-1049 (supersedes TODO-967): the debug channel now publishes to ONE
    # fixed rolling release (`debug-rolling`), so no new per-push
    # v<version>-debug.<seq>+<sha> prereleases are ever created. This step
    # garbage-collects the LEGACY versioned debug prereleases the old scheme
    # accumulated (and any that a stale/manual run might create), leaving the
    # Releases list with a single rolling debug entry alongside the formal/beta
    # ones. Runs ONLY on the automated push debug path -- never on
    # workflow_dispatch nor on release events -- and ONLY in this one workflow so
    # it cannot race release-desktop.yml (which publishes the SAME rolling tag).
    # HARD SAFETY, two independent filters before any delete: (1) isPrerelease
    # must be true AND isLatest must be false (never touch a formal or Latest
    # release), and (2) the tag must match ^v.*-debug\.[0-9]+\+ (the legacy
    # versioned debug tag shape) -- which the rolling tag `debug-rolling` does
    # NOT match, so the rolling release is never deleted. A release failing
    # either filter is left untouched.
    - name: Prune legacy versioned debug prereleases
      if: github.event_name == 'push' && steps.channel.outputs.channel == 'debug'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # List every release with the fields needed for the double filter.
        # --json keeps this robust against output format changes; jq does the
        # prerelease + regex filtering, never a loose grep.
        mapfile -t STALE < <(
          gh release list --repo "$REPO" --limit 1000 \
            --json tagName,isPrerelease,isLatest \
            --jq '
              .[]
              | select(.isPrerelease == true and .isLatest == false)
              | select(.tagName | test("^v.*-debug\\.[0-9]+\\+"))
              | .tagName
            '
        )
        if [ "${#STALE[@]}" -eq 0 ]; then
          echo "No legacy versioned debug prereleases to delete."
          exit 0
        fi
        echo "Deleting ${#STALE[@]} legacy versioned debug prerelease(s):"
        for tag in "${STALE[@]}"; do
          [ -n "$tag" ] || continue
          # Defence in depth: re-assert the legacy debug tag shape per tag so a
          # malformed jq result can never delete a non-debug or the rolling tag.
          if [[ ! "$tag" =~ ^v.*-debug\.[0-9]+\+ ]]; then
            echo "::warning title=Skipping non-legacy-debug tag::Refusing to delete '$tag' (does not match legacy versioned debug tag pattern)"
            continue
          fi
          echo "  deleting $tag"
          gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
        done

    # TODO-705: publish a mirror update manifest so beta/debug in-China update
    # checks succeed (raw.githubusercontent.com is proxiable; api.github.com
    # /releases is mirror-403'd, BUG-292). This pushes a DATA FILE to the
    # update-manifest branch -- it is NOT a GitHub Release: it never sets
    # make_latest / prerelease:false, reuses the channel outputs verbatim, uses
    # the shared release_sequence (never run_number), and update-manifest is
    # absent from this workflow's push trigger (main/develop only) so it does
    # not cascade a run.
    - name: Publish mirror update manifest (Android assets)
      # BUG-869: gate on publish_manifest (decoupled from publish_managed_release)
      # and use manifest_channel so the `release` event emits latest-stable.json
      # without re-touching the manually-created Release.
      if: steps.channel.outputs.publish_manifest == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        CHANNEL: ${{ steps.channel.outputs.manifest_channel }}
        TAG: ${{ steps.channel.outputs.tag }}
        # TODO-1049: manifest `tag` keeps the versioned/seq TAG for client
        # version comparison; asset URLs resolve under DOWNLOAD_TAG (the actual
        # release tag -- `debug-rolling` for debug, else identical to TAG).
        DOWNLOAD_TAG: ${{ steps.channel.outputs.publish_tag }}
        PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        NOTES: ${{ steps.channel.outputs.body }}
        VERSION: ${{ steps.channel.outputs.build_version_name }}
        RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
        ARTIFACTS_DIR: fushi/build/release-artifacts
        ASSET_GLOB: fushi-*.apk
        PLATFORM_LABEL: android
      run: bash tool/publish_update_manifest.sh

    # 反馈发布回填：清单落地 = 这一版 Android 包已对用户可见，把「本构建包含其修复」的
    # 反馈记上 <channel>.android = 本版本（按 git 祖先关系判定，见脚本头注释）。
    # 绝不能让发布变红：步骤 continue-on-error，脚本内部失败也只打 ::warning。
    # 守卫：fushi/test/build/feedback_workflow_guard_test.dart。
    - name: Backfill feedback fix releases (Android)
      if: steps.channel.outputs.publish_manifest == 'true'
      continue-on-error: true
      shell: bash
      env:
        FEEDBACK_CI_TOKEN: ${{ secrets.FEEDBACK_CI_TOKEN }}
        FEEDBACK_API_BASE: ${{ vars.FEEDBACK_API_BASE }}
        CHANNEL: ${{ steps.channel.outputs.manifest_channel }}
        PLATFORM: android
        VERSION: ${{ steps.channel.outputs.build_version_name }}
        HEAD_SHA: ${{ github.sha }}
      run: bash tool/feedback_mark_released.sh

    # 正式版发布成功后自动把 main 同步成 develop（2026-09-08 用户要求）。
    #
    # main 只有两种来源的提交：从 develop 合过来的（历史上是人工 `Merge develop into main
    # for X.Y.Z`），以及两条图表 workflow 的机器人提交（dev-activity.yml / star-history.yml
    # 是 scheduled，只能跑在默认分支 main 上，SVG 因此只落在 main）。所以 main 永远不是
    # develop 的祖先、纯快进永远失败，这里沿用人工时代的合并：`git merge --no-ff -X theirs`——
    # 图表 SVG 两边都改过就取 develop 的（第二天定时任务会重新生成），除此之外 main 不该有
    # develop 没有的东西。-X theirs 解不了的冲突（modify/delete）直接红，让人来看，绝不
    # force-push。GITHUB_TOKEN 的 push 不级联触发 main 的 push 构建，也不会因此多发一版。
    #
    # 只在本 workflow 做（release-desktop.yml 不做）：两条正式版 workflow 现在并行，各推一次
    # 就是两条合并提交。排在清单发布之后：清单落地 = 这一版的 Android 资产已上传完，此时
    # 同步 main 才是「发布成功后」。用 GITHUB_WORKSPACE 当 --reference 借对象，不重新拉全库；
    # 不在工作树里直接 checkout main：烘密钥那步改过已入库的占位文件，切分支会被挡。
    # 守卫：fushi/test/build/release_workflow_main_sync_guard_test.dart。
    - name: Sync main to develop after formal release
      if: steps.channel.outputs.manifest_channel == 'formal'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ steps.channel.outputs.tag }}
      run: |
        set -euo pipefail
        WORK="$(mktemp -d)"
        REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
        git clone -q --no-tags --reference "$GITHUB_WORKSPACE" --branch main "$REMOTE" "$WORK"
        git -C "$WORK" config user.name 'github-actions[bot]'
        git -C "$WORK" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        for attempt in 1 2 3; do
          git -C "$WORK" fetch -q --no-tags origin +refs/heads/develop:refs/remotes/origin/develop +refs/heads/main:refs/remotes/origin/main
          git -C "$WORK" checkout -q -B main origin/main
          DEVELOP="$(git -C "$WORK" rev-parse --short origin/develop)"
          if git -C "$WORK" merge-base --is-ancestor origin/develop HEAD; then
            echo "main already contains develop ($DEVELOP); nothing to sync."
            exit 0
          fi
          if ! git -C "$WORK" merge --no-ff -X theirs -m "Merge develop into main for ${RELEASE_TAG} (formal release)" origin/develop; then
            git -C "$WORK" merge --abort || true
            echo "::error title=main sync failed::develop 合不进 main（-X theirs 解不了的冲突）。main 上不该有 develop 没有的实质改动，请人工合并。"
            exit 1
          fi
          if git -C "$WORK" push -q origin HEAD:refs/heads/main; then
            echo "main -> $(git -C "$WORK" rev-parse --short HEAD) (develop $DEVELOP, attempt $attempt)"
            exit 0
          fi
          echo "push rejected (attempt $attempt); main moved underneath us, re-fetching and re-merging..."
          git -C "$WORK" reset -q --hard
          sleep "$attempt"
        done
        echo "::error title=main sync failed::推 main 三次都被拒（有人同时在推 main）。请人工把 develop 合进 main。"
        exit 1

  # 网页内容核心（native/fushi_web_core）Linux .so：packages/fushi_web_core 把原生库当硬依赖
  # （没有「缺库判不可用」的分支，测试找不到库就失败、不 skip），所以 fushi/ 与 packages/ 的
  # 单测 job 都要它。只编一次、以 workflow artifact 交给下游（artifact 不占 Actions 缓存配额）。
  web-core-linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/fushi-web-core-linux
    - uses: actions/upload-artifact@v7
      with:
        name: fushi-web-core-linux-x64
        path: native/fushi_web_core/prebuilt/linux-x64/libfushi_web_core.so
        if-no-files-found: error
        retention-days: 3

  # 测试矩阵的另几个 Rust 硬依赖（fushi_fsrs / fushi_compute / fushi_rwkv）同理只编一次、与
  # web-core-linux 并行，以 artifact 交给五份矩阵（原来每份各编一遍，约 2 分钟压在每份的关键路径上）。
  test-native-linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/test-native-linux
    - uses: actions/upload-artifact@v7
      with:
        name: fushi-test-native-linux-x64
        path: |
          native/fushi_fsrs/prebuilt/linux-x64/libfushi_fsrs.so
          native/fushi_compute/prebuilt/linux-x64/libfushi_compute.so
          native/fushi_rwkv/prebuilt/linux-x64/libfushi_rwkv.so
          native/fushi_music/prebuilt/linux-x64/libfushi_music.so
          native/fushi_corpus/prebuilt/linux-x64/libfushi_corpus.so
        if-no-files-found: error
        retention-days: 3

  # 词典引擎（native/fushidicts）Linux .so：packages/fushi_dictionary 的真原生库测试
  # （background_tokenize_native_test.dart 的后台查词 / redirect 标记迁移两组）缺库直接失败、
  # 不 skip，所以 tests (checks) 的包测试要它。与 web-core-linux 并行编一次、以 artifact 下发。
  fushidicts-linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/fushidicts-linux
    - uses: actions/upload-artifact@v7
      with:
        name: fushidicts-linux-x64
        path: native/fushidicts/prebuilt/linux-x64/libfushidicts_ffi.so
        if-no-files-found: error
        retention-days: 3

  # TODO-fast-release: the analyze/unit/package suites that used to run as
  # sequential steps at the top of the `build` job (gating `flutter build apk`)
  # now live here as an INDEPENDENT job. It shares the same trigger as `build`
  # but has NO `needs:` relationship, so it runs in parallel and never delays or
  # blocks the debug-channel APK. A failure still marks the whole workflow run
  # red (signal preserved on every push, including direct develop pushes that
  # bypass main.yml's PR gate). The job-level `if` keeps the workflow_dispatch
  # skip_tests fast-release path: a manual dispatch with skip_tests:true skips
  # this entire job. Setup mirrors `build` minus the Android/Gradle/keystore bits
  # tests don't need (analyze + Dart-VM unit tests link no native/Android
  # toolchain). Only google_oauth_secret.dart is gitignored and must be stubbed
  # or `flutter analyze` fails to compile google_drive_auth.dart; the
  # log_upload/dandanplay placeholders are committed, so their stubs are needed
  # only to bake real secrets when present (kept here for parity with `build`).
  tests:
    # BUG-2817：`release` 事件只给应用 release（tag = v<数字>…）构建；模型 / 依赖资产
    # release（manga-panel-detector-onnx-v1、vendor-libmpv、voice-hook-helper…）被手动
    # 发布时不许整套构建、把安装包挂到它们身上。表达式没有正则，只能逐个列 v0..v9；
    # 守卫 fushi/test/build/release_event_app_tag_guard_test.dart 钉住每个 job 都带它。
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    runs-on: ubuntu-latest
    # 2026-09-12：60 → 90。全量套件（25k+ 条）实测 57~58 分钟跑完，60 分钟上限只剩
    # 2 分钟余量，合入 #1438/#1430② 多几条测试后连续四次 60 分钟整点被 cancel——
    # 表现与「某条测试挂死」一模一样，但同 run 的 build job（上限 90）14 分钟就绿。
    # 这里跟 build 对齐；真正的出路是给 tool/flutter_test_failures.dart 加
    # --shard-index/--shard-total 再上 matrix 并行（TODO），不是继续抬上限。
    # 2026-09-30：已按文件分片（--file-shard，原理见 main.yml 的 unit-tests 注释）。
    # 矩阵 5 份：4 片主应用单测 + checks（analyze + 包测试），各自独立 runner 并行；
    # 分片数改 matrix 和 --file-shard 分母两处。
    # 2026-10-21：--experimental-faster-testing 试过又撤回（随机 SIGSEGV，见 main.yml 的
    # unit-tests 注释）；分片仍按实测 suite 耗时均衡，Rust 测试库由 test-native-linux 只编一次。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ['0', '1', '2', '3', checks]
    name: tests (${{ matrix.part }})
    needs: [web-core-linux, test-native-linux, fushidicts-linux]
    env:
      FUSHI_WEB_CORE_LIB: ${{ github.workspace }}/native/fushi_web_core/prebuilt/linux-x64/libfushi_web_core.so
      FUSHI_FSRS_LIB: ${{ github.workspace }}/native/fushi_fsrs/prebuilt/linux-x64/libfushi_fsrs.so
      FUSHI_COMPUTE_LIB: ${{ github.workspace }}/native/fushi_compute/prebuilt/linux-x64/libfushi_compute.so
      FUSHI_RWKV_LIB: ${{ github.workspace }}/native/fushi_rwkv/prebuilt/linux-x64/libfushi_rwkv.so
      FUSHI_MUSIC_LIB: ${{ github.workspace }}/native/fushi_music/prebuilt/linux-x64/libfushi_music.so
      FUSHI_CORPUS_LIB: ${{ github.workspace }}/native/fushi_corpus/prebuilt/linux-x64/libfushi_corpus.so
    steps:
    - uses: actions/checkout@v6

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.6'
        cache: true
    # pdfium_dart's build hook downloads PDFium from GitHub on every fresh
    # runner; restore it so a release-asset hiccup cannot fail the build.
    - uses: ./.github/actions/pdfium-hook-cache
      with:
        purpose: test

    # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
    # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
    # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
    - name: Provide baked-in secret stubs
      uses: ./.github/actions/provide-baked-secrets
      with:
        google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
        log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
        dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
        dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
        tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
        opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
        acoustid-api-key: ${{ secrets.ACOUSTID_API_KEY }}
    - name: Flutter pub get
      working-directory: fushi
      run: flutter pub get

    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh

    - name: Fetch fushi_web_core linux-x64 library (hard dependency of the unit tests)
      uses: actions/download-artifact@v7
      with:
        name: fushi-web-core-linux-x64
        path: native/fushi_web_core/prebuilt/linux-x64
    - name: Fetch fushidicts linux-x64 library (hard dependency of the package tests)
      if: matrix.part == 'checks'
      uses: actions/download-artifact@v7
      with:
        name: fushidicts-linux-x64
        path: native/fushidicts/prebuilt/linux-x64

    - name: Run dart analyze
      if: matrix.part == 'checks'
      working-directory: fushi
      run: flutter analyze

    # Anki 搜索的逐卡求值与 AnkiConnect 查重规范形只有 Rust 实现（native/fushi_fsrs/src/search.rs），
    # 计算内核 fushi_compute 与 RWKV-Instant 排程推理 fushi_rwkv 是硬依赖：单测（flutter_tester）与
    # 包测试（fushi_srs / fushi_compute / fushi_engine）都要真实 .so，库缺失时直接判红（不 skip）。
    # 由 test-native-linux 编好，五份矩阵只下载（路径与 job 级 FUSHI_FSRS_LIB / FUSHI_COMPUTE_LIB /
    # FUSHI_RWKV_LIB 对应）。
    - name: Fetch fushi_fsrs + fushi_compute + fushi_rwkv linux-x64 libraries (hard dependencies of the tests)
      uses: actions/download-artifact@v7
      with:
        name: fushi-test-native-linux-x64
        path: native

    - name: Run unit tests (main app, file shard ${{ matrix.part }}/4)
      if: matrix.part != 'checks'
      working-directory: fushi
      # faster-testing 的三个参数与原因见 main.yml 同名步骤。
      run: dart run tool/flutter_test_failures.dart --file-shard=${{ matrix.part }}/4 --exclude-tags golden --experimental-faster-testing --concurrency=1 --max-suites-per-run=400

    # 逐 suite 耗时（tool/update_suite_timings.dart 的输入），见 main.yml 同名步骤。
    - name: Upload test event log
      if: always() && matrix.part != 'checks'
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-events-${{ matrix.part }}
        path: .codex-test/flutter-test/flutter_test.jsonl
        if-no-files-found: warn
        retention-days: 14

    # packages/fushi_rwkv 的端到端测试要真权重（缺了判红、不 skip），与 main.yml 同名两步一致：
    # 只读 native-rwkv-gate 写的同一个缓存条目（key 是两个钉死的 SHA-256，与 fetch_model.sh
    # 一致），未命中时 fetch_model.sh 按钉死 URL 下载并校验（~16 MB）。
    - name: Restore RWKV weights cache
      if: matrix.part == 'checks'
      uses: actions/cache/restore@v4
      with:
        path: native/fushi_rwkv/model
        key: fushi-rwkv-model-749ad1ad18d5b6ef8c4185802fa0c1e4a14e67cd7874f3efeaae355fffb1b9ec-7b1790f49fdabf1279510247cc9bc3bf3ac461b67cf0135ab8e51589b5efe71a
    - name: Fetch RWKV weights (pinned URL, SHA-256 checked)
      if: matrix.part == 'checks'
      run: bash native/fushi_rwkv/fetch_model.sh

    - name: Run package tests
      if: matrix.part == 'checks'
      env:
        FUSHI_DICTS_LIB: ${{ github.workspace }}/native/fushidicts/prebuilt/linux-x64/libfushidicts_ffi.so
      run: |
        # 扫描面按磁盘枚举，不写死包清单：这里是 packages/*/test 的**唯一** runner，
        # 上一版把五个包名写成字面量，于是任何新加的自有包连同它的测试在 CI 里
        # 一次都不会跑，而且表现为绿。排除项只有两类，都有明确归属：
        #   * vendored / fork / stub —— 上游产物，不归本仓测；
        #   * fushi_torrent —— 测试要 dlopen 真 DLL，Linux 上整组 skip，由
        #     build-multiplatform.yml 里那个带 FUSHI_TORRENT_LIB 的 job 专门跑。
        skip="flutter_inappwebview_windows gamepads_windows gamepads_android_stub fushi_torrent"
        ran=0
        for pkg in packages/*/; do
          name=$(basename "$pkg")
          case " $skip " in
            *" $name "*) echo "::notice title=Skipped package::$name（vendored 或有专用 job）"; continue;;
          esac
          if [ -d "$pkg/test" ]; then
            echo "::group::Testing $name"
            (cd "$pkg" && dart ../../fushi/tool/flutter_test_failures.dart --output-dir=../../.codex-test/flutter-test/$name)
            echo "::endgroup::"
            ran=$((ran + 1))
          else
            echo "::warning title=No package tests::$name has no test/ dir — its code is only covered transitively by the main-app suite"
          fi
        done
        # 规模哨兵：枚举写错或 packages/ 布局变动会让循环一个包都不跑，而「零个包跑过」
        # 与「所有包都绿」在退出码上完全一样。实测 4 个（core/anki/audio/platform）。
        if [ "$ran" -lt 3 ]; then
          echo "::error title=Package test enumeration collapsed::只跑了 $ran 个包的测试，实测应有 4 个。去修枚举逻辑，不要调低这个下界。"
          exit 1
        fi
