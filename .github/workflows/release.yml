name: Build Release APK

on:
  # TODO-1208: docs-only / repo-chore pushes (docs/**, *.md, board files) should
  # not fire the full ~49m release build. Scope the PUSH trigger to build-relevant
  # paths. The `release` and `workflow_dispatch` triggers below are intentionally
  # left UNfiltered so manual beta/formal publishes always run regardless of what
  # changed. A version bump lives in hibiki/pubspec.yaml (under hibiki/**) so it
  # still triggers; the rolling debug seq = commit count, so skipping a seq on a
  # docs-only push is harmless.
  push:
    branches: ['main', 'develop']
    paths:
      - 'hibiki/**'
      - 'packages/**'
      - 'ci/**'
      - 'tool/**'
      - 'third_party/**'
      - '.github/workflows/**'
      - 'melos.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel: debug, beta, or formal'
        required: true
        default: beta
        type: choice
        options:
          - debug
          - beta
          - formal
      tag_name:
        description: 'Optional release tag. Defaults to v<version>-debug.<seq>+<sha>, v<version>-beta.<seq>, or v<version>.'
        required: false
      release_name:
        description: 'Optional GitHub Release title.'
        required: false
      skip_tests:
        description: 'Fast build: skip the analyze/unit/package test suites and go straight to compile+publish. Only honored on workflow_dispatch (push-triggered debug builds always run the tests).'
        required: false
        default: true
        type: boolean

concurrency:
  group: hibiki-release-${{ github.event.release.tag_name || github.event.inputs.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate unified release policy
      shell: pwsh
      run: ./tool/check_release_policy.ps1

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        cache: true

    - name: Resolve Android release channel
      id: channel
      working-directory: hibiki
      shell: bash
      env:
        INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        set -euo pipefail
        PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
        VERSION="${PUBSPEC_VERSION%%+*}"
        PUBSPEC_BUILD="${PUBSPEC_VERSION#*+}"
        if [ "$PUBSPEC_BUILD" = "$PUBSPEC_VERSION" ]; then
          PUBSPEC_BUILD=1
        fi
        if ! [[ "$PUBSPEC_BUILD" =~ ^[0-9]+$ ]]; then
          echo "::error title=Invalid pubspec build number::Expected numeric +build in $PUBSPEC_VERSION"
          exit 1
        fi
        RELEASE_SEQUENCE=$(git rev-list --count HEAD)
        if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
          echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
          exit 1
        fi
        # TODO-414: Android versionCode = build.gradle's versionCodeBase (1e9, a
        # one-time migration floor above every historically-shipped versionCode)
        # + 100 * RELEASE_SEQUENCE + ABI offset. The build number passed here is
        # JUST the monotonic commit count, NOT PUBSPEC_BUILD * 1e6 + seq: the
        # old *1e6 formula produced versionCode ~6.6e9, which overflows int32 and
        # exceeds Android's 2.1e9 ceiling, so beta/release Android packages could
        # not be built at all. PUBSPEC_BUILD stays parsed for logging only.
        echo "PUBSPEC_BUILD (log only, not in versionCode): $PUBSPEC_BUILD"
        ANDROID_BUILD_NUMBER=$RELEASE_SEQUENCE
        SHORT_SHA="${GITHUB_SHA::7}"
        EVENT="${GITHUB_EVENT_NAME}"
        CHANNEL="${INPUT_CHANNEL:-}"
        TAG="${INPUT_TAG_NAME:-}"
        NAME="${INPUT_RELEASE_NAME:-}"
        BODY=""
        PRERELEASE=true
        MAKE_LATEST=false
        FILES="hibiki/build/release-artifacts/*-debug.apk"
        BUILD_DEBUG_APK=true
        BUILD_DEBUG_CHANNEL_APK=false
        BUILD_SPLIT_RELEASE_APK=false
        NEEDS_RELEASE_KEYSTORE=false
        PUBLISH_MANAGED_RELEASE=false
        # BUG-869: manifest-only publish flag, decoupled from
        # PUBLISH_MANAGED_RELEASE so the `release` event can emit
        # latest-stable.json WITHOUT re-running the softprops managed-release
        # create/upsert (which would touch the user's manually-created Release).
        # MANIFEST_CHANNEL is the channel handed to publish_update_manifest.sh
        # (debug|beta|formal) that decides the latest-<channel>.json filename.
        PUBLISH_MANIFEST=false
        MANIFEST_CHANNEL=""

        case "$EVENT" in
          push)
            CHANNEL=debug
            TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
            NAME="${NAME:-Hibiki debug ${VERSION} (${SHORT_SHA})}"
            BODY="Automated release-signed debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
            BUILD_DEBUG_APK=false
            BUILD_DEBUG_CHANNEL_APK=true
            NEEDS_RELEASE_KEYSTORE=true
            PUBLISH_MANAGED_RELEASE=true
            ;;
          workflow_dispatch)
            case "$CHANNEL" in
              debug)
                TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                NAME="${NAME:-Hibiki debug ${VERSION} (${SHORT_SHA})}"
                BODY="Manual release-signed debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                BUILD_DEBUG_APK=false
                BUILD_DEBUG_CHANNEL_APK=true
                NEEDS_RELEASE_KEYSTORE=true
                ;;
              beta)
                TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                NAME="${NAME:-Hibiki ${VERSION} beta ${RELEASE_SEQUENCE}}"
                BODY="Manual beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                FILES="hibiki/build/release-artifacts/hibiki-*.apk"
                BUILD_DEBUG_APK=false
                BUILD_SPLIT_RELEASE_APK=true
                NEEDS_RELEASE_KEYSTORE=true
                ;;
              formal)
                TAG="${TAG:-v${VERSION}}"
                NAME="${NAME:-Hibiki ${VERSION}}"
                BODY="Manual formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                PRERELEASE=false
                MAKE_LATEST=true
                FILES="hibiki/build/release-artifacts/hibiki-*.apk"
                BUILD_DEBUG_APK=false
                BUILD_SPLIT_RELEASE_APK=true
                NEEDS_RELEASE_KEYSTORE=true
                ;;
              *)
                echo "::error title=Invalid release channel::Use debug, beta, or formal."
                exit 1
                ;;
            esac
            PUBLISH_MANAGED_RELEASE=true
            ;;
          release)
            CHANNEL=github-release
            TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
            FILES="hibiki/build/release-artifacts/hibiki-*.apk"
            BUILD_SPLIT_RELEASE_APK=true
            NEEDS_RELEASE_KEYSTORE=true
            # BUG-869: a manually-published, NON-prerelease GitHub Release IS the
            # formal stable release. Emit latest-stable.json (with releaseSequence)
            # so in-China stable clients can read the seq for "谁后用谁" comparison.
            # This writes ONLY the data-file manifest; it never creates/modifies
            # the Release (PUBLISH_MANAGED_RELEASE stays false). A manual PRERELEASE
            # (beta via the UI) is left alone so it can never pollute stable.
            if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
              MANIFEST_CHANNEL=formal
              PUBLISH_MANIFEST=true
              PRERELEASE=false
            fi
            ;;
          *)
            echo "::error title=Unsupported event::$EVENT is not a release channel event."
            exit 1
            ;;
        esac

        # BUG-869: push / workflow_dispatch keep existing behavior — MANIFEST_CHANNEL
        # follows CHANNEL (debug|beta|formal) and the manifest publishes whenever the
        # managed release does. Only the `release` event opts in above independently.
        if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
        if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

        BUILD_VERSION_NAME="${TAG#v}"
        BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
        case "$CHANNEL" in
          debug)
            if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
              echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
              exit 1
            fi
            ;;
          beta)
            if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
              echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
              exit 1
            fi
            ;;
          formal)
            if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error title=Invalid formal tag::Use v<version>."
              exit 1
            fi
            ;;
        esac

        # TODO-1049: the debug channel publishes to ONE fixed rolling GitHub
        # Release tag (`debug-rolling`) instead of a new v<version>-debug.<seq>
        # tag per push, so debug builds stop piling up prereleases that bury the
        # formal/beta entries in the Releases list. PUBLISH_TAG is the git tag
        # the GitHub Release actually uses; TAG stays the versioned/seq tag that
        # the client compares (manifest `tag` field) and that names the APK.
        # beta/formal are unchanged: their release IS the version tag.
        ROLLING_DEBUG_TAG=debug-rolling
        if [ "$CHANNEL" = debug ]; then
          PUBLISH_TAG="$ROLLING_DEBUG_TAG"
          ROLLING_DEBUG=true
        else
          PUBLISH_TAG="$TAG"
          ROLLING_DEBUG=false
        fi

        {
          echo "channel=$CHANNEL"
          echo "tag=$TAG"
          echo "publish_tag=$PUBLISH_TAG"
          echo "rolling_debug=$ROLLING_DEBUG"
          echo "name=$NAME"
          echo "prerelease=$PRERELEASE"
          echo "make_latest=$MAKE_LATEST"
          echo "build_debug_apk=$BUILD_DEBUG_APK"
          echo "build_debug_channel_apk=$BUILD_DEBUG_CHANNEL_APK"
          echo "build_split_release_apk=$BUILD_SPLIT_RELEASE_APK"
          echo "needs_release_keystore=$NEEDS_RELEASE_KEYSTORE"
          echo "build_version_name=$BUILD_VERSION_NAME"
          echo "android_build_number=$ANDROID_BUILD_NUMBER"
          echo "release_sequence=$RELEASE_SEQUENCE"
          echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
          echo "publish_manifest=$PUBLISH_MANIFEST"
          echo "manifest_channel=$MANIFEST_CHANNEL"
          echo "files=$FILES"
          echo "body<<EOF"
          echo "$BODY"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Decode keystore
      if: steps.channel.outputs.needs_release_keystore == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > hibiki/android/hibiki-release.jks

    - name: Create key.properties
      if: steps.channel.outputs.needs_release_keystore == 'true'
      working-directory: hibiki/android
      run: |
        cat > key.properties <<EOF
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=hibiki-release.jks
        EOF

    - name: Remove local proxy from gradle.properties
      working-directory: hibiki/android
      run: |
        sed -i '/systemProp\.http\.proxyHost/d' gradle.properties
        sed -i '/systemProp\.http\.proxyPort/d' gradle.properties
        sed -i '/systemProp\.https\.proxyHost/d' gradle.properties
        sed -i '/systemProp\.https\.proxyPort/d' gradle.properties
        sed -i '/systemProp\.http\.nonProxyHosts/d' gradle.properties

    # google_oauth_secret.dart is gitignored (the real client secret lives only
    # on dev hosts); CI lacks it, so google_drive_auth.dart's import fails
    # `flutter analyze`. When the GOOGLE_OAUTH_CLIENT_SECRET repo secret is set,
    # bake the REAL value in so release/CI builds can actually sign in to Google
    # Drive (otherwise desktop sign-in hits invalid_client 401, TODO-045). When
    # it is not set, fall back to the committed example (placeholder value, no
    # GOCSPX- prefix, so the no_hardcoded_google_secret guard stays green).
    - name: Provide gitignored Google OAuth secret stub
      shell: bash
      env:
        GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      run: |
        dst=hibiki/lib/src/sync/google_oauth_secret.dart
        if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
          oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
          printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
            "$oauth_secret_literal" \
            > "$dst"
        elif [ ! -f "$dst" ]; then
          cp hibiki/lib/src/sync/google_oauth_secret.example.dart "$dst"
        fi
    # log_upload_secret.dart ships a committed empty placeholder (endpoint = '')
    # so a fresh clone compiles and the log-upload button stays hidden (it is
    # gated by a non-empty endpoint, not by platform - see log_upload_config
    # showUploadLogAction). When the LOG_UPLOAD_ENDPOINT / LOG_UPLOAD_TOKEN repo
    # secrets are set, bake the real values in so CI/release builds (incl.
    # Windows) actually show and can use the "upload log to cloud" button
    # (TODO-385). When unset, leave the committed empty placeholder so the
    # button stays hidden and no endpoint is exposed.
    - name: Provide gitignored log upload secret stub
      shell: bash
      env:
        LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
        LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
      run: |
        dst=hibiki/lib/src/utils/misc/log_upload_secret.dart
        if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
          log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
          log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
          printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
            "$log_endpoint_literal" \
            "$log_token_literal" \
            > "$dst"
        elif [ ! -f "$dst" ]; then
          cp hibiki/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
        fi
    # dandanplay_secret.dart ships a committed empty placeholder (AppId/AppSecret
    # = '') so a fresh clone compiles and online danmaku degrades to unsigned.
    # When the DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET repo secrets are set, bake
    # the real values in so release builds sign dandanplay open-API requests and
    # online danmaku works out of the box (no manual API entry).
    - name: Provide gitignored dandanplay secret stub
      shell: bash
      env:
        DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
        DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
      run: |
        dst=hibiki/lib/src/media/video/dandanplay_secret.dart
        if [ -n "$DANDANPLAY_APP_ID" ]; then
          printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
            "$DANDANPLAY_APP_ID" \
            "$DANDANPLAY_APP_SECRET" \
            > "$dst"
        elif [ ! -f "$dst" ]; then
          cp hibiki/lib/src/media/video/dandanplay_secret.example.dart "$dst"
        fi

    # TODO-2721: 只缓存 Gradle 的下载物（modules-2 / wrapper dists），不缓存
    # <ver>/transforms 这类可从 modules-2 重算的派生产物。三个 workflow
    # （main / release / build-multiplatform）的 path + key 必须逐字相同，且此步
    # 之前不得 sed 改 build.gradle / settings.gradle —— 否则同一份内容会被存成
    # 两条各 2.7 GB 的缓存。理由见 docs/agent/build.md 的「CI 缓存配额」，守卫见
    # hibiki/test/build/workflow_cache_quota_guard_test.dart。
    - name: Cache Gradle caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/journal-1
          ~/.gradle/wrapper/dists
        key: ${{ runner.os }}-gradle-v2-${{ hashFiles('hibiki/android/**/*.gradle*', 'hibiki/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-v2-

    - name: Remove aliyun mirrors from gradle files
      working-directory: hibiki/android
      run: |
        sed -i "/maven.*aliyun/d" build.gradle
        sed -i "/maven.*aliyun/d" settings.gradle

    - name: Flutter pub get
      working-directory: hibiki
      run: flutter pub get

    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh

    # TODO-fast-release: analyze/unit/package tests no longer gate this build job.
    # They ran here as sequential steps BEFORE `flutter build apk`, so a slow or
    # red suite delayed (and could block) the debug-channel APK the user is
    # waiting on. They now live in the sibling `tests` job below, which runs in
    # PARALLEL off the same trigger and does NOT gate build/publish: the APK
    # compiles + publishes immediately, and a test failure still surfaces as a red
    # X on the `tests` job (continuous signal preserved on every push, including
    # direct develop pushes that skip the PR gate in main.yml). The desktop/EXE
    # workflow (release-desktop.yml) never ran tests, so nothing there changes.
    # The workflow_dispatch skip_tests input now governs whether the `tests` job
    # runs (see its job-level `if`), keeping the manual fast-release path intact.
    - name: Collect Android release build diagnostics
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      working-directory: hibiki
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Tool versions"
        pwd
        git rev-parse --short HEAD
        flutter --version
        dart --version
        java -version
        (cd android && timeout 120s ./gradlew --version --no-daemon) || true
        echo "::endgroup::"
        echo "::group::Pre-build output paths"
        ls -la build || true
        ls -la build/app || true
        ls -la build/app/outputs || true
        ls -la build/app/outputs/flutter-apk || true
        find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \; || true
        echo "::endgroup::"

    - name: Build debug APK
      if: steps.channel.outputs.build_debug_apk == 'true'
      working-directory: hibiki
      timeout-minutes: 20
      shell: bash
      run: |
        set -euo pipefail
        flutter --verbose build apk --debug \
          --build-name "${{ steps.channel.outputs.build_version_name }}" \
          --build-number "${{ steps.channel.outputs.android_build_number }}"

    - name: Prepare debug APK release asset
      if: steps.channel.outputs.build_debug_apk == 'true'
      working-directory: hibiki
      shell: bash
      run: |
        set -euo pipefail
        BUILD_VERSION_NAME="${{ steps.channel.outputs.build_version_name }}"
        SHORT_SHA="${GITHUB_SHA::7}"
        APK_DIR=build/app/outputs/flutter-apk
        OUT_DIR=build/release-artifacts
        DEBUG_APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*-debug.apk' | sort | head -n 1)
        if [ -z "$DEBUG_APK" ]; then
          echo "::error title=Debug APK missing::No *-debug.apk found in $APK_DIR"
          exit 1
        fi
        mkdir -p "$OUT_DIR"
        rm -f "$OUT_DIR"/hibiki-*.apk
        cp "$DEBUG_APK" "$OUT_DIR/hibiki-${BUILD_VERSION_NAME}-${SHORT_SHA}-debug.apk"

    - name: Build release-signed debug-channel APK
      if: steps.channel.outputs.build_debug_channel_apk == 'true'
      working-directory: hibiki
      timeout-minutes: 30
      shell: bash
      run: |
        set -euo pipefail
        flutter --verbose build apk --release --target-platform android-arm64 \
          --build-name "${{ steps.channel.outputs.build_version_name }}" \
          --build-number "${{ steps.channel.outputs.android_build_number }}"

    - name: Prepare release-signed debug-channel APK asset
      if: steps.channel.outputs.build_debug_channel_apk == 'true'
      working-directory: hibiki
      shell: bash
      run: |
        set -euo pipefail
        BUILD_VERSION_NAME="${{ steps.channel.outputs.build_version_name }}"
        SHORT_SHA="${GITHUB_SHA::7}"
        APK_DIR=build/app/outputs/flutter-apk
        OUT_DIR=build/release-artifacts
        DEBUG_CHANNEL_APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' ! -name '*-debug.apk' | sort | head -n 1)
        if [ -z "$DEBUG_CHANNEL_APK" ]; then
          echo "::error title=Debug channel APK missing::No release-signed APK found in $APK_DIR"
          exit 1
        fi
        mkdir -p "$OUT_DIR"
        rm -f "$OUT_DIR"/hibiki-*.apk
        cp "$DEBUG_CHANNEL_APK" "$OUT_DIR/hibiki-${BUILD_VERSION_NAME}-${SHORT_SHA}-debug.apk"

    - name: Build release APK (split per ABI)
      if: steps.channel.outputs.build_split_release_apk == 'true'
      working-directory: hibiki
      timeout-minutes: 60
      shell: bash
      run: |
        set -euo pipefail
        flutter --verbose build apk --split-per-abi --release \
          --build-name "${{ steps.channel.outputs.build_version_name }}" \
          --build-number "${{ steps.channel.outputs.android_build_number }}"

    - name: Collect Android post-build diagnostics
      if: ${{ always() && (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') }}
      working-directory: hibiki
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Post-build APK diagnostics"
        pwd
        find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \; || true
        find build/app/outputs -maxdepth 5 -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
        echo "::endgroup::"

    - name: Prepare release APK assets
      if: steps.channel.outputs.build_split_release_apk == 'true'
      working-directory: hibiki
      shell: bash
      run: |
        set -euo pipefail
        BUILD_VERSION_NAME="${{ steps.channel.outputs.build_version_name }}"
        APK_DIR=build/app/outputs/flutter-apk
        OUT_DIR=build/release-artifacts
        mkdir -p "$OUT_DIR"
        for f in "$APK_DIR"/app-*-release.apk; do
          ABI=$(basename "$f" | sed 's/^app-//;s/-release\.apk$//')
          cp "$f" "$OUT_DIR/hibiki-${BUILD_VERSION_NAME}-${ABI}.apk"
        done

    # TODO-866: the prepared APKs in build/release-artifacts/ are otherwise only
    # ever uploaded as GitHub Release assets (the softprops steps below). When
    # that release publish intermittently 403s ("Resource not accessible by
    # integration"), the APK is built successfully but has NO download path and
    # is destroyed with the runner. Capture it as a workflow-run artifact so the
    # build is always downloadable from the run page, decoupled from Release
    # publish. Pure additive capture: touches no tag/publish/Latest/formal
    # logic. always() + no channel gate so a successful build is downloadable
    # even if a later publish step 403s; if-no-files-found: ignore tolerates
    # channels/events that produced no APK.
    - name: Upload APK artifacts to workflow run
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: hibiki-${{ steps.channel.outputs.channel }}-apk-${{ github.sha }}
        path: hibiki/build/release-artifacts/*.apk
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload APKs to GitHub Release event
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.channel.outputs.tag }}
        files: |
          hibiki/build/release-artifacts/hibiki-*.apk

    # TODO-1049 / TODO-1123: the debug channel reuses ONE rolling GitHub Release
    # (tag `debug-rolling`). softprops upserts same-named assets but never
    # removes an asset from a PRIOR commit (different seq/sha in the name), so
    # without pruning the rolling release would accumulate one APK+EXE per commit.
    #
    # TODO-1123 root-cause narrowing of the pruned-asset 404 race: the OLD prune
    # kept ONLY the current build's seq, so a device that had just fetched the
    # PREVIOUS manifest (older seq) and then started downloading would 404 the
    # instant a newer push pruned that seq's APK. We now keep the most recent
    # KEEP_SEQS (=3: current + prior two) sequences, giving in-flight downloads a
    # grace window across a couple of pushes. The client also re-resolves the
    # manifest on a 404 and retries the fresh URL once (update_checker), so this
    # CI change is the "widen the window" half of a two-sided fix. Same-commit
    # Android+desktop share the seq, so they never prune each other. Skipped
    # unless this run is the rolling debug channel. Missing release / nothing to
    # prune is a no-op.
    - name: Prune stale assets from rolling debug release
      if: steps.channel.outputs.publish_managed_release == 'true' && steps.channel.outputs.rolling_debug == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PUBLISH_TAG: ${{ steps.channel.outputs.publish_tag }}
        BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
      run: |
        set -euo pipefail
        # Keep the most recent KEEP_SEQS debug sequences (current + prior 2) so a
        # client mid-download against a just-superseded seq is not 404'd.
        KEEP_SEQS=3
        if ! gh release view "$PUBLISH_TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Rolling release $PUBLISH_TAG does not exist yet; nothing to prune."
          exit 0
        fi
        mapfile -t ASSET_NAMES < <(
          gh release view "$PUBLISH_TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' || true
        )
        if [ "${#ASSET_NAMES[@]}" -eq 0 ]; then
          echo "No assets on $PUBLISH_TAG; nothing to prune."
          exit 0
        fi
        # TODO-1131: only ever prune THIS platform's own assets. The rolling
        # debug release is shared by Android/Windows/Apple, each publishing from
        # an independent workflow run. Computing the kept-seq set across ALL
        # platforms' assets means a lagging platform (slower or transiently
        # failed build) has its last-good asset's seq pushed out of the top
        # KEEP_SEQS by the OTHER platforms' newer seqs -- so another platform's
        # prune deletes it and the rolling release "loses" that device. Scope the
        # candidate set to this platform's filename shape (Android: *.apk) so each
        # platform keeps its own top KEEP_SEQS and never touches another's assets.
        PLATFORM_ASSETS=()
        for name in "${ASSET_NAMES[@]}"; do
          case "$name" in
            *.apk) PLATFORM_ASSETS+=("$name") ;;
          esac
        done
        # Check length BEFORE re-expanding the (possibly empty) array: on macOS
        # bash 3.2 `("${empty[@]}")` under `set -u` is an unbound-variable error,
        # and no-asset-for-this-platform is exactly the lagging / first-publish
        # case this fix must handle gracefully. `${#arr[@]}` is safe on 3.2.
        if [ "${#PLATFORM_ASSETS[@]}" -eq 0 ]; then
          echo "No Android assets on $PUBLISH_TAG; nothing to prune."
          exit 0
        fi
        ASSET_NAMES=("${PLATFORM_ASSETS[@]}")
        # Asset names embed the versionName token `-<base>-debug.<seq>-` (e.g.
        # hibiki-0.11.1-debug.5633-3cf5905-debug.apk). Parse the current build's
        # seq from BUILD_VERSION_NAME (0.11.1-debug.5633), extract every asset's
        # seq the same way, keep the top KEEP_SEQS distinct seqs (numeric desc),
        # and delete only assets whose seq is NOT in that set. Assets with no
        # parseable debug seq are treated as stale (superseded/legacy naming).
        seq_of() { printf '%s' "$1" | sed -n 's/.*-debug\.\([0-9]\+\).*/\1/p'; }
        CURRENT_SEQ="$(seq_of "$BUILD_VERSION_NAME")"
        {
          # TODO-1129: terminal-position `[ -n "$X" ] && echo` inside a pipefail
          # brace-group returns 1 when the test is false (empty seq), which
          # pipefail propagates and set -e kills the step silently. Use no-else
          # `if` so a false test yields exit 0.
          if [ -n "$CURRENT_SEQ" ]; then echo "$CURRENT_SEQ"; fi
          for name in "${ASSET_NAMES[@]}"; do
            s="$(seq_of "$name")"
            if [ -n "$s" ]; then echo "$s"; fi
          done
        } | sort -rn -u > /tmp/all_seqs.txt
        mapfile -t KEEP_SEQ_LIST < <(head -n "$KEEP_SEQS" /tmp/all_seqs.txt)
        echo "Keeping debug seqs: ${KEEP_SEQ_LIST[*]:-<none>}"
        in_keep() {
          local target="$1"
          for k in "${KEEP_SEQ_LIST[@]}"; do
            [ "$k" = "$target" ] && return 0
          done
          return 1
        }
        STALE=()
        for name in "${ASSET_NAMES[@]}"; do
          [ -n "$name" ] || continue
          s="$(seq_of "$name")"
          if [ -z "$s" ] || ! in_keep "$s"; then
            STALE+=("$name")
          fi
        done
        if [ "${#STALE[@]}" -eq 0 ]; then
          echo "No stale assets on $PUBLISH_TAG (all within kept seqs)."
          exit 0
        fi
        for asset in "${STALE[@]}"; do
          [ -n "$asset" ] || continue
          echo "  deleting stale asset $asset from $PUBLISH_TAG"
          gh release delete-asset "$PUBLISH_TAG" "$asset" --repo "$REPO" --yes
        done

    - name: Publish Android channel release
      if: steps.channel.outputs.publish_managed_release == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.channel.outputs.publish_tag }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.channel.outputs.name }}
        body: ${{ steps.channel.outputs.body }}
        prerelease: ${{ steps.channel.outputs.prerelease }}
        make_latest: ${{ steps.channel.outputs.make_latest }}
        files: ${{ steps.channel.outputs.files }}

    # TODO-1049 (supersedes TODO-967): the debug channel now publishes to ONE
    # fixed rolling release (`debug-rolling`), so no new per-push
    # v<version>-debug.<seq>+<sha> prereleases are ever created. This step
    # garbage-collects the LEGACY versioned debug prereleases the old scheme
    # accumulated (and any that a stale/manual run might create), leaving the
    # Releases list with a single rolling debug entry alongside the formal/beta
    # ones. Runs ONLY on the automated push debug path -- never on
    # workflow_dispatch nor on release events -- and ONLY in this one workflow so
    # it cannot race release-desktop.yml (which publishes the SAME rolling tag).
    # HARD SAFETY, two independent filters before any delete: (1) isPrerelease
    # must be true AND isLatest must be false (never touch a formal or Latest
    # release), and (2) the tag must match ^v.*-debug\.[0-9]+\+ (the legacy
    # versioned debug tag shape) -- which the rolling tag `debug-rolling` does
    # NOT match, so the rolling release is never deleted. A release failing
    # either filter is left untouched.
    - name: Prune legacy versioned debug prereleases
      if: github.event_name == 'push' && steps.channel.outputs.channel == 'debug'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # List every release with the fields needed for the double filter.
        # --json keeps this robust against output format changes; jq does the
        # prerelease + regex filtering, never a loose grep.
        mapfile -t STALE < <(
          gh release list --repo "$REPO" --limit 1000 \
            --json tagName,isPrerelease,isLatest \
            --jq '
              .[]
              | select(.isPrerelease == true and .isLatest == false)
              | select(.tagName | test("^v.*-debug\\.[0-9]+\\+"))
              | .tagName
            '
        )
        if [ "${#STALE[@]}" -eq 0 ]; then
          echo "No legacy versioned debug prereleases to delete."
          exit 0
        fi
        echo "Deleting ${#STALE[@]} legacy versioned debug prerelease(s):"
        for tag in "${STALE[@]}"; do
          [ -n "$tag" ] || continue
          # Defence in depth: re-assert the legacy debug tag shape per tag so a
          # malformed jq result can never delete a non-debug or the rolling tag.
          if [[ ! "$tag" =~ ^v.*-debug\.[0-9]+\+ ]]; then
            echo "::warning title=Skipping non-legacy-debug tag::Refusing to delete '$tag' (does not match legacy versioned debug tag pattern)"
            continue
          fi
          echo "  deleting $tag"
          gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
        done

    # TODO-705: publish a mirror update manifest so beta/debug in-China update
    # checks succeed (raw.githubusercontent.com is proxiable; api.github.com
    # /releases is mirror-403'd, BUG-292). This pushes a DATA FILE to the
    # update-manifest branch -- it is NOT a GitHub Release: it never sets
    # make_latest / prerelease:false, reuses the channel outputs verbatim, uses
    # the shared release_sequence (never run_number), and update-manifest is
    # absent from this workflow's push trigger (main/develop only) so it does
    # not cascade a run.
    - name: Publish mirror update manifest (Android assets)
      # BUG-869: gate on publish_manifest (decoupled from publish_managed_release)
      # and use manifest_channel so the `release` event emits latest-stable.json
      # without re-touching the manually-created Release.
      if: steps.channel.outputs.publish_manifest == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        CHANNEL: ${{ steps.channel.outputs.manifest_channel }}
        TAG: ${{ steps.channel.outputs.tag }}
        # TODO-1049: manifest `tag` keeps the versioned/seq TAG for client
        # version comparison; asset URLs resolve under DOWNLOAD_TAG (the actual
        # release tag -- `debug-rolling` for debug, else identical to TAG).
        DOWNLOAD_TAG: ${{ steps.channel.outputs.publish_tag }}
        PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        NOTES: ${{ steps.channel.outputs.body }}
        VERSION: ${{ steps.channel.outputs.build_version_name }}
        RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
        ARTIFACTS_DIR: hibiki/build/release-artifacts
        ASSET_GLOB: hibiki-*.apk
        PLATFORM_LABEL: android
      run: bash tool/publish_update_manifest.sh

  # TODO-fast-release: the analyze/unit/package suites that used to run as
  # sequential steps at the top of the `build` job (gating `flutter build apk`)
  # now live here as an INDEPENDENT job. It shares the same trigger as `build`
  # but has NO `needs:` relationship, so it runs in parallel and never delays or
  # blocks the debug-channel APK. A failure still marks the whole workflow run
  # red (signal preserved on every push, including direct develop pushes that
  # bypass main.yml's PR gate). The job-level `if` keeps the workflow_dispatch
  # skip_tests fast-release path: a manual dispatch with skip_tests:true skips
  # this entire job. Setup mirrors `build` minus the Android/Gradle/keystore bits
  # tests don't need (analyze + Dart-VM unit tests link no native/Android
  # toolchain). Only google_oauth_secret.dart is gitignored and must be stubbed
  # or `flutter analyze` fails to compile google_drive_auth.dart; the
  # log_upload/dandanplay placeholders are committed, so their stubs are needed
  # only to bake real secrets when present (kept here for parity with `build`).
  tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        cache: true

    - name: Provide gitignored Google OAuth secret stub
      shell: bash
      env:
        GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      run: |
        dst=hibiki/lib/src/sync/google_oauth_secret.dart
        if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
          oauth_secret_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]))')"
          printf 'const String kGoogleOAuthClientSecret =\n    %s;\n' \
            "$oauth_secret_literal" \
            > "$dst"
        elif [ ! -f "$dst" ]; then
          cp hibiki/lib/src/sync/google_oauth_secret.example.dart "$dst"
        fi
    # Symmetric with the build job (BUG-290): every job that injects the
    # google_oauth stub must also inject the log_upload stub so the symmetry
    # guard (log_upload_workflow_injection_guard_test) stays green and a future
    # platform job can never silently drop the injection. Harmless here (tests
    # do not upload logs) - when the secret is unset it leaves the committed
    # empty placeholder so nothing is exposed.
    - name: Provide gitignored log upload secret stub
      shell: bash
      env:
        LOG_UPLOAD_ENDPOINT: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
        LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
      run: |
        dst=hibiki/lib/src/utils/misc/log_upload_secret.dart
        if [ -n "$LOG_UPLOAD_ENDPOINT" ]; then
          log_endpoint_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ["LOG_UPLOAD_ENDPOINT"]))')"
          log_token_literal="$(python3 -c 'import json,os; print(json.dumps(os.environ.get("LOG_UPLOAD_TOKEN","")))')"
          printf 'const String kLogUploadEndpoint = %s;\nconst String kLogUploadToken = %s;\n' \
            "$log_endpoint_literal" \
            "$log_token_literal" \
            > "$dst"
        elif [ ! -f "$dst" ]; then
          cp hibiki/lib/src/utils/misc/log_upload_secret.example.dart "$dst"
        fi

    - name: Provide gitignored dandanplay secret stub
      shell: bash
      env:
        DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
        DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
      run: |
        dst=hibiki/lib/src/media/video/dandanplay_secret.dart
        if [ -n "$DANDANPLAY_APP_ID" ]; then
          printf "const String kDandanplayAppId = '%s';\nconst String kDandanplayAppSecret = '%s';\n" \
            "$DANDANPLAY_APP_ID" \
            "$DANDANPLAY_APP_SECRET" \
            > "$dst"
        elif [ ! -f "$dst" ]; then
          cp hibiki/lib/src/media/video/dandanplay_secret.example.dart "$dst"
        fi

    - name: Flutter pub get
      working-directory: hibiki
      run: flutter pub get

    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh

    - name: Run dart analyze
      working-directory: hibiki
      run: flutter analyze

    - name: Run unit tests (main app)
      working-directory: hibiki
      run: dart run tool/flutter_test_failures.dart --exclude-tags golden

    - name: Run package tests
      run: |
        for pkg in packages/hibiki_core packages/hibiki_dictionary packages/hibiki_anki packages/hibiki_audio packages/hibiki_platform; do
          if [ -d "$pkg/test" ]; then
            echo "::group::Testing $pkg"
            (cd "$pkg" && dart ../../hibiki/tool/flutter_test_failures.dart --output-dir=../../.codex-test/flutter-test/$(basename "$pkg"))
            echo "::endgroup::"
          else
            echo "::warning title=No package tests::$pkg has no test/ dir — its code is only covered transitively by the main-app suite"
          fi
        done
