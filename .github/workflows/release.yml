name: Build Release APK

on:
  # TODO-1208: docs-only / repo-chore pushes (docs/**, *.md, board files) should
  # not fire the full ~49m release build. Scope the PUSH trigger to build-relevant
  # paths. The `release` and `workflow_dispatch` triggers below are intentionally
  # left UNfiltered so manual beta/formal publishes always run regardless of what
  # changed. A version bump lives in fushi/pubspec.yaml (under fushi/**) so it
  # still triggers; the rolling debug seq = commit count, so skipping a seq on a
  # docs-only push is harmless.
  # Fushi 改名过渡期曾暂停 push 自动发布（2026-08-07 用户指示），
  # 2026-08-13 用户指示恢复。
  #
  # 2026-09-30 精简 CI：push 路径 = 本 workflow 真正读到的文件，逐个列出。以前挂整个
  # `tool/**` 与 `.github/workflows/**`，改 tool/bug.dart 或任何一条别的 workflow 都会在
  # develop 上跑一整轮发布构建。workflow / 发布脚本自身的守卫由 ci-config-gate.yml 在
  # PR 与 push 上跑；无头服务端由 server-gate.yml 负责（APK 不含它）。
  # 两条发布 workflow 互相列对方：check_release_policy.ps1 在发布第一步同时校验两份，
  # 改一份就可能让另一条的第一步红，必须当场暴露。
  # 守卫：fushi/test/build/release_workflow_path_filter_guard_test.dart（清单与实际
  # 调用的 tool/ 脚本逐个对账）。
  push:
    branches: ['main', 'develop']
    paths:
      - 'fushi/**'
      - 'packages/**'
      # Android 构建真正用到的原生源码：fushidicts 走 build.gradle 的 CMake，
      # torrent / p2p / fsrs / compute / web_core / rwkv 在本 workflow 里编成 .so 进 jniLibs。
      - 'native/fushidicts/**'
      - 'native/fushi_torrent/**'
      - 'native/fushi_p2p/**'
      - 'native/fushi_fsrs/**'
      - 'native/fushi_compute/**'
      - 'native/fushi_rwkv/**'
      - 'native/fushi_web_core/**'
      - 'ci/**'
      - 'third_party/**'
      - 'tool/check_release_policy.ps1'
      - 'tool/release_sequence.sh'
      - 'tool/publish_update_manifest.sh'
      - 'tool/merge_update_manifest.py'
      - 'tool/feedback_mark_released.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-desktop.yml'
      - '.github/actions/provide-baked-secrets/**'
      - '.github/actions/native-artifact-store/**'
      - '.github/actions/native-store-names/**'
      - '.github/actions/pdfium-hook-cache/**'
      - '.github/actions/setup-fushi-compute/**'
      - '.github/actions/setup-fushi-rwkv/**'
      - '.github/actions/setup-fushi-music/**'
      - '.github/actions/setup-fushi-corpus/**'
      - '.github/actions/fushi-web-core-linux/**'
      - '.github/actions/test-native-linux/**'
      - '.github/actions/fushidicts-linux/**'
      - '.github/scripts/verify_torrent_abi.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '!packages/fushi_server/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel: debug, beta, or formal'
        required: true
        default: beta
        type: choice
        options:
          - debug
          - beta
          - formal
      tag_name:
        description: 'Optional release tag. Defaults to v<version>-debug.<seq>+<sha>, v<version>-beta.<seq>, or v<version>.'
        required: false
      release_name:
        description: 'Optional GitHub Release title.'
        required: false
      skip_tests:
        description: 'Fast build: skip the analyze/unit/package test suites and go straight to compile+publish. Only honored on workflow_dispatch (push-triggered debug builds always run the tests).'
        required: false
        default: true
        type: boolean
      build_only:
        description: 'Build the channel artifacts but publish nothing: no GitHub Release, no update manifest. Artifacts stay downloadable from the run page. Use to hand a release candidate out for testing before committing to the publish.'
        required: false
        default: false
        type: boolean

concurrency:
  # 组名带 workflow 名（2026-09-08，用户要求正式版并行发包）：Android（release.yml）与
  # 桌面/Apple（release-desktop.yml）是两条产出不相交的 workflow，而 GitHub 的 concurrency
  # 组是**仓库级**的——两条 workflow 只要组名算出来一样就串行，且同组「1 个 in-progress +
  # 1 个 pending」的语义会让第二个 pending 把第一个 pending **取消**（2026-09-03 实测：同
  # sha 先后 dispatch Android beta 与桌面 beta，Android 那条 5 秒内 cancelled、0 个 job）。
  # 正式版靠 `release: published` 同时点燃两条、同 tag 同组必串行：桌面/Apple 包要等
  # Android 整条跑完才开始（v2.2.4：Android 13:44 上传，Windows/macOS/iOS 14:52）。
  # 两条并行上传同一个 GitHub Release 是安全的，上传侧本就按此设计：rolling debug 的
  # prune 只删本平台资产（TODO-1131）；softprops 建 release 撞车会重取（同一条 workflow
  # 里 windows/macos/ios 早就并行上传同一个 release）；update-manifest 推送有「重取远端
  # tip 再合并」循环（TODO-781）。同一条 workflow 内仍按 tag/sha 串行，同 tag 两次 dispatch
  # 不会互相踩。守卫：fushi/test/build/release_workflow_concurrency_guard_test.dart。
  #
  # push 事件按**分支**分组（2026-09-30）：此前 push 也按 sha 分组，develop 上每推一次就
  # 各自跑满一整轮 debug 发布，连推 5 次 = 5 轮全跑完、中间 4 轮的产物马上被最新那轮覆盖。
  # 改成同分支一组后：正在跑的那轮照样跑完（仍是 cancel-in-progress: false——半路取消会让
  # rolling debug 资产与 update-manifest 只写一半），只有**排队中**的旧 pending 被后来者顶掉。
  # 被跳过的 commit 无害：debug 序号 = commit 数（tool/release_sequence.sh），跳号本就发生在
  # 每次 docs-only push 上（见上面 TODO-1208）；最新那轮包含它们的全部改动，tests job 也跑在
  # 最新那轮的树上。代价：最新 commit 的 debug 包最多要等正在跑的那一轮结束才开跑。
  # release / workflow_dispatch 仍按 tag/sha，正式版与手动发布不受影响。
  # 组名前缀仍带 workflow 名：Android 与桌面在同一分支上也各自一组、互不取消（09-03 教训）。
  group: fushi-release-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.event.release.tag_name || github.event.inputs.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # BUG-2817：`release` 事件只给应用 release（tag = v<数字>…）构建；模型 / 依赖资产
    # release（manga-panel-detector-onnx-v1、vendor-libmpv、voice-hook-helper…）被手动
    # 发布时不许整套构建、把安装包挂到它们身上。表达式没有正则，只能逐个列 v0..v9；
    # 守卫 fushi/test/build/release_event_app_tag_guard_test.dart 钉住每个 job 都带它。
    if: ${{ (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      # publish_update_manifest.sh 推完正式版清单要 `gh workflow run` 唤醒 R2 镜像；
      # job 级 permissions 会把没列出的 scope 置 none，缺 actions: write 则 dispatch 403。
      actions: write
    # 发布步骤已搬到下面的 `publish-android` job（2026-10-17，正式版云端预构建 + 审批门）：
    # 这里只构建、签名、上传 run artifact，绝不对外发布任何东西。
    #
    # job outputs 只留 publish-android 的 job 级 if 要用的三个开关。通道解析结果（tag、
    # 发布 tag、文件清单、公告正文……）经 `fushi-release-channel-<sha>` artifact 交过去：
    # GitHub 会把「可能含 secret 值」的 job output 整条丢掉（只打一行 Skip output 警告）。
    # 2026-10-17 实测 publish_tag=fushi-debug-rolling 与 files 被丢，publish 拿空 tag 去
    # prune rolling release，`gh release view ''` 落到 Latest（v2.9.1）上差点删掉它的资产。
    # artifact 内容不做这种过滤。守卫 fushi/test/build/release_publish_gate_guard_test.dart。
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      publish_managed_release: ${{ steps.channel.outputs.publish_managed_release }}
      publish_manifest: ${{ steps.channel.outputs.publish_manifest }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate unified release policy
      shell: pwsh
      run: ./tool/check_release_policy.ps1

    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.6'
        cache: true
    # pdfium_dart's build hook downloads PDFium from GitHub on every fresh
    # runner; restore it so a release-asset hiccup cannot fail the build.
    - uses: ./.github/actions/pdfium-hook-cache
      with:
        purpose: android

    # 与 release-desktop.yml 的同名 step 一样在仓库根运行：BUG-1586 的
    # `bash tool/release_sequence.sh` 是根相对路径，working-directory: fushi
    # 会把它解析成不存在的 fushi/tool/（exit 127，自动发布恢复当天首跑即红）。
    - name: Resolve Android release channel
      id: channel
      shell: bash
      env:
        INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        INPUT_BUILD_ONLY: ${{ github.event.inputs.build_only }}
        INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        RELEASE_BODY: ${{ github.event.release.body }}
      run: |
        set -euo pipefail
        PUBSPEC_VERSION=$(grep '^version:' fushi/pubspec.yaml | sed 's/version: *//')
        VERSION="${PUBSPEC_VERSION%%+*}"
        PUBSPEC_BUILD="${PUBSPEC_VERSION#*+}"
        if [ "$PUBSPEC_BUILD" = "$PUBSPEC_VERSION" ]; then
          PUBSPEC_BUILD=1
        fi
        if ! [[ "$PUBSPEC_BUILD" =~ ^[0-9]+$ ]]; then
          echo "::error title=Invalid pubspec build number::Expected numeric +build in $PUBSPEC_VERSION"
          exit 1
        fi
        RELEASE_SEQUENCE=$(bash tool/release_sequence.sh)
        if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
          echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
          exit 1
        fi
        # TODO-414: Android versionCode = build.gradle's versionCodeBase (1e9, a
        # one-time migration floor above every historically-shipped versionCode)
        # + 100 * RELEASE_SEQUENCE + ABI offset. The build number passed here is
        # JUST the monotonic commit count, NOT PUBSPEC_BUILD * 1e6 + seq: the
        # old *1e6 formula produced versionCode ~6.6e9, which overflows int32 and
        # exceeds Android's 2.1e9 ceiling, so beta/release Android packages could
        # not be built at all. PUBSPEC_BUILD stays parsed for logging only.
        echo "PUBSPEC_BUILD (log only, not in versionCode): $PUBSPEC_BUILD"
        ANDROID_BUILD_NUMBER=$RELEASE_SEQUENCE
        SHORT_SHA="${GITHUB_SHA::7}"
        EVENT="${GITHUB_EVENT_NAME}"
        CHANNEL="${INPUT_CHANNEL:-}"
        TAG="${INPUT_TAG_NAME:-}"
        NAME="${INPUT_RELEASE_NAME:-}"
        # BUG-2088：正式版/测试版**真实更新公告**的来源。此前 BODY 只有一行模板，
        # 而 NOTES 就是它——实测 v2.1.1 的 latest-stable.json 里 notes 是
        # 「Manual formal release from bridge/auto-migrate-download @ 4d1c8f4.」，
        # 而 GitHub 上那份正文有 3613 字：**应用内更新弹窗给用户看的一直是占位符**。
        # 约定：公告写在 docs/release-notes/<语义版本>.md，正式/测试通道自动取用；
        # 手动发 GitHub Release 时优先用 Release 正文（那才是当场写的那份）。
        # debug 通道不取——滚动开发构建挂完整 changelog 会误导。
        NOTES_FILE="docs/release-notes/${VERSION}.md"
        BODY=""
        PRERELEASE=true
        MAKE_LATEST=false
        FILES="fushi/build/release-artifacts/*-debug.apk"
        BUILD_DEBUG_APK=true
        BUILD_DEBUG_CHANNEL_APK=false
        BUILD_SPLIT_RELEASE_APK=false
        NEEDS_RELEASE_KEYSTORE=false
        PUBLISH_MANAGED_RELEASE=false
        # BUG-869: manifest-only publish flag, decoupled from
        # PUBLISH_MANAGED_RELEASE so the `release` event can emit
        # latest-stable.json WITHOUT re-running the softprops managed-release
        # create/upsert (which would touch the user's manually-created Release).
        # MANIFEST_CHANNEL is the channel handed to publish_update_manifest.sh
        # (debug|beta|formal) that decides the latest-<channel>.json filename.
        PUBLISH_MANIFEST=false
        MANIFEST_CHANNEL=""

        case "$EVENT" in
          push)
            CHANNEL=debug
            TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
            NAME="${NAME:-Fushi debug ${VERSION} (${SHORT_SHA})}"
            BODY="Automated release-signed debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
            BUILD_DEBUG_APK=false
            BUILD_DEBUG_CHANNEL_APK=true
            NEEDS_RELEASE_KEYSTORE=true
            PUBLISH_MANAGED_RELEASE=true
            ;;
          workflow_dispatch)
            case "$CHANNEL" in
              debug)
                TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                NAME="${NAME:-Fushi debug ${VERSION} (${SHORT_SHA})}"
                BODY="Manual release-signed debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                BUILD_DEBUG_APK=false
                BUILD_DEBUG_CHANNEL_APK=true
                NEEDS_RELEASE_KEYSTORE=true
                ;;
              beta)
                TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                NAME="${NAME:-Fushi ${VERSION} beta ${RELEASE_SEQUENCE}}"
                BODY="Manual beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                if [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
                FILES="fushi/build/release-artifacts/fushi-*.apk"
                BUILD_DEBUG_APK=false
                BUILD_SPLIT_RELEASE_APK=true
                NEEDS_RELEASE_KEYSTORE=true
                ;;
              formal)
                TAG="${TAG:-v${VERSION}}"
                NAME="${NAME:-Fushi ${VERSION}}"
                BODY="Manual formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                if [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
                PRERELEASE=false
                MAKE_LATEST=true
                FILES="fushi/build/release-artifacts/fushi-*.apk"
                BUILD_DEBUG_APK=false
                BUILD_SPLIT_RELEASE_APK=true
                NEEDS_RELEASE_KEYSTORE=true
                ;;
              *)
                echo "::error title=Invalid release channel::Use debug, beta, or formal."
                exit 1
                ;;
            esac
            PUBLISH_MANAGED_RELEASE=true
            ;;
          release)
            CHANNEL=github-release
            # BUG-2104：本分支曾是**唯一**没显式关掉 debug APK 的分支。
            # `BUILD_DEBUG_APK` 的初值是 true（见本步骤开头），push / dispatch 的
            # debug|beta|formal 四条分支各自设了 false，只有这里漏了 ⇒ 留在默认 true；
            # 而下面的上传 glob 是 `fushi-*.apk`，顺手把 `fushi-<ver>-<sha>-debug.apk`
            # 扫进正式 release 的资产表和已发布的 latest-stable-fushi.json。
            # 后果不致命（两批已出货客户端都按名字把 `-debug.apk` 排除在 stable/beta 之外，
            # 见 fushi/test/utils/misc/formal_asset_naming_legacy_contract_test.dart 与
            # platform_updater.dart 的 _isDebugApkAsset），但正式版页面上多一个 debug 构建
            # 可供手动下载、白烧一次构建、清单里多一条无用条目。
            # **手动发 GitHub Release 正是本仓文档里正式版的一等路径**，所以这条必然复发。
            BUILD_DEBUG_APK=false
            # 手动发 GitHub Release：正文就是当场写的公告，优先用它；留空（先建空
            # Release 再补正文）时回落到仓库里的公告文件。
            BODY="${RELEASE_BODY:-}"
            if [ -z "$BODY" ] && [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
            TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
            FILES="fushi/build/release-artifacts/fushi-*.apk"
            BUILD_SPLIT_RELEASE_APK=true
            NEEDS_RELEASE_KEYSTORE=true
            # BUG-869: a manually-published, NON-prerelease GitHub Release IS the
            # formal stable release. Emit latest-stable.json (with releaseSequence)
            # so in-China stable clients can read the seq for "谁后用谁" comparison.
            # This writes ONLY the data-file manifest; it never creates/modifies
            # the Release (PUBLISH_MANAGED_RELEASE stays false). A manual PRERELEASE
            # (beta via the UI) is left alone so it can never pollute stable.
            if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
              MANIFEST_CHANNEL=formal
              PUBLISH_MANIFEST=true
              PRERELEASE=false
            fi
            ;;
          *)
            echo "::error title=Unsupported event::$EVENT is not a release channel event."
            exit 1
            ;;
        esac

        # BUG-869: push / workflow_dispatch keep existing behavior — MANIFEST_CHANNEL
        # follows CHANNEL (debug|beta|formal) and the manifest publishes whenever the
        # managed release does. Only the `release` event opts in above independently.
        if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
        if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

        # build_only：出候选包给人测，但**什么都不发布**。
        #
        # 刻意放在所有 channel 分支解析完之后：版本串、资产名、签名、构建开关全部
        # 照该 channel 的真实规则算（所以 formal 的 build_only 产物就是正式版产物，
        # 不是「像正式版的东西」），只把最后两个发布开关摁掉。
        #
        # 只认 workflow_dispatch：`release` 事件（手动发 GitHub Release）本身就是
        # 发布意图，push 的滚动 debug 也必须照常出包，两者都不该被这个开关影响——
        # 它们的 github.event.inputs.build_only 恒为空，下面的等值判断自然不成立。
        if [ "$INPUT_BUILD_ONLY" = "true" ]; then
          PUBLISH_MANAGED_RELEASE=false
          PUBLISH_MANIFEST=false
          echo "::notice title=Build-only run::Channel '$CHANNEL' artifacts will be built and uploaded to this workflow run, but no GitHub Release and no update manifest will be published."
        fi

        BUILD_VERSION_NAME="${TAG#v}"
        BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
        case "$CHANNEL" in
          debug)
            if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
              echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
              exit 1
            fi
            ;;
          beta)
            if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
              echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
              exit 1
            fi
            ;;
          formal)
            if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error title=Invalid formal tag::Use v<version>."
              exit 1
            fi
            ;;
        esac

        # TODO-1049: the debug channel publishes to ONE fixed rolling GitHub
        # Release tag (`debug-rolling`) instead of a new v<version>-debug.<seq>
        # tag per push, so debug builds stop piling up prereleases that bury the
        # formal/beta entries in the Releases list. PUBLISH_TAG is the git tag
        # the GitHub Release actually uses; TAG stays the versioned/seq tag that
        # the client compares (manifest `tag` field) and that names the APK.
        # beta/formal are unchanged: their release IS the version tag.
        #
        # BUG-1481: the rolling tag is per PRODUCT FAMILY. The bridge product
        # (`app.hibiki.reader`) keeps the historical `debug-rolling`; Fushi takes
        # its own tag. Sharing one rolling tag put both families' assets in one
        # release, and the prune step below groups candidates by PLATFORM only
        # (`case "$name" in *.apk)`) before keeping the top KEEP_SEQS sequences --
        # so the family with the higher commit count deleted the other family's
        # assets on every build. Per-family tags make that grouping single-product
        # again; do NOT re-merge them.
        ROLLING_DEBUG_TAG=fushi-debug-rolling
        if [ "$CHANNEL" = debug ]; then
          PUBLISH_TAG="$ROLLING_DEBUG_TAG"
          ROLLING_DEBUG=true
        else
          PUBLISH_TAG="$TAG"
          ROLLING_DEBUG=false
        fi

        {
          echo "channel=$CHANNEL"
          echo "tag=$TAG"
          echo "publish_tag=$PUBLISH_TAG"
          echo "rolling_debug=$ROLLING_DEBUG"
          echo "name=$NAME"
          echo "prerelease=$PRERELEASE"
          echo "make_latest=$MAKE_LATEST"
          echo "build_debug_apk=$BUILD_DEBUG_APK"
          echo "build_debug_channel_apk=$BUILD_DEBUG_CHANNEL_APK"
          echo "build_split_release_apk=$BUILD_SPLIT_RELEASE_APK"
          echo "needs_release_keystore=$NEEDS_RELEASE_KEYSTORE"
          echo "build_version_name=$BUILD_VERSION_NAME"
          echo "android_build_number=$ANDROID_BUILD_NUMBER"
          echo "release_sequence=$RELEASE_SEQUENCE"
          echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
          echo "publish_manifest=$PUBLISH_MANIFEST"
          echo "manifest_channel=$MANIFEST_CHANNEL"
          echo "files=$FILES"
          echo "body<<EOF"
          echo "$BODY"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Decode keystore
      if: steps.channel.outputs.needs_release_keystore == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fushi/android/fushi-release.jks

    - name: Create key.properties
      if: steps.channel.outputs.needs_release_keystore == 'true'
      working-directory: fushi/android
      run: |
        cat > key.properties <<EOF
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=fushi-release.jks
        EOF

    - name: Remove local proxy from gradle.properties
      working-directory: fushi/android
      run: |
        sed -i '/systemProp\.http\.proxyHost/d' gradle.properties
        sed -i '/systemProp\.http\.proxyPort/d' gradle.properties
        sed -i '/systemProp\.https\.proxyHost/d' gradle.properties
        sed -i '/systemProp\.https\.proxyPort/d' gradle.properties
        sed -i '/systemProp\.http\.nonProxyHosts/d' gradle.properties

    # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
    # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
    # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
    - name: Provide baked-in secret stubs
      uses: ./.github/actions/provide-baked-secrets
      with:
        google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
        log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
        dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
        dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
        tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
        opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
        acoustid-api-key: ${{ secrets.ACOUSTID_API_KEY }}
    # TODO-2721: 只缓存 Gradle 的下载物（modules-2 / wrapper dists），不缓存
    # <ver>/transforms 这类可从 modules-2 重算的派生产物。三个 workflow
    # （main / release / build-multiplatform）的 path + key 必须逐字相同，且此步
    # 之前不得 sed 改 build.gradle / settings.gradle —— 否则同一份内容会被存成
    # 两条各 2.7 GB 的缓存。理由见 docs/agent/build.md 的「CI 缓存配额」，守卫见
    # fushi/test/build/workflow_cache_quota_guard_test.dart。
    - name: Cache Gradle caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/journal-1
          ~/.gradle/wrapper/dists
        key: ${{ runner.os }}-gradle-v2-${{ hashFiles('fushi/android/**/*.gradle*', 'fushi/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-v2-

    - name: Remove aliyun mirrors from gradle files
      working-directory: fushi/android
      run: |
        sed -i "/maven.*aliyun/d" build.gradle
        sed -i "/maven.*aliyun/d" settings.gradle

    - name: Flutter pub get
      working-directory: fushi
      run: flutter pub get

    - name: Apply pub cache patches
      run: |
        chmod +x ci/apply-patches.sh
        bash ci/apply-patches.sh

    # 内置 libtorrent 引擎的 Android .so：vcpkg 交叉编 libtorrent + bridge，产物落
    # native/fushi_torrent/prebuilt/android/arm64-v8a/，由 fushi/android/app/
    # build.gradle 的 jniLibs copy-if-present 随包。
    #
    # 范围决策：**只编 arm64-v8a**（2026 年真机几乎全是 arm64）。armeabi-v7a /
    # x86_64 的 split APK 与 fat debug APK 在这些 ABI 上没有 .so，运行期
    # EmbeddedTorrentHost.open 返回 null → 自动回退外接 qb（与 Windows 缺 DLL
    # 同一条路径），不是静默破坏。要补其它 ABI 时给脚本追加 ABI 参数即可。
    #
    # 缓存姿势照抄 build-multiplatform.yml 的 Windows vcpkg 步骤（TODO-2668）：
    # key 带 runner ImageVersion（镜像决定 vcpkg 修订与工具链 = 决定 ABI hash，
    # 常量 key 会让另一镜像永远冷编且命中即不回存）；distfile 目录第二层兜
    # 「新镜像上线那一次必然冷编」的高危外网取件。
    - name: Resolve vcpkg cache identity
      id: vcpkg_cache_id
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      shell: bash
      run: |
        image="${ImageVersion:-unknown-image}"
        image="$(echo "$image" | tr -c '0-9A-Za-z._-' '-')"
        echo "vcpkg cache identity (runner ImageVersion): $image"
        echo "image=$image" >> "$GITHUB_OUTPUT"
    # 原生产物持久库（.github/actions/native-artifact-store，与 build-multiplatform.yml /
    # release-desktop.yml 的 windows job 同一套）：输入没变就直接取上次 develop/main 编好的
    # .so，省掉 libtorrent vcpkg 交叉编（~7 min）+ fushi_p2p cargo-ndk（~6 min）。
    # 2026-09-30 实测 run 36659762478：build job 28.0 min，这两步合计 13.0 min。
    # 仓库 10 GB 缓存配额约 1 小时换一轮，所以不用 actions/cache 存成品（理由见该 action
    # 头注释与 docs/agent/build.md「CI 缓存配额」）。
    #
    # 名字 = 全部构建输入：源码树哈希（native/fushi_torrent/** 含 CMakeLists / vcpkg.json
    # 钉版 / overlay ports+triplets / 构建脚本；native/fushi_p2p/** 含 Cargo.lock / 构建脚本）
    # + 实际使用的 NDK 版本 + 镜像内 vcpkg 修订 + Rust / cargo-ndk 钉版 + runner 镜像版本
    # + ABI 列表。在**任何东西被构建之前**算：此时 gitignore 的 prebuilt/ build-android-*/
    # target/ 都还不存在，之后再算就不是同一个值。
    # 取到的件和现编的件走**同一组**产物校验步骤（下面两个 Verify），不因为是恢复来的就少验。
    # 任何 miss（没有、过期、非可信来源、SHA256SUMS 不符、下载失败）都回落到现编。
    - name: Resolve native artifact store names (Android)
      id: native_store
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      # 名字配方只在 .github/actions/native-store-names/names.sh 写一次（与桌面 / PR 各端
      # 同源；Rust / cargo-ndk 钉版也从这里读），守卫 native_store_names_single_source_guard。
      uses: ./.github/actions/native-store-names
      with:
        platform: android
    - name: Restore libtorrent Android .so from native artifact store
      id: torrent_store
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      uses: ./.github/actions/native-artifact-store
      with:
        mode: restore
        name: ${{ steps.native_store.outputs.torrent }}
        path: native/fushi_torrent/prebuilt/android
    - name: Cache vcpkg source distfiles (libtorrent android)
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.torrent_store.outputs.hit != 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/vcpkg-downloads
          !${{ runner.temp }}/vcpkg-downloads/tools
        key: ${{ runner.os }}-vcpkg-downloads-libtorrent-android-v1-${{ steps.vcpkg_cache_id.outputs.image }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-downloads-libtorrent-android-v1-
    - name: Cache vcpkg binary archives (libtorrent android)
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.torrent_store.outputs.hit != 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/vcpkg/archives
        # v1 -> v2：同 Windows，manifest 钉版换了 ABI hash（BUG-1772）。
        # 末段 = vcpkg.json / overlay ports / triplets 的哈希：改钉版自动换 key，不再靠手动
        # bump vN（命中即不回存，忘了 bump 就每次重编改过的包）。restore-keys 只在同一
        # 镜像内前缀回退，没变的包照样从归档恢复；跨镜像不回退的约束不变。
        key: ${{ runner.os }}-vcpkg-libtorrent-arm64-android-v2-${{ steps.vcpkg_cache_id.outputs.image }}-${{ hashFiles('native/fushi_torrent/vcpkg.json', 'native/fushi_torrent/vcpkg-ports/**', 'native/fushi_torrent/vcpkg-triplets/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-libtorrent-arm64-android-v2-${{ steps.vcpkg_cache_id.outputs.image }}
    - name: Build embedded libtorrent Android .so (vcpkg)
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.torrent_store.outputs.hit != 'true' }}
      timeout-minutes: 90
      shell: bash
      env:
        VCPKG_DOWNLOADS: ${{ runner.temp }}/vcpkg-downloads
      run: |
        set -euo pipefail
        chmod +x native/fushi_torrent/build_android_so.sh
        bash native/fushi_torrent/build_android_so.sh \
          "$VCPKG_INSTALLATION_ROOT" "$ANDROID_NDK_LATEST_HOME" arm64-v8a
    # 现编与恢复共用的产物校验（与 native-torrent-gate.yml 的 android-arm64 同一组断言）：
    # 恢复来的件只核过 SHA256SUMS（= 与存入时逐字节一致），这里再验它确实是我们要的
    # 东西——在、导出头文件声明的每个 ht_* 符号、AArch64、LOAD 段 16KB 对齐。
    - name: Verify libtorrent Android .so
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        so="native/fushi_torrent/prebuilt/android/arm64-v8a/libfushi_torrent_ffi.so"
        test -f "$so" || { echo "::error::missing artifact $so"; exit 1; }
        file "$so"
        nm_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
        if [ ! -x "$nm_bin" ]; then nm_bin=nm; fi
        bash .github/scripts/verify_torrent_abi.sh "$so" "$nm_bin"
        # BUG-3284：C++ 运行时必须静态链入（c++_static）。依赖 APK 里那份由 pickFirst
        # 挑中的老 libc++_shared.so 时，新 NDK 编出的本库在设备上 dlopen 失败。
        # 恢复来的旧件（c++_shared 时代存入的）同样会在这里被拦下，回落不到发布。
        readelf_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
        if [ ! -x "$readelf_bin" ]; then readelf_bin=readelf; fi
        bash .github/scripts/verify_android_cxx_self_contained.sh "$so" "$readelf_bin" "$nm_bin"
        machine="$(readelf -h "$so" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
        echo "ELF machine: $machine"
        case "$machine" in
          *AArch64*) : ;;
          *) echo "::error title=wrong target arch::期望 AArch64，实际 $machine"; exit 1 ;;
        esac
        load_aligns="$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')"
        if ! grep -qx '0x4000' <<< "$load_aligns"; then
          echo "::error title=16KB alignment lost::LOAD segment 不是 0x4000 对齐（检查 CMakeLists 的 max-page-size）"
          exit 1
        fi
        ls -lh "$so"
    - name: Save libtorrent Android .so to native artifact store
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.torrent_store.outputs.hit != 'true' }}
      continue-on-error: true
      uses: ./.github/actions/native-artifact-store
      with:
        mode: save
        name: ${{ steps.native_store.outputs.torrent }}
        path: native/fushi_torrent/prebuilt/android

    # 互联 P2P 隧道（iroh）的 Android .so：cargo-ndk 交叉编，产物落
    # native/fushi_p2p/prebuilt/android/<abi>/，由 build.gradle 的 jniLibs
    # copy-if-present 随包。失败口径与上面的 libtorrent 一致：**构建失败即 job 失败**，
    # 不降级出一个悄悄少了 P2P 的包（缺库只是运行期能力隐藏，出包时没人会发现）。
    #
    # ABI 范围与 APK 对齐：debug APK 只出 arm64，split release APK 出 arm64-v8a /
    # armeabi-v7a / x86_64 三个。Rust 交叉编译便宜（缓存命中约 1 min），不像
    # libtorrent 那样只编 arm64。工具链/缓存与 native-p2p-gate.yml 逐字一致。
    # 持久库命中时 Rust 工具链 / rust-cache / cargo-ndk 一概不装（名字里已钉它们的版本）。
    - name: Restore fushi_p2p Android .so from native artifact store
      id: p2p_store
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      uses: ./.github/actions/native-artifact-store
      with:
        mode: restore
        name: ${{ steps.native_store.outputs.p2p }}
        path: native/fushi_p2p/prebuilt/android
    - name: Set up Rust (fushi_p2p, Android targets)
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.p2p_store.outputs.hit != 'true' }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.native_store.outputs.p2p_rust }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Cache Rust build (fushi_p2p)
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.p2p_store.outputs.hit != 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/fushi_p2p -> target
        key: fushi-p2p-android
    - name: Install cargo-ndk
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.p2p_store.outputs.hit != 'true' }}
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk@${{ steps.native_store.outputs.cargo_ndk }}
    - name: Build fushi_p2p Android .so (cargo-ndk)
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.p2p_store.outputs.hit != 'true' }}
      timeout-minutes: 45
      shell: bash
      run: |
        set -euo pipefail
        bash native/fushi_p2p/build_android_so.sh "$ANDROID_NDK_LATEST_HOME" arm64-v8a armeabi-v7a x86_64
    # 现编与恢复共用：每个 ABI 的 .so 都要导出 Dart 绑定 lookup 的全部 fp2p_* 符号。
    - name: Verify fushi_p2p Android .so
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        nm_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
        if [ ! -x "$nm_bin" ]; then nm_bin=nm; fi
        for abi in arm64-v8a armeabi-v7a x86_64; do
          bash native/fushi_p2p/verify_abi.sh "native/fushi_p2p/prebuilt/android/$abi/libfushi_p2p.so" "$nm_bin"
        done
    - name: Save fushi_p2p Android .so to native artifact store
      if: ${{ (steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true') && steps.p2p_store.outputs.hit != 'true' }}
      continue-on-error: true
      uses: ./.github/actions/native-artifact-store
      with:
        mode: save
        name: ${{ steps.native_store.outputs.p2p }}
        path: native/fushi_p2p/prebuilt/android

    # SRS 排程内核（fsrs-rs）的 Android .so：cargo-ndk 交叉编，产物落
    # native/fushi_fsrs/prebuilt/android/<abi>/，由 build.gradle 的 jniLibs copy-if-present
    # 随包。失败口径同 fushi_p2p：**构建失败即 job 失败**，不降级出一个悄悄少了 SRS 原生
    # 内核的包；出包后下面还会逐 ABI 核对 APK 里确有 libfushi_fsrs.so。
    # 工具链钉法与 fushi_p2p 同源（Rust / cargo-ndk 版本都从 native_store 读，与
    # native-fsrs-gate.yml 的 1.95.0 / 4.1.2 一致）；ABI 同样三个。fushi_fsrs 不进原生产物
    # 持久库（与 build-multiplatform.yml 各端的 fushi_fsrs 步骤同一口径：冷编便宜），只靠
    # rust-cache。fushi_p2p 持久库命中时它那组 Rust / cargo-ndk 安装步骤被跳过，所以这里
    # 无条件再装一次（同版本，幂等）。
    - name: Set up Rust (fushi_fsrs, Android targets)
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.native_store.outputs.p2p_rust }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Cache Rust build (fushi_fsrs)
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/fushi_fsrs -> target
        key: fushi-fsrs-android
    - name: Install cargo-ndk (fushi_fsrs)
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk@${{ steps.native_store.outputs.cargo_ndk }}
    - name: Build fushi_fsrs Android .so (cargo-ndk)
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      timeout-minutes: 45
      shell: bash
      run: |
        set -euo pipefail
        bash native/fushi_fsrs/build_android_so.sh "$ANDROID_NDK_LATEST_HOME" arm64-v8a armeabi-v7a x86_64
    # 每个 ABI 的 .so：ELF 架构对得上，且导出 Dart 绑定 lookup 的全部 ffsrs_* 符号。
    - name: Verify fushi_fsrs Android .so
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        nm_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
        if [ ! -x "$nm_bin" ]; then nm_bin=nm; fi
        for pair in arm64-v8a:AArch64 armeabi-v7a:ARM x86_64:X86-64; do
          abi="${pair%%:*}"; want="${pair#*:}"
          so="native/fushi_fsrs/prebuilt/android/$abi/libfushi_fsrs.so"
          test -f "$so" || { echo "::error::missing artifact $so"; exit 1; }
          machine="$(readelf -h "$so" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
          echo "$abi: ELF machine = $machine"
          case "$machine" in
            *"$want"*) : ;;
            *) echo "::error title=wrong target arch::$abi 期望 $want，实际 $machine"; exit 1 ;;
          esac
          bash native/fushi_fsrs/verify_abi.sh "$so" "$nm_bin"
        done
    # 网页内容核心（fushi_web_core，硬依赖）的 Android .so：cargo-ndk 交叉编，产物落
    # native/fushi_web_core/prebuilt/android/<abi>/，由 build.gradle 的 jniLibs 随包（release 构建缺库即失败）
    # 随包。失败口径同 fushi_p2p：**构建失败即 job 失败**，不降级出一个悄悄少了网页广告拦截原生
    # 库的包；出包后下面还会逐 ABI 核对 APK 里确有 libfushi_web_core.so。
    # 工具链钉法与 fushi_p2p 同源（Rust / cargo-ndk 版本都从 native_store 读，与
    # native-web-core-gate.yml 的 1.95.0 / 4.1.2 一致）；ABI 同样三个。fushi_web_core 不进原生产物
    # 持久库（与 build-multiplatform.yml 各端的 fushi_web_core 步骤同一口径：冷编便宜），只靠
    # rust-cache。fushi_p2p 持久库命中时它那组 Rust / cargo-ndk 安装步骤被跳过，所以这里
    # 无条件再装一次（同版本，幂等）。
    - name: Set up Rust (fushi_web_core, Android targets)
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.native_store.outputs.p2p_rust }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Cache Rust build (fushi_web_core)
      if: ${{ steps.channel.outputs.build_debug_apk == 'true' || steps.channel.outputs.build_debug_channel_apk == 'true' || steps.channel.outputs.build_split_release_apk == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/fushi_web_core -> target
