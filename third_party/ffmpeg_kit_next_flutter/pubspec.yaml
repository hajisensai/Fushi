name: ffmpeg_kit_next_flutter
description: FFmpeg Kit Next for Flutter (Fushi vendored; unified FFmpeg).
repository: https://github.com/arthenica/ffmpeg-kit-next
issue_tracker: https://github.com/arthenica/ffmpeg-kit-next/issues
homepage: https://github.com/arthenica/ffmpeg-kit-next
version: 9.0.0
publish_to: none

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

# Fushi: vendored from arthenica/ffmpeg-kit-next v9.0.0 (flutter/flutter).
# Only Android and iOS run FFmpeg in-process; desktop (and the headless server)
# run the unified FFmpeg's ffmpeg/ffprobe programs through CliFfmpegBackend, so
# the macos / linux plugin implementations are not vendored. The native
# binaries are the unified FFmpeg (tool/ffmpeg-unified, built by
# .github/workflows/ffmpeg-unified-mobile.yml); the libmpv player links the same
# FFmpeg libraries. See docs/specs/2026-10-17-unified-ffmpeg.md.
flutter:
  plugin:
    platforms:
      android:
        package: com.arthenica.ffmpegkit.flutter
        pluginClass: FFmpegKitFlutterPlugin
      ios:
        pluginClass: FFmpegKitFlutterPlugin

dependencies:
  ffmpeg_kit_next_flutter_platform_interface:
    path: ../ffmpeg_kit_next_flutter_platform_interface
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.5
