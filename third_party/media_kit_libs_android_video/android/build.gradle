import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their MD5 checksums.
        //
        // HIBIKI FORK, two independent reasons to not use the stock jars:
        //
        // BUG-073: upstream pins `default-*.jar`. media-kit's "default" FFmpeg
        // flavor compiles `--enable-demuxer=truehd` but NOT
        // `--enable-decoder=truehd/mlp`, so TrueHD audio demuxes but never
        // decodes — silent, the same root cause proven on Windows. The "full"
        // flavor (`buildscripts/flavors/full.sh` = `--enable-decoders`) has
        // every decoder incl. TrueHD/MLP.
        //
        // TODO-1137: every media-kit release, full flavor included, is built
        // against FFmpeg 6.0 (2023-02). That version left the maintenance
        // branches long ago and gets no security backports, while this .so
        // decodes whatever file the user opens — it still carries the magicyuv
        // OOB write reachable from a crafted mkv/mov/avi, plus the vp9, mov
        // CENC and mpegts issues. So these jars are built from our own fork
        // (hajisensai/libmpv-android-video-build @ hibiki/ffmpeg-6.1.6) at
        // FFmpeg 6.1.6, the tip of the 6.1 LTS branch, and mirrored into our
        // permanent `vendor-libmpv` release (assets never deleted or retagged,
        // unlike upstream's rolling ones). Staying on 6.x keeps the FFmpeg API
        // stable, so mpv itself is unchanged.
        //
        // BUG-2691 (Dolby Vision profile 5): the jars also carry
        // `buildscripts/patches/mpv/mpv_gl_dovi_p5.patch` (branch
        // hibiki/dovi-p5-gl), porting libplacebo's Dolby Vision reshaping into
        // gl_video (vo=gpu, the renderer used here). It only acts on frames that
        // carry AV_FRAME_DATA_DOVI_METADATA, which the mediacodec hwdec never
        // attaches, so the Dart side forces software decoding for known profile 5
        // sources (shouldForceSoftwareDecodeForDolbyVision). Same patch, same
        // result as the darwin build that was checked on a real Mac.
        //
        // BUG-2939 (#1953): the full flavor disables every muxer, so mpv's
        // `dump-cache` (online-video mining copies the buffered sentence out of
        // the player instead of fetching it again) always failed with "Output
        // format not found". These jars add `--enable-muxer=matroska` on top of
        // the dovi patch (hajisensai/libmpv-android-video-build @
        // hibiki/mkv-muxer); ff_matroska_muxer is present in all four .so and
        // nothing else changed (same 354 demuxers, n6.1.6, truehd, DV patch).
        // fushi/test/build/libmpv_mkv_muxer_guard_test.dart pins the `mkvmux`
        // name.
        //
        // Verified from the built artifacts: all four libmpv.so report
        // "FFmpeg version n6.1.6" and contain the truehd/mlp decoders.
        // MD5s recomputed from the uploaded jars.
        def filesToDownload = [
            ["url": "https://github.com/hajisensai/hibiki/releases/download/vendor-libmpv/libmpv-android-full-arm64-v8a-ffmpeg6.1.6-mkvmux-dovi.jar", "md5": "1503ce1fd1cf25a5b7c680b70bef8be1", "destination": file("$buildDir/ffmpeg6.1.6-mkvmux-dovi/full-arm64-v8a.jar")],
            ["url": "https://github.com/hajisensai/hibiki/releases/download/vendor-libmpv/libmpv-android-full-armeabi-v7a-ffmpeg6.1.6-mkvmux-dovi.jar", "md5": "6fc0fc7df1af5fdcc6fe170772dd1201", "destination": file("$buildDir/ffmpeg6.1.6-mkvmux-dovi/full-armeabi-v7a.jar")],
            ["url": "https://github.com/hajisensai/hibiki/releases/download/vendor-libmpv/libmpv-android-full-x86_64-ffmpeg6.1.6-mkvmux-dovi.jar", "md5": "2bde9b47c37f1f01ace6a00285a15fe0", "destination": file("$buildDir/ffmpeg6.1.6-mkvmux-dovi/full-x86_64.jar")],
            ["url": "https://github.com/hajisensai/hibiki/releases/download/vendor-libmpv/libmpv-android-full-x86-ffmpeg6.1.6-mkvmux-dovi.jar", "md5": "cc6fcd58e078cf0100ff5ad3d40d7dd8", "destination": file("$buildDir/ffmpeg6.1.6-mkvmux-dovi/full-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != fileInfo.md5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedMD5 != fileInfo.md5) {
                    throw new GradleException("MD5 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)