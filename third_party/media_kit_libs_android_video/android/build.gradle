import java.io.File
import java.nio.file.Files
import java.security.MessageDigest
import groovy.json.JsonSlurper
import java.util.zip.ZipFile

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

// Verified full-FFmpeg native jars are vendored so every normal build includes
// Blu-ray navigation. An explicit local directory is useful when rebuilding.
def nativeLibmpvDirectory = providers.gradleProperty('fushiLibmpvAndroidDir')
        .orElse(providers.environmentVariable('FUSHI_LIBMPV_ANDROID_DIR'))
        .orElse(file('native/bluray-menu-v1').absolutePath)

task downloadDependencies {
    doLast {
        def sourceDir = file(nativeLibmpvDirectory.get())
        def manifestFile = new File(sourceDir, 'sha256.json')
        if (!manifestFile.isFile()) {
            throw new GradleException("Missing libmpv checksum manifest: ${manifestFile}")
        }
        def checksums = new JsonSlurper().parse(manifestFile)
        def verifiedJars = []
        ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'].each { abi ->
            def filename = "full-${abi}.jar"
            def jarFile = new File(sourceDir, filename)
            def expected = checksums[filename]
            if (!jarFile.isFile() || !(expected instanceof String) || !(expected ==~ /[0-9a-f]{64}/)) {
                throw new GradleException("Missing libmpv jar or SHA-256: ${filename}")
            }
            def actual = MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(jarFile.toPath())).encodeHex().toString()
            if (actual != expected) {
                throw new GradleException("SHA-256 verification failed: ${jarFile}")
            }
            new ZipFile(jarFile).withCloseable { archive ->
                ['libmpv.so', 'libmediakitandroidhelper.so'].each { library ->
                    if (archive.getEntry("lib/${abi}/${library}") == null) {
                        throw new GradleException("Missing lib/${abi}/${library} in ${jarFile}")
                    }
                }
            }
            verifiedJars.add(jarFile)
        }
        // Validate the entire set before replacing a previous build's inputs.
        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()
        copy { from verifiedJars; into outputDir }
    }
}

preBuild.dependsOn(downloadDependencies)
assemble.dependsOn(downloadDependencies)
