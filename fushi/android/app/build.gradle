plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "dev.flutter.flutter-gradle-plugin"
}

def mihonSourceApiCommit = "fdb223d657cc60b2d7145c81b7ff690b8010d7aa"
def mihonSourceArchiveSha256 = "645e84b2a9abbe0196057d6ba9e752abd6876b7e93bd8bee8a6cbcfe8abb154c"
def mihonSourceArchive = layout.buildDirectory.file("downloads/mihon-${mihonSourceApiCommit}.zip")
def mihonSourceOutput = layout.buildDirectory.dir("generated/mihonSourceApi")

def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = input.read(buffer)) > 0) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().collect { String.format("%02x", it) }.join()
}

// The extension ABI is generated from an exact Apache-2.0 Mihon commit at
// build time. It is never downloaded by the installed Android app. The archive
// hash makes the generated source deterministic and fails closed on drift.
def prepareMihonSourceApi = tasks.register("prepareMihonSourceApi") {
    inputs.property("commit", mihonSourceApiCommit)
    inputs.property("sha256", mihonSourceArchiveSha256)
    outputs.dir(mihonSourceOutput)
    doLast {
        File archive = mihonSourceArchive.get().asFile
        archive.parentFile.mkdirs()
        if (!archive.exists() || sha256Of(archive) != mihonSourceArchiveSha256) {
            new URL("https://github.com/mihonapp/mihon/archive/${mihonSourceApiCommit}.zip")
                .withInputStream { input ->
                    archive.withOutputStream { output -> output << input }
                }
        }
        def actualSha = sha256Of(archive)
        if (actualSha != mihonSourceArchiveSha256) {
            archive.delete()
            throw new GradleException("Mihon source archive SHA-256 mismatch: ${actualSha}")
        }
        File output = mihonSourceOutput.get().asFile
        delete(output)
        copy {
            from zipTree(archive)
            include "mihon-${mihonSourceApiCommit}/source-api/src/main/kotlin/**/*.kt"
            eachFile { details ->
                details.path = details.path.replaceFirst(
                    "mihon-${mihonSourceApiCommit}/source-api/src/main/kotlin/",
                    "",
                )
            }
            includeEmptyDirs = false
            into output
        }
    }
}

// Aniyomi (anime) extension ABI. The `eu.kanade.tachiyomi.animesource` sources
// are vendored with the desktop sidecar (third_party/m_extension_server);
// compiling the same files here keeps Android and the desktop sidecar on one
// ABI. The sidecar build layers `overlay/` over `upstream_src/` (overlay wins),
// and so does this task: the overlay holds Fushi's lib 14 + 16 + 17 union of
// the ABI (`Video` with and without `memo`, hoster API, `SEpisode.fillermark`,
// combined `getAnimeEpisodeUpdate`, ...) plus the shared host loader
// `animesource/host/AnimeVideoLoader.kt` and the `torrentutils` helper that
// extensions link against. It is a plain copy of files already in the
// repository: no download, no hash. The one file not shared is the lib-17
// `animesource/model/HttpServer.kt`: the sidecar's extends NanoHTTPD, which
// the app does not ship, so the app compiles its own (same FQCN) from
// src/main/kotlin and the loader reports local-server videos as unplayable.
// `util/lang/CoroutinesExtensions.kt` comes along because the anime sources
// import `eu.kanade.tachiyomi.util.lang.awaitSingle`, which Mihon's source-api
// does not provide (its awaitSingle lives in `eu.kanade.tachiyomi.util`).
def aniyomiSourceRoot = rootProject.file("../../third_party/m_extension_server/upstream_src/server/src/main/kotlin")
def aniyomiOverlayRoot = rootProject.file("../../third_party/m_extension_server/overlay/server/src/main/kotlin")
def aniyomiOverlayJavaRoot = rootProject.file("../../third_party/m_extension_server/overlay/server/src/main/java")
def aniyomiSourceOutput = layout.buildDirectory.dir("generated/aniyomiSourceApi")
def prepareAniyomiSourceApi = tasks.register("prepareAniyomiSourceApi", Sync) {
    File upstreamAnime = new File(aniyomiSourceRoot, "eu/kanade/tachiyomi/animesource")
    File overlayAnime = new File(aniyomiOverlayRoot, "eu/kanade/tachiyomi/animesource")
    // Same relative path in both trees: the overlay file replaces the upstream one.
    List<String> overlaid = fileTree(overlayAnime).files.collect { File file ->
        overlayAnime.toPath().relativize(file.toPath()).toString().replace('\\', '/')
    }
    from(upstreamAnime) {
        into "eu/kanade/tachiyomi/animesource"
        exclude overlaid
    }
    from(overlayAnime) {
        into "eu/kanade/tachiyomi/animesource"
        exclude "model/HttpServer.kt"
    }
    from(new File(aniyomiOverlayRoot, "eu/kanade/tachiyomi/torrentutils")) {
        into "eu/kanade/tachiyomi/torrentutils"
    }
    from(new File(aniyomiOverlayJavaRoot, "eu/kanade/tachiyomi/torrentutils")) {
        into "eu/kanade/tachiyomi/torrentutils"
    }
    from(new File(aniyomiSourceRoot, "eu/kanade/tachiyomi/util/lang")) {
        into "eu/kanade/tachiyomi/util/lang"
    }
    include "**/*.kt", "**/*.java"
    into aniyomiSourceOutput
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// TODO-414: one-time migration floor for the Android versionCode. The CI build
// number (--build-number) is the monotonic `git rev-list --count HEAD` commit
// count (see release.yml / main.yml). The shipped versionCode is
//   versionCodeBase + 100 * versionCode + abiOffset
// 1_000_000_000 sits safely above every historically-shipped versionCode
// (the highest ever installed was ~6603) yet leaves ~10.9M commits of headroom
// before the int32 / Android 2.1e9 ceiling, so no user has to uninstall. The
// old `PUBSPEC_BUILD * 1_000_000 + seq` CI formula produced versionCode ~6.6e9,
// which overflowed int32 and exceeded Android's 2.1e9 limit, so beta/release
// Android packages could not be built. The maxVersionCode assertion in
// applicationVariants below fails the build loudly if it ever nears the ceiling.
def versionCodeBase = 1000000000
def maxVersionCode = 2100000000

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def requireReleaseKeystore = {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException("Release signing requires android/key.properties; refusing to build a debug-signed release APK.")
    }
    ["keyAlias", "keyPassword", "storeFile", "storePassword"].each { key ->
        if (!keystoreProperties[key]) {
            throw new GradleException("Release signing property '${key}' is missing in android/key.properties.")
        }
    }
    def releaseStoreFile = file("${rootProject.projectDir}/${keystoreProperties['storeFile']}")
    if (!releaseStoreFile.exists()) {
        throw new GradleException("Release signing storeFile '${keystoreProperties['storeFile']}' does not exist.")
    }
}

// 网页内容核心（native/fushi_web_core：广告拦截 + 漫画章末广告页识别）是硬依赖：Dart 侧没有
// 「缺库判不可用」的分支，Release 包缺 .so 在运行时就是 FushiWebCoreLibraryMissing。按 Flutter
// 传进来的 target-platform 逐 ABI 核对 prebuilt 在不在（build_android_so.* 产出），缺就拒绝出包。
def requireWebCoreSo = {
    def abiOf = ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a', 'android-x64': 'x86_64']
    def platforms = (project.findProperty('target-platform') ?: 'android-arm,android-arm64,android-x64').toString().split(',')
    platforms.each { platform ->
        def abi = abiOf[platform.trim()]
        if (abi == null) {
            return
        }
        def so = file("../../../native/fushi_web_core/prebuilt/android/${abi}/libfushi_web_core.so")
        if (!so.exists()) {
            throw new GradleException("Missing required native library ${so}. Run native/fushi_web_core/build_android_so.{sh,ps1} for ${abi} before building a release APK.")
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }) {
        requireReleaseKeystore()
        requireWebCoreSo()
    }
}

android {
    namespace "app.fushi.reader"
    compileSdk 36
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // v101 统一更新提醒引入 flutter_local_notifications：它自 v10 起用 java.time
        // 做定时通知的向后兼容，**即使只发即时通知也必须开 desugaring**（插件 README
        // 明写）。不开则 Android 构建在 dex 阶段直接失败。
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xcontext-parameters']
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.java.srcDirs += mihonSourceOutput
        main.java.srcDirs += aniyomiSourceOutput
        // 内置 libtorrent 引擎（copy-if-present，与 Windows runner 同姿态）：
        // native/fushi_torrent/build_android_so.{ps1,sh} 产出的
        // prebuilt/android/<abi>/libfushi_torrent_ffi.so 存在则随包；目录缺失时
        // Gradle 静默跳过，app 运行期 EmbeddedTorrentHost.open 因 .so 缺失返回
        // null → 自动回退外接 qBittorrent。构建本身不依赖 vcpkg/NDK 交叉编译。
        main.jniLibs.srcDirs += '../../../native/fushi_torrent/prebuilt/android'
        // 互联 P2P 隧道（iroh，copy-if-present）：native/fushi_p2p/build_android_so.*
        // 产出 prebuilt/android/<abi>/libfushi_p2p.so 则随包；缺失时 P2P 能力判
        // 不可用，其余互联照常。
        main.jniLibs.srcDirs += '../../../native/fushi_p2p/prebuilt/android'
        // SRS 排程内核（fsrs-rs，copy-if-present）：native/fushi_fsrs/build_android_so.*
        // 产出 prebuilt/android/<abi>/libfushi_fsrs.so 则随包；缺失时 SRS 原生内核
        // 判不可用，构建照常。
        main.jniLibs.srcDirs += '../../../native/fushi_fsrs/prebuilt/android'
        // 网页内容核心（fushi_web_core，硬依赖）：native/fushi_web_core/build_android_so.*
        // 产出 prebuilt/android/<abi>/libfushi_web_core.so；Release 构建缺它直接失败
        // （见上面的 requireWebCoreSo），Debug 构建不挡、运行时用到时如实报错。
        main.jniLibs.srcDirs += '../../../native/fushi_web_core/prebuilt/android'
        // 计算内核（哈希 / 图像 / 文本，**硬依赖**）：native/fushi_compute/build_android_so.*
        // 产出 prebuilt/android/<abi>/libfushi_compute.so 随包；本次要出的任一 ABI 缺库时
        // 下面的 checkFushiComputeNative 让构建失败（不像上面几个 copy-if-present 静默跳过）。
        main.jniLibs.srcDirs += '../../../native/fushi_compute/prebuilt/android'
        // RWKV-Instant 排程推理（**硬依赖**，AGPL-3.0-or-later）：native/fushi_rwkv/build_android_so.*
        // 产出 prebuilt/android/<abi>/libfushi_rwkv.so 随包；缺任一 ABI 时 checkFushiRwkvNative 让构建失败。
        main.jniLibs.srcDirs += '../../../native/fushi_rwkv/prebuilt/android'
        // 音乐胖核心（曲库扫描 / 标签 / CUE，**硬依赖**）：native/fushi_music/build_android_so.*
        // 产出 prebuilt/android/<abi>/libfushi_music.so 随包；缺任一 ABI 时 checkFushiMusicNative 让构建失败。
        main.jniLibs.srcDirs += '../../../native/fushi_music/prebuilt/android'
        // 语料胖核心（「我库里的例句」倒排索引，**硬依赖**）：native/fushi_corpus/build_android_so.*
        // 产出 prebuilt/android/<abi>/libfushi_corpus.so 随包；缺任一 ABI 时 checkFushiCorpusNative 让构建失败。
        main.jniLibs.srcDirs += '../../../native/fushi_corpus/prebuilt/android'
    }

    defaultConfig {
        applicationId "app.fushi.reader"
        minSdkVersion 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++23"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            // Flutter 插件不分包时会把 abiFilters 清空后**固定**写回 arm / arm64 / x64 三个，
            // 不看 `--target-platform`；而 target-platform 只管 libflutter/libapp，插件与本仓
            // jniLibs（onnxruntime、ffmpeg、libmpv、各 Rust 内核）于是三 ABI 全进包：调试通道
            // 的 arm64 包曾带着 ~228 MB 起不来的 armeabi-v7a / x86_64 死重（459 MB，BUG-3874）。
            // gradle.properties 用官方开关 `disable-abi-filtering=true` 关掉它那份，这里按
            // target-platform 收（没传时同 Flutter 默认三个，照旧排除第三方带的 32 位 x86）；
            // --split-per-abi 时由 Flutter 设的 splits.abi 管，AGP 不许两者同时设。
            def abiOfPlatform = ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a',
                                 'android-x64': 'x86_64', 'android-x86': 'x86']
            def targetPlatform = (project.findProperty('target-platform') ?: 'android-arm,android-arm64,android-x64').toString()
            def splitPerAbi = project.findProperty('split-per-abi')?.toString()?.toBoolean() ?: false
            if (!splitPerAbi) {
                abiFilters.clear()
                abiFilters.addAll(targetPlatform.split(',')
                    .collect { abiOfPlatform[it.trim()] }.findAll { it != null })
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../../native/fushidicts/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file("${rootProject.projectDir}/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
            }
            // minSdk 24 时 AGP 默认只签 v2（3.0.0 的 APK 实测 v1=false）。华为 HarmonyOS 4.x
            // 安装器 / 安全检测会因没有 JAR（v1）签名报「无证书」并拒装或标可疑（反馈 j3ChbSpKgJ），
            // 显式补上 v1，并同时签 v3 便于日后密钥轮换。
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
        }
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
        pickFirst 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "fushi"
            def buildType = variant.buildType.name
            def architecture = output.getFilter(com.android.build.OutputFile.ABI)
            def newName

            if ("${architecture}" == "arm64-v8a") {
                architecture = "arm64"
            } else if ("${architecture}" == "armeabi-v7a") {
                architecture = "armeabi"
            }

            if ("${architecture}" == "null") {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}.apk"
                }
                // HBK-AUDIT-071: the fat-APK branch computed newName but never
                // applied it, so the fat APK kept the default app-<type>.apk
                // name. Assign it like the split-ABI branch does.
                outputFileName = newName
                def computed = versionCodeBase + (100 * project.android.defaultConfig.versionCode)
                if (computed > maxVersionCode) {
                    throw new GradleException("Android versionCode ${computed} exceeds the ${maxVersionCode} ceiling (int32 / Android limit). Reduce versionCodeBase or the build number; see TODO-414.")
                }
                output.versionCodeOverride = computed
            } else {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}.apk"
                }

                def offset
                if (architecture == "armeabi") {
                    offset = 1
                } else if (architecture == "arm64") {
                    offset = 2
                } else if (architecture == "x86_64") {
                    offset = 3
                }

                outputFileName = newName
                def computed = versionCodeBase + (100 * project.android.defaultConfig.versionCode) + offset
                if (computed > maxVersionCode) {
                    throw new GradleException("Android versionCode ${computed} exceeds the ${maxVersionCode} ceiling (int32 / Android limit). Reduce versionCodeBase or the build number; see TODO-414.")
                }
                output.versionCodeOverride = computed
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // 与 compileOptions 的 coreLibraryDesugaringEnabled 成对；版本对齐
    // flutter_local_notifications 自身 android/build.gradle 里钉的那个。
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.webkit:webkit:1.12.0"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:2.2.20"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.ankidroid:Anki-Android:2.17alpha14'
    implementation 'com.github.umair13adil:RxLogs:v1.0.18'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 设备自带文字识别（漫画 OCR 的轻量兜底引擎，见 SystemOcrChannel.java）。
    //
    // 用 **unbundled**（play-services-mlkit-text-recognition-*）而不是 bundled 的
    // com.google.mlkit:text-recognition-*：后者把四套文字模型塞进 APK，每种约 4 MB、
    // 合计约 16 MB，而这四套里任何一个用户实际只会用到一两套（Fushi 没有全局学习
    // 语言，内容语言由调用方传入，所以又不能只带日文）。unbundled 版模型住在 Google
    // Play 服务里、由系统侧统一保管并在多个 app 之间共享，APK 只带 API 壳。
    //
    // 「安装后不用下载模型」由 AndroidManifest 里的 com.google.mlkit.vision.DEPENDENCIES
    // meta-data 保证：Play 服务在**安装时**就把声明的模型取下来，不是等到第一次识别。
    // 取不下来（无 GMS / 网络不通）时不是静默失败——SystemOcrChannel 把 ML Kit 的
    // UNAVAILABLE 单独映射成 MODEL_UNAVAILABLE，UI 据此说「模型未就绪」而不是「识别失败」。
    // 四种语言都声明，理由同上：不替用户假设学习语言。
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'

    // Mihon extension host ABI/runtime. Versions follow M-Extension-Server
    // v1.0.5.0 and current extensions-lib 1.4/1.6 expectations.
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.3.2'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0'
    implementation 'com.github.null2264.injekt:injekt-core:4135455a2a'
    implementation 'com.github.zhanghai.quickjs-java:quickjs-android:547f5b1597'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation platform('androidx.compose:compose-bom:2026.05.00')
    implementation 'androidx.compose.runtime:runtime'
}

// 计算内核 fushi_compute 是硬依赖：本次构建要出的每个 ABI 都必须已有
// native/fushi_compute/prebuilt/android/<abi>/libfushi_compute.so，否则失败并说明要跑哪个脚本。
// ABI 取 Flutter 传的 target-platform（flutter build / run 总会传；裸 gradle 时 Flutter 插件
// 默认出 arm / arm64 / x64 三个，这里同样按三个查）。
def fushiComputeAndroidDir = file('../../../native/fushi_compute/prebuilt/android')
def fushiComputeAbiOfPlatform = [
    'android-arm'  : 'armeabi-v7a',
    'android-arm64': 'arm64-v8a',
    'android-x64'  : 'x86_64',
    'android-x86'  : 'x86',
]
def checkFushiComputeNative = tasks.register("checkFushiComputeNative") {
    doLast {
        String platforms = (project.findProperty('target-platform') ?: 'android-arm,android-arm64,android-x64').toString()
        List<String> abis = platforms.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
            .collect { fushiComputeAbiOfPlatform[it] ?: it }
        List<String> missing = abis.findAll { abi ->
            !new File(fushiComputeAndroidDir, "${abi}/libfushi_compute.so").isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "fushi_compute is a required native dependency, but libfushi_compute.so is missing for ABI(s) " +
                "${missing.join(', ')} under ${fushiComputeAndroidDir}. Build it first: " +
                "native/fushi_compute/build_android_so.ps1 -Abis ${abis.join(',')} (Windows) or " +
                "bash native/fushi_compute/build_android_so.sh <ndk-root> ${abis.join(' ')} " +
                "(needs Rust + cargo-ndk; see docs/agent/build.md).")
        }
    }
}

// RWKV-Instant 排程推理 fushi_rwkv 与 fushi_compute 同为硬依赖、同一判据（ABI 取法见上）：
// 本次构建要出的每个 ABI 都必须已有 native/fushi_rwkv/prebuilt/android/<abi>/libfushi_rwkv.so。
def fushiRwkvAndroidDir = file('../../../native/fushi_rwkv/prebuilt/android')
def checkFushiRwkvNative = tasks.register("checkFushiRwkvNative") {
    doLast {
        String platforms = (project.findProperty('target-platform') ?: 'android-arm,android-arm64,android-x64').toString()
        List<String> abis = platforms.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
            .collect { fushiComputeAbiOfPlatform[it] ?: it }
        List<String> missing = abis.findAll { abi ->
            !new File(fushiRwkvAndroidDir, "${abi}/libfushi_rwkv.so").isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "fushi_rwkv is a required native dependency, but libfushi_rwkv.so is missing for ABI(s) " +
                "${missing.join(', ')} under ${fushiRwkvAndroidDir}. Build it first: " +
                "native/fushi_rwkv/build_android_so.ps1 -Abis ${abis.join(',')} (Windows) or " +
                "bash native/fushi_rwkv/build_android_so.sh <ndk-root> ${abis.join(' ')} " +
                "(needs Rust + cargo-ndk; see docs/agent/build.md).")
        }
    }
}

