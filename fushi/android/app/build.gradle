tasks.configureEach { task ->
    if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
        task.dependsOn(prepareMihonSourceApi)
        task.dependsOn(prepareAniyomiSourceApi)
    }
    if (task.name == "preBuild") {
        task.dependsOn(checkFushiComputeNative)
        task.dependsOn(checkFushiRwkvNative)
        task.dependsOn(checkFushiMusicNative)
        task.dependsOn(checkFushiCorpusNative)
    }
}
