# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**.freezed.dart'
    - '**.g.dart'
    - '**/generated_plugin_registrant.dart'
    - '**/google_oauth_secret.dart'
    - '**/log_upload_secret.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    deprecated_member_use: ignore
    library_private_types_in_public_api: ignore
    prefer_const_constructors: ignore
    unnecessary_import: warning
    unused_element: warning
    use_build_context_synchronously: warning

linter:
  # Keep analyzer signal useful. Broad style/documentation lints buried real
  # errors under thousands of low-value diagnostics.
  rules:
    always_use_package_imports: true
    avoid_relative_lib_imports: true
    cancel_subscriptions: true
    eol_at_end_of_file: true
    only_throw_errors: true
    prefer_single_quotes: true
    use_rethrow_when_possible: true

# 仓库自己的 analyzer 插件（packages/fushi_lints）：把纯语法 / 纯 import / 纯调用
# 形状的代码不变式做成 lint，随 flutter analyze / dart analyze 与 IDE 一起报。
# 规则都注册成 warning，启用插件即全部生效；豁免写在各规则源码的 Allowance 表里
# （精确到文件与个数，只减不增）。
plugins:
  fushi_lints:
    path: ../packages/fushi_lints
