name: TouchTapper
options:
  bundleIdPrefix: app.fushi.test
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  TouchTapperHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: TouchTapperHost
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        PRODUCT_BUNDLE_IDENTIFIER: app.fushi.test.touchtapperhost
  TouchTapperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TouchTapperHost
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        PRODUCT_BUNDLE_IDENTIFIER: app.fushi.test.touchtapper
schemes:
  TouchTapper:
    build:
      targets:
        TouchTapperHost: all
        TouchTapperUITests: [test]
    test:
      targets: [TouchTapperUITests]
