# tools/browser-extension is the source of truth. These app assets are
# byte-for-byte mirrors maintained by scripts/sync-mirrors.mjs, so counting both
# sides as independent copy-paste blocks makes every extension change duplicate.
#
# The popup bundle is a THREE-way byte-identical mirror:
#   fushi/assets/popup/**            (真源，app 内查词浮窗)
#   tools/browser-extension/vendor/  (扩展分发副本)
#   fushi/assets/browser_extension/vendor/  (随 app 打包的扩展副本)
# 三份的字节级一致由 Dart 守卫 fushi/test/build/browser_extension_popup_parity_guard_test.dart
# 强制，改一份必须同步三份。Sonar 把这种「被守卫强制的镜像」算成 new-code 重复行，
# 会让任何 popup 改动都撞红 Duplicated Lines on New Code —— 那不是可修复的重复，
# 修它只会破坏 parity 守卫。所以整批 vendor 镜像 + popup 真源都排除在 CPD 之外。
sonar.cpd.exclusions=fushi/assets/browser_extension/content.js,fushi/assets/browser_extension/options.html,fushi/assets/browser_extension/options.js,fushi/assets/browser_extension/self-update.js,fushi/assets/browser_extension/stream-bridge.js,fushi/assets/browser_extension/subtitle-adapters.js,fushi/assets/browser_extension/subtitle-panel.js,fushi/assets/browser_extension/video-shortcuts.js,**/vendor/**,fushi/assets/popup/**

# cpp:S959「不要 undef 在源文件之外定义的宏」与本仓强制的不变式直接冲突：
# CI 走 --config Release，MSVC 在该配置下定义 NDEBUG，裸 assert() 会被整条编译掉，
# 测试无论断言对不对都恒绿（BUG-1157 同族）。因此每个 native 测试都必须在任何
# include 之前 `#undef NDEBUG`，由 native/galgame_hook/tests/assert_liveness_guard_test.py
# 强制、并已接进 tools/run_guards.ps1（BUG-2025）。守卫要求写的这一行正好是 S959 要
# 挡的写法，于是**每新增一个 native 测试文件都会踩红 new-code 可维护性评分**——
# 那不是可修复的问题，修它等于把 47 条断言重新变成空跑。范围只收到这一个目录 +
# 这一条规则，其它位置的 #undef 仍会被正常报出来。
sonar.issue.ignore.multicriteria=undefndebug,lockfreeorder
sonar.issue.ignore.multicriteria.undefndebug.ruleKey=cpp:S959
sonar.issue.ignore.multicriteria.undefndebug.resourceKey=native/galgame_hook/tests/**

# cpp:S8417「显式 memory_order 一律换成 seq_cst」对本目录是错的建议。
# native/galgame_hook 的 host↔注入进程共享内存是**真无锁**结构：
#   voice_hook_ipc.h 的 admission/请求字是 seqlock（WriteInProgress 位 + 序号），
#   hunex_gge_capture_bridge.h 顶上就是 static_assert(is_always_lock_free)，
#   槽位发布走 compare_exchange_strong(acq_rel, acquire) + release/relaxed store。
# acquire/release 是这里的**语义**，不是随手写的优化：它标明了哪一对读写构成
# happens-before。全量改成 seq_cst 会在每个写点插入全序屏障（x86 上是 lock 前缀 /
# mfence），把逐字形高频路径的开销抬上去，而且把「这一处为什么只要 release」这条
# 信息从代码里抹掉——真出内存序 bug 时反而无从判读。
# 这条规则在本仓贡献了 8100 分钟技术债（占 galgame native 新代码总债的 83.6%），
# 单方面把 new-code 可维护性评分从 1 拉到 2，而它指出的每一处都不是缺陷。
# 范围只收到这一个目录；其它地方的裸 memory_order 仍会被正常报出来。
sonar.issue.ignore.multicriteria.lockfreeorder.ruleKey=cpp:S8417
sonar.issue.ignore.multicriteria.lockfreeorder.resourceKey=native/galgame_hook/**
