# tools/browser-extension is the source of truth. These app assets are
# byte-for-byte mirrors maintained by scripts/sync-mirrors.mjs, so counting both
# sides as independent copy-paste blocks makes every extension change duplicate.
sonar.cpd.exclusions=fushi/assets/browser_extension/content.js,fushi/assets/browser_extension/options.html,fushi/assets/browser_extension/options.js,fushi/assets/browser_extension/self-update.js,fushi/assets/browser_extension/stream-bridge.js,fushi/assets/browser_extension/subtitle-adapters.js,fushi/assets/browser_extension/subtitle-panel.js,fushi/assets/browser_extension/video-shortcuts.js
