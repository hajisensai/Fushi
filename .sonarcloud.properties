# tools/browser-extension is the source of truth. These app assets are
# byte-for-byte mirrors maintained by scripts/sync-mirrors.mjs, so counting both
# sides as independent copy-paste blocks makes every extension change duplicate.
#
# The popup bundle is a THREE-way byte-identical mirror:
#   fushi/assets/popup/**            (真源，app 内查词浮窗)
#   tools/browser-extension/vendor/  (扩展分发副本)
#   fushi/assets/browser_extension/vendor/  (随 app 打包的扩展副本)
# 三份的字节级一致由 Dart 守卫 fushi/test/build/browser_extension_popup_parity_guard_test.dart
# 强制，改一份必须同步三份。Sonar 把这种「被守卫强制的镜像」算成 new-code 重复行，
# 会让任何 popup 改动都撞红 Duplicated Lines on New Code —— 那不是可修复的重复，
# 修它只会破坏 parity 守卫。所以整批 vendor 镜像 + popup 真源都排除在 CPD 之外。
sonar.cpd.exclusions=fushi/assets/browser_extension/content.js,fushi/assets/browser_extension/options.html,fushi/assets/browser_extension/options.js,fushi/assets/browser_extension/self-update.js,fushi/assets/browser_extension/stream-bridge.js,fushi/assets/browser_extension/subtitle-adapters.js,fushi/assets/browser_extension/subtitle-panel.js,fushi/assets/browser_extension/video-shortcuts.js,**/vendor/**,fushi/assets/popup/**

# 为什么这里没有「规则级屏蔽」：本仓走的是 SonarCloud **Automatic Analysis**
# （`.github/workflows` 下没有任何 sonar workflow，分析由 SonarCloud GitHub App
# 直接跑）。该模式只认下面这一小撮属性，`sonar.issue.ignore.*` **不在其中**：
#   sonar.sources / exclusions / inclusions / tests / test.exclusions /
#   test.inclusions / sourceEncoding / cpd.exclusions / python.version /
#   cfamily.reportingCppStandardOverride
# 上面那条 CPD 排除能生效，正是因为 sonar.cpd.exclusions 在列表里。
#
# 实测（2026-09-02，PR#1116）：往本文件加 sonar.issue.ignore.multicriteria 屏蔽
# cpp:S959 与 cpp:S8417，重跑分析后两条规则的命中数纹丝不动（135 / 2），确认不生效。
# 所以**不要**再往这里加 issue-ignore 属性。真要关某条规则只有两条路：
#   1. 在 SonarCloud 网页端改本项目的 Quality Profile（需要项目管理员）；
#   2. 改成 CI 内跑 sonar-scanner + sonar-project.properties（那边支持 issue 排除）。
#
# 已知与本仓不变式冲突、但目前无法屏蔽的规则，记在这里免得反复重查：
# - cpp:S959「不要 undef 外部定义的宏」 ←→ 每个 native 测试都必须在 include 之前
#   `#undef NDEBUG`（否则 CI 的 --config Release 把裸 assert 整条编译掉，测试恒绿），
#   由 native/galgame_hook/tests/assert_liveness_guard_test.py 强制（BUG-2025）。
# - cpp:S8417「显式 memory_order 换成 seq_cst」 ←→ native/galgame_hook 的共享内存是
#   真无锁结构（static_assert(is_always_lock_free) + compare_exchange(acq_rel,
#   acquire) + seqlock），acquire/release 是语义不是优化。
