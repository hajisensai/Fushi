<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>词语星图</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--sky:#04060d;--ink:#e8ecf7;--muted:#8c94ad;--line:rgba(160,175,220,.16);--glass:rgba(12,16,30,.8);--gold:#ffe3a1;--cyan:#7fe3ff;
  --f-word:"Shippori Mincho","Yu Mincho",serif;--f-ui:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-ui);overflow:hidden;font-size:14px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:fixed;z-index:5}
#top{top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:16px;pointer-events:none}
#top>*{pointer-events:auto}
h1{margin:0;font-family:var(--f-word);font-size:22px;letter-spacing:.08em}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.warn{color:#ffb38a;font-size:12px;margin-top:6px;max-width:520px;line-height:1.5}
button{font:inherit;font-size:12px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:rgba(200,215,255,.4)}
#bar{left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#slider{flex:1;min-width:140px;accent-color:var(--gold)}
#clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:170px}
#hint{font-size:11px;color:var(--muted);width:100%}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-family:var(--f-word);white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000;font-weight:500}
.lbl.hub{color:var(--gold);font-weight:700}.lbl.sel{color:#fff;font-weight:700;font-size:18px!important}.lbl.rel{color:var(--cyan)}
.wlbl{position:absolute;left:0;top:0;text-align:center;font-size:12px;white-space:nowrap;text-shadow:0 0 6px #000;cursor:pointer;opacity:0}
#zoom{right:16px;bottom:64px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:36px;height:36px;padding:0;font-size:18px;line-height:1}
.wlbl b{font-family:var(--f-word);font-size:14px;display:block}
.wlbl em{font-style:normal;color:var(--muted)}
#panel{position:fixed;z-index:6;top:100px;right:16px;width:350px;max-height:calc(100% - 190px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:18px;backdrop-filter:blur(14px)}
#panel .w{font-family:var(--f-word);font-size:38px;font-weight:700}
#panel .r{color:var(--muted);font-size:13px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.tag.gold{color:var(--gold)}
.sec{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:16px 0 8px}
.occ{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.occ.cur{background:linear-gradient(90deg,rgba(127,227,255,.08),transparent)}
.occ .loc{font-size:12px;color:var(--muted)}
.occ .s{grid-column:1/-1;font-family:var(--f-word);font-size:14px;line-height:1.6;color:#cdd3e6}
.occ .s mark{background:none;color:#fff;border-bottom:1px solid var(--gold)}
.rels{display:flex;flex-wrap:wrap;gap:6px}.rels button{font-family:var(--f-word);font-size:14px;color:var(--cyan);padding:3px 9px}
#close{position:absolute;top:10px;right:10px;padding:2px 8px}
#toast{position:fixed;z-index:9;left:50%;bottom:84px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;transition:opacity .3s;opacity:0;pointer-events:none}
</style>
<canvas id="c"></canvas>
<div id="labels"></div>
<div class="hud" id="top">
  <div><h1>词语星图</h1><div class="sub" id="stats"></div><div class="warn" id="warn"></div></div>
  <div style="text-align:right"><div id="legend" style="display:flex;gap:12px;font-size:12px;color:var(--muted);justify-content:flex-end;flex-wrap:wrap;margin-bottom:8px"></div><button id="home" type="button">回到全景</button></div>
</div>
<div class="hud" id="bar">
  <button id="play" type="button">▶ 回放生长</button>
  <input id="slider" type="range" min="0" max="1000" value="1000" aria-label="时间轴">
  <div id="clock"></div>
  <div id="hint">拖动旋转 · 滚轮 / 双击 / ＋− 朝光标处缩放 · 点星团名飞过去 · 点星看出处 · 金色是桥星</div>
</div>
<div class="hud" id="zoom"><button id="zin" type="button" aria-label="放大">＋</button><button id="zout" type="button" aria-label="缩小">−</button></div>
<aside id="panel" hidden><button id="close" type="button">✕</button><div id="pbody"></div></aside>
<div id="toast"></div>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" integrity="sha384-wagZhIFgY4hD+7awjQjR4e2E294y6J2HSnd8eTNc15ZubTeQeVRZwhQJ+W6hnBsf" crossorigin="anonymous"></script>
<script>
(() => {
const KINDS={video:{name:'视频',color:'#6ec3ff'},manga:{name:'漫画',color:'#ff8fb1'},book:{name:'书',color:'#f2cf6b'},game:{name:'游戏',color:'#a493ff'},music:{name:'音乐',color:'#5fe0b5'},audiobook:{name:'有声书',color:'#ff9f5a'},lyrics:{name:'歌词',color:'#5fe0b5'}};
const D=window.STARFIELD_DATA;
const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(7);
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);};
const ss=(e0,e1,x)=>{const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);};

// ── 数据：每颗星 = 一张真实的卡；同一部作品的卡聚成一个星团 ──
const works=D.works.map(w=>({...w,cards:[]}));
const words=new Map();
const cards=D.cards.map((c,i)=>{
  const w=works[c.w];const card={...c,i,work:w,pos:new THREE.Vector3()};
  w.cards.push(card);
  if(!words.has(c.word))words.set(c.word,{word:c.word,reading:c.reading,cards:[]});
  words.get(c.word).cards.push(card);return card;
});
// 星团布局：卡多的作品离中心近；整体是一个略扁的盘，像一片星系
const order=[...works].sort((a,b)=>b.n-a.n);
order.forEach((w,i)=>{const a=i*2.39996,r=18+Math.sqrt(i)*78;
  w.center=new THREE.Vector3(Math.cos(a)*r,gauss()*26,Math.sin(a)*r);
  w.rad=6+Math.sqrt(w.n)*2.1;});
// 星团内部：钟形分布（中心密、边缘疏），像疏散星团
works.forEach(w=>w.cards.forEach(c=>{
  c.pos.set(gauss(),gauss()*.75,gauss()).multiplyScalar(w.rad*.55).add(w.center);
  c.seed=R()*100;
}));
cards.forEach(c=>c.mem=c.stab?Math.min(1,Math.log(1+c.stab)/Math.log(1+120)):0);
const hubs=[];
words.forEach(w=>{const ws=[...new Set(w.cards.map(c=>c.work))];w.isBridge=ws.length>1;
  w.kanji=new Set([...w.word].filter(ch=>/[一-鿿]/.test(ch)));
  if(w.isBridge){
    // 桥星：放在它连接的那几颗星的重心，往盘面上方抬一点
    const p=new THREE.Vector3();w.cards.forEach(c=>p.add(c.pos));p.divideScalar(w.cards.length);p.y+=14+R()*10;
    w.hub={pos:p,word:w,born:w.cards.map(c=>c.t).sort((a,b)=>a-b)[1],n:ws.length,seed:R()*100};hubs.push(w.hub);}});
const related=w=>{const o=[];words.forEach(x=>{if(x!==w&&[...x.kanji].some(k=>w.kanji.has(k)))o.push(x);});return o.slice(0,40);};

// ── three ──
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color('#03050b');
const camera=new THREE.PerspectiveCamera(50,1,.5,6000);
const HOME_POS=new THREE.Vector3(0,300,640),HOME_TARGET=new THREE.Vector3(0,0,0);
camera.position.copy(HOME_POS);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.rotateSpeed=.55;controls.enableZoom=false;  // 缩放自己做，见下
controls.target.copy(HOME_TARGET);

// 真实星点：锐利星芯 + 淡光晕；亮星（记忆稳的、桥星）带十字星芒；轻微闪烁。
// 屏幕尺寸有上下限：走近时星不会膨胀成光斑，走远时也不会消失。
const VS=`attribute vec3 aColor;attribute float aMag;attribute float aAlpha;attribute float aSeed;attribute float aSpike;
uniform float uScale;uniform float uTime;varying vec3 vC;varying float vA;varying float vS;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.);
 float tw=.82+.18*sin(uTime*(1.3+fract(aSeed)*2.2)+aSeed*6.28);
 float px=aMag*uScale/-mv.z;
 gl_PointSize=clamp(px,4.,16.+aSpike*22.);
 gl_Position=projectionMatrix*mv;
 vC=aColor;vA=aAlpha*tw;vS=aSpike;}`;
const FS=`varying vec3 vC;varying float vA;varying float vS;
void main(){vec2 c=gl_PointCoord-.5;float d=length(c)*2.;
 float core=exp(-d*d*38.);float halo=exp(-d*d*8.)*.75+exp(-d*d*2.)*.16;
 float spike=(exp(-abs(c.x)*90.)*exp(-abs(c.y)*7.)+exp(-abs(c.y)*90.)*exp(-abs(c.x)*7.))*vS;
 vec3 col=vC*(halo+spike*.9)+vec3(1.)*core;float a=(core+halo+spike)*vA;
 if(a<.004)discard;gl_FragColor=vec4(col*vA,1.);}`;
const N=cards.length+hubs.length;const g=new THREE.BufferGeometry();
const at=(n,s)=>{const a=new THREE.BufferAttribute(new Float32Array(N*s),s);a.setUsage(THREE.DynamicDrawUsage);g.setAttribute(n,a);return a;};
const A={pos:at('position',3),col:at('aColor',3),mag:at('aMag',1),alpha:at('aAlpha',1),seed:at('aSeed',1),spike:at('aSpike',1)};
hubs.forEach((h,j)=>h.i=cards.length+j);
cards.forEach(c=>{A.pos.setXYZ(c.i,c.pos.x,c.pos.y,c.pos.z);A.seed.setX(c.i,c.seed);});
hubs.forEach(h=>{A.pos.setXYZ(h.i,h.pos.x,h.pos.y,h.pos.z);A.seed.setX(h.i,h.seed);});
const mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,uniforms:{uScale:{value:1},uTime:{value:0}},transparent:true,depthWrite:false,blending:THREE.CustomBlending,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor});
const stars=new THREE.Points(g,mat);stars.frustumCulled=false;scene.add(stars);
const bl=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xffe3a1,transparent:true,opacity:.16,depthWrite:false}));
const blBuf=new Float32Array(cards.length*6);bl.geometry.setAttribute('position',new THREE.BufferAttribute(blBuf,3));bl.frustumCulled=false;scene.add(bl);
const kl=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x7fe3ff,transparent:true,opacity:.65,depthWrite:false}));
const klBuf=new Float32Array(400*6);kl.geometry.setAttribute('position',new THREE.BufferAttribute(klBuf,3));kl.frustumCulled=false;scene.add(kl);

const tMin=cards[0].t-86400000,tMax=cards[cards.length-1].t+3600000;
let now=Infinity,playing=false,playStart=0,playFrom=0;const PLAY_MS=28000;
let sel=null,selCard=null,rel=[],hover=null,fly=null;
const tmp=new THREE.Vector3(),c3=new THREE.Color(),WHITE=new THREE.Color(1,1,1),GOLD=new THREE.Color('#ffe3a1');
// 星色：种类色往白偏一些，像真实恒星的淡彩
works.forEach(w=>w.kcol=new THREE.Color((KINDS[w.kind]||KINDS.video).color).lerp(WHITE,.3));
function update(ts){
  const flashSpan=(tMax-tMin)*.012;
  works.forEach(w=>w.lit=0);
  cards.forEach(c=>{
    const vis=c.t<=now,flash=vis&&now!==Infinity?Math.max(0,1-(now-c.t)/flashSpan):0;
    const bridge=words.get(c.word).isBridge,on=sel&&sel.word===c.word;
    c3.copy(bridge?GOLD:c.work.kcol).lerp(WHITE,flash*.8);
    A.col.setXYZ(c.i,c3.r,c3.g,c3.b);
    A.mag.setX(c.i,(1.4+2.2*c.mem+(bridge?1.6:0))*(1+flash*2)*(on?2:1));
    A.alpha.setX(c.i,vis?Math.min(1,.55+.45*c.mem+flash+(on?.5:0)):0);
    A.spike.setX(c.i,Math.max(bridge?.8:0,ss(.7,1,c.mem)*.7,flash,on?1:0));
    if(vis)c.work.lit++;
  });
  hubs.forEach(h=>{const vis=h.born<=now;A.col.setXYZ(h.i,GOLD.r,GOLD.g,GOLD.b);A.mag.setX(h.i,(4+1.6*h.n)*(sel===h.word?1.5:1));A.alpha.setX(h.i,vis?1:0);A.spike.setX(h.i,1);});
  ['col','mag','alpha','spike'].forEach(k=>A[k].needsUpdate=true);
  mat.uniforms.uTime.value=ts/1000;
  let b=0;hubs.forEach(h=>{if(h.born>now)return;h.word.cards.forEach(c=>{if(c.t>now)return;blBuf.set([h.pos.x,h.pos.y,h.pos.z,c.pos.x,c.pos.y,c.pos.z],b);b+=6;});});
  bl.geometry.attributes.position.needsUpdate=true;bl.geometry.setDrawRange(0,b/3);
  let k=0;if(sel){const from=selCard?selCard.pos:(sel.hub?sel.hub.pos:sel.cards[0].pos);
    rel.forEach(o=>{(o.hub&&o.hub.born<=now?[o.hub.pos]:o.cards.filter(c=>c.t<=now).map(c=>c.pos)).forEach(p=>{if(k<klBuf.length-6){klBuf.set([from.x,from.y,from.z,p.x,p.y,p.z],k);k+=6;}});});}
  kl.geometry.attributes.position.needsUpdate=true;kl.geometry.setDrawRange(0,k/3);
}

// ── 标签 ──
const labelsEl=document.getElementById('labels');const pool=[];
for(let i=0;i<160;i++){const d=document.createElement('div');d.className='lbl';d.style.opacity=0;labelsEl.appendChild(d);pool.push(d);}
const wl=works.map(w=>{const d=document.createElement('div');d.className='wlbl';d.onclick=()=>flyToWork(w);labelsEl.appendChild(d);return d;});
let W=1,H=1;const screen=new Float32Array(N*3);
const project=p=>{tmp.copy(p).project(camera);return tmp.z<1&&tmp.z>-1?[(tmp.x*.5+.5)*W,(-tmp.y*.5+.5)*H]:null;};
function drawLabels(){
  const relSet=new Set(rel),cand=[];
  for(let i=0;i<N;i++){
    const isHub=i>=cards.length,o=isHub?hubs[i-cards.length]:cards[i];
    const vis=isHub?o.born<=now:o.t<=now;const pr=vis?project(o.pos):null;
    screen[i*3]=pr?pr[0]:-1e4;screen[i*3+1]=pr?pr[1]:-1e4;screen[i*3+2]=pr?1:0;
    if(!pr||pr[0]<-40||pr[0]>W+40||pr[1]<-20||pr[1]>H+20)continue;
    const w=isHub?o.word:words.get(o.word);const forced=sel===w||relSet.has(w)||hover===i;
    const d=camera.position.distanceTo(o.pos);
    // 词标签只在够近时出现（桥星远一点也显示）
    const tv=ss(isHub?520:260,isHub?260:120,d);
    if(!forced&&tv<.05)continue;cand.push({o,isHub,w,pr,forced,d,tv});
  }
  cand.sort((a,b)=>(b.forced-a.forced)||(a.d-b.d));
  const taken=new Set();let k=0;
  for(const c of cand){if(k>=pool.length)break;
    const key=Math.floor(c.pr[0]/70)+','+Math.floor(c.pr[1]/18);
    if(!c.forced&&taken.has(key))continue;taken.add(key);
    const el=pool[k++];
    const cls='lbl'+(c.isHub?' hub':'')+(sel===c.w&&(!selCard||selCard===c.o||c.isHub)?' sel':relSet.has(c.w)?' rel':'');
    if(el.className!==cls)el.className=cls;if(el.textContent!==c.w.word)el.textContent=c.w.word;
    const fs=Math.max(10,Math.min(16,900/c.d));el.style.fontSize=fs+'px';
    el.style.color=(!c.isHub&&sel!==c.w&&!relSet.has(c.w))?(c.w.isBridge?'#ffe3a1':(KINDS[c.o.work.kind]||KINDS.video).color):'';
    el.style.opacity=c.forced?1:c.tv;
    el.style.transform=`translate(${c.pr[0]+7}px,${c.pr[1]-fs*.6}px)`;}
  for(;k<pool.length;k++)pool[k].style.opacity=0;
  // 星团名：像星座名一样标在星团上方；走进星团内部后淡出
  // 卡多的作品先占位，与已放下的名字重叠就不显示
  const placed=[];
  [...works].sort((a,b)=>b.lit-a.lit).forEach(w=>{const el=wl[works.indexOf(w)];const pr=project(tmp.copy(w.center).add(new THREE.Vector3(0,w.rad*.9,0)));
    const d=camera.position.distanceTo(w.center);
    const bw=Math.min(260,w.title.length*13)/2,box=pr&&[pr[0]-bw,pr[1]-34,pr[0]+bw,pr[1]];
    if(!pr||w.lit===0||pr[0]<-80||pr[0]>W+80||placed.some(b=>b[0]<box[2]&&box[0]<b[2]&&b[1]<box[3]&&box[1]<b[3])){el.style.opacity=0;el.style.pointerEvents='none';return;}
    placed.push(box);
    const op=ss(w.rad*1.2,w.rad*3,d);
    el.style.opacity=op;el.style.pointerEvents=op>.3?'auto':'none';
    el.innerHTML=`<b>${esc(w.title)}</b><em>${w.lit} 颗星</em>`;
    el.style.transform=`translate(calc(${pr[0]}px - 50%),calc(${pr[1]}px - 100%))`;});
}

// ── 视角：拖动旋转；滚轮 / 触控板 / 按钮 / 键盘缩放都朝光标所指处平滑推进 ──
const MIN_D=6,MAX_D=1800;
let goal=null;  // {pos,target}：缩放的目标视角，每帧向它缓动
const viewDir=new THREE.Vector3(),ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const vcam=camera.clone();
function anchorAt(x,y,pos,target){
  // 连续滚动时视角还在缓动，锚点必须按「缩放目标视角」算，不能按当前相机算，否则光标下的东西会漂
  vcam.copy(camera);vcam.position.copy(pos);vcam.lookAt(target);vcam.updateMatrixWorld();
  // 光标附近有星就以那颗星为锚
  let best=null,bd=24*24;
  for(let i=0;i<N;i++){const o=i>=cards.length?hubs[i-cards.length]:cards[i];if((i>=cards.length?o.born:o.t)>now)continue;
    tmp.copy(o.pos).project(vcam);if(tmp.z>1||tmp.z<-1)continue;
    const dx=(tmp.x*.5+.5)*W-x,dy=(-tmp.y*.5+.5)*H-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=o.pos;}}
  if(best)return best.clone();
  // 否则取光标射线与「过目标点、垂直视线」平面的交点
  ndc.set(x/W*2-1,-(y/H)*2+1);ray.setFromCamera(ndc,vcam);
  vcam.getWorldDirection(viewDir);
  const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(viewDir,target);
  const hit=new THREE.Vector3();return ray.ray.intersectPlane(plane,hit)?hit:target.clone();
}
function zoomBy(factor,x,y){
  fly=null;
  const pos=goal?goal.pos.clone():camera.position.clone(),target=goal?goal.target.clone():controls.target.clone();
  const d=pos.distanceTo(target),nd=Math.min(MAX_D,Math.max(MIN_D,d*factor)),k=nd/d;
  const anchor=anchorAt(x,y,pos,target);
  // 相机与目标点都朝锚点按同一比例收拢 → 光标下的东西停在光标下
  pos.sub(anchor).multiplyScalar(k).add(anchor);target.sub(anchor).multiplyScalar(k).add(anchor);
  goal={pos,target};
}
canvas.addEventListener('wheel',e=>{e.preventDefault();
  // 鼠标滚轮一格 ≈ 走 18%；触控板 / 捏合（ctrlKey）的 delta 小而密，同一公式自然更细
  const dy=e.deltaMode===1?e.deltaY*33:e.deltaY;
  zoomBy(Math.exp(Math.max(-300,Math.min(300,dy))*(e.ctrlKey?.01:.0017)),e.clientX,e.clientY);},{passive:false});
document.getElementById('zin').onclick=()=>zoomBy(.6,W/2,H/2);
document.getElementById('zout').onclick=()=>zoomBy(1/.6,W/2,H/2);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='+'||e.key==='=')zoomBy(.7,W/2,H/2);else if(e.key==='-'||e.key==='_')zoomBy(1/.7,W/2,H/2);});
canvas.addEventListener('pointerdown',()=>{goal=null;});  // 拖动时放弃未完成的缩放缓动

const nearest=(x,y,m)=>{let best=-1,bd=m*m;for(let i=0;i<N;i++){if(!screen[i*3+2])continue;const dx=screen[i*3]-x,dy=screen[i*3+1]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}return best;};
function startFly(toP,toT,dur){goal=null;fly={t0:performance.now(),dur,fromP:camera.position.clone(),fromT:controls.target.clone(),toP,toT};}
function flyTo(target,dist){const dir=camera.position.clone().sub(controls.target).normalize();startFly(target.clone().addScaledVector(dir,dist),target.clone(),1100);}
function flyToWork(w){flyTo(w.center,w.rad*3.2);}
// 调试钩子：__fly(作品下标) 飞到星团；__zoom(倍数) 以屏幕中心缩放
window.__fly=i=>flyToWork(works[i]);window.__zoom=f=>zoomBy(f,W/2,H/2);window.__sf={works,camera,controls};
let down=null;
canvas.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
addEventListener('pointerup',e=>{if(!down)return;const m=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(m>6||e.target!==canvas)return;
  const i=nearest(e.clientX,e.clientY,16);if(i<0)return;
  if(i>=cards.length)select(hubs[i-cards.length].word,null);else select(words.get(cards[i].word),cards[i]);});
canvas.addEventListener('dblclick',e=>zoomBy(.45,e.clientX,e.clientY));
canvas.addEventListener('pointermove',e=>{if(down)return;const i=nearest(e.clientX,e.clientY,14);hover=i>=0?i:null;canvas.style.cursor=i>=0?'pointer':'grab';});
document.getElementById('home').onclick=()=>startFly(HOME_POS.clone(),HOME_TARGET.clone(),1300);
const panel=document.getElementById('panel'),pbody=document.getElementById('pbody');
document.getElementById('close').onclick=()=>{sel=null;selCard=null;rel=[];panel.hidden=true;};
const hl=(s,w)=>esc(s).split(esc(w)).join(`<mark>${esc(w)}</mark>`);
function select(w,card){sel=w;selCard=card;rel=related(w);
  const ws=[...new Set(w.cards.map(c=>c.work))];
  pbody.innerHTML=`<div class="w">${esc(w.word)}</div><div class="r">${esc(w.reading)}</div>
   <div class="tags">${w.hub?`<span class="tag gold">桥星 · 连接 ${ws.length} 部作品</span>`:''}${ws.map(x=>`<span class="tag">${esc(x.title)}</span>`).join('')}</div>
   <div class="sec">出现位置 · ${w.cards.length}</div>
   ${w.cards.map((c,k)=>`<div class="occ${c===card?' cur':''}"><div>${esc(c.work.title)}<div class="loc">${esc(c.loc)}${c.ep?' · '+esc(c.ep):''} · ${new Date(c.t).toLocaleDateString('zh-CN')} 制卡</div></div>
     <button type="button" data-k="${k}">跳回原处</button><div class="s">${hl(c.sent,c.word)}</div></div>`).join('')}
   ${rel.length?`<div class="sec">共享汉字 · ${rel.length}</div><div class="rels">${rel.map(o=>`<button type="button" data-w="${esc(o.word)}">${esc(o.word)}</button>`).join('')}</div>`:''}`;
  pbody.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const c=w.cards[+b.dataset.k];toast(`将打开《${c.work.title}》${c.loc}（预览里不跳转）`);});
  pbody.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const o=words.get(b.dataset.w);select(o,o.cards[0]);flyTo(o.hub?o.hub.pos:o.cards[0].pos,60);});
  panel.hidden=false;}
let tt;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200);}
const playBtn=document.getElementById('play'),slider=document.getElementById('slider'),clock=document.getElementById('clock');
function setPlaying(p){playing=p;playBtn.textContent=p?'❚❚ 暂停':'▶ 回放生长';if(p){if(now===Infinity||now>=tMax)now=tMin;playFrom=now;playStart=performance.now();}}
playBtn.onclick=()=>setPlaying(!playing);
slider.oninput=()=>{setPlaying(false);const v=+slider.value/1000;now=v>=1?Infinity:tMin+v*(tMax-tMin);};
document.getElementById('stats').textContent=`${cards.length} 颗星 = ${cards.length} 张卡 · ${words.size} 个词 · ${works.length} 部作品 · ${hubs.length} 颗桥星`;
document.getElementById('warn').textContent=`从 ${new Date(cards[0].t).toLocaleDateString('zh-CN')} 第一张卡起的全部制卡（取自本机 SRS 牌组）。每个光点都是一张卡；亮度 = 记忆稳定度，最稳的带星芒。`;
document.getElementById('legend').innerHTML=[...new Set(works.map(w=>w.kind))].map(k=>`<span><span style="color:${(KINDS[k]||KINDS.video).color}">●</span> ${(KINDS[k]||KINDS.video).name}</span>`).join('')+'<span><span style="color:#ffe3a1">●</span> 桥星</span>';
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();mat.uniforms.uScale.value=H*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));}
addEventListener('resize',resize);resize();
function frame(ts){
  if(playing){now=playFrom+(ts-playStart)/PLAY_MS*(tMax-tMin);if(now>=tMax){now=Infinity;setPlaying(false);}slider.value=now===Infinity?1000:Math.round((now-tMin)/(tMax-tMin)*1000);}
  if(fly){const k=Math.min(1,(ts-fly.t0)/fly.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(fly.fromP,fly.toP,e);controls.target.lerpVectors(fly.fromT,fly.toT,e);if(k>=1)fly=null;}
  if(goal){camera.position.lerp(goal.pos,.16);controls.target.lerp(goal.target,.16);
    if(camera.position.distanceToSquared(goal.pos)<1e-4)goal=null;}
  controls.update();update(ts);renderer.render(scene,camera);drawLabels();
  const lit=now===Infinity?cards.length:cards.filter(c=>c.t<=now).length;clock.textContent=`${now===Infinity?'今天':new Date(now).toLocaleDateString('zh-CN')} · 第 ${lit} 颗星`;
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
