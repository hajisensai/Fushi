<!DOCTYPE html>
<!-- TODO-1184：点浏览器工具栏 Hibiki 图标弹出的「制卡队列管理」菜单。
     站点无关的 browser-action popup（default_popup），普通网页 / Netflix / YouTube 都能点开。
     和 vendor/popup.html（查词渲染壳，注入到宿主页 #entries-container）是两回事，别混。
     设了 default_popup 后 chrome.action.onClicked 永不触发，故「开始生成/录制」入口迁到这里的
     按钮（按钮点击即用户手势 → 发消息给 background 跑原 hibikiIconClick 逻辑）。 -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      width: 320px;
      font: 13px/1.5 "Hiragino Sans", "Segoe UI", sans-serif;
      background: #1d211d;
      color: #eaebe5;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f0f1ec; color: #1a1c19; }
    }
    .hp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px 8px;
    }
    .hp-title { font-weight: 600; }
    .hp-count { opacity: 0.7; font-size: 12px; }
    .hp-gen {
      display: block;
      width: calc(100% - 28px);
      margin: 4px 14px 12px;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #386a58;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .hp-gen:hover { filter: brightness(1.08); }
    .hp-gen:active { opacity: 0.7; }
    .hp-list { max-height: 320px; overflow-y: auto; padding: 0 6px 8px; }
    .hp-list-title { padding: 6px 8px 4px; font-size: 11px; font-weight: 600; opacity: 0.55; text-transform: none; }
    .hp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .hp-row:hover { background: rgba(128, 128, 128, 0.16); }
    .hp-row-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .hp-row-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* TODO-1270：暗色上下文句子行，让同句不同词的卡片区分开又保留语境。 */
    .hp-row-sub {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      opacity: 0.55;
    }
    .hp-row-site { opacity: 0.55; font-size: 11px; margin-right: 2px; align-self: flex-start; margin-top: 1px; }
    .hp-del {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.6;
    }
    .hp-del:hover { background: rgba(211, 47, 47, 0.85); color: #fff; opacity: 1; }
    .hp-empty { padding: 20px 14px 24px; text-align: center; opacity: 0.6; }
    .hp-connection {
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      margin: 0 14px 10px;
      padding: 9px 10px;
      border: 1px solid rgba(128, 128, 128, 0.25);
      border-radius: 8px;
      background: rgba(128, 128, 128, 0.08);
    }
    .hp-connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #d49a42; }
    .hp-connection[data-tone="good"] .hp-connection-dot { background: #78c79f; }
    .hp-connection[data-tone="danger"] .hp-connection-dot { background: #e06f68; }
    .hp-connection-copy { min-width: 0; }
    .hp-connection-title { display: block; overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .hp-connection-detail { display: block; overflow: hidden; margin-top: 1px; opacity: .55; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .hp-settings-link { border: 0; padding: 4px; color: inherit; background: transparent; cursor: pointer; opacity: .72; }
    .hp-settings-link:hover { opacity: 1; }
    /* TODO-1219：网飞字幕列表面板开关（扩展弹窗入口，方案 B）。独立页脚区，不属于上方 1270 制卡队列。 */
    .hp-settings { border-top: 1px solid rgba(128, 128, 128, 0.22); padding: 10px 14px 12px; }
    .hp-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .hp-toggle input { flex: 0 0 auto; margin: 0; }
    .hp-toggle-text { flex: 1 1 auto; }
    .hp-toggle-hint { margin: 4px 0 0 24px; font-size: 11px; opacity: 0.55; }
  </style>
</head>
<body>
  <div class="hp-header">
    <span class="hp-title">Hibiki 制卡队列</span>
    <span class="hp-count" id="hp-count"></span>
  </div>
  <div class="hp-connection" id="hp-connection" data-tone="loading" title="点击齿轮打开完整设置">
    <span class="hp-connection-dot" aria-hidden="true"></span>
    <span class="hp-connection-copy">
      <span class="hp-connection-title" id="hp-connection-title">正在检测 Hibiki…</span>
      <span class="hp-connection-detail" id="hp-connection-detail">查词与字幕服务</span>
    </span>
    <button class="hp-settings-link" id="hp-open-options" type="button" title="打开扩展设置" aria-label="打开扩展设置">⚙</button>
  </div>
  <button class="hp-gen" id="hp-gen" type="button">开始生成 / 录制</button>
  <div class="hp-list" id="hp-list"></div>
  <div class="hp-settings">
    <label class="hp-toggle">
      <input type="checkbox" id="hp-nf-sublist">
      <span class="hp-toggle-text">字幕列表</span>
    </label>
    <div class="hp-toggle-hint">面板在视频播放页侧栏（网飞整集 · 其他站点实时采集）</div>
  </div>
  <script src="../connection-diagnostics.js"></script>
  <script src="action-popup.js"></script>
</body>
</html>
