<!DOCTYPE html>
<!-- TODO-1184：点浏览器工具栏 Fushi 图标弹出的「制卡队列管理」菜单。
     站点无关的 browser-action popup（default_popup），普通网页 / Netflix / YouTube 都能点开。
     和 vendor/popup.html（查词渲染壳，注入到宿主页 #entries-container）是两回事，别混。
     设了 default_popup 后 chrome.action.onClicked 永不触发，故「开始生成/录制」入口迁到这里的
     按钮（按钮点击即用户手势 → 发消息给 background 跑原 fushiIconClick 逻辑）。 -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      width: 320px;
      font: 13px/1.5 "Hiragino Sans", "Segoe UI", sans-serif;
      background: #1d211d;
      color: #eaebe5;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f0f1ec; color: #1a1c19; }
    }
    .hp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px 8px;
    }
    .hp-title { font-weight: 600; }
    .hp-count { opacity: 0.7; font-size: 12px; }
    .hp-gen {
      display: block;
      width: calc(100% - 28px);
      margin: 4px 14px 12px;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #386a58;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .hp-gen:hover { filter: brightness(1.08); }
    .hp-gen:active { opacity: 0.7; }
    /* TODO-1881：显式按钮状态——禁用（队列空/站点不对）灰化不可点；取消态（生成中）转警示色。 */
    .hp-gen:disabled { background: rgba(128, 128, 128, 0.28); color: inherit; opacity: 0.55; cursor: default; }
    .hp-gen:disabled:hover { filter: none; }
    .hp-gen[data-mode="cancel"] { background: #a9443e; }
    .hp-gen-hint { margin: -8px 14px 10px; font-size: 11px; line-height: 1.4; opacity: 0.6; }
    .hp-list { max-height: 320px; overflow-y: auto; padding: 0 6px 8px; }
    .hp-list-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 4px; font-size: 11px; font-weight: 600; opacity: 0.55; text-transform: none; }
    /* TODO-1881：清空队列（二次确认时文字变「确认清空？」并转警示色）。 */
    .hp-clear { border: 0; padding: 2px 6px; border-radius: 4px; background: transparent; color: inherit; font: inherit; font-size: 11px; cursor: pointer; opacity: 0.8; }
    .hp-clear:hover { background: rgba(128, 128, 128, 0.2); opacity: 1; }
    .hp-clear[data-confirm="1"] { background: rgba(211, 47, 47, 0.85); color: #fff; opacity: 1; }
    .hp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .hp-row:hover { background: rgba(128, 128, 128, 0.16); }
    .hp-row-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    /* TODO-1881：带跳转 URL 的条目可点击回到对应视频页（hover 主标签加下划线示意）。 */
    .hp-row-main[data-url] { cursor: pointer; }
    .hp-row-main[data-url]:hover .hp-row-text { text-decoration: underline; }
    .hp-row-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* TODO-1270：暗色上下文句子行，让同句不同词的卡片区分开又保留语境。 */
    .hp-row-sub {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      opacity: 0.55;
    }
    .hp-row-site { opacity: 0.55; font-size: 11px; margin-right: 2px; align-self: flex-start; margin-top: 1px; }
    .hp-del {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.6;
    }
    .hp-del:hover { background: rgba(211, 47, 47, 0.85); color: #fff; opacity: 1; }
    .hp-empty { padding: 20px 14px 24px; text-align: center; opacity: 0.6; }
    .hp-connection {
      cursor: pointer; /* TODO-1881：整行可点=强制重检连接 */
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      margin: 0 14px 10px;
      padding: 9px 10px;
      border: 1px solid rgba(128, 128, 128, 0.25);
      border-radius: 8px;
      background: rgba(128, 128, 128, 0.08);
    }
    .hp-connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #d49a42; }
    .hp-connection[data-tone="good"] .hp-connection-dot { background: #78c79f; }
    .hp-connection[data-tone="danger"] .hp-connection-dot { background: #e06f68; }
    .hp-connection-copy { min-width: 0; }
    .hp-connection-title { display: block; overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .hp-connection-detail { display: block; overflow: hidden; margin-top: 1px; opacity: .55; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .hp-open-options {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 9px 10px;
      border: 1px solid rgba(128, 128, 128, 0.45);
      border-radius: 8px;
      background: rgba(128, 128, 128, 0.10);
      color: inherit;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    .hp-open-options:hover { background: rgba(128, 128, 128, 0.20); border-color: rgba(128, 128, 128, 0.7); }
    /* BUG-1079：自更新失效提示（fushiUpdateStale 存在时显示）：需到扩展管理页手动重新加载。 */
    .hp-update {
      margin: 0 14px 10px;
      padding: 9px 10px;
      border: 1px solid rgba(212, 154, 66, 0.55);
      border-radius: 8px;
      background: rgba(212, 154, 66, 0.12);
    }
    .hp-update-title { display: block; font-size: 12px; font-weight: 600; }
    .hp-update-detail { display: block; margin-top: 1px; opacity: .7; font-size: 10px; line-height: 1.5; }
    /* 字幕列表使用浏览器原生 Side Panel。独立页脚区，不属于上方制卡队列。 */
    .hp-settings { border-top: 1px solid rgba(128, 128, 128, 0.22); padding: 10px 14px 12px; }
    .hp-side-panel { width: 100%; padding: 9px 10px; border: 1px solid rgba(128,128,128,.45); border-radius: 8px; background: rgba(128,128,128,.10); color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
    .hp-side-panel:hover { background: rgba(128,128,128,.20); border-color: rgba(128,128,128,.7); }
    .hp-toggle-hint { margin: 4px 0 0; font-size: 11px; opacity: 0.55; }
  </style>
</head>
<body>
  <div class="hp-header">
    <span class="hp-title">Fushi 制卡队列</span>
    <span class="hp-count" id="hp-count"></span>
  </div>
  <div class="hp-connection" id="hp-connection" data-tone="loading" title="点击重新检测连接">
    <span class="hp-connection-dot" aria-hidden="true"></span>
    <span class="hp-connection-copy">
      <span class="hp-connection-title" id="hp-connection-title">正在检测 Fushi…</span>
      <span class="hp-connection-detail" id="hp-connection-detail">查词与字幕服务</span>
    </span>
  </div>
  <!-- BUG-1079：自更新失效提示（默认隐藏；chrome.storage.local.fushiUpdateStale 存在时显示）。 -->
  <div class="hp-update" id="hp-update" hidden>
    <span class="hp-update-title" id="hp-update-title"></span>
    <span class="hp-update-detail" id="hp-update-detail"></span>
  </div>
  <button class="hp-gen" id="hp-gen" type="button">开始生成 / 录制</button>
  <!-- TODO-1881：按钮不可用/跨站点剩余量的原因提示（状态机 hint，空则隐藏）。 -->
  <div class="hp-gen-hint" id="hp-gen-hint" hidden></div>
  <div class="hp-list" id="hp-list"></div>
  <div class="hp-settings">
    <button class="hp-side-panel" id="hp-nf-sublist" type="button">▤ 打开字幕侧边栏</button>
    <div class="hp-toggle-hint">使用浏览器原生侧边栏，不向视频网页注入列表或修改布局。</div>
    <!-- 用户反馈「扩展配置根本看不见」：此前通往设置页的唯一入口，是上方连接行里一个无边框、
         无文字、opacity .72 的「⚙」字符，而那一整行本身可点（点击=重检连接），齿轮读起来像
         状态行的装饰而不是按钮——还要靠 stopPropagation 才不被误判成重检。工具栏图标又被
         default_popup 占着，chrome.action.onClicked 永不触发（见 background.js），
         options_page 因此在产品里几乎不可达。现在改成页脚一整行、有边框有文字的按钮。 -->
    <button class="hp-open-options" id="hp-open-options" type="button">⚙ 扩展设置（连接 · 字幕 · 快捷键）</button>
  </div>
  <script src="../connection-diagnostics.js"></script>
  <script src="action-popup.js"></script>
</body>
</html>
