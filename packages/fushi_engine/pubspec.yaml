name: fushi_engine
resolution: workspace
description: >-
  Fushi 纯 Dart 引擎：互联 host 服务器（shelf）、配对/TLS、远程 OCR 作业、
  漫画 OCR 算法层、视频下载管线、刮削/字幕搜索、ffmpeg CLI 后端。
  同时被 Flutter app（fushi/）与无头服务端（packages/fushi_server）消费。
publish_to: none

# 本包 pubspec 不声明 flutter sdk：源码禁止 package:flutter / dart:ui / 任何
# method-channel 插件 import（守卫 fushi/test/build/fushi_engine_purity_guard_test.dart）。
# fushi_core / fushi_audio 已零 Flutter（2026-09-30）；fushi_anki / fushi_dictionary /
# fushi_platform 仍声明 flutter，所以解析依赖时需要
# Flutter SDK 作为构建工具链；运行时二进制不含 Flutter（dart compile exe 是最终门）。
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  fushi_core:
    path: ../fushi_core
  fushi_audio:
    path: ../fushi_audio
  fushi_anki:
    path: ../fushi_anki
  fushi_dictionary:
    path: ../fushi_dictionary
  fushi_platform:
    path: ../fushi_platform
  fushi_torrent:
    path: ../fushi_torrent
  # 互联 P2P 隧道（iroh，纯 Dart FFI；原生库缺失时能力判不可用）。
  fushi_p2p:
    path: ../fushi_p2p
  # Fushi SRS 纯 Dart 内核（含 native/fushi_fsrs 的 FFI，原生库缺失时排程能力判不可用）。
  fushi_srs:
    path: ../fushi_srs
  # Rust 计算内核（native/fushi_compute，纯 Dart FFI）。硬依赖、没有 Dart 回退：原生库或某域
  # 符号缺失时调用即抛 FushiComputeUnavailableError。
  fushi_compute:
    path: ../fushi_compute
  # RWKV-Instant 推理（native/fushi_rwkv，AGPL-3.0-or-later，纯 Dart FFI + 后台 worker isolate）。
  # 硬依赖：库加载失败抛 FushiRwkvUnavailableError；权重按需下载（srs/srs_rwkv_models.dart）。
  fushi_rwkv:
    path: ../fushi_rwkv
  # 与 fushi/pubspec.yaml 钉同一 sha（OCR 与 ASR 共用 OnnxSessionFactory 抽象）。
  fushi_asr_core:
    git:
      url: https://github.com/hajisensai/fushi-subtitles.git
      path: packages/asr_core
      ref: 232a02434f9abca36e412a4aa20c0e309f09a8c6
  # 外挂字幕按内嵌参考轨对时间轴的算法（subtitle_reference_alignment /
  # subtitle_time_rewriter）住在上游；本包只留 ffmpeg 抽轨与原稿备份的装配层
  # （media/video/subtitle/embedded_reference_subtitle_sync.dart）。同仓同 sha。
  fushi_asr_subtitles:
    git:
      url: https://github.com/hajisensai/fushi-subtitles.git
      path: packages/asr_subtitles
      ref: 232a02434f9abca36e412a4aa20c0e309f09a8c6
  archive: ^3.6.1
  characters: ^1.3.0
  collection: any
  crypto: ^3.0.0
  dio: ^5.1.1
  drift: ">=2.33.0 <2.34.0"
  ffi: ^2.1.3
  html: ^0.15.2
  html_unescape: ^2.0.0
  http: ^1.2.0
  image: ^4.3.0
  meta: ^1.9.0
  path: ^1.8.2
  shelf: ^1.4.0
  # Anki 包导入 / 导出读写来源 SQLite（与 fushi_core 同一约束）。
  sqlite3: ">=3.4.0 <4.0.0"
  xml: ^6.3.0
  youtube_explode_dart: ^2.3.6
  # Pointer.asTypedList 的唯一入口（绕开 Dart JIT 去优化物化视图的崩溃，见包内注释）。
  fushi_ffi_view:
    path: ../fushi_ffi_view

dev_dependencies:
  lints: ^2.0.0
  test: ^1.24.0
