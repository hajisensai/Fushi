name: fushi_core
resolution: workspace
description: Shared models, database, language config, and i18n for Fushi
publish_to: none


environment:
  sdk: ">=3.8.0 <4.0.0"

# 零 Flutter：本包被无头服务端（packages/fushi_server，dart build cli）消费，
# 不得依赖 flutter sdk / 任何 method-channel 插件。sqlite3 原生库由各消费方自己
# 装配：app 与服务端都走 sqlite3 3.x 包的 build hook（native asset）。
# 不要再加 sqlite3_flutter_libs——它只配 sqlite3 2.x，在 3.x 下只会往包里多塞一份
# 没人用的 SQLite（macOS/iOS 上主程序启动即加载它）。
dependencies:
  drift: ">=2.33.0 <2.34.0"
  sqlite3: ">=3.4.0 <4.0.0"
  path: ^1.8.2

dev_dependencies:
  test: ^1.24.0
  # BUG-5615：drift_dev 生成的 database.g.dart 调用的是 drift 运行时的内部 API，两者必须
  # 成对钉住，而 drift_dev 自己声明的 drift 下限并不可靠——drift_dev 2.35.3 声明
  # drift >=2.30.0 却生成 `$_getPrefetchedDataByColumns` 调用（drift 2.33 没有），
  # 宽松的 `^` 约束一解析到它，普通 `dart run build_runner build` 生成的码就编不过。
  # 所以钉精确版本：2.34.5 是兼容上面钉住的 drift 2.33.x、且与工作区 analyzer 13
  # 共存的最新一版。全仓只在这里声明 drift_dev（只有本包有 Drift 表）；升 drift 时
  # 同步改这里并重跑 codegen。守卫：fushi/test/build/drift_codegen_pin_guard_test.dart。
  drift_dev: 2.34.5
  build_runner: ^2.3.3
