name: fushi_anki
description: Anki integration for Hibiki - abstract service, AnkiDroid and AnkiConnect implementations
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.41.6"

dependencies:
  flutter:
    sdk: flutter
  collection: any
  crypto: ^3.0.0
  # Windows 前台激活（AnkiDesktopForeground）要用 calloc/Utf16 做 Win32 FFI。
  ffi: ^2.1.3
  shared_preferences: ^2.2.2
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
