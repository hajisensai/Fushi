name: fushi_music
resolution: workspace
description: >-
  native/fushi_music（Rust 音乐胖核心：曲库扫描 / 标签 / CUE 拆轨 / 内容派生 uid）的 FFI 绑定、
  库定位与后台扫描 isolate。纯 Dart，不依赖 Flutter / 插件。硬依赖：库加载失败抛带原因的
  FushiMusicUnavailableError，没有 Dart 回退实现。
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  ffi: ^2.1.3
  # Pointer.asTypedList 的唯一入口（绕开 Dart JIT 去优化物化视图的崩溃，见包内注释）。
  fushi_ffi_view:
    path: ../fushi_ffi_view

dev_dependencies:
  test: ^1.24.0
