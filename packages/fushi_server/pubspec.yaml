name: fushi_server
resolution: workspace
description: >-
  Fushi 无头服务端（Linux / 任意桌面）：互联 host（配对 / 库 / 流播 / 远程 OCR）、
  通用任务（ASR）、下载管线 + 内容订阅、WebUI + admin API。纯 Dart，`dart build cli`
  出 bundle（sqlite3 是 native asset，`dart compile exe` 单文件运行时打不开 DB）。
# 服务端自己的版本（release-server.yml 的 tag / 包名从这里取）；与 app 的 fushi/pubspec
# 版本独立，按服务端功能里程碑升。
version: 0.1.0
publish_to: none

# 不依赖 flutter sdk。解析依赖仍需 Flutter SDK（fushi_audio 等尚声明 flutter），
# 运行时二进制不含 Flutter；守卫 fushi/test/build/fushi_engine_purity_guard_test.dart。
environment:
  sdk: ">=3.8.0 <4.0.0"

executables:
  fushi_server: fushi_server

dependencies:
  fushi_core:
    path: ../fushi_core
  fushi_audio:
    path: ../fushi_audio
  fushi_engine:
    path: ../fushi_engine
  fushi_platform:
    path: ../fushi_platform
  # 与 fushi/pubspec.yaml 钉同一 sha；fushi_asr_onnx_ffi 是纯 Dart FFI 的 ONNX Runtime
  # 后端（CPU / CUDA / DirectML），服务端的 OCR 与 ASR 会话工厂都用它。
  #
  # app 侧不引 fushi_asr_onnx_ffi（Flutter 端走 flutter_onnxruntime 插件后端），
  # 只有无头服务端需要进程内的纯 Dart ONNX；它对 `archive` 的约束比本仓紧，
  # 处理见根 pubspec.yaml 的 dependency_overrides。
  fushi_asr_core:
    git:
      url: https://github.com/hajisensai/fushi-subtitles.git
      path: packages/asr_core
      ref: 9e21511ce786569cb06f814551584b0b09f77da5
  fushi_asr_onnx_ffi:
    git:
      url: https://github.com/hajisensai/fushi-subtitles.git
      path: packages/asr_onnx_ffi
      ref: 9e21511ce786569cb06f814551584b0b09f77da5
  args: ^2.4.0
  crypto: ^3.0.0
  drift: ">=2.33.0 <2.34.0"
  http: ^1.2.0
  path: ^1.8.2
  shelf: ^1.4.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.24.0
