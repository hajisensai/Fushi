name: fushi_srs
resolution: workspace
description: >-
  Fushi SRS 纯 Dart 内核：确定性 ID、HLC 与排序键、因果上下文与修改记录合并、
  有效日志选取、排程策略，以及 native/fushi_fsrs（fsrs-rs）的 FFI 绑定；
  确定性 ID 与同步文件摘要的哈希走 native/fushi_compute（硬依赖）。
  不依赖 Flutter / 插件 / 数据库，app、fushi_engine 与无头服务端共用。
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  crypto: ^3.0.0
  ffi: ^2.1.3
  # Rust 计算内核（硬依赖，纯 Dart FFI）：确定性 ID 的 SHA-1 / SHA-256、同步文件摘要。
  fushi_compute:
    path: ../fushi_compute
  # Pointer.asTypedList 的唯一入口（绕开 Dart JIT 去优化物化视图的崩溃，见包内注释）。
  fushi_ffi_view:
    path: ../fushi_ffi_view

dev_dependencies:
  test: ^1.24.0
