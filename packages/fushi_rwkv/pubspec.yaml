name: fushi_rwkv
resolution: workspace
description: >-
  native/fushi_rwkv（Rust RWKV-Instant 推理：大模型 / SM56 小模型，AGPL-3.0-or-later）的 FFI 绑定、
  库定位与常驻 worker isolate。纯 Dart，不依赖 Flutter / 插件。硬依赖：库加载失败抛带原因的
  FushiRwkvUnavailableError，没有 Dart 回退实现。
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  ffi: ^2.1.3
  # Pointer.asTypedList 的唯一入口（绕开 Dart JIT 去优化物化视图的崩溃，见包内注释）。
  fushi_ffi_view:
    path: ../fushi_ffi_view

dev_dependencies:
  # 测试从小模型发布包（zip）里取权重；与本仓其余包同钉 archive 3（见根 pubspec）。
  archive: ^3.6.1
  test: ^1.24.0
