name: fushi_compute
resolution: workspace
description: >-
  native/fushi_compute（Rust 计算内核：哈希 / 图像 / 文本匹配）的 FFI 绑定与库定位。
  纯 Dart，不依赖 Flutter / 插件；app、fushi_engine 与无头服务端共用。库缺失时各域退回
