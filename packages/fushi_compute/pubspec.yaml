name: fushi_compute
resolution: workspace
description: >-
  native/fushi_compute（Rust 计算内核：哈希 / 图像 / 文本匹配）的 FFI 绑定与库定位。
  纯 Dart，不依赖 Flutter / 插件；app、fushi_engine 与无头服务端共用。硬依赖：没有 Dart
  回退实现，库加载失败抛带原因的 FushiComputeUnavailableError。
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  crypto: ^3.0.0
  test: ^1.24.0
