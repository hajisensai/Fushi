name: hibiki_audio
description: Audio playback, recording, audiobook matching, and subtitle parsing for Hibiki
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.41.6"

dependencies:
  flutter:
    sdk: flutter
  hibiki_core:
    path: ../hibiki_core
  just_audio: ^0.9.31
  audio_session: ^0.1.13
  xml: ^6.3.0
  flutter_charset_detector: ^1.0.2
  # subtitle_markup.dart 用 package:characters 做字素簇切分；此前靠传递依赖
  # （flutter → characters）碰运气解析，这里显式声明（与 hibiki/pubspec.yaml 同约束）。
  characters: ^1.3.0
  path: ^1.8.2
  path_provider: ^2.0.13
  drift: ">=2.33.0 <2.34.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
