name: fushi_corpus
resolution: workspace
description: >-
  native/fushi_corpus（Rust 语料胖核心：「我库里的例句」倒排索引 / 查询 / 切句）的 FFI 绑定与库定位。
  纯 Dart，不依赖 Flutter / 插件。硬依赖：库加载失败抛带原因的 FushiCorpusUnavailableError，
  没有 Dart 回退实现。
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  ffi: ^2.1.3
  # Pointer.asTypedList 的唯一入口（绕开 Dart JIT 去优化物化视图的崩溃，见包内注释）。
  fushi_ffi_view:
    path: ../fushi_ffi_view

dev_dependencies:
  test: ^1.24.0
