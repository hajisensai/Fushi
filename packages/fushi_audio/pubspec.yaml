name: fushi_audio
resolution: workspace
description: Audio playback, recording, audiobook matching, and subtitle parsing for Fushi
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

# 零 Flutter：本包被无头服务端（packages/fushi_server）消费，不得依赖 flutter sdk /
# 任何 method-channel 插件（守卫 fushi/test/build/fushi_engine_purity_guard_test.dart）。
# 平台实现（just_audio 播放控制器、path_provider documents 根与时长探测、
# flutter_charset_detector）住在 app 的 fushi/lib/src/media/audiobook/，经
# AudiobookStorage.documentsRootResolver / audioDurationProbeMs 与
# platformCharsetDecoder 装配点注入。
dependencies:
  fushi_core:
    path: ../fushi_core
  # Rust 计算内核（硬依赖）：cue↔EPUB 匹配的算法主体、EPUB 打包的 CRC-32、字幕 SRT / VTT / ASS 与行内 markup 解析。
  # 纯 Dart FFI 绑定，不依赖 Flutter / 插件。
  fushi_compute:
    path: ../fushi_compute
  xml: ^6.3.0
  meta: ^1.9.0
  path: ^1.8.2
  drift: ">=2.33.0 <2.34.0"

dev_dependencies:
  test: ^1.24.0
