name: fushi_torrent
resolution: workspace
description: >-
  Embedded torrent engine (libtorrent 2.x) C ABI FFI bindings for Fushi.
  阶段1a walking skeleton：只证明 libtorrent 构建 → 自写 C ABI → Dart FFI
  在桌面端打通，尚未实现下载管线。
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  ffi: ^2.1.3
  # Pointer.asTypedList 的唯一入口（绕开 Dart JIT 去优化物化视图的崩溃，见包内注释）。
  fushi_ffi_view:
    path: ../fushi_ffi_view

dev_dependencies:
  ffigen: ^13.0.0
  test: ^1.24.0
