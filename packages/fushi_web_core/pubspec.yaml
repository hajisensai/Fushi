name: fushi_web_core
resolution: workspace
description: >-
  网页内容计算核心（native/fushi_web_core 的 C ABI）的纯 Dart FFI 绑定：广告 / 跟踪拦截
  （订阅、缓存、引擎全在 Rust）与网页漫画章末广告页识别。不依赖 Flutter / 插件；WebView 接线在 app 侧。
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  ffi: ^2.1.3
  # Pointer.asTypedList 的唯一入口（绕开 Dart JIT 去优化物化视图的崩溃，见包内注释）。
  fushi_ffi_view:
    path: ../fushi_ffi_view

dev_dependencies:
  test: ^1.24.0
