<!DOCTYPE html>
<!-- TODO-1184：点浏览器工具栏 Hibiki 图标弹出的「制卡队列管理」菜单。
     站点无关的 browser-action popup（default_popup），普通网页 / Netflix / YouTube 都能点开。
     和 vendor/popup.html（查词渲染壳，注入到宿主页 #entries-container）是两回事，别混。
     设了 default_popup 后 chrome.action.onClicked 永不触发，故「开始生成/录制」入口迁到这里的
     按钮（按钮点击即用户手势 → 发消息给 background 跑原 hibikiIconClick 逻辑）。 -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      width: 320px;
      font: 13px/1.5 "Hiragino Sans", "Segoe UI", sans-serif;
      background: #1d211d;
      color: #eaebe5;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f0f1ec; color: #1a1c19; }
    }
    .hp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px 8px;
    }
    .hp-title { font-weight: 600; }
    .hp-count { opacity: 0.7; font-size: 12px; }
    .hp-gen {
      display: block;
      width: calc(100% - 28px);
      margin: 4px 14px 12px;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #386a58;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .hp-gen:hover { filter: brightness(1.08); }
    .hp-gen:active { opacity: 0.7; }
    .hp-list { max-height: 320px; overflow-y: auto; padding: 0 6px 8px; }
    .hp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .hp-row:hover { background: rgba(128, 128, 128, 0.16); }
    .hp-row-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hp-row-site { opacity: 0.55; font-size: 11px; margin-right: 2px; }
    .hp-del {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.6;
    }
    .hp-del:hover { background: rgba(211, 47, 47, 0.85); color: #fff; opacity: 1; }
    .hp-empty { padding: 20px 14px 24px; text-align: center; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="hp-header">
    <span class="hp-title">Hibiki 制卡队列</span>
    <span class="hp-count" id="hp-count"></span>
  </div>
  <button class="hp-gen" id="hp-gen" type="button">开始生成 / 录制</button>
  <div class="hp-list" id="hp-list"></div>
  <script src="action-popup.js"></script>
</body>
</html>
