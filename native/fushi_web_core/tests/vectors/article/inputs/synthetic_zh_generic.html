&nbsp;&nbsp;&nbsp;&nbsp;列车在夜色中穿过山谷，车厢里只剩下轮轨的声音。<br /><br />
&nbsp;&nbsp;&nbsp;&nbsp;林晚把额头贴在冰凉的车窗上，看着远处零星的灯火一盏盏退后。<br /><br />
&nbsp;&nbsp;&nbsp;&nbsp;“你也睡不着？”对面的老人忽然开口。<br /><br />
&nbsp;&nbsp;&nbsp;&nbsp;她愣了一下，点点头。老人从包里摸出一个橘子，递了过来。<br /><br />
&nbsp;&nbsp;&nbsp;&nbsp;橘子很凉，剥开的时候，一股清甜的气味在车厢里散开。<br /><br />
&nbsp;&nbsp;&nbsp;&nbsp;她想起很多年前，也有人在这样的夜里，给过她一个橘子。<br /><br />
