[package]
name = "fushi-aidoku-runtime"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs", rev = "1a6bb691dd67c7151fc76fc852fb5a364d325f72", default-features = false, features = ["imports"] }
aidoku-test-runner = { git = "https://github.com/Aidoku/aidoku-rs", rev = "1a6bb691dd67c7151fc76fc852fb5a364d325f72" }
anyhow = "1.0"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmer = "6.1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = true
strip = true
