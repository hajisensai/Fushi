[package]
name = "fushi_p2p"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
# rlib：给 native/fushi_ios_umbrella（iOS 伞形 staticlib，与 fushi_fsrs 共用一份 Rust std）当依赖用。
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["dht"]
# Mainline DHT 地址查找（iroh 1.x 把它拆到了独立 crate）。
dht = ["dep:iroh-mainline-address-lookup"]

[dependencies]
iroh = "1.2"
iroh-mainline-address-lookup = { version = "0.5", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# 编译期依赖（过程宏、build script）不 strip：新工具链的 macOS（实测 macOS 27.2 / Xcode 27.1 /
# rustc 1.95）上，cargo strip 出来的 Mach-O dylib 加载即报「mis-aligned LINKEDIT string pool」，
# 过程宏 dylib 坏掉后 rustc 报 E0463「can't find crate」，iOS / macOS / 在 Mac 上交叉编 Android
# 都编不过。最终产物的 macOS strip 见 build_macos_dylib.sh。
[profile.release.build-override]
strip = false
