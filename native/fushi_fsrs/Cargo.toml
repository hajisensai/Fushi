[package]
name = "fushi_fsrs"
version = "0.1.0"
edition = "2021"
publish = false
# fsrs-rs 是 BSD-3-Clause，ruzstd 是 MIT，可以直接链进 app 本体（GPL-3.0）。
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# 测试构建之外也装 ID 绑定审计（store/ids.rs `audit`）：Dart 经桥跑的语句绑了文本 UUID 就报错。只给测试用的库。
id_audit = ["rusqlite/trace"]

[dependencies]
# FSRS-7 还没发版：钉 fsrs-rs 主干的 git rev（Cargo.lock 锁死）。
# 这个 rev 的 Cargo.toml 版本号仍写 6.6.2；FSRS-6 的数值要与 6.6.2 / Anki 26.09.3 一致（第 0 步对拍）。
# FSRS-7 进 crates.io 正式版后换成正式版。
fsrs = { git = "https://github.com/open-spaced-repetition/fsrs-rs", rev = "0a5737406a0c5c7a5259b144738cbe4a0b649d76" }
# .apkg 新格式（collection.anki21b、媒体清单、媒体文件）的 zstd 解码。纯 Rust，五个平台交叉编译不需要 C 工具链。
ruzstd = "0.8"
# 同步 v2 段体的**压缩**（sync2/segment.rs）：ruzstd 只实现了 Fastest 一档，且同档比官方 zstd -1 大 50%（10 万笔记 / 40 万复习的
# 基准库：26.7 MB vs 17.8 MB）。解压仍走 ruzstd（流式窗口，codec.rs），产物是标准 zstd 帧。与 fushi_anki_sync 同一个
# crate / 版本；C 源码由 zstd-sys 随包编译（rusqlite bundled 本来就要 C 工具链）。BSD-3-Clause / MIT。
zstd = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# Anki 搜索的正则与去 HTML（search.rs）：与 Anki 桌面版 rslib 同一个正则引擎，`re:` 语义以它为准。
regex = "1"
# srs.db（docs/specs/2026-10-23-srs-rust-store.md）：自带一份 SQLite（bundled），只开 srs.db，绝不开主库 fushi.db。
# `functions`：注册 SQL 自定义函数——摘要桶哈希（store/sync2/digest.rs）与写连接上常驻复习队列的临时触发器回调
# （store/queue.rs）。
rusqlite = { version = "0.37", features = ["bundled", "functions", "column_decltype"] }
# 字段寄存器（registers.rs）：修改记录 ID 的 UUIDv5 与「释义样式去重」规范形的样式文件名（与 native/fushi_compute 同一个包）。
sha1 = "0.10"
# sha256：内容寻址媒体（store/sync2/media.rs，`media/<前2位>/<sha256>`）与 Anki 数字 id（`hash53`，与 Dart
# `SrsIds.ankiNumericId` / native/fushi_compute 同一算法；store/schema.rs v13 缓存列、浏览会话的 `nid:` / `cid:`）。
# 与 ed25519-dalek 共用锁定的版本。
sha2 = "0.11"
# SRS 同步 v2（src/sync2/，docs/specs/2026-10-25-srs-sync-v2-design.md）。除段压缩（上面的 zstd）外全部纯 Rust：
# blake3 关掉 SIMD 汇编（`pure`）；确定性重放的 exp / ln / pow 用 libm（musl 移植），不走平台 libm（设计 §4.5）。
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
ed25519-dalek = "3.0"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
getrandom = "0.4"
libm = "0.2.16"

# 格式升级后整理库文件前查库所在卷的可用空间（store/compact.rs；Windows 直接调 kernel32）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 测试构建里盯住漏编码的 ID 绑定（store/ids.rs `audit`）。
rusqlite = { version = "0.37", features = ["trace"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# 编译期依赖（过程宏、build script）不 strip：新工具链的 macOS（实测 macOS 27.2 / Xcode 27.1 /
# rustc 1.95）上，cargo strip 出来的 Mach-O dylib 加载即报「mis-aligned LINKEDIT string pool」，
# 过程宏 dylib 坏掉后 rustc 报 E0463「can't find crate」，iOS / macOS / 在 Mac 上交叉编 Android
# 都编不过。最终产物的 macOS strip 见 build_macos_dylib.sh。
[profile.release.build-override]
strip = false
# Anki 搜索的热路径（正则引擎、子串查找、去 HTML 扫描）按速度编：整体仍是 "z"，只这几个包开 3。
# 10 万张卡实测正则扫原文快约 2 倍，DLL 多约 230 KB（Windows x64）。
# iOS 伞形 crate（native/fushi_ios_umbrella/Cargo.toml）有同样的一段：依赖的 profile 不生效，那边要自己写。
[profile.release.package.fushi_fsrs]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
