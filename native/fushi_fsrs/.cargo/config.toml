# SQLite 临时数据（大排序溢出、建索引、VACUUM / VACUUM INTO 的整理副本）落临时文件，不落内存。
#
# libsqlite3-sys 编 Android 时固定加 -DSQLITE_TEMP_STORE=3（照搬 AOSP 的系统 SQLite）：临时数据一律放内存，
# `PRAGMA temp_store` / `temp_store_directory` 都改不回来。srs.db 有几个 GB 时，备份快照（VACUUM INTO + VACUUM）、
# 格式升级后的整理、同步里的大排序都会把整份数据搬进内存，Android 进程直接 Scudo OOM 闪退（平板实测 RSS 涨到 2 GB 后
# abort）。这里先 -U 掉它再定成 1（默认落文件，`PRAGMA temp_store` 可改）；临时目录由 store/compact.rs 的
# set_temp_dir 指到库所在目录（Android 没有可写的默认临时目录）。桌面 / iOS 本来就是 1，等于没改。
#
# 构建脚本（build_*_so.*、CI、tool/native_libs.ps1）都在本目录跑 cargo，这份配置对它们都生效。
# 守卫：src/store/compact.rs 的 tests::temp_store_compiled_to_files。
[env]
LIBSQLITE3_FLAGS = "-USQLITE_TEMP_STORE -DSQLITE_TEMP_STORE=1"
