[package]
name = "fushi_compute"
version = "0.1.0"
edition = "2021"
publish = false
# 依赖一律选可链进 GPL-3.0 app 本体的许可（MIT / Apache-2.0 / BSD / Zlib）。
license = "GPL-3.0-only"

[lib]
# rlib：给 native/fushi_ios_umbrella（iOS 伞形 staticlib，共用一份 Rust std）当依赖用。
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# text.rs：UTF-16 子串查找（memmem，SIMD）。MIT / Unlicense。
memchr = { version = "2.7", default-features = false, features = ["std"] }
# WOFF2 解码用（font.rs）：纯 Rust、BSD-3-Clause / MIT，五端交叉编译不需要 C 工具链。
brotli-decompressor = "6.1.0"
# AES（运行时检测 AES-NI / ARMv8 AES）+ CBC，Apache-2.0 OR MIT。
aes = { version = "0.8", features = ["zeroize"] }
cbc = "0.1"
# P-256 ECDSA（RFC 6979 确定性 k），Apache-2.0 OR MIT。
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "tga", "ico", "pnm"] }
jpeg-encoder = "0.6"
# image/avif.rs：AV1 解码（dav1d 的纯 Rust 移植，BSD-2-Clause）。关掉默认的 `asm` 特性：asm 要
# nasm / 各架构汇编工具链，五端交叉编译时不可靠；纯 Rust 路径只慢在大图解码上，漫画页 / 封面够用。
# 钉 git rev 而不是 crates.io 1.1.0：1.1.0 的出错路径 `on_error` 对 `frame_hdr` 直接 unwrap，坏码流
# 会在 `extern "C"` 的 dav1d_send_data 里 panic → 不可 unwind → 整个进程 abort（catch_unwind 接
# 不住）。上游 6c6f463785（2026-09-14）已修、尚未发版；发 1.1.0 之后的版本就换回 crates.io。
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "0c851fa046d6a36430570459283e5886fbdd8a66", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
md4 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# parse::epub：CSS url 正则（HTML 树构建是 parse::html5lib，package:html 的移植，无外部依赖）。
regex = "1"

[lints.rust]
# aes_armv8 / aes_force_soft 是 aes 0.8 的 cfg；src/crypto.rs 用它们在 aarch64 丢 cfg 时 compile_error。
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aes_armv8)", "cfg(aes_force_soft)"] }

[profile.release]
# 计算内核吃 CPU：取 3（不是 fushi_fsrs 的 "z"），体积换速度。
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# 构建脚本 / 过程宏不 strip：新 macOS 工具链上 cargo strip 出的 dylib（含过程宏）加载失败
# （hajisensai/Fushi#2329）。产物本身的 strip 由各平台构建脚本决定（macOS 用 strip -x）。
[profile.release.build-override]
strip = false
