[package]
name = "fushi_compute"
version = "0.1.0"
edition = "2021"
publish = false
# 依赖一律选可链进 GPL-3.0 app 本体的许可（MIT / Apache-2.0 / BSD / Zlib）。
license = "GPL-3.0-only"

[lib]
# rlib：给 native/fushi_ios_umbrella（iOS 伞形 staticlib，共用一份 Rust std）当依赖用。
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
crc32fast = "1"
jpeg-encoder = "0.6"
md4 = "0.10"
png = { version = "0.17", default-features = false }
sha2 = "0.10"

[profile.release]
# 计算内核吃 CPU：取 3（不是 fushi_fsrs 的 "z"），体积换速度。
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
