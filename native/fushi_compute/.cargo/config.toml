# aes 0.8 在 aarch64 上要 `--cfg aes_armv8` 才用 ARMv8 AES 指令（Linux / Android / Apple
# 运行时检测），否则退回软件实现（结果相同，慢数倍）。cargo 按**工作目录**找本文件：
# 在 native/fushi_compute 下构建才生效；从别处构建（iOS 伞形库）或设了 RUSTFLAGS 环境
# 变量时要自行带上同一个 cfg。
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8"]

# rustdoc（doctest / cargo doc）不吃上面的 target rustflags：没有这条，aarch64 主机（Apple Silicon）上
# `cargo test` 的 doctest 阶段会撞 src/crypto.rs 的 compile_error!。x86 上 aes 不看这个 cfg，无副作用。
[build]
rustdocflags = ["--cfg", "aes_armv8"]
